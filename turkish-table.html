<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alvan's Table</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alvan">
<meta name="theme-color" content="#D9463E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23D9463E'/%3E%3Cellipse cx='90' cy='104' rx='44' ry='34' fill='%23F6B24A' stroke='%231E3A5F' stroke-width='6'/%3E%3Cpath d='M52 78 l6-30 24 16 M128 78 l-6-30 -24 16' fill='%23F6B24A' stroke='%231E3A5F' stroke-width='6' stroke-linejoin='round'/%3E%3Cellipse cx='74' cy='100' rx='8' ry='9' fill='%23FFFDF7' stroke='%231E3A5F' stroke-width='4'/%3E%3Cellipse cx='106' cy='100' rx='8' ry='9' fill='%23FFFDF7' stroke='%231E3A5F' stroke-width='4'/%3E%3Ccircle cx='76' cy='103' r='4' fill='%232E9EA6'/%3E%3Ccircle cx='108' cy='103' r='4' fill='%232E9EA6'/%3E%3Cpath d='M90 112 l-5-5 h10 Z' fill='%23E8859B' stroke='%231E3A5F' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M90 118 q-8 7 -14 2 M90 118 q8 7 14 2' stroke='%231E3A5F' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F1E4; --tile:#FFFDF7; --ink:#1E3A5F;      /* İznik cobalt */
  --cobalt:#1B4F8A; --turq:#2E9EA6; --coral:#D9463E; --sage:#5E8C57;
  --gold:#E0A83C; --line:#D9CDB4; --grey:#7C7461;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 80px}

/* ---------- header ---------- */
header{position:relative;background:var(--coral);color:#FFF9F0;overflow:hidden;
  border-bottom:3px solid var(--ink)}
.hd{max-width:1180px;margin:0 auto;padding:10px 13px 12px;position:relative;z-index:2;
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(23px,5.4vw,36px);
  line-height:.94;letter-spacing:-.03em}
.hsub{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;opacity:.9;margin-top:5px}
.flag{flex:none;display:block}
#catbox{flex:none}
#tilebg{position:absolute;inset:0;opacity:.16;z-index:1}

/* ---------- controls ---------- */
.sticky{position:sticky;top:0;z-index:30;background:var(--paper);
  padding:7px 0 6px;margin:0 -14px;padding-left:14px;padding-right:14px;
  border-bottom:2px solid var(--line);box-shadow:0 6px 12px -8px rgba(30,58,95,.28)}
.searchrow{display:flex;gap:7px;align-items:center;min-width:0}
.searchrow .bar{flex:1;min-width:0}
.dice{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);
  background:var(--gold);font-size:15px;cursor:pointer;line-height:1;padding:0}
.dice:hover{background:var(--coral)}
.dice:active{transform:scale(.92)}
.dice.roll{animation:roll .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes roll{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.25)}100%{transform:rotate(360deg) scale(1)}}
.bar{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;margin:0;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bar::-webkit-scrollbar{display:none}
.bar .chip{flex:none}
.chip{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 9px;border:1.8px solid var(--line);border-radius:18px;background:var(--tile);
  color:var(--grey);cursor:pointer;transition:.15s;font-weight:600}
.chip:hover{border-color:var(--cobalt);color:var(--cobalt)}
.chip.on{background:var(--cobalt);border-color:var(--cobalt);color:#FFF}
.chip.veg.on{background:var(--sage);border-color:var(--sage)}
.chip.salt.on{background:var(--turq);border-color:var(--turq)}
.chip.snd.on{background:var(--gold);border-color:var(--ink);color:var(--ink)}
.spacer{flex:1;min-width:12px}
.count{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--grey);letter-spacing:.06em}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px;margin-top:10px}
@media(min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:11px}}
.dish{background:var(--tile);border:2px solid var(--ink);border-radius:11px;overflow:hidden;
  cursor:pointer;transition:transform .16s,box-shadow .16s;position:relative}
.dish:hover{transform:translateY(-4px);box-shadow:4px 6px 0 rgba(30,58,95,.18)}
.art{display:block;width:100%;background:#FFF;border-bottom:2.5px solid var(--ink)}
.dbody{padding:7px 9px 9px}
.dtr{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:14.5px;letter-spacing:-.01em;line-height:1.12;display:flex;align-items:center;gap:5px}
.stars{font-size:11px;color:var(--gold);letter-spacing:1px;margin-top:2px;line-height:1}
.stars .dim{color:var(--line)}
.starlab{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--grey);vertical-align:2px}
.dph{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--turq);letter-spacing:.04em;margin-top:2px}
.den{font-size:11px;color:var(--grey);margin-top:3px;line-height:1.3}
.seas{position:absolute;top:6px;left:6px;z-index:2;background:var(--sage);color:#FFF;
  font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.09em;text-transform:uppercase;
  padding:2.5px 7px;border-radius:20px;border:1.5px solid var(--ink);font-weight:600}
.ate{position:absolute;top:5px;right:5px;z-index:3;width:26px;height:26px;border-radius:50%;
  border:2px solid var(--ink);background:rgba(255,253,247,.9);cursor:pointer;font-size:13px;
  line-height:1;padding:0;color:#C0B8A2}
.ate.on{background:var(--sage);color:#FFF}
.dish.eaten{box-shadow:inset 0 0 0 3px var(--sage)}
.tally{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--sage);font-weight:600;letter-spacing:.05em}
/* basket */
.bskbar{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--cobalt);color:#FFF;
  padding:10px 14px;display:none;align-items:center;gap:10px;box-shadow:0 -6px 18px rgba(30,58,95,.28)}
.bskbar.on{display:flex}
.bskn{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:15px;flex:1}
.bskbtn{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  border:2px solid #FFF;border-radius:20px;background:transparent;color:#FFF;padding:6px 11px;cursor:pointer;font-weight:600}
.bskbtn.go{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.add{position:absolute;bottom:5px;right:5px;z-index:3;width:26px;height:26px;border-radius:50%;
  border:2px solid var(--ink);background:rgba(255,253,247,.92);cursor:pointer;font-size:15px;
  line-height:1;padding:0;color:#C0B8A2;font-weight:700}
.add.on{background:var(--cobalt);color:#FFF}
/* order sheet */
.ordwrap{position:fixed;inset:0;z-index:70;background:rgba(30,58,95,.55);display:none;
  align-items:center;justify-content:center;padding:18px}
.ordwrap.on{display:flex}
.ordbox{background:var(--tile);border:3px solid var(--ink);border-radius:16px;max-width:460px;width:100%;
  padding:20px 20px 18px;max-height:86vh;overflow-y:auto}
.ordh{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em}
.ordline{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:21px;line-height:1.3;
  margin:12px 0 4px;color:var(--cobalt)}
.ordph{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--turq);line-height:1.5}
.ordlist{margin:14px 0 0;font-size:13px;line-height:1.7}
.ordlist span{color:var(--grey)}
.ordx{float:right;border:2px solid var(--ink);border-radius:50%;width:30px;height:30px;
  background:var(--tile);cursor:pointer;font-size:15px;color:var(--ink)}
/* point-at-this */
.pointwrap{position:fixed;inset:0;z-index:80;background:var(--coral);color:#FFF9F0;display:none;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer}
.pointwrap.on{display:flex}
.pointtr{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
  font-size:clamp(40px,13vw,96px);line-height:.95;letter-spacing:-.03em}
.pointen{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;margin-top:16px;opacity:.85}
.pointhint{position:absolute;bottom:26px;font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.pointbtn{margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;border:2px solid var(--cobalt);border-radius:20px;background:#E9F0F8;
  color:var(--cobalt);padding:7px 12px;cursor:pointer;font-weight:600}
/* progress */
.prog{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 0;flex:1;min-width:70px}
.prog i{display:block;height:100%;background:var(--sage);transition:width .4s}
.spk{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--cobalt);
  background:#E9F0F8;color:var(--cobalt);cursor:pointer;font-size:11px;line-height:1;padding:0;
  display:inline-flex;align-items:center;justify-content:center}
.spk:hover,.spk.play{background:var(--cobalt);color:#FFF}
.spk.big{width:34px;height:34px;font-size:16px;border-width:2px}
.dreg{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--turq);margin-top:3px}
.pills{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}
.pill{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.07em;text-transform:uppercase;
  padding:2.5px 6px;border-radius:20px;border:1.5px solid;font-weight:600}
.p-vegan{color:#3E7A38;border-color:#3E7A38;background:#EAF4E7}
.p-veg{color:var(--sage);border-color:var(--sage);background:#F0F6EE}
.p-fish{color:var(--turq);border-color:var(--turq);background:#E7F5F5}
.p-meat{color:var(--coral);border-color:var(--coral);background:#FCEDEC}
.p-lo{color:var(--cobalt);border-color:var(--cobalt);background:#E9F0F8}
.p-hi{color:#A8471F;border-color:#A8471F;background:#FBEDE6}
.p-prot{color:var(--ink);border-color:var(--line);background:#F7F3E8}
.p-heat{color:var(--coral);border-color:var(--coral);background:#FCEDEC;letter-spacing:-1px}
.p-rate{color:var(--gold);border-color:var(--gold);background:#FDF6E6;letter-spacing:-.5px}
.p-price{color:#2E6B4A;border-color:#2E6B4A;background:#E9F4EE;font-weight:600}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:auto 0 0 0;max-height:88vh;overflow-y:auto;z-index:60;background:var(--tile);
  border-top:4px solid var(--ink);transform:translateY(101%);
  transition:transform .3s cubic-bezier(.3,.8,.4,1);box-shadow:0 -12px 40px rgba(30,58,95,.22)}
.sheet.open{transform:translateY(0)}
.sin{max-width:1180px;margin:0 auto;padding:16px 14px 30px;position:relative;
  display:grid;grid-template-columns:170px 1fr;gap:18px}
@media(max-width:700px){
  .sheet{max-height:82vh}
  .sin{grid-template-columns:96px 1fr;gap:12px;padding:12px 12px 20px;align-items:start}
  .sart{grid-row:1/3;border-width:2px;border-radius:9px}
  .stitle{font-size:21px!important;gap:7px!important}
  .sphon{font-size:11px;margin:2px 0 1px}
  .sen{font-size:9px;letter-spacing:.07em;margin:0 0 8px}
  .sdesc{grid-column:1/-1;font-size:12.5px;line-height:1.42;margin:2px 0 0}
  .facts{grid-column:1/-1;display:flex;gap:5px;margin:9px 0 0}
  .fact{flex:1;padding:5px 7px;border-radius:7px;border-width:1.5px;min-width:0}
  .fk{font-size:8px;letter-spacing:.07em}
  .fv{font-size:13px;white-space:nowrap}
  .fn{display:none}
  .say{grid-column:1/-1;padding:8px 10px;border-radius:9px;margin-top:8px;border-width:2px}
  .saylab{font-size:8.5px}
  .saytr{font-size:14.5px;gap:7px!important}
  .sayph{font-size:10px}
  .note{grid-column:1/-1;font-size:11px;margin-top:8px;padding-left:9px}
  .pointbtn{grid-column:1/-1;margin-top:8px;padding:6px 9px;font-size:9px}
  .spk.big{width:24px;height:24px;font-size:11px;border-width:1.5px}
  .sx{top:8px;right:8px;width:26px;height:26px;font-size:14px}
  .sbody{display:contents}
  .sbody > .stitle{grid-column:2/3;align-self:center}
  .sbody > .sphon,.sbody > .sen{grid-column:2/3}
}
.sx{position:absolute;top:12px;right:12px;width:30px;height:30px;border:2px solid var(--ink);
  border-radius:50%;background:var(--tile);cursor:pointer;font-size:17px;color:var(--ink)}
.sx:hover{background:var(--coral);color:#FFF;border-color:var(--coral)}
.sart{border:2.5px solid var(--ink);border-radius:12px;background:#FFF;overflow:hidden;align-self:start}
.sbody{min-width:0}
.stitle{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(22px,4vw,34px);
  letter-spacing:-.03em;line-height:1}
.sphon{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--turq);margin:3px 0 2px;letter-spacing:.03em}
.sen{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
.sdesc{margin:11px 0;font-size:14px;line-height:1.5}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:7px;margin:11px 0}
.fact{border:2px solid var(--line);border-radius:10px;padding:9px 11px;background:#FBF8EF}
.fk{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--grey)}
.fv{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:16px;margin-top:1px}
.fn{font-size:11px;color:var(--grey);margin-top:2px;line-height:1.3}
.say{border:2.5px solid var(--cobalt);border-radius:12px;background:#EDF3FA;padding:12px 14px;margin-top:12px}
.saylab{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cobalt)}
.saytr{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:17px;margin-top:3px}
.sayph{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--turq)}
.note{margin-top:12px;font-size:12.5px;color:var(--grey);border-left:3px solid var(--gold);padding-left:11px}

/* ---------- phrasebook ---------- */
.phr{margin-top:44px}
.h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.025em;
  border-bottom:3px solid var(--ink);padding-bottom:8px;margin-bottom:16px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:10px;margin-bottom:8px}
.rcard{background:var(--tile);border:2px solid var(--ink);border-radius:11px;padding:11px 13px}
.rk{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  color:#FFF;background:var(--turq);display:inline-block;padding:2px 7px;border-radius:20px;font-weight:600}
.rk.hole{background:var(--coral)}
.rn{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:18px;margin-top:6px;line-height:1.1}
.rm{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--grey);margin-top:2px;letter-spacing:.04em}
.rd{font-size:12.5px;line-height:1.4;margin-top:6px;color:#4A4436}
.rw{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--cobalt);margin-top:7px;letter-spacing:.04em}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;margin-bottom:6px}
.wcard{background:var(--tile);border:2px solid var(--line);border-radius:9px;padding:8px 10px}
.wt{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:15px;line-height:1.1}
.wp{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--turq);margin-top:1px}
.we{font-size:11.5px;color:var(--grey);margin-top:3px;line-height:1.3}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:9px}
.pcard{background:var(--tile);border:2px solid var(--ink);border-radius:11px;padding:11px 13px}
.ptr{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:17px;line-height:1.15}
.pph{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--turq);margin-top:2px}
.pen{font-size:12.5px;color:var(--grey);margin-top:4px}
footer{margin-top:44px;padding-top:18px;border-top:3px solid var(--ink);
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
@media(max-width:520px){
  .flag{width:92px;height:auto}
  h1{font-size:22px}
  .hsub{font-size:8px}
  .rgrid{grid-template-columns:1fr;gap:8px}
  .pgrid{grid-template-columns:1fr 1fr;gap:7px}
  .h2{font-size:22px}
  .phr{margin-top:30px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <svg id="tilebg" preserveAspectRatio="none"></svg>
  <div class="hd">
    <div>
      <h1>Alvan's Table</h1>
      <div class="hsub">Tap the cat for a suggestion · hold for vegan only</div>
    </div>
    <div id="catbox"></div>
  </div>
</header>

<div class="wrap">
  <div class="sticky">
    <div class="searchrow">
      <div class="bar" id="cats"></div>
      <button class="dice" id="dice" title="Ne yiyeyim? — shake or tap">🎲</button>
    </div>
  </div>
  <div class="bar" style="margin-top:0">
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <button class="chip snd" id="snd">♪ Müzik</button>
  </div>
  <div class="idbar">
    <button class="idbtn" id="idopen">👁 What's on the table?</button>
  </div>
  <div class="grid" id="grid"></div>

  <section class="phr">
    <div class="h2">Fethiye · where to eat</div>
    <div class="rgrid" id="rests"></div>
  </section>

  <section class="phr">
    <div class="h2">Menu words</div>
    <div class="wgrid" id="words"></div>
  </section>

  <section class="phr">
    <div class="h2">Say it</div>
    <div class="pgrid" id="phrases"></div>
  </section>

  <footer>
    <span>🔊 hear it · ✓ tried · + build an order · 🎲 shake to decide</span>
    <span>Protein &amp; sodium are estimates</span>
    <span>Afiyet olsun</span>
  </footer>
</div>

<div class="bskbar" id="bskbar">
  <span class="bskn" id="bskn"></span>
  <button class="bskbtn" id="bskclear">Clear</button>
  <button class="bskbtn go" id="bskgo">Order it</button>
</div>

<div class="idwrap" id="idwrap"><div class="idbox" id="idbox"></div></div>

<div class="ordwrap" id="ordwrap"><div class="ordbox" id="ordbox"></div></div>

<div class="pointwrap" id="pointwrap">
  <div class="pointtr" id="pointtr"></div>
  <div class="pointen" id="pointen"></div>
  <div class="pointhint">tap anywhere to close</div>
</div>

<div class="sheet" id="sheet"><div class="sin" id="sheetIn"></div></div>

<script>
/* ============ drawing kit ============ */
const C={cobalt:'#1B4F8A',turq:'#2E9EA6',coral:'#D9463E',sage:'#5E8C57',gold:'#E0A83C',
  cream:'#FBF3DF',white:'#FFFDF7',ink:'#1E3A5F',olive:'#6B7B3A',aub:'#5D4A72',
  tom:'#D9463E',yog:'#FFFDF7',bread:'#E3B872',tea:'#B5442A',green:'#7EA85C',
  pom:'#B22C4A',honey:'#E8A83C',choc:'#6B4423',milk:'#FBF6EC',pink:'#E8859B'};
function rnd(seed){let s=seed||7;return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}}
function hash(str){let h=11;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;return h}

/* vessels */
function bowl(fill){return `<ellipse cx="100" cy="84" rx="58" ry="6" fill="${C.ink}" opacity=".12"/>
  <path d="M42,52 q58,-14 116,0 l-9,30 q-49,13 -98,0 Z" fill="${C.white}" stroke="${C.ink}" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M45,58 q55,-11 110,0" stroke="${C.cobalt}" stroke-width="1.6" fill="none" opacity=".7"/>
  <path d="M47,70 q53,10 106,0" stroke="${C.turq}" stroke-width="1.4" fill="none" opacity=".6"/>
  ${[0,1,2,3,4,5].map(i=>`<circle cx="${52+i*19}" cy="${75+(i%2)*2}" r="1.5" fill="${C.cobalt}" opacity=".55"/>`).join('')}
  <path d="M46,55 q54,-12 108,0 l-4,13 q-50,12 -100,0 Z" fill="${fill}"/>
  <path d="M50,56 q22,-6 44,-3" stroke="#FFF" stroke-width="2" fill="none" opacity=".22" stroke-linecap="round"/>`}
function plate(fill){return `<ellipse cx="100" cy="79" rx="66" ry="6" fill="${C.ink}" opacity=".11"/>
  <ellipse cx="100" cy="64" rx="74" ry="21" fill="${C.white}" stroke="${C.ink}" stroke-width="2.4"/>
  <ellipse cx="100" cy="64" rx="66" ry="17" fill="none" stroke="${C.cobalt}" stroke-width="1.5" opacity=".65"/>
  ${[0,1,2,3,4,5,6,7].map(i=>{const a=i/8*Math.PI*2;
    return `<circle cx="${(100+Math.cos(a)*70).toFixed(1)}" cy="${(64+Math.sin(a)*19).toFixed(1)}" r="1.7" fill="${C.turq}" opacity=".7"/>`}).join('')}
  <ellipse cx="100" cy="63" rx="57" ry="14" fill="${fill}"/>
  <path d="M60,60 q20,-7 40,-5" stroke="#FFF" stroke-width="2" fill="none" opacity=".2" stroke-linecap="round"/>`}
function glass(fill,tulip){
  return tulip
   ? `<ellipse cx="100" cy="84" rx="24" ry="4.5" fill="${C.ink}" opacity=".12"/>
      <ellipse cx="100" cy="84" rx="21" ry="5" fill="${C.white}" stroke="${C.ink}" stroke-width="2.2"/>
      <path d="M83,36 q-4,26 17,48 q21,-22 17,-48 Z" fill="${fill}" stroke="${C.ink}" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M87,41 q-2,20 13,38" stroke="#FFF" stroke-width="3.4" fill="none" opacity=".35" stroke-linecap="round"/>`
   : `<ellipse cx="100" cy="84" rx="24" ry="4.5" fill="${C.ink}" opacity=".12"/>
      <path d="M80,36 l4,46 q16,5 32,0 l4,-46 Z" fill="${fill}" stroke="${C.ink}" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M85,41 l3,38" stroke="#FFF" stroke-width="3.4" fill="none" opacity=".38" stroke-linecap="round"/>`}
function cup(fill){return `<ellipse cx="100" cy="84" rx="27" ry="4.5" fill="${C.ink}" opacity=".12"/>
  <path d="M76,44 q24,-7 48,0 l-6,38 q-18,6 -36,0 Z" fill="${C.white}" stroke="${C.ink}" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M124,52 q17,3 12,17 q-4,10 -15,8" fill="none" stroke="${C.ink}" stroke-width="2.4"/>
  <path d="M79,48 q21,-5 42,0 l-2,10 q-19,6 -38,0 Z" fill="${fill}"/>`}
/* toppings */
const T={
  drizzle:(c)=>`<path d="M68,58 q16,7 32,0 t32,0" stroke="${c}" stroke-width="3" fill="none" opacity=".8" stroke-linecap="round"/>`,
  dots:(c,n,seed)=>{const r=rnd(seed);let o='';for(let i=0;i<n;i++)
      o+=`<circle cx="${62+r()*76}" cy="${52+r()*16}" r="${2+r()*2.6}" fill="${c}"/>`;return o},
  leaf:(c)=>`<g><path d="M118,46 q12,-9 20,-3 q-6,10 -20,3 Z" fill="${c}" stroke="${C.ink}" stroke-width="1.3"/>
      <path d="M120,45 q9,-3 16,-2" stroke="${C.ink}" stroke-width=".9" fill="none" opacity=".7"/>
      <path d="M62,48 q9,-7 16,-2 q-5,8 -16,2 Z" fill="${c}" stroke="${C.ink}" stroke-width="1.3"/></g>`,
  parsley:(c,seed)=>{const r=rnd(seed);let o='';for(let i=0;i<7;i++){const x=64+r()*72,y=48+r()*12;
      o+=`<g transform="translate(${x},${y})">${[0,1,2].map(k=>`<circle cx="${(k-1)*2.6}" cy="${k===1?-2.4:0}" r="1.9" fill="${c}"/>`).join('')}</g>`}return o},
  sumac:(seed)=>{const r=rnd(seed);let o='';for(let i=0;i<24;i++)
      o+=`<circle cx="${62+r()*76}" cy="${50+r()*14}" r=".9" fill="#9C2B2B" opacity=".8"/>`;return o},
  lemon:()=>`<g transform="translate(140,66)"><path d="M0,0 a11,11 0 0 1 0,-14 a11,11 0 0 1 0,14 Z" fill="#F2D34B" stroke="${C.ink}" stroke-width="1.4"/>
      <path d="M0,-13 v13 M-3,-11 l0,9 M3,-11 l0,9" stroke="#E0B82A" stroke-width=".9"/></g>`,
  olives:(seed)=>{const r=rnd(seed);let o='';for(let i=0;i<3;i++){const x=70+i*30+r()*8;
      o+=`<ellipse cx="${x}" cy="${54+r()*8}" rx="7" ry="5.4" fill="${C.olive}" stroke="${C.ink}" stroke-width="1.8"/>`}return o},
  mound:(c)=>`<path d="M62,60 q38,-30 76,0 Z" fill="${c}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>`,
  swirl:(c)=>`<path d="M100,54 q-16,-2 -14,8 q2,10 16,6 q16,-4 12,-14 q-4,-12 -20,-6" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/>`,
  steam:()=>`<path d="M88,36 q6,-7 0,-13 M100,33 q7,-8 0,-14 M112,36 q6,-7 0,-13"
      stroke="${C.turq}" stroke-width="2.4" fill="none" opacity=".5" stroke-linecap="round"/>`,
  skewer:(c)=>`<rect x="46" y="47" width="108" height="4" rx="2" fill="#9A8A70"/>
      ${[0,1,2].map(i=>`<rect x="${62+i*30}" y="38" width="26" height="22" rx="9" fill="${c}" stroke="${C.ink}" stroke-width="2.6"/>`).join('')}`,
  flatbread:(c)=>`<ellipse cx="100" cy="60" rx="66" ry="22" fill="${c}" stroke="${C.ink}" stroke-width="2.3"/>
      ${T.dots('#C68A4A',9,4)}`,
  crescentPastry:(c)=>`<path d="M56,66 q10,-34 46,-34 q36,0 42,34 q-44,10 -88,0 Z" fill="${c}" stroke="${C.ink}" stroke-width="2.3" stroke-linejoin="round"/>`,
  diamonds:(c)=>[0,1,2,3].map(i=>`<path d="M${58+i*28},58 l13,-11 13,11 -13,11 Z" fill="${c}" stroke="${C.ink}" stroke-width="2.2"/>`).join(''),
  fishShape:()=>`<path d="M52,60 q30,-22 66,0 q-36,22 -66,0 Z" fill="#9FC0CE" stroke="${C.ink}" stroke-width="3"/>
      <path d="M118,60 l24,-13 0,26 Z" fill="#9FC0CE" stroke="${C.ink}" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="68" cy="55" r="2.6" fill="${C.ink}"/>`,
  scoop:(c)=>`<circle cx="100" cy="46" r="24" fill="${c}" stroke="${C.ink}" stroke-width="3"/>`,
  chilli:()=>`<g transform="translate(134,44) rotate(24)">
      <path d="M0,0 q7,3 8,12 q1,9 -5,10 q-6,1 -6,-9 q0,-9 3,-13 Z" fill="#C4302A" stroke="${C.ink}" stroke-width="1.5"/>
      <path d="M0,0 q-3,-6 -8,-7" stroke="#5E8C57" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>`,
  chillies:()=>[0,1,2].map(i=>`<g transform="translate(${72+i*26},50) rotate(${-14+i*14})">
      <path d="M0,0 q6,4 6,14 q0,9 -6,9 q-6,0 -6,-9 q0,-10 6,-14 Z" fill="#6B8C3A" stroke="${C.ink}" stroke-width="1.5"/>
      <path d="M0,0 q-3,-6 -7,-7" stroke="#4A6B2A" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>`).join(''),
  flakes:(c)=>{const r=rnd(23);let o='';for(let i=0;i<34;i++){
      const x=62+r()*76,y=50+r()*14;
      o+=`<rect x="${x}" y="${y}" width="${1.6+r()*2}" height="${1.2+r()*1.4}" rx=".6"
        fill="${c}" transform="rotate(${r()*90-45} ${x} ${y})"/>`}return o},
  spread:()=>{const cs=['#FBF6EC','#5A6B32','#D9463E','#E8C24A','#C4304A','#8FA85C','#E8DCC0'];let o='';
      for(let i=0;i<7;i++){const x=52+(i%4)*32, y=48+Math.floor(i/4)*15;
      o+=`<circle cx="${x}" cy="${y}" r="9" fill="${C.white}" stroke="${C.ink}" stroke-width="1.5"/>
          <circle cx="${x}" cy="${y}" r="5.6" fill="${cs[i]}"/>`}return o},
  kaymak:()=>`<path d="M70,62 q6,-20 30,-20 q24,0 30,20 Z" fill="#FBF6EC" stroke="${C.ink}" stroke-width="1.8"/>
      <path d="M76,50 q10,-6 22,-2 q12,4 22,4" stroke="#E8A83C" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M84,58 q8,-4 16,-1" stroke="#E8A83C" stroke-width="2.6" fill="none" opacity=".7" stroke-linecap="round"/>`,
  friedegg:()=>[0,1].map(i=>`<g transform="translate(${80+i*40},56)">
      <ellipse cx="0" cy="0" rx="20" ry="13" fill="#FFFDF7" stroke="${C.ink}" stroke-width="1.8"/>
      <circle cx="0" cy="-1" r="7" fill="#F2B824" stroke="${C.ink}" stroke-width="1.4"/>
      <circle cx="-2.4" cy="-3.4" r="2" fill="#FFF" opacity=".45"/></g>`).join(''),
  sucuk:()=>{let o=`<ellipse cx="86" cy="56" rx="19" ry="12" fill="#FFFDF7" stroke="${C.ink}" stroke-width="1.8"/>
      <circle cx="86" cy="55" r="6.6" fill="#F2B824" stroke="${C.ink}" stroke-width="1.3"/>`;
    for(let i=0;i<3;i++){const x=112+i*15, y=50+(i%2)*10;
      o+=`<circle cx="${x}" cy="${y}" r="8" fill="#9C2B2B" stroke="${C.ink}" stroke-width="1.6"/>
          <circle cx="${x}" cy="${y}" r="4.6" fill="#7A1E1A"/>`}
    return o},
  stringy:()=>`<path d="M62,58 q12,-14 26,-4 q14,10 26,-4 q10,-10 22,2" stroke="#F2D06A" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M62,58 q12,-14 26,-4 q14,10 26,-4 q10,-10 22,2" stroke="${C.ink}" stroke-width="1.4" fill="none"/>
      <path d="M74,64 q4,10 0,16 M104,62 q3,11 -1,17" stroke="#F2D06A" stroke-width="3.4" fill="none" stroke-linecap="round"/>`,
  katmer:()=>`<path d="M62,64 l14,-24 h48 l14,24 Z" fill="#E8CC8A" stroke="${C.ink}" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M76,40 l10,24 M100,40 l0,24 M124,40 l-10,24" stroke="#C9A85C" stroke-width="1.4"/>
      ${[0,1,2,3,4,5].map(i=>`<circle cx="${72+i*11}" cy="${46+(i%2)*4}" r="2.2" fill="#7EA85C"/>`).join('')}`,
  jamjars:()=>[0,1,2].map(i=>{const cs=['#C4304A','#8A3A6A','#E8A83C'];
      return `<g transform="translate(${72+i*28},52)">
        <rect x="-9" y="-4" width="18" height="17" rx="2.5" fill="${cs[i]}" stroke="${C.ink}" stroke-width="1.6"/>
        <rect x="-10" y="-8" width="20" height="5" rx="2" fill="${C.cream}" stroke="${C.ink}" stroke-width="1.4"/></g>`}).join(''),
  figs:()=>[0,1,2].map(i=>`<g transform="translate(${72+i*28},54)">
      <path d="M0,10 q-11,-2 -10,-11 q1,-9 10,-11 q9,2 10,11 q1,9 -10,11 Z" fill="#7A4A6A" stroke="${C.ink}" stroke-width="1.8"/>
      <path d="M0,-12 l0,-5 M0,-15 l-4,-3 M0,-15 l4,-3" stroke="#5E8C57" stroke-width="1.8" stroke-linecap="round"/>
      ${i===1?`<path d="M0,10 q-11,-2 -10,-11 q1,-9 10,-11 Z" fill="#E8859B"/>
      ${[0,1,2,3].map(k=>`<path d="M-1,${-6+k*4} l-6,1" stroke="#C4587A" stroke-width=".9"/>`).join('')}`:''}</g>`).join(''),
  grapes:()=>{const r=rnd(5);let o='';for(let i=0;i<13;i++){
      const row=Math.floor(i/4), x=84+ (i%4)*11 + row*5, y=44+row*9;
      o+=`<circle cx="${x}" cy="${y}" r="5.6" fill="#6A4A7A" stroke="${C.ink}" stroke-width="1.3"/>
          <circle cx="${x-1.6}" cy="${y-1.8}" r="1.6" fill="#FFF" opacity=".3"/>`}
      return o+`<path d="M96,40 q3,-9 10,-11" stroke="#5E8C57" stroke-width="2.2" fill="none" stroke-linecap="round"/>`},
  pom:()=>`<g transform="translate(100,54)">
      <circle cx="0" cy="0" r="19" fill="#B22C4A" stroke="${C.ink}" stroke-width="2"/>
      <path d="M0,-19 l-4,-7 4,3 4,-3 Z" fill="#8C1F38" stroke="${C.ink}" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M0,0 a19,19 0 0 1 17,8 a19,19 0 0 1 -34,0 Z" fill="#D9463E" opacity=".55"/>
      ${[0,1,2,3,4,5,6].map(k=>`<circle cx="${-11+k*3.7}" cy="${5+(k%3)*4}" r="2" fill="#F2647A"/>`).join('')}</g>`,
  roundfruit:(a,b)=>[0,1,2].map(i=>`<g transform="translate(${74+i*26},54)">
      <circle cx="0" cy="0" r="13" fill="${a}" stroke="${C.ink}" stroke-width="1.8"/>
      <path d="M-13,0 a13,13 0 0 0 13,13 a13,13 0 0 0 6,-2 Z" fill="${b}" opacity=".5"/>
      <path d="M0,-13 q3,-7 8,-8" stroke="#5E8C57" stroke-width="2" fill="none" stroke-linecap="round"/></g>`).join(''),
  melon:()=>`<g transform="translate(100,56)">
      <path d="M-30,6 a30,30 0 0 1 60,0 Z" fill="#3E7A4A" stroke="${C.ink}" stroke-width="2"/>
      <path d="M-25,4 a25,25 0 0 1 50,0 Z" fill="#F2647A"/>
      ${[0,1,2,3,4].map(k=>`<ellipse cx="${-14+k*7}" cy="${-6-(k%2)*4}" rx="1.5" ry="2.4" fill="#2E2318"/>`).join('')}</g>`,
  nuts:(c)=>{const r=rnd(3);let o='';for(let i=0;i<9;i++){const x=64+r()*72,y=48+r()*13;
      o+=`<g transform="translate(${x},${y}) rotate(${r()*60-30})">
        <ellipse cx="0" cy="0" rx="6" ry="5" fill="${c}" stroke="${C.ink}" stroke-width="1.4"/>
        <path d="M-5,0 q5,-3 10,0" stroke="${C.ink}" stroke-width=".9" fill="none" opacity=".6"/></g>`}return o},
  driedfruit:(c)=>{const r=rnd(9);let o='';for(let i=0;i<8;i++){const x=64+r()*72,y=48+r()*13;
      o+=`<g transform="translate(${x},${y}) rotate(${r()*40-20})">
        <path d="M-7,0 q0,-6 7,-6 q7,0 7,6 q0,5 -7,5 q-7,0 -7,-5 Z" fill="${c}" stroke="${C.ink}" stroke-width="1.4"/>
        <path d="M-3,-2 q3,2 6,0" stroke="${C.ink}" stroke-width=".8" fill="none" opacity=".5"/></g>`}return o},
  bottle:(body,label)=>`<g transform="translate(54,32)">
      <path d="M8,50 v-24 q0,-6 4,-9 v-11 h10 v11 q4,3 4,9 v24 Z" fill="${body}" stroke="${C.ink}" stroke-width="1.8"/>
      <rect x="11" y="4" width="8" height="4" fill="${C.ink}" opacity=".8"/>
      <rect x="7" y="31" width="18" height="13" rx="1.5" fill="${label}" stroke="${C.ink}" stroke-width="1.3"/>
      <path d="M10,35 h12 M10,39 h9" stroke="${C.ink}" stroke-width=".9" opacity=".65"/>
      <path d="M11,28 q3,-13 3,-19" stroke="#FFF" stroke-width="1.8" fill="none" opacity=".28"/>
    </g>`,
  rakiSet:()=>`<g>
      <ellipse cx="100" cy="84" rx="44" ry="4.5" fill="${C.ink}" opacity=".1"/>
      <path d="M72,38 q-3,20 10,40 q13,-20 10,-40 Z" fill="#F2F6F2" stroke="${C.ink}" stroke-width="2"/>
      <path d="M75,46 q-2,13 7,28 q9,-15 7,-28 Z" fill="#FFFFFF" opacity=".85"/>
      <path d="M106,38 q-3,20 10,40 q13,-20 10,-40 Z" fill="#DCEAF2" stroke="${C.ink}" stroke-width="2"/>
      <g transform="translate(134,50)"><rect x="0" y="0" width="15" height="8" rx="2" fill="#EAF2E4" stroke="${C.ink}" stroke-width="1.5"/>
      <circle cx="4" cy="4" r="1.3" fill="#5E8C57"/><circle cx="9" cy="4.4" r="1.3" fill="#D9463E"/></g>
    </g>`,
  smallfish:(n,c)=>{let o='';for(let i=0;i<n;i++){const x=58+i*(84/n), y=52+(i%2)*10;
      o+=`<g transform="translate(${x},${y})"><path d="M0,0 q11,-9 24,0 q-13,9 -24,0 Z" fill="${c}" stroke="${C.ink}" stroke-width="1.5"/>
      <path d="M24,0 l9,-5 0,10 Z" fill="${c}" stroke="${C.ink}" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="7" cy="-2" r="1.3" fill="${C.ink}"/></g>`}return o},
  rings:(c)=>{const r=rnd(11);let o='';for(let i=0;i<7;i++){const x=62+r()*74,y=50+r()*14;
      o+=`<circle cx="${x}" cy="${y}" r="${5+r()*2.4}" fill="none" stroke="${c}" stroke-width="3.4"/>
          <circle cx="${x}" cy="${y}" r="${5+r()*2.4}" fill="none" stroke="${C.ink}" stroke-width="1.2"/>`}return o},
  prawns:(n)=>{let o='';for(let i=0;i<n;i++){const x=68+i*28,y=52+(i%2)*7;
      o+=`<g transform="translate(${x},${y}) rotate(${-18+i*16})">
        <path d="M0,0 q-3,-9 6,-11 q10,-2 11,7 q1,8 -8,8 q-6,0 -9,-4" fill="#F2947A" stroke="${C.ink}" stroke-width="1.5"/>
        <path d="M-1,3 l-6,4" stroke="${C.ink}" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="12" cy="-2" r="1.2" fill="${C.ink}"/></g>`}return o},
  octopus:()=>`<g transform="translate(100,54)">
      <ellipse cx="0" cy="-6" rx="15" ry="12" fill="#E0839A" stroke="${C.ink}" stroke-width="1.8"/>
      ${[-2,-1,0,1,2].map(i=>`<path d="M${i*6},4 q${i*4},13 ${i*9},15" stroke="#E0839A" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M${i*6},4 q${i*4},13 ${i*9},15" stroke="${C.ink}" stroke-width="1.2" fill="none" stroke-linecap="round"/>`).join('')}
      <circle cx="-5" cy="-8" r="1.6" fill="${C.ink}"/><circle cx="5" cy="-8" r="1.6" fill="${C.ink}"/></g>`,
  sandwichFish:()=>`<path d="M50,64 q10,-26 50,-26 q40,0 50,26 q-50,10 -100,0 Z" fill="#E0B071" stroke="${C.ink}" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M56,56 q44,-9 88,0" stroke="#8FA85C" stroke-width="4" fill="none"/>
      <path d="M60,52 q40,-8 80,0" stroke="#A8B8C4" stroke-width="6" fill="none"/>
      <path d="M60,52 q40,-8 80,0" stroke="${C.ink}" stroke-width="1.2" fill="none"/>`,
  rolls:(c)=>[0,1,2,3].map(i=>`<g transform="translate(${62+i*26},54) rotate(${-14+i*9})">
      <rect x="-9" y="-6" width="18" height="13" rx="6" fill="${c}" stroke="${C.ink}" stroke-width="2.2"/>
      <path d="M-4,-4 v10 M2,-5 v11" stroke="${C.ink}" stroke-width="1.4" opacity=".55"/></g>`).join(''),
  cubes:(c)=>[0,1,2].map(i=>`<rect x="${64+i*26}" y="${46+(i%2)*8}" width="24" height="20" rx="5" fill="${c}" stroke="${C.ink}" stroke-width="2.6"/>`).join('')
};
function art(d,h){
  const seed=hash(d.tr);
  let inner='';
  switch(d.v){
    case 'bowl':   inner=bowl(d.c1)+ (d.top||''); break;
    case 'plate':  inner=plate(d.c1)+ (d.top||''); break;
    case 'glass':  inner=glass(d.c1,false)+(d.top||''); break;
    case 'tulip':  inner=glass(d.c1,true)+(d.top||''); break;
    case 'cup':    inner=cup(d.c1)+(d.top||''); break;
    case 'flat':   inner=`<ellipse cx="100" cy="83" rx="64" ry="5" fill="${C.ink}" opacity=".12"/>`+T.flatbread(d.c1)+(d.top||''); break;
    default:       inner=plate(d.c1)+(d.top||'');
  }
  return `<svg class="${h?'':'art'}" viewBox="18 30 164 60" ${h?'style="width:100%;display:block"':''}>
    <rect width="200" height="110" fill="${d.bg||'#FFFDF7'}"/>
    <g opacity=".26">${tileMotif(seed)}</g>${inner}</svg>`;
}
function tileMotif(seed){
  const r=rnd(seed);let o='';
  for(let i=0;i<5;i++){
    const x=14+r()*172, y=10+r()*30, s=.5+r()*.5;
    o+=`<g transform="translate(${x},${y}) scale(${s})">
      <path d="M0,-10 q7,7 0,14 q-7,-7 0,-14 Z" fill="${C.turq}"/>
      <path d="M-10,0 q7,-7 14,0 q-7,7 -14,0 Z" fill="${C.cobalt}" opacity=".7"/></g>`;
  }

 desc:'Stronger than most and yet it barely smells. As one forum put it: beginners try it, decide rakı does not actually smell, and become addicts. From fresh grape must rather than raisins, so lighter and fruitier.',
 order:'Kara Efe',oph:'ka-RA EH-feh',
 note:'The outlier. Worth tasting precisely because it breaks the pattern.',
 v:'glass',c1:'#F2F6F2',top:T.bottle('#2E2A2A','#E0A83C')},
{tr:'Beylerbeyi Göbek',tl:1350,un:'bottle / jar',ph:'bay-ler-bay-EE guh-BEK',en:'The smooth extreme',cat:'Rakı',reg:'İstanbul',diet:'vegan',prot:0,na:5,rate:3,
 desc:'The one the smooth camp defends and the burn camp dismisses. Best line on it: "It is beautiful. But it is not like rakı, it is like sherbet. My wife who cannot manage two glasses can drink a whole 35cl." Taste it to know what you are rejecting.',
 order:'Beylerbeyi Göbek',oph:'bay-ler-bay-EE guh-BEK',
 note:'If you like Braulio neat, this is probably too soft for you.',
 v:'glass',c1:'#F2F6F2',top:T.bottle('#8C2A2A','#FFFDF7')},
{tr:'Kulüp Rakı',tl:1050,un:'bottle / jar',ph:'koo-LOOP ra-KUH',en:'The old-school label',cat:'Rakı',reg:'Nationwide',diet:'vegan',prot:0,na:5,rate:4,
 desc:'Made since the 1930s and several drinkers call it the best brand outright, separated from its rivals by a higher alcohol ratio. Drier and more restrained than Yeni, usually a little cheaper, and frequently what the older men at the next table are drinking.',
 order:'Kulüp',oph:'koo-LOOP',v:'glass',c1:'#F2F6F2',top:T.bottle('#2A3A6A','#FFFDF7')},
{tr:'Tekirdağ No 10',tl:1600,un:'bottle / jar',ph:'te-keer-DAA no ON',en:'Called legendary',cat:'Rakı',reg:'Tekirdağ',diet:'vegan',prot:0,na:5,rate:5,
 desc:'Named efsane — legendary — repeatedly. Pairs with classic meze and a proper meal rather than being sipped alone. The Öküzgözü bottling from the same house is more divisive: some call it magnificent, one respected drinker called it too heavy and overpowering.',
 order:'Tekirdağ No 10',oph:'te-keer-DAA no ON',v:'glass',c1:'#F2F6F2',top:T.bottle('#1B4F8A','#C9A45E')},
{tr:'Yeni Rakı',tl:1100,un:'bottle / jar',ph:'yeh-NEE ra-KUH',en:'The default bottle',cat:'Rakı',reg:'Nationwide',diet:'vegan',prot:0,na:5,rate:3,
 desc:'What arrives if you order rakı without naming a brand. Fine, and the benchmark for availability rather than quality. The Ustaların Karışımı bottling is the one forum drinkers actually rate; Ala is sharper; Uzun Demleme was called extremely spirity and volatile, more grappa than rakı.',
 order:'Bir duble Yeni',oph:'beer DOOB-leh yeh-NEE',
 note:'If you must drink Yeni, ask for Ustaların Karışımı.',
 v:'glass',c1:'#F2F6F2',top:T.bottle('#2E7D4F','#FFFDF7')},
{tr:'Sarı Zeybek',tl:1500,un:'bottle / jar',ph:'sa-RUH zay-BEK',en:'For fruit and nuts',cat:'Rakı',reg:'Aegean',diet:'vegan',prot:0,na:5,rate:4,
 desc:'A göbek rakı that forum drinkers say goes with seasonal fruit and a handful of nuts rather than a full meal. Which makes it the September bottle — melon, figs and white cheese on a balcony.',
 order:'Sarı Zeybek',oph:'sa-RUH zay-BEK',v:'glass',c1:'#F2F6F2',top:T.bottle('#C9A45E','#2A3A6A')},
{tr:'Yaş üzüm rakısı',tl:1300,un:'bottle / jar',ph:'YAHSH oo-ZOOM ra-kuh-SUH',en:'Fresh-grape rakı',cat:'Rakı',reg:'Nationwide',diet:'vegan',prot:0,na:5,
 desc:'Distilled from fresh grape must rather than raisins. Fresher, rounder, softer, more floral; raisin-based rakı is heavier and more full-bodied. Fresh grape is generally held to be the better of the two and priced accordingly.',
 order:'Yaş üzüm mü?',oph:'YAHSH oo-ZOOM moo',
 note:'yaş üzüm = fresh grape · kuru üzüm = raisin. It is on the label.',
 v:'glass',c1:'#F2F6F2',top:T.grapes()},
{tr:'Üretim tarihi',ph:'oo-re-TEEM ta-ree-HEE',en:'The production date',cat:'Rakı',reg:'Nationwide',diet:'vegan',prot:0,na:5,
 desc:'A retired worker from the Tekirdağ distillery, quoted on a Turkish forum: forget the brand, look at the production date. Good rakı is fresh-grape rakı, and that only comes from August, September and October production. You are here in exactly that window — check the bottle.',
 order:'Üretim tarihi nedir?',oph:'oo-re-TEEM ta-ree-HEE ne-DEER',
 note:'The single most useful thing on this page. Almost no visitor checks it.',
 v:'glass',c1:'#F2F6F2',top:T.bottle('#5E8C57','#FFFDF7')},
{tr:'Rakı sofrası',ph:'ra-KUH sof-ra-SUH',en:'How to drink it',cat:'Rakı',reg:'Nationwide',diet:'vegan',prot:0,na:5,
 desc:'Water in the glass first, then rakı — it clouds white and becomes aslan sütü, lion\'s milk. Ice after, never before. A separate glass of plain water alongside. Sipped slowly over meze across three or four hours, never shot.',
 order:'Su ve buz, lütfen',oph:'SOO veh BOOZ loot-FEN',
 note:'For comparing bottles the forums say the opposite: drink it sek — neat, no water, no ice — then a sip of water after.',
 v:'glass',c1:'#F2F6F2',top:T.rakiSet()},
{tr:'Sek',ph:'SEK',en:'Neat, for tasting',cat:'Rakı',reg:'Nationwide',diet:'vegan',prot:0,na:5,
 desc:'"If you are comparing, drink it neat first — no water, no ice. That way you get both its purest form and, with a sip of water after, how it interacts with your body." Contradicts the ritual, and it is how you would actually run a comparison.',
 order:'Sek olsun',oph:'SEK ol-SOON',
 note:'sek = neat · duble = a double · tek = a single',
 v:'glass',c1:'#F2F6F2',top:''},

/* ---- KAHVALTI ---- */
{tr:'Serpme kahvaltı',tg:'many,cold',tl:650,un:'for two',reg:'Nationwide',ph:'ser-PMEH kah-val-TUH',en:'The spread breakfast',cat:'Kahvaltı',diet:'veg',prot:24,na:1200,
 desc:'Fifteen to thirty small plates arriving at once — cheeses, olives, tomato, cucumber, honey, clotted cream, jams, eggs, bread — and endless tea. Ordered for the table, eaten for two hours. The single most Turkish meal there is.',
 order:'İki kişilik serpme kahvaltı',oph:'i-KEE ki-shi-LEEK ser-PMEH kah-val-TUH',
 note:'"Serpme for two." Tea is usually unlimited and included.',
 v:'plate',c1:'#F6EEDC',top:T.spread()},
{tr:'Kaymak ve bal',tg:'white,thick,cold',tl:220,reg:'Afyon',ph:'kai-MAHK veh BAHL',en:'Clotted cream and honey',cat:'Kahvaltı',diet:'veg',prot:5,na:60,
 desc:'A slab of buffalo-milk clotted cream with honey poured over, scooped onto bread. Afyon makes the famous kaymak. Absurdly rich and non-negotiable at breakfast.',
 order:'Kaymak ve bal',oph:'kai-MAHK veh BAHL',v:'plate',c1:'#FBF6EC',top:T.kaymak()},
{tr:'Sahanda yumurta',tg:'yellow,egg,hot',tl:180,reg:'Nationwide',ph:'sa-HAN-da yoo-moor-TA',en:'Eggs in the pan',cat:'Kahvaltı',diet:'veg',prot:13,na:340,
 desc:'Two eggs fried in butter in a small copper pan and brought still sizzling. Sucuklu adds spicy sausage; pastırmalı adds cured beef.',
 order:'Sahanda yumurta',oph:'sa-HAN-da yoo-moor-TA',
 note:'sucuklu = with sausage, so not vegetarian. Plain is just eggs.',
 v:'plate',c1:'#F2F0E4',top:T.friedegg()},
{tr:'Sucuklu yumurta',tg:'red,egg,hot',tl:240,reg:'Nationwide',ph:'soo-jook-LOO yoo-moor-TA',en:'Eggs with spiced sausage',cat:'Kahvaltı',diet:'meat',prot:22,na:980,
 desc:'Coins of garlicky, cumin-heavy beef sausage fried until the fat renders, eggs cracked in after. The smell of a Turkish weekend morning.',
 order:'Sucuklu yumurta',oph:'soo-jook-LOO yoo-moor-TA',v:'plate',c1:'#F2F0E4',top:T.sucuk()},
{tr:'Menemen',tg:'red,egg,hot',tl:220,reg:'Aegean',ph:'me-ne-MEN',en:'Eggs in tomato and pepper',cat:'Kahvaltı',diet:'veg',prot:14,na:560,
 desc:'Soft eggs cooked into tomatoes and green peppers in a copper pan, eaten with bread straight from it. Argument rages over whether onion belongs. It does not.',
 order:'Menemen, soğansız',oph:'me-ne-MEN so-an-SUHZ',
 note:'soğansız = without onion, if you want the purist version.',
 v:'plate',c1:'#E0803C',top:T.dots('#F2C84B',6,79)},
{tr:'Mıhlama / Kuymak',tg:'yellow,thick,hot',tl:260,reg:'Black Sea',ph:'muhh-la-MA',en:'Black Sea cheese and cornmeal',cat:'Kahvaltı',diet:'veg',prot:16,na:720,
 desc:'Cornmeal cooked into melted butter and stringy Black Sea cheese until it pulls in ropes. A fondue by another name and gloriously heavy.',
 order:'Mıhlama',oph:'muhh-la-MA',v:'bowl',c1:'#E8C24A',top:T.stringy()},
{tr:'Katmer',tg:'brown,pastry,hot',tl:220,reg:'Gaziantep',ph:'kat-MER',en:'Pistachio and cream pastry',cat:'Kahvaltı',diet:'veg',prot:9,na:220,
 desc:'Gaziantep\'s breakfast pastry — paper-thin dough folded around clotted cream and green pistachio, baked crisp and cut into squares. Eaten in the morning, not as dessert.',
 order:'Katmer',oph:'kat-MER',v:'plate',c1:'#E8CC8A',top:T.katmer()},
{tr:'Zeytin',tg:'green,black,cold',tl:90,un:'per kilo',reg:'Aegean',ph:'zay-TEEN',en:'Olives',cat:'Kahvaltı',diet:'vegan',prot:1,na:680,
 desc:'Both colours at every breakfast — black yeşil-kırma from the Aegean, green cracked ones with garlic and lemon. Sold loose by the kilo in every market.',
 order:'Yeşil zeytin',oph:'ye-SHEEL zay-TEEN',
 note:'Cured in brine — one of the saltiest items on a breakfast table.',
 v:'bowl',c1:'#5A6B32',top:T.olives(13)},
{tr:'Reçel',tg:'red,thick,cold',tl:70,un:'bottle / jar',reg:'Nationwide',ph:'reh-CHEL',en:'Preserves',cat:'Kahvaltı',diet:'vegan',prot:0,na:15,
 desc:'Small dishes of jam across the table — rose petal, sour cherry, bergamot, fig, and the strange green walnut one. Ask what is homemade; the answer is often "everything".',
 order:'Gül reçeli',oph:'GOOL reh-che-LEE',
 note:'gül = rose, vişne = sour cherry, kayısı = apricot.',
 v:'bowl',c1:'#C4304A',top:T.jamjars()},
{tr:'Tahin pekmez',tg:'brown,thick,cold',tl:110,reg:'Nationwide',ph:'ta-HEEN pek-MEZ',en:'Tahini and grape molasses',cat:'Kahvaltı',diet:'vegan',prot:6,na:35,
 desc:'Sesame paste swirled with grape molasses and eaten on bread. Nutty, dark, iron-rich, and the traditional thing given to Turkish children in winter. Vegan and genuinely good.',
 order:'Tahin pekmez',oph:'ta-HEEN pek-MEZ',v:'bowl',c1:'#8A6A4A',top:T.swirl('#E8DCC0')},
{tr:'Su böreği',tg:'yellow,pastry,hot',tl:160,reg:'Nationwide',ph:'SOO bo-reh-EE',en:'Layered "water" pastry',cat:'Kahvaltı',diet:'veg',prot:12,na:640,
 desc:'Sheets of pastry boiled then layered with white cheese and parsley and baked — somewhere between lasagne and börek. Heavy, soft, magnificent.',
 order:'Su böreği',oph:'SOO bo-reh-EE',v:'plate',c1:'#EFD8A0',top:T.diamonds('#E8C86A')},

/* ---- FRUIT & NUTS ---- */
{tr:'İncir',tg:'purple,fruit',tl:160,un:'per kilo',reg:'Aydın',ph:'in-JEER',en:'Fig',cat:'Fruit',diet:'vegan',prot:1,na:2,sea:[8,9],
 desc:'The Aegean around Fethiye is fig country and September is the month. Fresh ones off a market stall are a different food from anything sold abroad — split them open with your thumbs.',
 order:'Yarım kilo incir',oph:'ya-RUHM KEE-lo in-JEER',
 note:'Peak now. Buy from a stall, not a shop.',v:'plate',c1:'#EDE0CE',top:T.figs()},
{tr:'Kuru incir',tg:'brown,fruit',tl:320,un:'per kilo',reg:'Aydın',ph:'koo-ROO in-JEER',en:'Dried fig',cat:'Fruit',diet:'vegan',prot:3,na:10,sea:[8,9,10],
 desc:'Aydın figs, dried and pressed. September is just after harvest, so what is on the stalls now is this year\'s crop rather than last year\'s warehouse stock. The best in the world and priced like nothing.',
 order:'Kuru incir, kilosu ne kadar?',oph:'koo-ROO in-JEER ki-lo-SOO neh ka-DAR',
 v:'plate',c1:'#EDE0CE',top:T.driedfruit('#A88A5C')},
{tr:'Kuru kayısı',tg:'orange,fruit',tl:420,un:'per kilo',reg:'Malatya',ph:'koo-ROO kai-yuh-SUH',en:'Dried apricot',cat:'Fruit',diet:'vegan',prot:3,na:10,sea:[7,8,9,10],
 desc:'Malatya supplies most of the world. The bright orange ones are sulphured; the dark brown ones are not, and taste far more of apricot. Ask for kükürtsüz — unsulphured.',
 order:'Kükürtsüz kayısı var mı?',oph:'koo-kurt-SOOZ kai-yuh-SUH var muh',
 note:'kükürtsüz = unsulphured. Dark brown, not orange.',
 v:'plate',c1:'#EDE0CE',top:T.driedfruit('#C4682A')},
{tr:'Üzüm',tg:'purple,fruit',tl:90,un:'per kilo',reg:'Aegean',ph:'oo-ZOOM',en:'Grapes',cat:'Fruit',diet:'vegan',prot:1,na:2,sea:[7,8,9],
 desc:'Harvest season. Dozens of varieties on the stalls, most of them you will not recognise — sultaniye seedless, the long green parmak, the black kara üzüm. Buy a kilo and eat them all afternoon.',
 order:'Bir kilo üzüm',oph:'beer KEE-lo oo-ZOOM',v:'plate',c1:'#EDE0CE',top:T.grapes()},
{tr:'Nar',tg:'red,fruit',tl:110,un:'per kilo',reg:'Antalya',ph:'NAR',en:'Pomegranate',cat:'Fruit',diet:'vegan',prot:2,na:3,sea:[8,9,10,11],
 desc:'Comes in from late September and stays through winter. Juice carts press them in front of you; whole fruit on the stalls is cheaper. The molasses (nar ekşisi) is in half the meze on this list.',
 order:'Bir nar suyu',oph:'beer NAR soo-YOO',v:'plate',c1:'#EDE0CE',top:T.pom()},
{tr:'Şeftali',tg:'orange,fruit',tl:110,un:'per kilo',reg:'Bursa',ph:'shef-ta-LEE',en:'Peach',cat:'Fruit',diet:'vegan',prot:1,na:1,sea:[5,6,7,8],
 desc:'Bursa peaches run through summer into early September. The flat ones, yassı şeftali, are worth grabbing whenever they appear.',
 order:'Şeftali',oph:'shef-ta-LEE',v:'plate',c1:'#EDE0CE',top:T.roundfruit('#F2A05C','#E0803C')},
{tr:'Kavun / Karpuz',tg:'green,fruit',tl:50,un:'per kilo',reg:'Anatolia',ph:'ka-VOON / kar-POOZ',en:'Melon / watermelon',cat:'Fruit',diet:'vegan',prot:1,na:5,sea:[6,7,8],
 desc:'Enormous and cheap through summer. Kavun — the pale honeydew type — is the one eaten with white cheese and rakı, a combination that sounds wrong and is completely right.',
 order:'Kavun',oph:'ka-VOON',
 note:'Kavun + beyaz peynir + rakı is a genuine Turkish trio.',
 v:'plate',c1:'#EDE0CE',top:T.melon()},
{tr:'Ayva',tg:'yellow,fruit',tl:120,un:'per kilo',reg:'Marmara',ph:'eye-VA',en:'Quince',cat:'Fruit',diet:'vegan',prot:1,na:4,sea:[9,10,11],
 desc:'Hard and inedible raw, transformed by slow cooking into something rose-coloured and perfumed. Ayva tatlısı — poached in syrup with clotted cream — is the autumn dessert.',
 order:'Ayva tatlısı',oph:'eye-VA tat-luh-SUH',v:'plate',c1:'#EDE0CE',top:T.roundfruit('#E8D06A','#C4A83C')},
{tr:'Fındık',tg:'brown,nut',tl:480,un:'per kilo',reg:'Black Sea',ph:'fuhn-DUHK',en:'Hazelnut',cat:'Fruit',diet:'vegan',prot:15,na:2,sea:[7,8,9],
 desc:'Turkey grows about seventy per cent of the world supply, all along the Black Sea. Harvest is August, so September stalls have this year\'s nuts. Buy them in the shell and crack them yourself.',
 order:'Fındık',oph:'fuhn-DUHK',v:'plate',c1:'#EDE0CE',top:T.nuts('#B08A5C')},
{tr:'Antep fıstığı',tg:'green,nut',tl:1100,un:'per kilo',reg:'Gaziantep',ph:'an-TEP fuhs-tuh-UH',en:'Pistachio',cat:'Fruit',diet:'vegan',prot:20,na:8,sea:[8,9,10],
 desc:'Gaziantep pistachios are smaller, greener and more intensely flavoured than the Iranian or Californian kind. They are what makes proper baklava green rather than beige.',
 order:'Antep fıstığı',oph:'an-TEP fuhs-tuh-UH',v:'plate',c1:'#EDE0CE',top:T.nuts('#8FA85C')},
{tr:'Dut',tg:'purple,fruit',tl:520,un:'per kilo',reg:'Anatolia',ph:'DOOT',en:'Mulberry',cat:'Fruit',diet:'vegan',prot:1,na:5,sea:[5,6],
 desc:'White and black mulberries, sold fresh in early summer and dried the rest of the year. Dried white mulberries are intensely sweet and worth a bag for the trail.',
 order:'Kuru dut',oph:'koo-ROO DOOT',v:'plate',c1:'#EDE0CE',top:T.driedfruit('#7A5A8A')},
{tr:'Trabzon hurması',tg:'orange,fruit',tl:150,un:'per kilo',reg:'Black Sea',ph:'trab-ZON hoor-ma-SUH',en:'Persimmon',cat:'Fruit',diet:'vegan',prot:1,na:1,sea:[9,10,11],
 desc:'Orange, glossy, and only good when almost collapsing — eaten firm it will dry your mouth out completely. Comes in from October.',
 order:'Trabzon hurması',oph:'trab-ZON hoor-ma-SUH',v:'plate',c1:'#EDE0CE',top:T.roundfruit('#E8802A','#C4601A')},

/* ---- BREAD ---- */
{tr:'Simit',tg:'brown,bread',tl:20,reg:'Nationwide',ph:'si-MEET',en:'Sesame bread ring',cat:'Bread',diet:'vegan',prot:8,na:480,
 desc:'A ring of dough dipped in molasses and sesame, baked crisp. Sold from red carts everywhere for the price of nothing. The default Turkish breakfast on foot.',
 order:'Bir simit',oph:'beer si-MEET',v:'plate',c1:'#D9A05C',
 top:`<circle cx="100" cy="52" r="30" fill="none" stroke="#C68A4A" stroke-width="17"/><circle cx="100" cy="52" r="30" fill="none" stroke="#1E3A5F" stroke-width="3"/><circle cx="100" cy="52" r="13" fill="none" stroke="#1E3A5F" stroke-width="3"/>`},
{tr:'Poğaça',tg:'yellow,bread',tl:45,reg:'Nationwide',ph:'po-a-CHA',en:'Soft savoury bun',cat:'Bread',diet:'veg',prot:7,na:520,
 desc:'A pillowy bun filled with white cheese, olives or potato. Bakery staple, eaten with tea, best in the first hour after baking.',
 order:'Peynirli poğaça',oph:'pay-neer-LEE po-a-CHA',v:'plate',c1:'#E8C88A',top:''},

/* ---- SWEETS ---- */
{tr:'Baklava',tg:'yellow,pastry,sweet',tl:180,reg:'Gaziantep',ph:'bak-la-VA',en:'Layered pastry with pistachio',cat:'Sweets',diet:'veg',prot:6,na:120,
 desc:'Forty-odd sheets of filo, clarified butter, pistachio from Gaziantep, syrup. Judge it by the pistachio ratio and whether the layers shatter.',
 order:'Fıstıklı baklava',oph:'fuhs-tuhk-LUH bak-la-VA',
 note:'fıstıklı = pistachio, cevizli = walnut. Gaziantep is the source.',
 v:'plate',c1:'#E8C86A',top:T.diamonds('#D9B44A')},
{tr:'Künefe',tg:'orange,pastry,sweet,hot',tl:260,reg:'Hatay',ph:'koo-NE-feh',en:'Hot cheese pastry in syrup',cat:'Sweets',diet:'veg',prot:12,na:380,
 desc:'Shredded pastry around a layer of unsalted cheese, baked until crisp and doused in syrup, served hot so the cheese pulls. Eat it immediately or not at all.',
 order:'Künefe',oph:'koo-NE-feh',v:'plate',c1:'#D9873C',top:T.dots('#5E8C57',5,89)},
{tr:'Lokum',tg:'pink,cubed,sweet',tl:600,un:'per kilo',reg:'İstanbul',ph:'lo-KOOM',en:'Turkish delight',cat:'Sweets',diet:'vegan',prot:1,na:20,
 desc:'Starch and sugar set into cubes, dusted with icing sugar. Buy the double-roasted pistachio kind from a proper confectioner and it\'s a different food from the tourist version.',
 order:'Fıstıklı lokum',oph:'fuhs-tuhk-LUH lo-KOOM',
 note:'Sold by weight. Say "yarım kilo" for half a kilo.',
 v:'plate',c1:'#E8859B',top:T.cubes('#F0A8B8')},
{tr:'Sütlaç',tg:'white,thick,sweet',tl:140,reg:'Nationwide',ph:'soot-LAHCH',en:'Baked rice pudding',cat:'Sweets',diet:'veg',prot:7,na:140,
 desc:'Rice pudding baked until the top blisters brown, served cold in a clay dish. Plainer and better than it sounds.',
 order:'Sütlaç',oph:'soot-LAHCH',v:'bowl',c1:'#FBF6EC',top:T.dots('#C68A4A',6,97)},
{tr:'Dondurma',tg:'white,thick,sweet',tl:120,reg:'Kahramanmaraş',ph:'don-doo-RMA',en:'Stretchy mastic ice cream',cat:'Sweets',diet:'veg',prot:5,na:90,
 desc:'Thickened with salep root and mastic so it stretches and resists the spoon. The Maraş vendors will do a routine with it before handing it over.',
 order:'Bir dondurma',oph:'beer don-doo-RMA',v:'plate',c1:'#FBF6EC',top:T.scoop('#FBF6EC')},
{tr:'Aşure',tg:'brown,thick,sweet',tl:130,reg:'Nationwide',ph:'a-shoo-REH',en:'Noah\'s pudding',cat:'Sweets',diet:'vegan',prot:5,na:60,
 desc:'Wheat berries, beans, dried fruit and nuts cooked into a sweet pudding. Supposedly what was left in the ark. Naturally vegan and shared with neighbours.',
 order:'Aşure',oph:'a-shoo-REH',v:'bowl',c1:'#C4A06A',top:T.dots('#8C4A32',9,101)},

/* ---- DRINKS ---- */
{tr:'Çay',tl:30,reg:'Rize',ph:'CHAI',en:'Black tea',cat:'Drinks',diet:'vegan',prot:0,na:5,
 desc:'Brewed in a stacked double kettle, poured strong from the top pot and cut with water from the bottom. Served in tulip glasses with sugar cubes, all day, everywhere, often free.',
 order:'Bir çay, koyu',oph:'beer CHAI ko-YOO',
 note:'koyu = strong, açık = weak. Refusing tea is the rudeness, not accepting it.',
 v:'tulip',c1:'#B5442A',top:''},
{tr:'Türk kahvesi',tl:110,reg:'İstanbul',ph:'TURK kah-ve-SEE',en:'Turkish coffee',cat:'Drinks',diet:'vegan',prot:0,na:5,
 desc:'Unfiltered, brewed in a cezve, served with the grounds settling at the bottom. Ordered by sweetness, not size. Don\'t drink the last inch.',
 order:'Orta şekerli',oph:'or-TA she-ker-LEE',
 note:'sade = no sugar, az şekerli = a little, orta = medium, şekerli = sweet.',
 v:'cup',c1:'#4A3226',top:T.steam()},
{tr:'Ayran',tl:60,reg:'Nationwide',ph:'eye-RAHN',en:'Salted yoghurt drink',cat:'Drinks',diet:'veg',prot:6,na:420,
 desc:'Yoghurt whisked with water and salt, served cold and often foamy. The correct thing to drink with kebab, and genuinely good after a hot walk.',
 order:'Bir ayran',oph:'beer eye-RAHN',
 note:'Salted by definition — one of the few drinks that counts on the sodium ledger.',
 v:'glass',c1:'#FBFAF4',top:''},
{tr:'Şalgam suyu',tl:60,reg:'Adana',ph:'shal-GAHM soo-YOO',en:'Fermented turnip juice',cat:'Drinks',diet:'vegan',prot:1,na:900,
 desc:'Purple carrot and turnip fermented with bulgur into a sour, salty, faintly spicy drink. The traditional partner to Adana kebab. Divisive and worth trying once.',

/* Kept small on purpose — 420px wide JPEG at 0.62 is ~35KB, so a month of
   shooting fits in localStorage without eviction. */
let PIC={};
try{ const v=localStorage.getItem('alvan_pics'); if(v) PIC=JSON.parse(v) }catch(e){}
function savePics(){
  try{ localStorage.setItem('alvan_pics',JSON.stringify(PIC)); return true }
  catch(e){ return false }
}
function shrink(file,cb){
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const W=420, sc=Math.min(1,W/im.width);
      const w=Math.round(im.width*sc), h=Math.round(im.height*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.62));
    };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}
let PLACE={};
try{ const v=localStorage.getItem('alvan_places'); if(v) PLACE=JSON.parse(v) }catch(e){}
function savePlaces(){ try{ localStorage.setItem('alvan_places',JSON.stringify(PLACE)) }catch(e){} }

function grabLocation(name,thenRedraw){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:la,longitude:lo}=pos.coords;
    PLACE[name]=Object.assign({},PLACE[name],{la:+la.toFixed(5),lo:+lo.toFixed(5)});
    savePlaces();
    if(thenRedraw) openSheet(name);
    /* try for a human name, but never block on it */
    fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${la}&lon=${lo}&zoom=18`)
      .then(r=>r.json()).then(j=>{
        const a=j.address||{};
        const near = a.restaurant||a.cafe||a.bar||a.amenity||a.shop||a.road||a.suburb||a.town||a.city;
        if(near && !(PLACE[name]||{}).n){
          PLACE[name].n=near; savePlaces();
          if(thenRedraw) openSheet(name);
        }
      }).catch(()=>{});
  },()=>{},{enableHighAccuracy:false,timeout:8000,maximumAge:120000});
}

function takePhoto(name){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    shrink(f,data=>{
      PIC[name]=data;
      if(!savePics()){ delete PIC[name]; alert('Out of storage — delete a few photos first.'); return; }
      if(navigator.vibrate) navigator.vibrate([12,40,12]);
      grabLocation(name,true);
      openSheet(name); render();
    });
  };
  inp.click();
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-photo]');
  if(a){ e.stopPropagation(); takePhoto(a.dataset.photo); return }
  const d=e.target.closest('[data-photodel]');
  if(d){ e.stopPropagation(); const n=d.dataset.photodel;
    delete PIC[n]; savePics(); openSheet(n); render(); return }
  const f=e.target.closest('[data-flip]');
  if(f){ e.stopPropagation(); f.classList.toggle('big'); return }
  const pin=e.target.closest('[data-pin]');
  if(pin){ e.stopPropagation(); grabLocation(pin.dataset.pin,true) }
});

/* ============ speech ============ */
let TRV=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  TRV = vs.find(v=>v.lang==='tr-TR') || vs.find(v=>v.lang&&v.lang.startsWith('tr')) || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
}
function say(text,btn){
  if(!('speechSynthesis' in window)){ if(btn) btn.textContent='—'; return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(!TRV) pickVoice();
  if(TRV) u.voice=TRV;
  u.lang='tr-TR'; u.rate=.82; u.pitch=1;
  if(btn){ btn.classList.add('play'); u.onend=()=>btn.classList.remove('play');
           u.onerror=()=>btn.classList.remove('play'); }
  speechSynthesis.speak(u);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-say]');
  if(!b) return;
  e.stopPropagation();
  say(b.dataset.say,b);
});

/* ============ offline ============ */
/* The whole app is one file, so caching that file is caching everything.
   The worker is built from a blob so there's still nothing else to host. */
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol==='file:') return;          // file:// can't host workers
  const src=`
    const CACHE='alvan-v1';
    self.addEventListener('install',e=>{ self.skipWaiting(); });
    self.addEventListener('activate',e=>{ e.waitUntil(self.clients.claim()); });
    self.addEventListener('fetch',e=>{
      if(e.request.method!=='GET') return;
      e.respondWith(
        fetch(e.request).then(r=>{
          const c=r.clone();
          caches.open(CACHE).then(k=>k.put(e.request,c)).catch(()=>{});
          return r;
        }).catch(()=> caches.match(e.request).then(r=> r || caches.match('./')))
      );
    });`;
  try{
    const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
    navigator.serviceWorker.register(url).then(()=>{
      const f=document.querySelector('footer span');
      if(f) f.innerHTML='🔊 hear it · ✓ tried · + order · 🎲 shake &nbsp;·&nbsp; <b style="color:var(--sage)">works offline</b>';
    }).catch(()=>{});
  }catch(e){}
}

/* --- shake detection --- */
let shakeOn=false, lastShake=0, lx=null,ly=null,lz=null;
function armShake(){
  if(shakeOn) return; shakeOn=true;
  window.addEventListener('devicemotion',e=>{
    const a=e.accelerationIncludingGravity; if(!a||a.x==null) return;
    if(lx!==null){
      const delta=Math.abs(a.x-lx)+Math.abs(a.y-ly)+Math.abs(a.z-lz);
      if(delta>32 && Date.now()-lastShake>1200){
        lastShake=Date.now();
        if(navigator.vibrate) navigator.vibrate(35);
        surprise();
      }
    }
    lx=a.x; ly=a.y; lz=a.z;
  });
  const d=document.getElementById('dice'); d.title='Shake the phone, or tap';
}
/* Android and desktop don't need permission */
if(typeof DeviceMotionEvent!=='undefined' &&
   typeof DeviceMotionEvent.requestPermission!=='function') armShake();

/* Hicaz makam — the sound people mean by "Turkish" */
const HICAZ=[0,1,4,5,7,8,11,12,13,16,17,19];
const PH=[ [0,2,1,0,-1,0,2,4], [4,3,2,1,0,1,2,0], [0,2,4,5,4,2,1,0], [4,5,4,2,1,0,-1,0] ];
function ir(ctx,sec,dec){const n=ctx.sampleRate*sec,b=ctx.createBuffer(2,n,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dec)}return b}
const f0=n=>293.66*Math.pow(2,n/12);
function pluck(f,t,g){                       /* bağlama-ish: bright, quick decay */
  const out=AC.createGain();out.connect(rev);out.connect(mas);
  [[1,1],[2,.5],[3,.28],[4,.14],[5.4,.07]].forEach(([m,a])=>{
    const o=AC.createOscillator(),gg=AC.createGain();
    o.type='triangle';o.frequency.value=f*m;
    gg.gain.setValueAtTime(0,t);gg.gain.linearRampToValueAtTime(g*a,t+.004);
    gg.gain.exponentialRampToValueAtTime(.0002,t+1.5/m);
    o.connect(gg);gg.connect(out);o.start(t);o.stop(t+1.6);
  });
}
function drum(t,hard){                       /* darbuka düm / tek */
  const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=hard?260:900;
  o.type='sine';o.frequency.setValueAtTime(hard?150:320,t);
  o.frequency.exponentialRampToValueAtTime(hard?55:150,t+.09);
  g.gain.setValueAtTime(hard?.16:.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);
  o.connect(lp);lp.connect(g);g.connect(mas);o.start(t);o.stop(t+.25);
}
function start(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  mas=AC.createGain();mas.gain.value=.5;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4000;
  mas.connect(lp);lp.connect(AC.destination);
  rev=AC.createConvolver();rev.buffer=ir(AC,2.2,2.4);
  const rg=AC.createGain();rg.gain.value=.3;rev.connect(rg);rg.connect(AC.destination);
  let t=AC.currentTime+.3;const bpm=96,b=60/bpm;
  step=0;on=true;
  seq=setInterval(()=>{
    if(!on)return;
    while(t<AC.currentTime+1.6){
      const bar=Math.floor(step/8)%4, i=step%8;
      const d=PH[bar][i];
      const n=HICAZ[((d%12)+12)%12]+12*Math.floor(d/12);
      pluck(f0(n+12),t,.075);
      if(i%2===0) pluck(f0(n),t+.006,.03);
      /* düm-tek-tek pattern */
      if(i===0||i===3) drum(t,true); else if(i%2===1) drum(t,false);
      t+=b/2; step++;
    }
  },200);
}
function stop(){on=false;clearInterval(seq);if(AC){AC.close();AC=null}}
document.getElementById('snd').onclick=e=>{
  const b=e.currentTarget;
  if(on){stop();b.textContent='♪ Müzik';b.classList.remove('on')}
  else{try{start();b.textContent='♪ Müzik açık';b.classList.add('on')}catch(err){b.textContent='♪ engellendi';console.error(err)}}
};

drawCat();
bskUpdate();
registerSW();
render();
</script>
