<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alvan's Table</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alvan">
<meta name="theme-color" content="#D9463E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23D9463E'/%3E%3Cellipse cx='90' cy='104' rx='44' ry='34' fill='%23F6B24A' stroke='%231E3A5F' stroke-width='6'/%3E%3Cpath d='M52 78 l6-30 24 16 M128 78 l-6-30 -24 16' fill='%23F6B24A' stroke='%231E3A5F' stroke-width='6' stroke-linejoin='round'/%3E%3Cellipse cx='74' cy='100' rx='8' ry='9' fill='%23FFFDF7' stroke='%231E3A5F' stroke-width='4'/%3E%3Cellipse cx='106' cy='100' rx='8' ry='9' fill='%23FFFDF7' stroke='%231E3A5F' stroke-width='4'/%3E%3Ccircle cx='76' cy='103' r='4' fill='%232E9EA6'/%3E%3Ccircle cx='108' cy='103' r='4' fill='%232E9EA6'/%3E%3Cpath d='M90 112 l-5-5 h10 Z' fill='%23E8859B' stroke='%231E3A5F' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M90 118 q-8 7 -14 2 M90 118 q8 7 14 2' stroke='%231E3A5F' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F1E4; --tile:#FFFDF7; --ink:#1E3A5F;      /* İznik cobalt */
  --cobalt:#1B4F8A; --turq:#2E9EA6; --coral:#D9463E; --sage:#5E8C57;
  --gold:#E0A83C; --line:#D9CDB4; --grey:#7C7461;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 80px}

/* ---------- header ---------- */
header{position:relative;background:var(--coral);color:#FFF9F0;overflow:hidden;
  border-bottom:3px solid var(--ink)}
.hd{max-width:1180px;margin:0 auto;padding:14px 16px 16px;position:relative;z-index:2;
  display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(23px,5.4vw,36px);
  line-height:.94;letter-spacing:-.03em}
.hsub{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;opacity:.9;margin-top:5px}
.flag{flex:none;display:block}
#catbox{flex:none}
#tilebg{position:absolute;inset:0;opacity:.16;z-index:1}

/* ---------- controls ---------- */
.sticky{position:sticky;top:0;z-index:30;background:var(--paper);
  padding:7px 0 6px;margin:0 -14px;padding-left:14px;padding-right:14px;
  border-bottom:2px solid var(--line);box-shadow:0 6px 12px -8px rgba(30,58,95,.28)}
.searchrow{display:flex;gap:7px;align-items:center;min-width:0}
.searchrow .bar{flex:1;min-width:0}
.dice{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);
  background:var(--gold);font-size:15px;cursor:pointer;line-height:1;padding:0}
.dice:hover{background:var(--coral)}
.dice:active{transform:scale(.92)}
.dice.roll{animation:roll .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes roll{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.25)}100%{transform:rotate(360deg) scale(1)}}
.bar{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;margin:0;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bar::-webkit-scrollbar{display:none}
.bar .chip{flex:none}
.chip{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 9px;border:1.8px solid var(--line);border-radius:18px;background:var(--tile);
  color:var(--grey);cursor:pointer;transition:.15s;font-weight:600}
.chip:hover{border-color:var(--cobalt);color:var(--cobalt)}
.chip.on{background:var(--cobalt);border-color:var(--cobalt);color:#FFF}
.chip.veg.on{background:var(--sage);border-color:var(--sage)}
.chip.salt.on{background:var(--turq);border-color:var(--turq)}
.chip.snd.on{background:var(--gold);border-color:var(--ink);color:var(--ink)}
.spacer{flex:1;min-width:12px}
.count{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--grey);letter-spacing:.06em}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:9px;margin-top:12px}
@media(min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:11px}}
.dish{background:var(--tile);border:2px solid var(--ink);border-radius:11px;overflow:hidden;
  cursor:pointer;transition:transform .16s,box-shadow .16s;position:relative}
.dish:hover{transform:translateY(-4px);box-shadow:4px 6px 0 rgba(30,58,95,.18)}
.art{display:block;width:100%;background:#FFF;border-bottom:2.5px solid var(--ink)}
.dbody{padding:8px 10px 10px}
.dtr{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:15.5px;letter-spacing:-.01em;line-height:1.12;display:flex;align-items:center;gap:5px}
.dph{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--turq);letter-spacing:.04em;margin-top:2px}
.den{font-size:11px;color:var(--grey);margin-top:3px;line-height:1.3}
.seas{position:absolute;top:6px;left:6px;z-index:2;background:var(--sage);color:#FFF;
  font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.09em;text-transform:uppercase;
  padding:2.5px 7px;border-radius:20px;border:1.5px solid var(--ink);font-weight:600}
.ate{position:absolute;top:5px;right:5px;z-index:3;width:26px;height:26px;border-radius:50%;
  border:2px solid var(--ink);background:rgba(255,253,247,.9);cursor:pointer;font-size:13px;
  line-height:1;padding:0;color:#C0B8A2}
.ate.on{background:var(--sage);color:#FFF}
.dish.eaten{box-shadow:inset 0 0 0 3px var(--sage)}
.tally{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--sage);font-weight:600;letter-spacing:.05em}
/* basket */
.bskbar{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--cobalt);color:#FFF;
  padding:10px 14px;display:none;align-items:center;gap:10px;box-shadow:0 -6px 18px rgba(30,58,95,.28)}
.bskbar.on{display:flex}
.bskn{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:15px;flex:1}
.bskbtn{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  border:2px solid #FFF;border-radius:20px;background:transparent;color:#FFF;padding:6px 11px;cursor:pointer;font-weight:600}
.bskbtn.go{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.add{position:absolute;bottom:5px;right:5px;z-index:3;width:26px;height:26px;border-radius:50%;
  border:2px solid var(--ink);background:rgba(255,253,247,.92);cursor:pointer;font-size:15px;
  line-height:1;padding:0;color:#C0B8A2;font-weight:700}
.add.on{background:var(--cobalt);color:#FFF}
/* order sheet */
.ordwrap{position:fixed;inset:0;z-index:70;background:rgba(30,58,95,.55);display:none;
  align-items:center;justify-content:center;padding:18px}
.ordwrap.on{display:flex}
.ordbox{background:var(--tile);border:3px solid var(--ink);border-radius:16px;max-width:460px;width:100%;
  padding:20px 20px 18px;max-height:86vh;overflow-y:auto}
.ordh{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em}
.ordline{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:21px;line-height:1.3;
  margin:12px 0 4px;color:var(--cobalt)}
.ordph{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--turq);line-height:1.5}
.ordlist{margin:14px 0 0;font-size:13px;line-height:1.7}
.ordlist span{color:var(--grey)}
.ordx{float:right;border:2px solid var(--ink);border-radius:50%;width:30px;height:30px;
  background:var(--tile);cursor:pointer;font-size:15px;color:var(--ink)}
/* point-at-this */
.pointwrap{position:fixed;inset:0;z-index:80;background:var(--coral);color:#FFF9F0;display:none;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer}
.pointwrap.on{display:flex}
.pointtr{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
  font-size:clamp(40px,13vw,96px);line-height:.95;letter-spacing:-.03em}
.pointen{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;margin-top:16px;opacity:.85}
.pointhint{position:absolute;bottom:26px;font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.pointbtn{margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;border:2px solid var(--cobalt);border-radius:20px;background:#E9F0F8;
  color:var(--cobalt);padding:7px 12px;cursor:pointer;font-weight:600}
/* progress */
.prog{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 0;flex:1;min-width:70px}
.prog i{display:block;height:100%;background:var(--sage);transition:width .4s}
.spk{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--cobalt);
  background:#E9F0F8;color:var(--cobalt);cursor:pointer;font-size:11px;line-height:1;padding:0;
  display:inline-flex;align-items:center;justify-content:center}
.spk:hover,.spk.play{background:var(--cobalt);color:#FFF}
.spk.big{width:34px;height:34px;font-size:16px;border-width:2px}
.pills{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}
.pill{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.07em;text-transform:uppercase;
  padding:2.5px 6px;border-radius:20px;border:1.5px solid;font-weight:600}
.p-vegan{color:#3E7A38;border-color:#3E7A38;background:#EAF4E7}
.p-veg{color:var(--sage);border-color:var(--sage);background:#F0F6EE}
.p-fish{color:var(--turq);border-color:var(--turq);background:#E7F5F5}
.p-meat{color:var(--coral);border-color:var(--coral);background:#FCEDEC}
.p-lo{color:var(--cobalt);border-color:var(--cobalt);background:#E9F0F8}
.p-hi{color:#A8471F;border-color:#A8471F;background:#FBEDE6}
.p-prot{color:var(--ink);border-color:var(--line);background:#F7F3E8}
.p-heat{color:var(--coral);border-color:var(--coral);background:#FCEDEC;letter-spacing:-1px}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:auto 0 0 0;max-height:90vh;overflow-y:auto;z-index:60;background:var(--tile);
  border-top:4px solid var(--ink);transform:translateY(101%);
  transition:transform .3s cubic-bezier(.3,.8,.4,1);box-shadow:0 -12px 40px rgba(30,58,95,.22)}
.sheet.open{transform:translateY(0)}
.sin{max-width:1180px;margin:0 auto;padding:22px 18px 40px;position:relative;
  display:grid;grid-template-columns:196px 1fr;gap:22px}
@media(max-width:700px){.sin{grid-template-columns:1fr;gap:16px}}
.sx{position:absolute;top:18px;right:18px;width:34px;height:34px;border:2px solid var(--ink);
  border-radius:50%;background:var(--tile);cursor:pointer;font-size:17px;color:var(--ink)}
.sx:hover{background:var(--coral);color:#FFF;border-color:var(--coral)}
.sart{border:2.5px solid var(--ink);border-radius:12px;background:#FFF;overflow:hidden;align-self:start}
.stitle{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(26px,4.4vw,40px);
  letter-spacing:-.03em;line-height:1}
.sphon{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--turq);margin:5px 0 3px;letter-spacing:.03em}
.sen{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
.sdesc{margin:14px 0;font-size:15px;line-height:1.6}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:9px;margin:14px 0}
.fact{border:2px solid var(--line);border-radius:10px;padding:9px 11px;background:#FBF8EF}
.fk{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--grey)}
.fv{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:18px;margin-top:2px}
.fn{font-size:11px;color:var(--grey);margin-top:2px;line-height:1.3}
.say{border:2.5px solid var(--cobalt);border-radius:12px;background:#EDF3FA;padding:12px 14px;margin-top:12px}
.saylab{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cobalt)}
.saytr{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:20px;margin-top:3px}
.sayph{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--turq)}
.note{margin-top:12px;font-size:12.5px;color:var(--grey);border-left:3px solid var(--gold);padding-left:11px}

/* ---------- phrasebook ---------- */
.phr{margin-top:44px}
.h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.025em;
  border-bottom:3px solid var(--ink);padding-bottom:8px;margin-bottom:16px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:10px;margin-bottom:8px}
.rcard{background:var(--tile);border:2px solid var(--ink);border-radius:11px;padding:11px 13px}
.rk{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  color:#FFF;background:var(--turq);display:inline-block;padding:2px 7px;border-radius:20px;font-weight:600}
.rk.hole{background:var(--coral)}
.rn{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:18px;margin-top:6px;line-height:1.1}
.rm{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--grey);margin-top:2px;letter-spacing:.04em}
.rd{font-size:12.5px;line-height:1.4;margin-top:6px;color:#4A4436}
.rw{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--cobalt);margin-top:7px;letter-spacing:.04em}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:9px}
.pcard{background:var(--tile);border:2px solid var(--ink);border-radius:11px;padding:11px 13px}
.ptr{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:17px;line-height:1.15}
.pph{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--turq);margin-top:2px}
.pen{font-size:12.5px;color:var(--grey);margin-top:4px}
footer{margin-top:44px;padding-top:18px;border-top:3px solid var(--ink);
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <svg id="tilebg" preserveAspectRatio="none"></svg>
  <div class="hd">
    <div>
      <h1>Alvan's Table</h1>
      <div class="hsub">Turkish food, drink &amp; how to ask for it</div>
    </div>
    <div id="catbox"></div>
  </div>
</header>

<div class="wrap">
  <div class="sticky">
    <div class="searchrow">
      <div class="bar" id="cats"></div>
      <button class="dice" id="dice" title="Ne yiyeyim? — shake or tap">🎲</button>
    </div>
  </div>
  <div class="bar" style="margin-top:0">
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <button class="chip snd" id="snd">♪ Müzik</button>
  </div>
  <div class="grid" id="grid"></div>

  <section class="phr">
    <div class="h2">Fethiye · where to eat</div>
    <div class="rgrid" id="rests"></div>
  </section>

  <section class="phr">
    <div class="h2">Say it</div>
    <div class="pgrid" id="phrases"></div>
  </section>

  <footer>
    <span>🔊 hear it · ✓ tried · + build an order · 🎲 shake to decide</span>
    <span>Protein &amp; sodium are estimates</span>
    <span>Afiyet olsun</span>
  </footer>
</div>

<div class="bskbar" id="bskbar">
  <span class="bskn" id="bskn"></span>
  <button class="bskbtn" id="bskclear">Clear</button>
  <button class="bskbtn go" id="bskgo">Order it</button>
</div>

<div class="ordwrap" id="ordwrap"><div class="ordbox" id="ordbox"></div></div>

<div class="pointwrap" id="pointwrap">
  <div class="pointtr" id="pointtr"></div>
  <div class="pointen" id="pointen"></div>
  <div class="pointhint">tap anywhere to close</div>
</div>

<div class="sheet" id="sheet"><div class="sin" id="sheetIn"></div></div>

<script>
/* ============ drawing kit ============ */
const C={cobalt:'#1B4F8A',turq:'#2E9EA6',coral:'#D9463E',sage:'#5E8C57',gold:'#E0A83C',
  cream:'#FBF3DF',white:'#FFFDF7',ink:'#1E3A5F',olive:'#6B7B3A',aub:'#5D4A72',
  tom:'#D9463E',yog:'#FFFDF7',bread:'#E3B872',tea:'#B5442A',green:'#7EA85C',
  pom:'#B22C4A',honey:'#E8A83C',choc:'#6B4423',milk:'#FBF6EC',pink:'#E8859B'};
function rnd(seed){let s=seed||7;return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}}
function hash(str){let h=11;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;return h}

/* vessels */
function bowl(fill){return `<ellipse cx="100" cy="86" rx="60" ry="8" fill="${C.ink}" opacity=".12"/>
  <path d="M42,52 q58,-14 116,0 l-9,30 q-49,13 -98,0 Z" fill="${C.white}" stroke="${C.ink}" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M45,58 q55,-11 110,0" stroke="${C.cobalt}" stroke-width="1.6" fill="none" opacity=".7"/>
  <path d="M47,70 q53,10 106,0" stroke="${C.turq}" stroke-width="1.4" fill="none" opacity=".6"/>
  ${[0,1,2,3,4,5].map(i=>`<circle cx="${52+i*19}" cy="${75+(i%2)*2}" r="1.5" fill="${C.cobalt}" opacity=".55"/>`).join('')}
  <path d="M46,55 q54,-12 108,0 l-4,13 q-50,12 -100,0 Z" fill="${fill}"/>
  <path d="M50,56 q22,-6 44,-3" stroke="#FFF" stroke-width="2" fill="none" opacity=".22" stroke-linecap="round"/>`}
function plate(fill){return `<ellipse cx="100" cy="80" rx="68" ry="7" fill="${C.ink}" opacity=".11"/>
  <ellipse cx="100" cy="64" rx="74" ry="21" fill="${C.white}" stroke="${C.ink}" stroke-width="2.4"/>
  <ellipse cx="100" cy="64" rx="66" ry="17" fill="none" stroke="${C.cobalt}" stroke-width="1.5" opacity=".65"/>
  ${[0,1,2,3,4,5,6,7].map(i=>{const a=i/8*Math.PI*2;
    return `<circle cx="${(100+Math.cos(a)*70).toFixed(1)}" cy="${(64+Math.sin(a)*19).toFixed(1)}" r="1.7" fill="${C.turq}" opacity=".7"/>`}).join('')}
  <ellipse cx="100" cy="63" rx="57" ry="14" fill="${fill}"/>
  <path d="M60,60 q20,-7 40,-5" stroke="#FFF" stroke-width="2" fill="none" opacity=".2" stroke-linecap="round"/>`}
function glass(fill,tulip){
  return tulip
   ? `<ellipse cx="100" cy="94" rx="30" ry="6" fill="${C.ink}" opacity=".13"/>
      <ellipse cx="100" cy="91" rx="26" ry="6" fill="${C.white}" stroke="${C.ink}" stroke-width="3"/>
      <path d="M80,20 q-6,32 20,68 q26,-36 20,-68 Z" fill="${fill}" stroke="${C.ink}" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M84,26 q-3,26 16,54" stroke="#FFF" stroke-width="4" fill="none" opacity=".38" stroke-linecap="round"/>`
   : `<ellipse cx="100" cy="94" rx="30" ry="6" fill="${C.ink}" opacity=".13"/>
      <path d="M76,18 l6,72 q18,6 36,0 l6,-72 Z" fill="${fill}" stroke="${C.ink}" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M82,24 l4,60" stroke="#FFF" stroke-width="4" fill="none" opacity=".4" stroke-linecap="round"/>`}
function cup(fill){return `<ellipse cx="100" cy="92" rx="34" ry="6" fill="${C.ink}" opacity=".13"/>

function art(d,h){
  const seed=hash(d.tr);
  let inner='';
  switch(d.v){
    case 'bowl':   inner=bowl(d.c1)+ (d.top||''); break;
    case 'plate':  inner=plate(d.c1)+ (d.top||''); break;
    case 'glass':  inner=glass(d.c1,false)+(d.top||''); break;
    case 'tulip':  inner=glass(d.c1,true)+(d.top||''); break;
    case 'cup':    inner=cup(d.c1)+(d.top||''); break;
    case 'flat':   inner=`<ellipse cx="100" cy="82" rx="66" ry="7" fill="${C.ink}" opacity=".12"/>`+T.flatbread(d.c1)+(d.top||''); break;
    default:       inner=plate(d.c1)+(d.top||'');
  }
  return `<svg class="${h?'':'art'}" viewBox="14 24 172 68" ${h?'style="width:100%;display:block"':''}>
    <rect width="200" height="110" fill="${d.bg||'#FFFDF7'}"/>
    <g opacity=".26">${tileMotif(seed)}</g>${inner}</svg>`;
}
function tileMotif(seed){
  const r=rnd(seed);let o='';
  for(let i=0;i<5;i++){
    const x=14+r()*172, y=10+r()*30, s=.5+r()*.5;
    o+=`<g transform="translate(${x},${y}) scale(${s})">
      <path d="M0,-10 q7,7 0,14 q-7,-7 0,-14 Z" fill="${C.turq}"/>
      <path d="M-10,0 q7,-7 14,0 q-7,7 -14,0 Z" fill="${C.cobalt}" opacity=".7"/></g>`;
  }
  return o;
}

{tr:'Fava',ph:'FA-va',en:'Broad bean purée',cat:'Meze',diet:'vegan',prot:7,na:300,
 desc:'Dried broad beans cooked down and set into a smooth block, cut into squares, dressed with dill and lemon. Nutty and mild.',
 order:'Fava',oph:'FA-va',v:'plate',c1:'#D6C98A',top:T.leaf(C.green)},
{tr:'Barbunya pilaki',ph:'bar-BOON-ya pi-la-KUH',en:'Borlotti beans in olive oil',cat:'Meze',diet:'vegan',prot:8,na:340,
 desc:'Cranberry beans stewed with carrot, potato and tomato, served cold with lemon. Genuinely filling and one of the highest-protein mezes.',
 order:'Barbunya',oph:'bar-BOON-ya',v:'bowl',c1:'#C08A6A',top:T.dots('#8C4A32',7,17)},
{tr:'Kısır',ph:'kuh-SUHR',en:'Fine bulgur salad',cat:'Meze',diet:'vegan',prot:6,na:290,
 desc:'Fine bulgur worked with pepper paste, pomegranate molasses, parsley and spring onion. Turkey\'s tabbouleh, redder and more robust.',
 order:'Kısır',oph:'kuh-SUHR',v:'plate',c1:'#C25A3A',top:T.dots(C.green,9,21)},
{tr:'Deniz börülcesi',ph:'de-NEEZ bo-rool-je-SEE',en:'Samphire with garlic',cat:'Meze',diet:'vegan',prot:3,na:520,
 desc:'Sea beans blanched and dressed with garlic, olive oil and lemon. Squeaky, saline, and a coastal speciality — you\'ll see it in Fethiye and not inland.',
 order:'Deniz börülcesi',oph:'de-NEEZ bo-rool-je-SEE',
 note:'Naturally salty — it grows in salt marsh.',v:'plate',c1:'#4E8C4A',top:T.drizzle(C.gold)},
{tr:'Piyaz',ph:'pee-YAHZ',en:'White bean salad',cat:'Meze',diet:'vegan',prot:9,na:420,
 desc:'White beans with onion, parsley and sumac. The Antalya version adds tahini and is a different, better dish. Sometimes topped with egg — ask.',
 order:'Piyaz, yumurtasız',oph:'pee-YAHZ yoo-moor-ta-SUHZ',
 note:'yumurtasız = without egg.',v:'plate',c1:'#EFE6CE',top:T.dots('#B04A5A',6,29)},
{tr:'Semizotu',ph:'se-MEEZ-o-too',en:'Purslane with yoghurt',cat:'Meze',diet:'veg',prot:4,na:240,
 desc:'A succulent, lemony green folded through garlicky yoghurt. Refreshing and almost never found outside Turkey and Greece.',
 order:'Semizotu',oph:'se-MEEZ-o-too',v:'bowl',c1:'#EAF2E4',top:T.dots(C.green,8,33)},
{tr:'Atom',ph:'a-TOM',en:'Hot yoghurt with chilli butter',cat:'Meze',diet:'veg',prot:6,na:380,
 desc:'Yoghurt with dried chillies fried in butter poured over. Named for the effect. The spiciest meze on most tables.',
 order:'Atom',oph:'a-TOM',v:'bowl',c1:'#FBF6EC',top:T.drizzle(C.coral)+T.dots(C.coral,4,37)},
{tr:'Mücver',ph:'mooj-VER',en:'Courgette fritters',cat:'Meze',diet:'veg',prot:7,na:430,
 desc:'Grated courgette bound with egg, feta and dill, fried into soft green patties. Served with yoghurt to dip.',
 order:'Mücver',oph:'mooj-VER',v:'plate',c1:'#8FA85C',top:T.dots('#5E7A3A',6,41)},
{tr:'Sigara böreği',ph:'si-ga-RA bo-reh-EE',en:'Cheese cigars',cat:'Meze',diet:'veg',prot:9,na:620,
 desc:'Thin yufka pastry rolled around white cheese and parsley, fried crisp. Impossible to eat only one.',
 order:'Sigara böreği',oph:'si-ga-RA bo-reh-EE',v:'plate',c1:'#E0B45C',top:''},
{tr:'Midye dolma',ph:'MEED-yeh dol-MA',en:'Stuffed mussels',cat:'Meze',diet:'fish',prot:8,na:560,
 desc:'Mussel shells packed with spiced rice, sold from carts by the dozen. Squeeze lemon in, eat straight from the shell, stack the empties — the seller counts them.',
 order:'On tane, lütfen',oph:'ON ta-neh loot-FEN',
 note:'"Ten, please." Street price is per mussel.',v:'plate',c1:'#3F3B4A',top:T.dots(C.cream,5,43)},
{tr:'Lakerda',ph:'la-KER-da',en:'Salt-cured bonito',cat:'Meze',diet:'fish',prot:22,na:980,
 desc:'Thick slices of bonito cured in brine, served with red onion and olive oil. Turkey\'s answer to sashimi, and the classic partner to rakı.',
 order:'Lakerda',oph:'la-KER-da',
 note:'Cured in salt — the highest-sodium thing on the meze table.',v:'plate',c1:'#E8B8A8',top:T.dots('#B08A98',5,47)},
{tr:'Topik',ph:'to-PEEK',en:'Armenian chickpea & tahini ball',cat:'Meze',diet:'vegan',prot:9,na:390,
 desc:'Potato and chickpea shell around a filling of onion cooked down with tahini, currants and allspice. Rare, Armenian-Istanbul, and worth ordering wherever you see it.',
 order:'Topik var mı?',oph:'to-PEEK var muh',v:'plate',c1:'#EFE0C4',top:T.drizzle('#A88A5C')},
{tr:'Çiğ köfte',ph:'CHEE kuf-TEH',en:'Spiced bulgur balls',cat:'Meze',diet:'vegan',prot:6,na:480,
 desc:'Once raw meat, now legally meatless — fine bulgur kneaded for hours with pepper paste and spices, wrapped in lettuce with lemon. Fiery.',
 order:'Çiğ köfte, acılı',oph:'CHEE kuf-TEH a-juh-LUH',v:'plate',c1:'#A83C2E',top:T.leaf(C.green)},
{tr:'Beyaz peynir',ph:'beh-YAHZ pay-NEER',en:'White cheese',cat:'Meze',diet:'veg',prot:14,na:820,
 desc:'Turkish brined sheep\'s cheese, firmer and saltier than feta. On every breakfast table and every rakı table.',
 order:'Beyaz peynir',oph:'beh-YAHZ pay-NEER',v:'plate',c1:'#FFFDF7',top:T.cubes('#FFFDF7')},

/* ---- MAINS ---- */
{tr:'Adana kebap',ph:'a-da-NA ke-BAHP',en:'Spicy minced lamb skewer',cat:'Mains',diet:'meat',prot:34,na:920,
 desc:'Hand-minced lamb with red pepper flakes, pressed onto a flat skewer and grilled over coals. The spicy one — its mild twin is Urfa.',
 order:'Bir Adana, acılı',oph:'beer a-da-NA a-juh-LUH',
 note:'Adana = hot. Urfa = mild. That\'s the whole distinction.',v:'plate',c1:'#F0E4CE',top:T.skewer('#8C4A32')},
{tr:'İskender',ph:'is-KEN-der',en:'Döner over bread with tomato & butter',cat:'Mains',diet:'meat',prot:38,na:1400,
 desc:'Sliced döner laid over cubes of pide, drowned in tomato sauce, with melted butter poured at the table and a slab of yoghurt beside. Bursa\'s gift and a genuinely enormous plate.',
 order:'İskender',oph:'is-KEN-der',
 note:'The saltiest main on this list by some distance.',v:'plate',c1:'#C4522E',top:T.dots('#8C3A24',8,53)},
{tr:'Lahmacun',ph:'lah-ma-JOON',en:'Thin lamb flatbread',cat:'Mains',diet:'meat',prot:16,na:680,
 desc:'Paper-thin dough spread with minced lamb, tomato and pepper, blasted in a hot oven. Load it with parsley and lemon, roll it, eat it with your hands.',
 order:'Bir lahmacun',oph:'beer lah-ma-JOON',v:'flat',c1:'#D9A05C',top:T.dots('#8C4A32',10,59)},
{tr:'Pide',ph:'PEE-deh',en:'Boat-shaped baked flatbread',cat:'Mains',diet:'meat',prot:22,na:760,
 desc:'A canoe of dough filled with cheese, egg, minced meat or sucuk. Kaşarlı (cheese) is the vegetarian version and it\'s excellent.',
 order:'Kaşarlı pide',oph:'ka-shar-LUH PEE-deh',
 note:'Kaşarlı = cheese, so vegetarian. Kıymalı = minced meat.',v:'plate',c1:'#E0B45C',top:T.dots('#E8C86A',6,61)},
{tr:'Mantı',ph:'man-TUH',en:'Tiny dumplings in yoghurt',cat:'Mains',diet:'meat',prot:20,na:780,
 desc:'Minuscule meat dumplings under garlic yoghurt with paprika butter and dried mint. Kayseri claims them, and Cappadocia is where you should eat them.',
 order:'Mantı',oph:'man-TUH',v:'plate',c1:'#FBF6EC',top:T.dots('#E8A83C',9,67)},
{tr:'İmam bayıldı',ph:'ee-MAHM ba-yuhl-DUH',en:'Aubergine stuffed with onion & tomato',cat:'Mains',diet:'vegan',prot:4,na:420,
 desc:'"The imam fainted" — whole aubergine split and stuffed with slow-cooked onion, garlic and tomato, drenched in olive oil, served at room temperature. The great vegan main.',
 order:'İmam bayıldı',oph:'ee-MAHM ba-yuhl-DUH',
 note:'Its meat sibling is karnıyarık. Easy to confuse — this one is vegan.',
 v:'plate',c1:'#5D4A72',top:T.dots(C.tom,6,71)},
{tr:'Mercimek çorbası',ph:'mer-ji-MEK chor-ba-SUH',en:'Red lentil soup',cat:'Mains',diet:'vegan',prot:9,na:640,
 desc:'The national soup — red lentils blended smooth, with lemon squeezed in and chilli flakes shaken over. Almost always vegan but stock varies; ask.',
 order:'Mercimek çorbası',oph:'mer-ji-MEK chor-ba-SUH',
 note:'Ask "et suyu var mı?" — is there meat stock?',v:'bowl',c1:'#E08A3C',top:T.steam()},
{tr:'Kuru fasulye',ph:'koo-ROO fa-sool-YEH',en:'White bean stew',cat:'Mains',diet:'meat',prot:16,na:720,
 desc:'White beans stewed in tomato, usually with lamb or pastırma, served with rice. Turkey\'s comfort food. A meatless version exists — ask for etsiz.',
 order:'Etsiz kuru fasulye',oph:'et-SEEZ koo-ROO fa-sool-YEH',
 note:'etsiz = without meat.',v:'bowl',c1:'#C4703C',top:T.dots('#EFE6CE',8,73)},
{tr:'Gözleme',ph:'guz-le-MEH',en:'Griddled stuffed flatbread',cat:'Mains',diet:'veg',prot:11,na:540,
 desc:'Dough rolled paper-thin, folded around cheese, spinach or potato and cooked on a convex griddle. Trail food, village food, and what gets handed to walkers on the Lycian Way.',
 order:'Ispanaklı gözleme',oph:'uhs-pa-nak-LUH guz-le-MEH',
 note:'Potato (patatesli) or spinach without cheese is usually vegan.',
 v:'flat',c1:'#E8C88A',top:T.dots('#5E8C57',7,83)},
{tr:'Levrek ızgara',ph:'lev-REK uhz-ga-RA',en:'Grilled sea bass',cat:'Mains',diet:'fish',prot:32,na:360,
 desc:'Whole fish over coals with nothing but salt, lemon and a pile of rocket. Priced by weight — always ask the price per kilo before agreeing.',
 order:'Kilosu ne kadar?',oph:'ki-lo-SOO neh ka-DAR',
 note:'"How much per kilo?" — the single most useful sentence in a fish restaurant.',
 v:'plate',c1:'#F0E4CE',top:T.fishShape()},
{tr:'Lüfer',ph:'loo-FER',en:'Bluefish',cat:'Mains',diet:'fish',prot:30,na:340,
 desc:'The autumn fish. Migrates through the Bosphorus from September and the whole country pays attention. Oily, firm, strongly flavoured — grilled whole with rocket and raki.',
 order:'Lüfer var mı?',oph:'loo-FER var muh',
 note:'Season opens September. Sized by name: çinekop small, kofana large.',
 v:'plate',c1:'#F0E4CE',top:T.fishShape()},
{tr:'Testi kebabı',ph:'tes-TEE ke-ba-BUH',en:'Pottery kebab',cat:'Mains',diet:'meat',prot:36,na:820,
 desc:'Meat and vegetables sealed in a clay pot, cooked slowly, then the pot is cracked open at your table with a blade. Cappadocia\'s signature and pure theatre.',
 order:'Testi kebabı',oph:'tes-TEE ke-ba-BUH',v:'bowl',c1:'#A8623C',top:T.steam()},

/* ---- FISH ---- */
{tr:'Çupra',ph:'CHOO-pra',en:'Gilt-head sea bream',cat:'Fish',diet:'fish',prot:31,na:330,
 desc:'The other whole grilled fish beside levrek, and slightly richer. Farmed widely, so it is the reliable year-round order when nothing is running wild.',
 order:'Bir çupra ızgara',oph:'beer CHOO-pra uhz-ga-RA',
 note:'ızgara = grilled, tava = pan-fried, buğulama = steamed in broth.',
 v:'plate',c1:'#F0E4CE',top:T.fishShape()+T.lemon()},
{tr:'Hamsi',ph:'ham-SEE',en:'Black Sea anchovy',cat:'Fish',diet:'fish',prot:20,na:640,
 desc:'Small silver anchovies rolled in cornmeal and fried in a fan-shaped pan, eaten whole by the handful. The Black Sea coast is built around them. Winter is the season.',
 order:'Hamsi tava',oph:'ham-SEE ta-VA',
 note:'Best November to February. Out of season it will be frozen.',
 v:'plate',c1:'#E8D8B0',top:T.smallfish(5,'#A8B8C4')},
{tr:'Palamut',ph:'pa-la-MOOT',en:'Bonito',cat:'Fish',diet:'fish',prot:29,na:390,
 desc:'Oily, meaty, and the fish that becomes lakerda when cured. Autumn migration through the Bosphorus makes September and October its months. Grilled whole or in thick steaks.',
 order:'Palamut var mı?',oph:'pa-la-MOOT var muh',v:'plate',c1:'#F0E4CE',top:T.fishShape()+T.lemon()},
{tr:'İstavrit',ph:'is-tav-REET',en:'Horse mackerel',cat:'Fish',diet:'fish',prot:23,na:410,
 desc:'The cheap, everyday fish — small, oily, grilled or fried and piled on a plate. What the fishermen on the Galata Bridge are actually catching.',
 order:'İstavrit ızgara',oph:'is-tav-REET uhz-ga-RA',v:'plate',c1:'#EDE0C6',top:T.smallfish(4,'#B8C4C8')},
{tr:'Kalamar tava',ph:'ka-la-MAR ta-VA',en:'Fried calamari',cat:'Fish',diet:'fish',prot:24,na:720,
 desc:'Squid rings floured and fried, served with tarator — a garlic and walnut sauce that is far better than the tartare you get elsewhere.',
 order:'Kalamar tava',oph:'ka-la-MAR ta-VA',
 note:'Ask for tarator alongside. Nut-based, and vegan on its own.',
 v:'plate',c1:'#E8C88A',top:T.rings('#F2DFB0')},
{tr:'Karides güveç',ph:'ka-ree-DES goo-VECH',en:'Prawn casserole',cat:'Fish',diet:'fish',prot:26,na:780,
 desc:'Prawns baked in a clay dish with tomato, garlic, peppers and a lid of melted kaşar cheese. Bubbling when it arrives. A meze-table staple on the coast.',
 order:'Karides güveç',oph:'ka-ree-DES goo-VECH',v:'bowl',c1:'#D9543A',top:T.prawns(3)},
{tr:'Ahtapot salatası',ph:'ah-ta-POT sa-la-ta-SUH',en:'Octopus salad',cat:'Fish',diet:'fish',prot:25,na:520,
 desc:'Octopus simmered until tender, sliced and dressed with olive oil, lemon and parsley. Cold, clean, and one of the best things on an Aegean meze table.',
 order:'Ahtapot salatası',oph:'ah-ta-POT sa-la-ta-SUH',v:'plate',c1:'#EDE0CE',top:T.octopus()},
{tr:'Balık ekmek',ph:'ba-LUHK ek-MEK',en:'Fish in bread',cat:'Fish',diet:'fish',prot:24,na:820,
 desc:'Grilled mackerel fillet in half a loaf with onion, lettuce and lemon, sold from boats at Eminönü. Cheap, enormous, and best eaten standing by the water.',
 order:'Bir balık ekmek',oph:'beer ba-LUHK ek-MEK',v:'plate',c1:'#D9A05C',top:T.sandwichFish()},
{tr:'Barbunya',ph:'bar-BOON-ya',en:'Red mullet',cat:'Fish',diet:'fish',prot:26,na:350,
 desc:'Small, pink, delicate and expensive — usually fried whole. Not to be confused with the bean of the same name on the meze list.',
 order:'Barbunya balık',oph:'bar-BOON-ya ba-LUHK',
 note:'Same word as the bean. Add "balık" to be clear you mean the fish.',
 v:'plate',c1:'#EDE0C6',top:T.smallfish(3,'#E88A8A')},
{tr:'Çipura buğulama',ph:'chi-poo-RA boo-oo-la-MA',en:'Bream steamed in broth',cat:'Fish',diet:'fish',prot:30,na:420,
 desc:'Fish poached gently with tomato, onion and herbs rather than grilled — softer, lighter, and the version to ask for when you have had enough char.',
 order:'Buğulama yapar mısınız?',oph:'boo-oo-la-MA ya-PAR muh-suh-nuhz',v:'bowl',c1:'#E8C08A',top:T.fishShape()+T.steam()},

/* ---- RAKI ---- */
{tr:'Yeni Rakı',ph:'yeh-NEE ra-KUH',en:'The standard bottle',cat:'Rakı',diet:'vegan',prot:0,na:5,
 desc:'The one on every table and the benchmark everything else is judged against. 45%, twice-distilled, clean anise. If you order "rakı" without naming a brand, this is what arrives.',
 order:'Bir duble Yeni',oph:'beer DOOB-leh yeh-NEE',
 note:'duble = a double, the standard pour. tek = single.',
 v:'glass',c1:'#F2F6F2',top:T.bottle('#2E7D4F','#FFFDF7')},
{tr:'Tekirdağ Rakısı',ph:'te-keer-DAA ra-kuh-SUH',en:'The connoisseur\'s choice',cat:'Rakı',diet:'vegan',prot:0,na:5,
 desc:'Made with Turkish-grown anise from Tekirdağ on the Sea of Marmara. Softer and rounder than Yeni, and what people who drink rakı seriously tend to order.',
 order:'Tekirdağ, lütfen',oph:'te-keer-DAA loot-FEN',
 note:'The Gold (Altın Seri) version is the step up and worth the few extra lira.',
 v:'glass',c1:'#F2F6F2',top:T.bottle('#1B4F8A','#E0A83C')},
{tr:'Efe Rakı',ph:'EH-feh ra-KUH',en:'Aegean, from fresh grapes',cat:'Rakı',diet:'vegan',prot:0,na:5,
 desc:'Distilled from fresh grape must rather than raisins, which gives it a lighter, fruitier edge. The Efe Gold is triple-distilled and very smooth. Popular along this coast.',
 order:'Efe var mı?',oph:'EH-feh var muh',v:'glass',c1:'#F2F6F2',top:T.bottle('#7A1E5A','#FFFDF7')},
{tr:'Beylerbeyi',ph:'bay-ler-bay-EE',en:'Rich and aniseed-forward',cat:'Rakı',diet:'vegan',prot:0,na:5,
 desc:'A heavier, more perfumed style with a strong anise nose. Divides people — try a single before committing to a bottle.',
 order:'Bir tek Beylerbeyi',oph:'beer TEK bay-ler-bay-EE',v:'glass',c1:'#F2F6F2',top:T.bottle('#8C2A2A','#E0A83C')},
{tr:'Kulüp Rakı',ph:'koo-LOOP ra-KUH',en:'The old-school label',ca:'',cat:'Rakı',diet:'vegan',prot:0,na:5,
 desc:'An older brand with a loyal following, drier and more restrained than Yeni. Often a little cheaper and frequently what the older men at the next table are drinking.',
 order:'Kulüp',oph:'koo-LOOP',v:'glass',c1:'#F2F6F2',top:T.bottle('#2A3A6A','#FFFDF7')},
{tr:'Rakı sofrası',ph:'ra-KUH sof-ra-SUH',en:'How to drink it',cat:'Rakı',diet:'vegan',prot:0,na:5,
 desc:'Water in the glass first, then rakı — it clouds white and becomes aslan sütü, lion\'s milk. Ice after, never before. A separate glass of plain water alongside. Sipped slowly over meze across three or four hours, never shot.',
 order:'Su ve buz, lütfen',oph:'SOO veh BOOZ loot-FEN',
 note:'"Water and ice, please." Order the meze first and let the rakı last the whole table.',
 v:'glass',c1:'#F2F6F2',top:T.rakiSet()},

/* ---- ACI · THE HOT END ---- */
{tr:'Acılı ezme',ph:'a-juh-LUH ez-MEH',en:'The hot chopped salad',cat:'Acı',diet:'vegan',prot:2,na:340,heat:3,
 desc:'Ezme made properly hot — tomato, pepper, onion and a serious quantity of pul biber, worked to a rough paste. The single most reliable source of heat on any meze table. Always specify acılı.',
 order:'Çok acılı ezme, lütfen',oph:'CHOK a-juh-LUH ez-MEH loot-FEN',
 note:'Say çok acılı — very spicy — or you will get the tourist version.',
 v:'bowl',c1:'#C4302A',top:T.dots('#7A1414',9,3)+T.chilli()},
{tr:'Atom',ph:'a-TOM',en:'Yoghurt under chilli butter',cat:'Acı',diet:'veg',prot:6,na:380,heat:3,
 desc:'Named for what it does to you. Thick yoghurt with dried chillies fried in butter poured over while still sizzling. The heat sits on top; the yoghurt underneath does nothing to stop it.',
 order:'Atom',oph:'a-TOM',v:'bowl',c1:'#FBF6EC',top:T.drizzle('#C4302A')+T.chilli()},
{tr:'İsot biberi',ph:'ee-SOT bee-be-REE',en:'Urfa pepper',cat:'Acı',diet:'vegan',prot:0,na:15,heat:3,
 desc:'Dark purple-black pepper flakes from Şanlıurfa, sun-dried then sweated overnight in cloth. Smoky, raisiny, and a slow heat that builds rather than hits. Buy a bag — it does not exist outside Turkey.',
 order:'İsot var mı?',oph:'ee-SOT var muh',
 note:'The best single thing to bring home from a Turkish market.',
 v:'bowl',c1:'#3A1E28',top:T.flakes('#5A2030')},
{tr:'Pul biber',ph:'POOL bee-BER',en:'Red pepper flakes',cat:'Acı',diet:'vegan',prot:0,na:10,heat:2,
 desc:'On every table in Turkey, in a shaker beside the salt. Bright red, moderately hot, faintly sweet. Your instrument — the food arrives mild and you fix it yourself.',
 order:'Pul biber var mı?',oph:'POOL bee-BER var muh',
 note:'It is already on the table. Look before you ask.',
 v:'bowl',c1:'#C4302A',top:T.flakes('#8C1F1F')},
{tr:'Acı biber turşusu',ph:'a-JUH bee-BER toor-shoo-SOO',en:'Pickled hot peppers',cat:'Acı',diet:'vegan',prot:1,na:820,heat:3,
 desc:'Long green chillies pickled in brine, eaten whole alongside kebab and beans. Sour and hot at once. Ask at any pickle shop — a turşucu — and they will hand you one to try.',
 order:'Acı biber turşusu',oph:'a-JUH bee-BER toor-shoo-SOO',
 note:'Very high sodium — it is brine.',v:'bowl',c1:'#6B8C3A',top:T.chillies()},
{tr:'Adana kebap',ph:'a-da-NA ke-BAHP',en:'The spicy kebab',cat:'Acı',diet:'meat',prot:34,na:920,heat:2,
 desc:'Hand-minced lamb worked with red pepper until it is properly hot, pressed onto a flat skewer over coals. Its mild twin is Urfa — that is the entire difference between the two.',
 order:'Bir Adana, acılı olsun',oph:'beer a-da-NA a-juh-LUH ol-SOON',
 note:'Adana = hot. Urfa = mild. Never the other way round.',
 v:'plate',c1:'#F0E4CE',top:T.skewer('#8C4A32')+T.chilli()},
{tr:'Çiğ köfte',ph:'CHEE kuf-TEH',en:'Fiery bulgur balls',cat:'Acı',diet:'vegan',prot:6,na:480,heat:3,
 desc:'Bulgur kneaded for hours with pepper paste and isot until the heat is in the grain itself. Wrapped in lettuce with lemon. Vegan, cheap, and hotter than it looks.',
 order:'Çiğ köfte dürüm, acılı',oph:'CHEE kuf-TEH doo-ROOM a-juh-LUH',
 v:'plate',c1:'#A83C2E',top:T.leaf('#7EA85C')+T.chilli()},
{tr:'Muammara acılı',ph:'moo-ha-ma-RA a-juh-LUH',en:'Hot walnut-pepper paste',cat:'Acı',diet:'vegan',prot:5,na:320,heat:2,
 desc:'The hot version of muhammara, made with acı biber salçası rather than sweet. Smoky, sweet-sour and warm rather than sharp. Ask for the acı one.',
 order:'Acı muhammara',oph:'a-JUH moo-ha-ma-RA',v:'bowl',c1:'#A8341F',top:T.dots('#6A2A18',8,11)},
{tr:'Biber salçası',ph:'bee-BER sal-cha-SUH',en:'Pepper paste',cat:'Acı',diet:'vegan',prot:2,na:640,heat:2,
 desc:'Sun-dried red pepper paste, sold sweet (tatlı) or hot (acı), and the base of half the dishes on this list. A jar travels well and will change your cooking at home.',
 order:'Acı biber salçası',oph:'a-JUH bee-BER sal-cha-SUH',
 note:'acı = hot, tatlı = sweet. Check the lid.',
 v:'bowl',c1:'#9C2818',top:T.swirl('#C4402A')},
{tr:'Şalgam acılı',ph:'shal-GAHM a-juh-LUH',en:'Hot turnip juice',cat:'Acı',diet:'vegan',prot:1,na:900,heat:2,
 desc:'The spicy version of fermented turnip juice, and the traditional partner to Adana. Sour, salty and hot all at once. Order acılı or you get the plain one.',
 order:'Acılı şalgam',oph:'a-juh-LUH shal-GAHM',
 note:'Very high sodium.',v:'glass',c1:'#6B2A4A',top:''},

/* ---- KAHVALTI ---- */

/* ============ speech ============ */
let TRV=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  TRV = vs.find(v=>v.lang==='tr-TR') || vs.find(v=>v.lang&&v.lang.startsWith('tr')) || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
}
function say(text,btn){
  if(!('speechSynthesis' in window)){ if(btn) btn.textContent='—'; return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(!TRV) pickVoice();
  if(TRV) u.voice=TRV;
  u.lang='tr-TR'; u.rate=.82; u.pitch=1;
  if(btn){ btn.classList.add('play'); u.onend=()=>btn.classList.remove('play');
           u.onerror=()=>btn.classList.remove('play'); }
  speechSynthesis.speak(u);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-say]');
  if(!b) return;
  e.stopPropagation();
  say(b.dataset.say,b);
});

/* ============ offline ============ */
/* The whole app is one file, so caching that file is caching everything.
   The worker is built from a blob so there's still nothing else to host. */
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol==='file:') return;          // file:// can't host workers
  const src=`
    const CACHE='alvan-v1';
    self.addEventListener('install',e=>{ self.skipWaiting(); });
    self.addEventListener('activate',e=>{ e.waitUntil(self.clients.claim()); });
    self.addEventListener('fetch',e=>{
      if(e.request.method!=='GET') return;
      e.respondWith(
        fetch(e.request).then(r=>{
          const c=r.clone();
          caches.open(CACHE).then(k=>k.put(e.request,c)).catch(()=>{});
          return r;
        }).catch(()=> caches.match(e.request).then(r=> r || caches.match('./')))
      );
    });`;
  try{
    const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
    navigator.serviceWorker.register(url).then(()=>{
      const f=document.querySelector('footer span');
      if(f) f.innerHTML='🔊 hear it · ✓ tried · + order · 🎲 shake &nbsp;·&nbsp; <b style="color:var(--sage)">works offline</b>';
    }).catch(()=>{});
  }catch(e){}
}

function orderSentence(){
  const items=BSK.map(t=>F.find(d=>d.tr===t)).filter(Boolean);
  if(!items.length) return {tr:'',ph:''};
  const names=items.map(d=>'bir '+d.tr);
  const tr = names.slice(0,-1).join(', ') + (names.length>1?' ve ':'') + names.slice(-1) + ', lütfen';
  const phs = items.map(d=>'beer '+d.ph.toLowerCase());
  const ph = phs.slice(0,-1).join(', ') + (phs.length>1?' veh ':'') + phs.slice(-1) + ', loot-FEN';
  return {tr:tr.charAt(0).toUpperCase()+tr.slice(1), ph};

/* --- shake detection --- */
let shakeOn=false, lastShake=0, lx=null,ly=null,lz=null;
function armShake(){
  if(shakeOn) return; shakeOn=true;
  window.addEventListener('devicemotion',e=>{
    const a=e.accelerationIncludingGravity; if(!a||a.x==null) return;
    if(lx!==null){
      const delta=Math.abs(a.x-lx)+Math.abs(a.y-ly)+Math.abs(a.z-lz);
      if(delta>32 && Date.now()-lastShake>1200){
        lastShake=Date.now();
        if(navigator.vibrate) navigator.vibrate(35);
        surprise();
      }
    }
    lx=a.x; ly=a.y; lz=a.z;
  });
  const d=document.getElementById('dice'); d.title='Shake the phone, or tap';
}

/* ============ light makam music ============ */
let AC=null,mas=null,rev=null,seq=null,on=false,step=0;
/* Hicaz makam — the sound people mean by "Turkish" */
const HICAZ=[0,1,4,5,7,8,11,12,13,16,17,19];
const PH=[ [0,2,1,0,-1,0,2,4], [4,3,2,1,0,1,2,0], [0,2,4,5,4,2,1,0], [4,5,4,2,1,0,-1,0] ];
function ir(ctx,sec,dec){const n=ctx.sampleRate*sec,b=ctx.createBuffer(2,n,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dec)}return b}
const f0=n=>293.66*Math.pow(2,n/12);
function pluck(f,t,g){                       /* bağlama-ish: bright, quick decay */
  const out=AC.createGain();out.connect(rev);out.connect(mas);
  [[1,1],[2,.5],[3,.28],[4,.14],[5.4,.07]].forEach(([m,a])=>{
    const o=AC.createOscillator(),gg=AC.createGain();
    o.type='triangle';o.frequency.value=f*m;
    gg.gain.setValueAtTime(0,t);gg.gain.linearRampToValueAtTime(g*a,t+.004);
    gg.gain.exponentialRampToValueAtTime(.0002,t+1.5/m);
    o.connect(gg);gg.connect(out);o.start(t);o.stop(t+1.6);
  });
}
function drum(t,hard){                       /* darbuka düm / tek */
  const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=hard?260:900;
  o.type='sine';o.frequency.setValueAtTime(hard?150:320,t);
  o.frequency.exponentialRampToValueAtTime(hard?55:150,t+.09);
  g.gain.setValueAtTime(hard?.16:.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);
  o.connect(lp);lp.connect(g);g.connect(mas);o.start(t);o.stop(t+.25);
}
function start(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  mas=AC.createGain();mas.gain.value=.5;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4000;
  mas.connect(lp);lp.connect(AC.destination);
  rev=AC.createConvolver();rev.buffer=ir(AC,2.2,2.4);
  const rg=AC.createGain();rg.gain.value=.3;rev.connect(rg);rg.connect(AC.destination);
  let t=AC.currentTime+.3;const bpm=96,b=60/bpm;
  step=0;on=true;
  seq=setInterval(()=>{
    if(!on)return;
    while(t<AC.currentTime+1.6){
      const bar=Math.floor(step/8)%4, i=step%8;
      const d=PH[bar][i];
      const n=HICAZ[((d%12)+12)%12]+12*Math.floor(d/12);
      pluck(f0(n+12),t,.075);
      if(i%2===0) pluck(f0(n),t+.006,.03);
      /* düm-tek-tek pattern */
      if(i===0||i===3) drum(t,true); else if(i%2===1) drum(t,false);
      t+=b/2; step++;
    }
  },200);
}
function stop(){on=false;clearInterval(seq);if(AC){AC.close();AC=null}}
document.getElementById('snd').onclick=e=>{
  const b=e.currentTarget;
  if(on){stop();b.textContent='♪ Müzik';b.classList.remove('on')}
  else{try{start();b.textContent='♪ Müzik açık';b.classList.add('on')}catch(err){b.textContent='♪ engellendi';console.error(err)}}
};

drawCat();
bskUpdate();
registerSW();
render();
</script>
