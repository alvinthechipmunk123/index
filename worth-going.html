IbgOHv3jTgl4HH1Hwf7gUvLVaqZJP4JxcQKh6DLly5cuXLly5cuXFzLlrMJSXE8Y9oK3HdU/cvb355PeYO5TbfxULKos0BORqxIpEpyrGa5jQ7xaEasH3ht0vh6jkM+zCOeYThOf8Z/g59OSATSy2JyjjP15v7ICnzGDif/Z",imgt:"Kanas Lake",imgp:"https://en.wikipedia.org/wiki/Kanas_Lake",season:[0, 0, 0, 0, 0, 1, 2, 2, 2, 1, 0, 0],best:"Late Sept",seasonN:"A short, spectacular window. The birch forests round Kanas turn in the last two weeks of September and are famous throughout China for it. By mid-October snow closes the road.",acc:"Urumqi, then a domestic flight to Kanas or a long drive north. The most remote corner of China from anywhere.",col2:"<b>The most famous autumn colour in China, and it lasts about a fortnight.</b> Siberian birch and larch round Kanas lake turn gold and scarlet in late September against a turquoise glacial lake, with Tuvan and Kazakh villages of log houses among them. It is genuinely spectacular and it is genuinely brief.",food:"Kazakh and Tuvan rather than Chinese — mutton, horse, dairy, and the same nomadic tradition as across the border in Kyrgyzstan. Xinjiang lamb kebabs and hand-pulled laghman are the regional staples.",eat:["Xinjiang lamb kebab", "Laghman · hand-pulled noodles", "Nan bread from a tandoor", "Kumiss, if offered"],safe:"⚠ This is the caveat that matters. Xinjiang has pervasive surveillance, frequent checkpoints and identity checks, and the political situation is the subject of serious international concern. Personal safety is high; the experience of travelling there is not comparable to anywhere else on this list.",v:"The autumn colour is the best in China and among the best anywhere. But Xinjiang is not a normal destination — checkpoints, surveillance, permits that change, and a political context that many travellers will not want to participate in. Included because it is real and the colour is extraordinary; flagged because the caveat is not a detail.",pro:["The most famous autumn colour in China", "Tuvan and Kazakh villages, log houses", "Genuinely few foreign visitors"],con:["⚠ Xinjiang — surveillance and checkpoints", "A two-week colour window and then snow", "22 hours door to door"],hikes:[["Kanas lake to Hemu", "35 km · 2 days · 500 m", "Through birch forest between Tuvan villages, with the lake below. The walk everyone comes for and still quiet outside the peak fortnight."], ["Guanyu Pavilion & the three bays", "10 km · 300 m · 3 h", "The classic viewpoints over the lake’s bends. Boardwalked and busy at peak."], ["Baihaba village", "12 km · 400 m · 4 h", "A Tuvan village on the Kazakh border, log houses and hay meadows. Border permit needed."], ["Hemu river valley", "14 km · 300 m · 4 h", "Morning mist over the river with birch on both sides. The photograph everyone in China has seen."]],disc:{"lang": {"sc": 2, "s": "Chinese + Uyghur", "t": "⚠ Mandarin plus Uyghur and Kazakh. Very little English anywhere. Signage is Chinese and Uyghur. A guide is close to essential, and guides here are supervised.", "words": ["你好 · nǐ hǎo", "谢谢 · xiè xie", "Салам · Kazakh hello"]}, "veg": {"sc": 2, "t": "Hard. The regional cuisine is mutton and dairy. Chinese vegetarian dishes exist in Urumqi; in the Altai villages the answer is bread, tea and whatever vegetables are around.", "ask": "我吃素，不要肉"}, "med": {"sc": 2, "t": "Thin. Clinics in Burqin, hospital in Urumqi which is a flight away. No mountain rescue."}, "con": {"sc": 2, "t": "⚠ 4G exists but is monitored. VPNs are actively disrupted in Xinjiang specifically. Alipay and WeChat work."}, "soc": {"sc": 3, "t": "⚠ Personal safety is high and violent crime negligible. But expect repeated ID checks, vehicle stops and phone inspections. Several governments advise reconsidering travel to Xinjiang."}, "hosp": "Tuvan and Kazakh hospitality is real and warm in the villages. The wider atmosphere is not, and the two coexist uncomfortably.", "who": "Chinese domestic tourists in enormous numbers during the two-week colour peak, and almost no foreigners at all."},masc:"马鹿",mascEn:"the Altai wapiti",mas  October you can actually see them.",food:"Dal bhat twice a day, and the free refills are a genuine institution. Tibetan bread, thukpa, and increasingly good bakeries in Namche. Prices climb with altitude — everything is carried or flown.",eat:["Dal bhat · unlimited refills", "Thukpa · Tibetan noodle soup", "Sherpa stew", "Namche bakery apple pie, at 3,440 m"],safe:"The trail itself is safe and busy. ⚠ Altitude is the real killer — HAPE and HACE happen every season and the only cure is descent. Helicopter evacuation is available and expensive; insurance covering it is essential.",v:"The most developed trekking infrastructure on earth — teahouses every hour, wifi, bakeries, and a rescue helicopter industry. That is either the appeal or the objection. The mountains are beyond anything else on this list and you will share them with several thousand people.",pro:["October is the best month of the year", "Teahouses every hour — no camping", "8,000 m peaks in your face"],con:["Busy in a way nothing else here is", "Lukla flight is weather-dependent", "Little autumn colour"],hikes:[["Everest Base Camp & Kala Patthar", "130 km · 12 days", "The classic. Kala Patthar at 5,644 m is the viewpoint — base camp itself sees nothing."], ["Gokyo Lakes & Renjo La", "120 km · 12 days", "Quieter, six turquoise lakes, and Gokyo Ri arguably beats Kala Patthar for the view."], ["Three Passes circuit", "160 km · 18 days", "Renjo La, Cho La and Kongma La. The serious version, and the one that loses the crowds."], ["Namche to Tengboche", "12 km · 700 m · 5 h", "The day-hike everyone remembers — a monastery at 3,867 m facing Ama Dablam."]],disc:{"lang": {"sc": 4, "s": "Devanagari", "t": "Nepali in Devanagari, but English is excellent throughout the trekking areas — lodge owners, guides and signage all handle it. The most English-friendly non-European place here.", "words": ["नमस्ते · namaste", "धन्यवाद · dhanyabad, thank you", "दाल भात · dal bhat"]}, "veg": {"sc": 5, "t": "Excellent. A large proportion of Nepalis are vegetarian, dal bhat is vegan by default, and every lodge menu has a vegetarian half. Above 4,000 m the vegetables get tired but the tradition is unambiguous.", "ask": "शाकाहारी · shakahari — vegetarian; add \"no dairy\" in English"}, "med": {"sc": 4, "t": "Unusually good for a remote range — HRA aid posts at Pheriche and Manang staffed by volunteer doctors in season, and a functioning helicopter evacuation industry. Expensive without insurance."}, "con": {"sc": 4, "t": "Wifi in most lodges, mobile data to base camp via Ncell. Cash is essential above Namche — the last ATM is there and it runs out."}, "soc": {"sc": 5, "t": "Very safe and thoroughly used to solo and female trekkers. Guide-mandatory rules have shifted recently — check the current position for the Khumbu."}, "hosp": "Sherpa hospitality is professionalised but genuine. Lodge families have been doing this for two generations and are good at it.", "who": "Everyone. Americans, Europeans, Indians, Chinese, Israelis, and an enormous Nepali guiding and portering workforce."},masc:"नाउर",mascEn:"the Himalayan tahr",mascL:"Also musk deer, snow leopards nobody sees, and Himalayan monal — the national bird, iridescent and absurd."},

s and run like ryokan. Down in Matsumoto: soba, basashi, and the best convenience-store food on earth for trail lunches.",eat:["Shinshu soba · buckwheat, the regional specialty", "Oyaki · stuffed dumplings", "Hut curry rice at 3,000 m", "Onsen after, non-negotiable"],safe:"Very safe. Trails are exceptionally well maintained and signed, huts are dense, and mountain rescue is competent. The Daikiretto traverse is the exception — genuinely exposed and chained.",v:"The Alpine formula applied by a country that does infrastructure better than anyone. Car-free valley, huts every few hours, onsen at the end, and autumn colour that the whole nation watches. It is the most expensive non-European option here and it is worth it.",pro:["Autumn colour is a national institution", "Hut network as good as the Alps", "Onsen"],con:["Most expensive outside western Europe", "Huts require reservations", "Peak colour weekends are very busy"],hikes:[["Kamikōchi to Karasawa", "16 km · 800 m · 7 h", "Up the Azusa into a glacial cirque that turns scarlet and gold in October. The colour walk."], ["Okuhotaka via Zaitengrat", "2 days · 1,600 m", "Japan’s third-highest at 3,190 m, chains on the final ridge, hut at the col."], ["Yari-ga-take", "2–3 days · 1,700 m", "The Japanese Matterhorn, a spear of rock at 3,180 m with a ladder to the summit."], ["Daikiretto traverse", "1 day · exposed", "Between Kita-Hotaka and Minami-dake — the most serious ridge in the Japanese Alps."]],disc:{"lang": {"sc": 3, "s": "Japanese", "t": "Three scripts and limited English outside the cities, but signage in Kamikōchi and on the main trails is bilingual and the systems are so well organised that language matters less than you would expect. Hut reservations often need Japanese or a booking site.", "words": ["こんにちは · konnichiwa", "ありがとう · arigatō", "山小屋 · yamagoya, mountain hut"]}, "veg": {"sc": 2, "t": "⚠ Harder than it looks. Dashi — bonito stock — is in almost everything including apparently vegetable dishes, and hut meals are fixed menus. Shōjin ryōri, Buddhist temple food, is fully vegan but not found in huts. Self-catering and konbini are the practical answer.", "ask": "ヴィーガンです。だしも魚も入っていないもの · vegan, no dashi or fish"}, "med": {"sc": 4, "t": "Good. Mountain rescue is prompt though sometimes charged, huts have radios, and Matsumoto has a major hospital. Japanese trail signage includes emergency numbering."}, "con": {"sc": 4, "t": "Coverage in the valley, patchy on ridges. Japan is still surprisingly cash-preferring in the mountains — huts often take nothing else. IC cards work in cities."}, "soc": {"sc": 5, "t": "Among the safest places on earth for anyone travelling in any configuration."}, "hosp": "Formal, precise and warm underneath. Hut wardens run a tight operation and expect you to fit into it — lights out at 20:00, breakfast at 05:00. Fitting in is appreciated.", "who": "Japanese hikers overwhelmingly, of every age — the 70-year-olds will pass you. A growing but still small international presence."},masc:"ニホンカモシカ",mascEn:"the Japanese serow",mascL:"A goat-antelope found nowhere else, and a designated national treasure. Also snow monkeys in the next valley."},

IbnM1IQmqJWyY4ibNtV+J9sfMo0wwfHPsvQyaIanM+qMT8I/OaHhgCrBzP//Z",imgt:"Alpamayo",imgp:"https://en.wikipedia.org/wiki/Alpamayo",season:[0, 0, 0, 1, 2, 2, 2, 2, 1, 0, 0, 0],best:"May to Sept",seasonN:"⚠ Southern-hemisphere dry season. May through September is the window; October begins the wet season and the trails become miserable. This is a northern-summer destination.",acc:"Lima, then eight hours by overnight bus to Huaraz at 3,050 m. The bus is comfortable; the altitude is not.",col2:"⚠ Essentially no autumn colour — this is high puna grassland and glacier, above the treeline. What there is: queñua, the highest-growing tree on earth, with peeling red bark. The show is ice.",food:"Huaraz eats well and cheaply. Trout from the lakes, ceviche that travelled up from the coast, cuy if you want it, and pachamanca cooked in a ground oven.",eat:["Trucha · lake trout, everywhere", "Pachamanca · meat and potatoes cooked in earth", "Lomo saltado", "Chicha morada · purple corn drink"],safe:"Huaraz is safe with normal city sense. ⚠ Altitude is the issue — the town is at 3,050 m and passes go over 4,750 m. Acclimatise for three days minimum. Casa de Guías runs rescue but it is thin.",v:"The highest tropical mountain range on earth, and the density of 6,000 m peaks above Huaraz is unmatched outside the Himalaya. The Santa Cruz trek is the classic. But it is a May-to-September range and the wrong half of the calendar for an autumn trip.",pro:["Highest tropical range on earth", "Huaraz is a real base town", "Very cheap"],con:["⚠ Wrong season — Northern summer only", "Serious altitude from day one", "No autumn colour"],hikes:[["Santa Cruz trek", "50 km · 4 days · 4,750 m pass", "The classic Andean trek — Punta Unión pass with Alpamayo and Taulliraju either side."], ["Laguna 69", "14 km · 800 m · 6 h", "A day hike to an impossibly blue lake at 4,600 m under Chacraraju. The one everyone does."], ["Huayhuash circuit", "130 km · 10 days", "South of the Blanca and harder — the finest trek in South America by most accounts."], ["Laguna Churup", "8 km · 700 m · 5 h", "The acclimatisation day, with a cabled scramble at the top."]],disc:{"lang": {"sc": 3, "s": "Latin", "t": "Spanish, plus Quechua in the villages. English in Huaraz agencies and little else. Spanish is genuinely useful here in a way it is not in most of this list.", "words": ["Buenos días", "¿Cuánto cuesta?", "Allillanchu · Quechua hello"]}, "veg": {"sc": 3, "t": "Manageable. Potatoes, quinoa, beans and corn are the base of Andean food and there are hundreds of potato varieties. But meat is the centrepiece and lard is common. Huaraz has a few vegetarian places.", "ask": "Soy vegano — sin carne, sin queso, sin huevo"}, "med": {"sc": 2, "t": "⚠ Thin. Casa de Guías coordinates mountain rescue and is competent but under-resourced. Huaraz hospital handles altitude cases; anything serious means Lima."}, "con": {"sc": 3, "t": "Good in Huaraz, nothing on the treks. Cash economy — soles. Cards in town only."}, "soc": {"sc": 4, "t": "Safe with sensible precautions. Huaraz is a trekking town and used to foreigners. Bus travel at night is standard and fine on the good companies."}, "hosp": "Warm and unfussy. Andean hospitality is quieter than the Caucasus — practical rather than ceremonial.", "who": "A serious international trekking and climbing crowd — Israelis, Europeans, Americans, plus a large Peruvian guiding community."},masc:"cóndor",mascEn:"the Andean condor",mascL:"Three-metre wingspan over the puna. Also vizcacha — a rabbit-sized chinchilla relative that sunbathes on rocks."},

os Aires or Santiago, then a domestic flight to El Calafate or Punta Arenas, then bus. A long day and a half.",col2:"⚠ Southern-hemisphere seasons invert everything. Lenga beech does turn spectacular scarlet — in April, which is their autumn. In the northern autumn Patagonia is just emerging from winter.",food:"Argentine beef and Chilean seafood, which is a good combination. El Chaltén has a surprisingly good small food scene for a village of 3,000; Puerto Natales likewise. Malbec throughout.",eat:["Asado · the barbecue, an all-afternoon event", "Cordero al palo · lamb on a cross over embers", "Calafate berry · eat one and you return", "Malbec, and Patagonian Río Negro pinot"],safe:"Very safe. ⚠ The wind is the actual hazard — routinely 80 km/h and occasionally 120, strong enough to stop you walking. Days get cancelled by it, and Torres del Paine has had serious wind incidents.",v:"El Chaltén is the purest version of your own formula anywhere on earth — every trail starts on the village street, no lifts, no permits. Torres del Paine is the opposite: bookings months ahead through three portals. Together they are the best trekking in the southern hemisphere, in the wrong half of the year.",pro:["Every trail from the village in El Chaltén", "Fitz Roy and the Torres", "Real towns with real food"],con:["⚠ Opposite season to Europe", "The wind cancels days", "Paine bookings open six months ahead"],hikes:[["Laguna de los Tres", "20 km · 750 m · 9 h", "Ten hours to a lake under Fitz Roy, the last kilometre a steep scramble. Go on the first clear morning, not the second."], ["Base las Torres", "18 km · 800 m · 8 h", "The three granite towers over a glacial lake. Sleep at Chileno and go up at dawn to have it alone."], ["Loma del Pliegue Tumbado", "22 km · 1,100 m · 8 h", "Fitz Roy, Cerro Torre and the ice cap from one summit, with a tenth of the traffic."], ["French Valley · the W", "24 km · 600 m · 9 h", "Into an amphitheatre of hanging glaciers with audible avalanches. The best day on the W."]],disc:{"lang": {"sc": 3, "s": "Latin", "t": "Spanish, with good English in El Chaltén and Puerto Natales because both live on trekking. Argentine Spanish is its own dialect — sh for ll, and vos for tú.", "words": ["Buen día", "Che · the all-purpose address", "¿Cuánto sale?"]}, "veg": {"sc": 3, "t": "Better than the beef reputation suggests. El Chaltén has a proper vegetarian restaurant and Argentine produce is excellent. But an asado is the social event and declining it is awkward.", "ask": "Soy vegano — sin carne, sin lácteos"}, "med": {"sc": 4, "t": "Good. Both parks have organised rescue, El Calafate and Puerto Natales have hospitals, and the trails are busy enough that help finds you."}, "con": {"sc": 3, "t": "⚠ Argentina limits ATM withdrawals to about USD 80 a day and machines are scarce. Bring dollars and change locally. Chile is easier. Signal in the villages, none in the parks."}, "soc": {"sc": 5, "t": "Very safe and thoroughly used to independent trekkers of every kind."}, "hosp": "Argentine warmth is loud and immediate; Chilean is more reserved. Both are easy. The mate gourd being passed to you is an inclusion, not an offer.", "who": "A genuinely international trekking crowd, heavy on Israelis, Europeans and North Americans, plus a big Argentine domestic contingent in January."},masc:"guanaco",mascEn:"the guanaco",mascL:"On every ridge in Torres del Paine, watching. Also the puma that hunts it — the densest population on earth is here."},

 this list from anywhere.",col2:"⚠ Mostly evergreen beech and podocarp — little autumn colour, and their autumn is your spring. What there is: golden tussock on the tops year-round, and Central Otago poplars in April.",food:"Better than its old reputation. Lamb obviously, but also excellent seafood, whitebait in season, and a serious wine industry. Hut food is what you carried.",eat:["Green-lipped mussels", "Whitebait fritter, in season", "Hokey pokey ice cream", "Central Otago pinot noir"],safe:"Very safe. ⚠ The weather is the hazard — Fiordland gets seven metres of rain a year and rivers rise fast enough to strand people. DOC weather warnings are not decorative.",v:"World-class and a very long way away. The hut system is the best-run on earth, the Great Walks are booked to the minute, and the landscape moves from glacier to rainforest to fiord in a day. It is also expensive and in the opposite season.",pro:["Best-run hut system anywhere", "Glacier to fiord in one country", "Total safety and total organisation"],con:["⚠ 26 hours away and opposite season", "Most expensive on this list", "Great Walks book out in minutes"],hikes:[["Hooker Valley", "10 km · 100 m · 3 h", "Swing bridges to a glacial lake with Aoraki filling the head of the valley. Flat, and the best short walk in the country."], ["Routeburn Track", "32 km · 3 days", "Great Walk over the Harris Saddle between two national parks. Books out instantly."], ["Mueller Hut route", "10 km · 1,050 m · 8 h", "Straight up to a red hut at 1,800 m ringed by glaciers. Avalanche noise all night."], ["Gertrude Saddle", "7 km · 700 m · 5 h", "Unmarked, slabby, and the view down to Milford Sound is the finest in Fiordland."]],disc:{"lang": {"sc": 5, "s": "Latin", "t": "English, plus te reo Māori increasingly in official use and place names. Zero friction.", "words": ["Kia ora · hello", "Ka pai · good", "Tramping · what they call hiking"]}, "veg": {"sc": 4, "t": "Good. New Zealand cities are very vegan-friendly and supermarkets stock everything. In huts you cook what you carried, so it is entirely up to you.", "ask": "Just ask in English"}, "med": {"sc": 5, "t": "Excellent. DOC huts have radios, rescue is prompt and free, and ACC covers injury to visitors — a genuinely unusual arrangement."}, "con": {"sc": 4, "t": "Good in towns, none in the parks. Cards universal. Personal locator beacons are rented everywhere and widely used."}, "soc": {"sc": 5, "t": "Among the easiest and safest countries in the world to travel in."}, "hosp": "Casual and genuinely friendly, with a strong outdoors culture that assumes competence. Hut etiquette is real and unspoken.", "who": "New Zealanders, Australians, Germans and a long-stay working-holiday crowd. The Great Walks skew international; the backcountry skews local."},masc:"kea",mascEn:"the kea",mascL:"The world’s only alpine parrot, and it will dismantle your rucksack for entertainment. Genuinely intelligent and entirely without shame."},

h", "1,900 stone steps built by Sherpas to the most photographed view in Norway. Short, brutal, worth it."], ["Ryten & Kvalvika", "10 km · 400 m · 4 h", "Over to a beach reachable only on foot, with a clifftop view straight down to it."], ["Munken", "12 km · 800 m · 6 h", "A long ridge walk above Reine with the whole archipelago below."], ["Himmeltindan", "13 km · 960 m · 7 h", "The highest on Vestvågøy, and quieter than anything near Reine."]],disc:{"lang": {"sc": 5, "s": "Latin", "t": "Norwegian, and English is effectively universal and excellent. No friction at all.", "words": ["Hei · hello", "Takk · thanks", "Fjell · mountain"]}, "veg": {"sc": 4, "t": "Fine. Norwegian supermarkets stock plenty and Svolvær has options. Restaurant food is fish-centric and very expensive, so self-catering is the answer for other reasons anyway.", "ask": "Just ask in English"}, "med": {"sc": 5, "t": "Excellent. Norwegian rescue is superb and free, and Red Cross volunteers cover the islands."}, "con": {"sc": 5, "t": "Full coverage almost everywhere including the ridges. Cards universal — Norway is close to cashless."}, "soc": {"sc": 5, "t": "As safe as anywhere on earth."}, "hosp": "Reserved to the point of invisibility, and completely reliable. Nobody will approach you; everybody will help if you need it.", "who": "Germans, Dutch, photographers of every nationality, and an increasing number of van-lifers. Norwegians go elsewhere in summer."},masc:"havørn",mascEn:"the white-tailed eagle",mascL:"Europe’s largest raptor, 2.5 m across, and Lofoten has one of the densest populations anywhere. Also otters on the shore."},

d Sept–Oct",seasonN:"Spring and autumn both work. October is excellent — the summer heat has broken, the walnut harvest is in, and the skies are clear. Summer is too hot below 2,500 m; winter needs crampons on Toubkal.",acc:"Marrakech, then ninety minutes to Imlil. The shortest transfer of any non-European option here.",col2:"⚠ Not a colour destination in the northern sense — this is a semi-arid range. But the valley floors are terraced walnut and poplar, and they do turn gold in late October against red rock. The Aït Bougmez valley in autumn is genuinely beautiful.",food:"Berber mountain food is simple and good — tagine, bread baked in the village oven, mint tea constantly. Marrakech before or after is a different and much richer proposition.",eat:["Tagine, cooked over embers in a gîte", "Berber omelette for breakfast", "Amlou · argan, almond and honey", "Mint tea, poured from height"],safe:"Safe and well travelled. ⚠ The 2023 earthquake was centred near Imlil and rebuilding continues — check current conditions on specific villages. Guides are mandatory for Toubkal itself.",v:"The closest genuinely different mountain range to Europe — three hours from London, 4,167 m, Berber villages of mud-brick, and a mule-supported trekking tradition. October works properly. It is not an autumn-colour trip but it is a very good autumn trip.",pro:["Closest exotic option — 13 h door to door", "October is a proper season", "Very cheap, mule-supported"],con:["Little autumn colour", "Guide mandatory on Toubkal", "Post-earthquake rebuilding in places"],hikes:[["Toubkal summit", "22 km · 2 days · 1,700 m", "North Africa’s highest at 4,167 m, from a refuge at 3,207 m. Non-technical in autumn, a long scree slog."], ["Aït Bougmez valley circuit", "3–5 days · mule supported", "The happy valley — terraced fields, mud-brick villages, gîtes. The cultural trek rather than the summit one."], ["Imlil to Tacheddirt", "14 km · 900 m · 6 h", "Over the Tizi n’Tamatert between villages. The day walk that shows you the range."], ["M’Goun traverse", "6 days · 4,071 m", "The second-highest and far quieter than Toubkal, through gorges and high plateau."]],disc:{"lang": {"sc": 3, "s": "Arabic + Tifinagh", "t": "Arabic and Tamazight — the Berber language, written in Tifinagh script on signage. French is the practical second language and gets you everywhere. English in Marrakech and among guides.", "words": ["السلام عليكم · salam alaikum", "شكرا · shukran", "Azul · hello in Tamazight"]}, "veg": {"sc": 4, "t": "Good. Vegetable tagine is a standard dish, bread and olive oil are everywhere, and Moroccan cooking uses vegetables seriously. Watch for meat stock. Gîtes will adapt if told when booking.", "ask": "Sans viande et sans produits laitiers, s’il vous plaît"}, "med": {"sc": 2, "t": "⚠ Thin in the mountains. A clinic in Imlil, hospitals in Marrakech ninety minutes away. Mule evacuation is the realistic first stage. No helicopter service to speak of."}, "con": {"sc": 3, "t": "Signal in the valleys, none high. Cash economy in the mountains — dirhams. Cards in Marrakech only."}, "soc": {"sc": 4, "t": "Safe. Morocco is conservative — modest dress in villages matters, and a woman travelling will get more attention in Marrakech than in the mountains, where it is markedly easier."}, "hosp": "Berber hospitality is a formal institution — tea will be poured three times and you drink all three. Guides and muleteers are often from the villages you walk through.", "who": "French and Spanish overwhelmingly, plus British and a growing Moroccan domestic hiking scene. Toubkal is busy; everywhere else is not."},masc:"أروي",mascEn:"the Barbary sheep",mascL:"Aoudad, the only wild sheep in Africa, and increasingly rare. Also Barbary macaques in the cedar forests further north."},

HmKzFqKGAwIA0UAxg77gkBQoDGYDMKC2BZABhxW9OPtDIGCbyamf6A2GFJisGK69QlRdzcNXO3lkYOYiKqWV5AlxmDT5niT249R0RgAQ5iiZGwqr6gG8G7fP/AIH2jQamlcbIFSdEOIcAMQdLMPiK2KwBONy1sqoaepQtrAXcYhwgHDnmameryz//2Q==",imgt:"Mount Whitney",imgp:"https://en.wikipedia.org/wiki/Mount_Whitney",season:[0, 0, 0, 0, 0, 1, 2, 2, 2, 2, 1, 0],best:"Sept to mid-Oct",seasonN:"September and early October are the best window — the crowds and heat have gone, water is low, the mosquitoes are dead. Snow closes Tioga Pass some time in October or November.",acc:"San Francisco or Reno, then four hours. Straightforward but the permit system is the real barrier.",col2:"Aspen, not larch. The eastern Sierra — Bishop Creek, Lundy Canyon, June Lake — turns brilliant gold in the first three weeks of October and it is a well-known pilgrimage. The high country itself is granite and pine, and does not change.",food:"Nothing to write home about in the mountains. Bishop has the Erick Schat bakery and that is the local institution. Everything else is carried.",eat:["Erick Schat’s sheepherder bread, Bishop", "In-N-Out on the drive", "Trail: whatever fits the bear canister", "Sierra Nevada, the beer, from Chico"],safe:"Safe. ⚠ Bear canisters are mandatory and enforced. Wildfire smoke in September is an increasingly real problem that can ruin a week. Permits are competitive and rangers check them.",v:"The finest granite in the world and a trail network that runs 340 km without leaving the high country. September is the right month. The frustration is entirely bureaucratic — the wilderness permit lottery is genuinely difficult and plans have to be made months ahead.",pro:["The best granite anywhere", "September–October is the right window", "Aspen colour in the eastern Sierra"],con:["⚠ Permit lottery is brutal", "Wildfire smoke is a real risk in Sept", "No hut system — you carry everything"],hikes:[["Yosemite Valley to Half Dome", "26 km · 1,460 m · 12 h", "Cables up the last 120 m. Permit-only and worth the lottery."], ["Mount Whitney", "35 km · 1,900 m · 14 h", "The highest in the lower 48 at 4,421 m. Day-hikeable and brutal; permit-only."], ["Rae Lakes Loop", "66 km · 5 days", "A loop over Glen Pass in Kings Canyon — the best circuit in the range."], ["Lundy Canyon", "12 km · 400 m · 4 h", "The eastern Sierra aspen walk in October. Short, and the colour is the point."]],disc:{"lang": {"sc": 5, "s": "Latin", "t": "English.", "words": ["—", "—", "—"]}, "veg": {"sc": 5, "t": "Easy. California. Bishop and Mammoth both have options and every supermarket is well stocked.", "ask": "Just ask"}, "med": {"sc": 4, "t": "Good but expensive. SAR is competent and free; the hospital afterwards is not. Travel insurance matters here more than in Europe."}, "con": {"sc": 3, "t": "Signal in the towns, none in the wilderness. Inreach or similar is standard. Cards everywhere."}, "soc": {"sc": 5, "t": "Straightforward."}, "hosp": "The trail culture is strong and friendly — JMT and PCT hikers are a community. Town culture in Bishop and Lone Pine is unfussy.", "who": "Americans overwhelmingly, plus a strong international contingent on the JMT. Thru-hikers coming off the PCT in September."},masc:"black bear",mascEn:"the black bear",mascL:"Yosemite bears are expert at food theft and the canisters exist for a reason. Also marmots that will chew through a pack for the salt."},

her", "Two hours from Seattle"],con:["⚠ Short season, fast weather", "Enchantments permits near-impossible", "Rain, a great deal of it"],hikes:[["Wonderland Trail", "150 km · 9 days", "Right round Mount Rainier through every ecosystem it has. Permit-only and the finest circuit in the US."], ["Maple Pass Loop", "12 km · 600 m · 5 h", "The larch walk. Late September, and one of the best day-loops in the country."], ["The Enchantments", "29 km · 1,400 m · 1–3 days", "Granite basins, larches and mountain goats at 2,300 m. A permit lottery with roughly 3% odds."], ["Skyline Trail · Paradise", "9 km · 500 m · 4 h", "Straight up into the flower meadows under the Nisqually glacier. The introduction to Rainier."]],disc:{"lang": {"sc": 5, "s": "Latin", "t": "English.", "words": ["—", "—", "—"]}, "veg": {"sc": 5, "t": "Easy. Seattle is one of the better vegan cities in North America.", "ask": "Just ask"}, "med": {"sc": 4, "t": "Good, expensive. Rainier has a climbing ranger programme and rescue is competent."}, "con": {"sc": 3, "t": "None in the parks. Cards everywhere else."}, "soc": {"sc": 5, "t": "Straightforward."}, "hosp": "Pacific Northwest friendly — mild, outdoorsy, slightly reserved.", "who": "Seattleites in enormous numbers on weekends, and a serious mountaineering community."},masc:"mountain goat",mascEn:"the mountain goat",mascL:"The Enchantments goats are habituated and follow hikers for the salt in urine, which is exactly as awkward as it sounds."},

t walking on this list per kilometre. The GR20 is chains, slabs, exposure and scrambling for two weeks, and people are injured on it every season. It is not a walking holiday.",v:"Reputedly the toughest waymarked trail in Europe — 180 km along the granite spine of Corsica with refuges every night. Technically demanding rather than high. September is the right month and it is an intense fortnight rather than a relaxed one.",pro:["The most technically interesting trail in Europe", "Refuges every night", "September is the correct month"],con:["⚠ Genuinely hard and exposed", "Refuges are basic and can be full", "No autumn colour"],hikes:[["GR20 north section", "~90 km · 8 days", "Calenzana to Vizzavona. The hard half — Cirque de la Solitude was rerouted after a fatal rockfall but it remains serious."], ["GR20 south section", "~90 km · 7 days", "Vizzavona to Conca. Gentler, still not gentle, and the Bavella needles are the highlight."], ["Monte Cinto", "14 km · 1,400 m · 8 h", "Corsica’s highest at 2,706 m, off the main route and worth the detour."], ["Lac de Melo & Capitello", "10 km · 700 m · 5 h", "Two glacial lakes in the Restonica, and a taste of the terrain without the fortnight."]],disc:{"lang": {"sc": 4, "s": "Latin", "t": "French, plus Corsican which you will see on signage and hear in villages. English is patchy in the interior. French is genuinely useful.", "words": ["Bonjour", "Merci", "Salute · hello in Corsican"]}, "veg": {"sc": 2, "t": "⚠ Difficult. Corsican food is charcuterie and cheese, and refuge dinners are fixed. Tell them well in advance or carry your own — most GR20 walkers resupply and self-cater anyway.", "ask": "Végétalien — sans viande, sans fromage, sans œuf"}, "med": {"sc": 4, "t": "French mountain rescue — PGHM — is excellent and helicopter-equipped. Given how many injuries the GR20 produces, they are well practised."}, "con": {"sc": 3, "t": "Patchy on the route, fine in the towns. Refuges are cash. Euro."}, "soc": {"sc": 4, "t": "Safe. Corsican reserve toward outsiders is real but overstated; it fades quickly on the trail."}, "hosp": "Proud and initially cool, warm once you are past it. The refuge gardiens are characters.", "who": "French overwhelmingly, plus Germans, Italians and a hard core of long-distance walkers. Everyone on the trail is doing the same thing, which builds a fast community."},masc:"muvra",mascEn:"the mouflon",mascL:"Corsica’s wild sheep, on the high ground above Bavella. Also the bearded vulture, reintroduced and slowly recovering."},

,v:"The most underrated range in western Europe. Half the price of the Alps, refuges as good, a canyon that rivals anything in Colorado, and an autumn window that runs into late October. Nobody talks about it because the Alps are next door.",pro:["Half the price of the Alps, comparable quality", "Ordesa canyon in October", "Long season, good refuges"],con:["Less dramatic peaks than the Alps", "Two countries, two languages, two systems", "Access needs a car for the good valleys"],hikes:[["Ordesa canyon to Cola de Caballo", "18 km · 500 m · 6 h", "Up a beech-filled canyon between 1,000 m walls to a horsetail waterfall. In October the colour is extraordinary."], ["Brèche de Roland", "14 km · 900 m · 7 h", "A 40 m natural gap in the ridge at 2,807 m, from the Gavarnie side. Snow lingers in it year round."], ["Aneto", "20 km · 1,500 m · 10 h", "The highest Pyrenean at 3,404 m, with a small glacier and an exposed final ridge."], ["Carros de Foc", "55 km · 5 days", "A hut-to-hut circuit in Aigüestortes linking nine refuges. The best multi-day in the range."]],disc:{"lang": {"sc": 4, "s": "Latin", "t": "Spanish, Catalan, French and some Aragonese depending which valley. English is patchy in the refuges. A little Spanish or French makes everything easier.", "words": ["Buenos días / Bonjour", "Refugio / Refuge", "¿Hay sitio? · is there space?"]}, "veg": {"sc": 3, "t": "Manageable. Spanish refuges do a fixed menu that is meat-centric; tell them at booking. Down in the valleys, Spain has improved enormously and pisto, escalivada and lentils are everywhere.", "ask": "Soy vegano — sin carne, sin queso, sin huevo"}, "med": {"sc": 4, "t": "Good on both sides. Spanish GREIM and French PGHM both helicopter-equipped. EU card valid."}, "con": {"sc": 4, "t": "Good in valleys, patchy high. Cards accepted, refuges often cash. Euro throughout."}, "soc": {"sc": 5, "t": "Very comfortable and family-oriented."}, "hosp": "Aragonese and Catalan mountain villages are welcoming and unpretentious. Refuge culture is communal and sociable in a way the Alps sometimes are not.", "who": "Spanish and French, overwhelmingly. Very few English speakers, which is part of the appeal."},masc:"quebrantahuesos",mascEn:"the bearded vulture",mascL:"The bone-breaker — drops bones from height to crack them. The Pyrenees hold Europe’s densest population, and Ordesa is the place to see one."},

which is routine rather than alarming. But Ethiopia has had serious internal conflict — the Amhara region including Gondar has seen unrest and travel advice has been restrictive. Check current position before committing.",v:"An escarpment of 1,500 m cliffs with troops of gelada — a monkey found nowhere else — walking past you at close range. Genuinely extraordinary and genuinely cheap. The caveat is political and it is not small: check current advice, and be prepared for that to change your plans.",pro:["Gelada troops at arm’s length", "The cheapest espresso on this list", "An escarpment unlike anything else"],con:["⚠ Check current travel advice — Amhara unrest", "Armed scout mandatory", "No real trail infrastructure"],hikes:[["Sankaber to Geech", "15 km · 500 m · 6 h", "Along the escarpment edge with gelada troops and lammergeier below. The classic first day."], ["Imet Gogo", "8 km · 400 m · 4 h", "A promontory at 3,926 m with a 360° drop. The best viewpoint in the park."], ["Ras Dashen", "2 days · 1,200 m", "Ethiopia’s highest at 4,550 m and the tenth-highest in Africa. A long walk rather than a climb."], ["Chennek escarpment", "10 km · 300 m · 4 h", "Walia ibex country — endemic, endangered, and reliably seen here."]],disc:{"lang": {"sc": 2, "s": "Ge’ez script", "t": "⚠ Amharic in its own script, plus Tigrinya. English among guides and in Gondar hotels, little elsewhere. Guides and scouts are mandatory anyway, which solves it.", "words": ["ሰላም · selam, hello", "አመሰግናለሁ · ameseginalehu, thank you", "ቡና · buna, coffee"]}, "veg": {"sc": 5, "t": "Outstanding, and for the same reason as Georgia — Orthodox fasting. Wednesdays and Fridays are fasting days nationally and the whole country eats vegan, so shiro, misir wot and atkilt are everyday food. Ask for \"fasting food\" and you get a vegan platter.", "ask": "የጾም · ye-tsom — fasting food"}, "med": {"sc": 1, "t": "⚠ Minimal. A clinic in Debark, hospital in Gondar three hours away. No mountain rescue. Altitude to 4,550 m with no infrastructure."}, "con": {"sc": 1, "t": "⚠ Patchy at best and periodically shut down entirely during unrest. Cash economy — birr, and dollars to change."}, "soc": {"sc": 2, "t": "⚠ The park is safe and scouted. The wider region is the concern — check advice, and note that internet and transport have both been suspended regionally in recent years."}, "hosp": "Ethiopian hospitality is famous and the coffee ceremony is a real institution — an hour, three cups, and you stay for all three.", "who": "A small determined crowd, mostly organised groups. Numbers collapsed with the conflict and have not fully returned."},masc:"ጭላዳ",mascEn:"the gelada",mascL:"The bleeding-heart baboon — the last grass-eating primate on earth, found only here, and troops of several hundred graze past you paying no attention at all."},

ol2:"<b>Aspen, at a scale nothing in Europe matches.</b> Whole mountainsides of a single clonal organism turning gold at once, from about 18 September to 5 October depending on altitude. The Maroon Bells, Kebler Pass and the San Juans around Telluride are the classics. It is a genuine national pilgrimage.",food:"Aspen and Telluride are resort towns with resort prices and good restaurants. Durango is more honest. Green chile everywhere in the south.",eat:["Green chile, on everything", "Rocky Mountain oysters, if brave", "Colorado craft beer, the epicentre", "Palisade peaches, if you are early"],safe:"Safe. ⚠ Altitude is real — trailheads start at 3,000 m and 14ers go to 4,400 m. Afternoon thunderstorms are lethal on ridges; be off the summit by noon in summer.",v:"The best aspen colour on earth, in a range with 58 peaks over 4,267 m and a hut system in the San Juans. Two weeks in late September and the whole state goes out to look at it. Expensive, high, and easy to reach from anywhere in North America.",pro:["The best aspen display anywhere", "58 peaks over 14,000 ft", "Eight hours from you"],con:["⚠ Colour window is two weeks and busy", "Trailheads start at 3,000 m", "Aspen and Telluride are expensive"],hikes:[["Maroon Bells & Crater Lake", "6 km · 150 m · 2 h", "The most photographed mountains in North America, with aspen below. Shuttle-only in season."], ["Four Pass Loop", "43 km · 2,700 m · 4 days", "Four passes over 3,800 m round the Maroon Bells. The finest circuit in Colorado."], ["Ice Lake Basin", "13 km · 800 m · 6 h", "Above Silverton to a basin of impossibly blue lakes at 3,800 m."], ["Kebler Pass", "drive + short walks", "The largest aspen stand in North America — a single organism covering hundreds of hectares."]],disc:{"lang": {"sc": 5, "s": "Latin", "t": "English.", "words": ["—", "—", "—"]}, "veg": {"sc": 5, "t": "Easy. Boulder and Denver are very vegan-friendly and the resort towns cater to everything.", "ask": "Just ask"}, "med": {"sc": 4, "t": "Good, expensive. County SAR teams are volunteer and excellent. Altitude clinics exist in the resort towns."}, "con": {"sc": 4, "t": "Good in the corridors, none in the wilderness. Cards everywhere."}, "soc": {"sc": 5, "t": "Straightforward."}, "hosp": "Outdoorsy and welcoming. Colorado mountain-town culture is friendly and slightly self-satisfied about the lifestyle.", "who": "Coloradans in enormous numbers during leaf season, plus Texans and a national photography crowd."},masc:"elk",mascEn:"the elk",mascL:"Bugling through September — a sound like a rusty gate crossed with a whistle, and one of the great wildlife experiences in North America."},

 chilli and cheese", "Red rice", "Suja · butter tea, salted", "Ara · the local spirit"],safe:"Extremely safe. ⚠ The constraint is not safety but cost — the Sustainable Development Fee is USD 100 per person per night on top of everything, which is what makes Bhutan the most expensive destination on this list by a distance.",v:"⚠ The €210 a day is the daily fee plus costs, not a lifestyle choice — Bhutan deliberately prices tourism to limit it. What you get is a Himalayan kingdom with no crowds anywhere, October clarity, and the Jomolhari trek under a 7,326 m peak. Whether that is worth four times Val Gardena is a real question.",pro:["October is the correct month", "No crowds anywhere, by design", "Culturally unlike anywhere else here"],con:["⚠ USD 100/night fee on top of costs", "Guide mandatory for everything", "Trek infrastructure is camping, not huts"],hikes:[["Tiger’s Nest · Taktsang", "6 km · 700 m · 4 h", "A monastery on a cliff face at 3,120 m. The image of Bhutan, and busy by Bhutanese standards, which means fifty people."], ["Jomolhari trek", "8 days · 4,900 m pass", "To base camp under a 7,326 m peak, over Nyile La. The classic Bhutanese trek, fully camping."], ["Druk Path", "5 days · 4,200 m", "Paro to Thimphu over lakes and ridges. The shorter introduction and the most walkable."], ["Bumthang cultural circuit", "var · easy", "Valley walking between temples in the spiritual heartland. Gentle and the autumn festivals are here."]],disc:{"lang": {"sc": 4, "s": "Tibetan script", "t": "Dzongkha in Tibetan script, but English is an official language and the medium of education — everyone under fifty speaks it well. Effectively no friction, unusually.", "words": ["Kuzuzangpo la · hello", "Kadrinchey la · thank you", "Ema datshi"]}, "veg": {"sc": 4, "t": "Good. Buddhist country, vegetarian dishes are standard, and ema datshi itself is vegetarian though not vegan. Your guide arranges all meals so it is simply a matter of telling them.", "ask": "Tell your guide when booking"}, "med": {"sc": 3, "t": "Basic but organised. Hospitals in Thimphu and Paro, guide-managed evacuation, and helicopter service exists. Free healthcare, including for visitors."}, "con": {"sc": 3, "t": "Good in the valleys, none on trek. Cards in Thimphu; cash elsewhere. Ngultrum, pegged to the rupee."}, "soc": {"sc": 5, "t": "Among the safest countries anywhere, and the guided structure removes almost all friction."}, "hosp": "Formal, gentle, and quietly proud. The guide relationship is central — you will spend a week with one person and it shapes the trip entirely.", "who": "Very few people, by design. Older and wealthier than most trekking destinations, plus a serious Indian visitor contingent who pay a lower fee."},masc:"ཏཀིན",mascEn:"the takin",mascL:"The national animal — a goat-antelope that looks assembled from spare parts, and according to legend was created that way by a mad saint."},
{n:'Zell am See',disc:{"lang": {"sc": 5, "s": "Latin", "t": "German plus fluent tourism English. Also, unusually, a lot of Arabic — Zell has been a summer destination for Gulf visitors for two decades and signage reflects it.", "words": ["Grüß Gott", "Zwei Bier, bitte", "Wo ist die Seilbahn?"]}, "veg": {"sc": 3, "t": "Better than Bavaria because the town is big enough to have variety — Italian, Asian, and a couple of places that do it properly. The Pinzgau harvest festival is cheese and bread heavy.", "ask": "Vegan, bitte"}, "med": {"sc": 5, "t": "Excellent. Hospital in Zell, helicopter base, EU card valid."}, "con": {"sc": 5, "t": "Complete. It is a resort town."}, "soc": {"sc": 5, "t": "Entirely comfortable. A busy lakeside promenade with families everywhere."}, "hosp": "Professional rather than personal — this is a place that has been hosting people for a century and does it well without needing to know you.", "who": "Germans, Dutch, Gulf families in summer, and a strong Austrian domestic crowd. The most international of the Alpine options."},cty:"Austria",masc:"Camoscio",mascEn:"the chamois",mascL:"Also present, also unbothered, but nearer the caf\u00e9.",season:[0, 0, 0, 0, 1, 2, 2, 2, 2, 1, 0, 0],best:"Sept",seasonN:"The lake is swimmable into early October and the Pinzgau harvest festival runs from late August. Lifts thin out from mid-October.",lat:47.32,lon:12.8,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA8LDA0MCg8NDA0REA8SFyYZFxUVFy8iJBwmODE7OjcxNjU9RVhLPUFUQjU2TWlOVFteY2RjPEpsdGxgc1hhY1//2wBDARARERcUFy0ZGS1fPzY/X19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX1//wgARCACCASwDASIAAhEBAxEB/8QAGQABAQEBAQEAAAAAAAAAAAAAAAEDAgQF/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//aAAwDAQACEAMQAAAB+grWABSKIoiiKIoiiAASiKICKIsIokoko0UoQVZFEURRFEURYAAJRFEAlEWCUQEWGolFIoi8HT53rrZURRFEUQACURSRYqUkWAVARYaiUAcHSb438heemPV6Pk6H02W0RRFEAIFEURYDg6KSURYRYagHEskkvq+Jr5rNJlpvPdBrjT1ev5cj60+ZV+nl47Htzw7lTrwV774+rn3afP8ATnWnfmwl7z5m8+/v5nqPSIijjTycy+z5vNoNZ5dDjqg const PY=d=>(52-d.lat)/16*430+35;
const WX=lon=>(lon+180)*10, WY=lat=>(85-lat)*10;
function drawWorld(){
  const box = VB[region] || VB.all;
  const zoomed = region!=='all';
  const k = box[2]/1100;                       /* scale factor: how many map units per screen px */
  let s='';
  s+=`<defs><pattern id="sea" width="${8*k}" height="${8*k}" patternUnits="userSpaceOnUse"
        patternTransform="rotate(38)"><rect width="${8*k}" height="${8*k}" fill="#C6DCE8"/>
        <line x1="0" y1="0" x2="0" y2="${8*k}" stroke="#B2CEDC" stroke-width="${2*k}"/></pattern></defs>`;
  s+=`<rect x="${box[0]}" y="${box[1]}" width="${box[2]}" height="${box[3]}" fill="url(#sea)"/>`;
  const inRegion = c => region!=='all' && D.some(d=>regOf(d.n)===region && d.cty===c.n);
  LAND.forEach(c=>{
    const hot = zoomed ? inRegion(c) : c.h;
    s+=`<path d="${c.d}" fill="${hot?'#E8DCBE':'#D8CEB6'}" stroke="#2B2118"
      stroke-width="${(hot?1.6:1)*k}" opacity="${hot?1:.7}" stroke-linejoin="round"/>`;});

  if(zoomed){
    LAND.filter(inRegion).forEach(c=>{
      const dd=D.filter(x=>x.cty===c.n && regOf(x.n)===region);

        font-size="${11*k}" font-weight="700" fill="#7A6E58" letter-spacing="${1.4*k}"
        opacity=".8">${c.n.toUpperCase()}</text>`;});
  }
  /* the pins */
  D.forEach(d=>{
    const r=regOf(d.n); if(region!=='all'&&region!==r) return;
    const x=WX(d.lon), y=WY(d.lat);
    const c=d.day<=70?'#3E7A4A':d.day<=100?'#E0A125':'#B8322B';
    const oct=d.season[9], sz=zoomed?k:1.55;
    s+=`<g class="mpk" data-n="${d.n}" transform="translate(${x},${y}) scale(${sz})">

        <text x="13" y="-17.4" text-anchor="middle" font-family="Courier Prime,monospace" font-size="7.5" font-weight="700" fill="#FBF6EA">×</text>`:''}

const MONTHS=['J','F','M','A','M','J','J','A','S','O','N','D'];
const MONTHNAME=['January','February','March','April','May','June','July','August','September','October','November','December'];

try{ star=new Set(JSON.parse(localStorage.getItem('wg_star')||'[]')); }catch(e){}
const saveStars=()=>{try{localStorage.setItem('wg_star',JSON.stringify([...star]))}catch(e){}};
/* how far, from Boca Raton — great-circle, then a rough door-to-door estimate */
const HOME=[26.36,-80.09];
function km(a,b){const R=6371,r=Math.PI/180;
  const dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(x)));}
const distKm=d=>km(HOME,[d.lat,d.lon]);
const monthOK=d=>month===12?Math.max(...d.season):d.season[month];
const money=e=>'€'+e.toFixed(2);
function stamp(d,i){
  const cols=['#B8322B','#2C5C8A','#3E7A4A','#6B4A7A','#2E8B8B','#8A5A1E'];
  const c=cols[i%cols.length];
  return `<svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="42" fill="none" stroke="${c}" stroke-width="4" opacity=".82"/>
    <circle cx="50" cy="50" r="35" fill="none" stroke="${c}" stroke-width="1.6" opacity=".82"/>
    ${Array.from({length:28},(_,k)=>{const a=k/28*Math.PI*2;
      return `<line x1="${50+Math.cos(a)*42}" y1="${50+Math.sin(a)*42}" x2="${50+Math.cos(a)*46}" y2="${50+Math.sin(a)*46}" stroke="${c}" stroke-width="2" opacity=".55"/>`}).join('')}
    <path d="M28,62 L40,38 L47,49 L56,28 L72,62 Z" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" opacity=".85"/>
    <text x="50" y="76" text-anchor="middle" font-family="Bungee,cursive" font-size="13" fill="${c}" opacity=".9">${d.hi.toLocaleString()}m</text>
    <text x="50" y="24" text-anchor="middle" font-family="Courier Prime,monospace" font-weight="700" font-size="7.5" fill="${c}" opacity=".8">${money(d.esp)} ESPRESSO</text>
  </svg>`;
}
function ease(d){ return 6-Math.min(5,Math.max(1,Math.round((d.fly-13)/1))) }
function score(d){
  return sortBy==='esp'?-d.esp
       : sortBy==='mtq'?mtScore(d)
       : sortBy==='val'?perEuro(d)
       : sortBy==='hi'?d.hi/1000
       : sortBy==='near'?-distKm(d)/1000
       : sortBy==='veg'?d.disc.veg.sc
       : sortBy==='safe'?d.disc.med.sc
       : sortBy==='easy2'?(d.disc.lang.sc+d.disc.med.sc+d.disc.con.sc+d.disc.soc.sc)
       : sortBy==='net'?(d.net+d.huts)
       : d[sortBy]; }
const mtScore=d=>d.mt*2+d.net+d.huts+d.tech;          /* out of 25 */
const perEuro=d=>mtScore(d)/d.day*100;
function flags(d){
  const out=[];
  if(d.season[9]===0) out.push(['✕','Shut by October']);
  if(d.disc.veg.sc<=1) out.push(['🥬','Vegan: very hard']);
  else if(d.disc.veg.sc===2) out.push(['🥬','Vegan: difficult']);
  if(d.disc.med.sc<=1) out.push(['🚁','No mountain rescue']);
  else if(d.disc.med.sc===2) out.push(['🚁','Rescue is thin']);
  if(d.disc.lang.sc<=1) out.push(['🗣','Own alphabet, little English']);
  if(d.disc.con.sc<=1) out.push(['📶','Offline, cash only']);
  if(d.fly>=20) out.push(['✈',d.fly+'h door to door']);
  if(d.disc.soc.sc<=3 && d.disc.soc.t.includes('⚠')) out.push(['⚠','Check current advice']);
  if(!out.length) return `<div class="flags"><span class="fl ok">✓ nothing here would rule it out</span></div>`;
  return `<div class="flags">${out.map(([i,t])=>`<span class="fl"><b>${i}</b>${t}</span>`).join('')}</div>`;
}
function passes(d){
  if(region!=='all'&&regOf(d.n)!==region) return false;
  if(month!==12 && d.season[month]===0) return false;
  if(filters.has('cheap') && d.day>80) return false;
  if(filters.has('close') && d.fly>16) return false;
  if(filters.has('rescue') && d.disc.med.sc<3) return false;
  if(filters.has('vegan') && d.disc.veg.sc<4) return false;
  if(filters.has('colour') && d.col<4) return false;
  if(filters.has('star') && !star.has(d.n)) return false;
  return true;
}

  document.querySelectorAll('.d').forEach(el=>el.onclick=e=>{

const WILD={
 bear:'<b>Bear.</b> Grizzly and black in the Canadian Rockies, black in the Sierra and Cascades. Bear spray on the hip is standard equipment rather than a precaution, and Yosemite\u2019s bears are expert enough at food theft that canisters are legally required. You are far more likely to be hurt by an elk.',
 guanaco:'<b>Guanaco.</b> The wild ancestor of the llama, and on every ridge in Torres del Paine watching you without moving. Herds are matriarchal; the males posture and spit. Where they are, the puma that hunts them is not far — this is the densest puma population on earth.',
 kea:'<b>Kea.</b> The world\u2019s only alpine parrot, olive-green with scarlet under the wing, and comfortably the most intelligent bird you will meet. It solves puzzles, works cooperatively, and will systematically dismantle a rucksack, a car\u2019s rubber trim or a tent for the entertainment. Around 4,000 left.',
 gelada:'<b>Gelada.</b> The bleeding-heart baboon — the last grass-eating primate on earth, found only on the Ethiopian escarpment. Troops of several hundred graze past you paying no attention whatever, sleep on the cliff face, and have the most complex vocal repertoire of any non-human primate.',
 elk:'<b>Elk · wapiti.</b> Bugling through September — a rising whistle that sounds mechanical and carries for miles. Bulls are genuinely dangerous during the rut and Banff closes areas because of it. The defining sound of a Rockies autumn.',
 tahr:'<b>Himalayan tahr.</b> A wild goat on the cliffs above Namche, shaggy-maned and entirely unbothered by drops. Also here: musk deer, snow leopards nobody sees, and the Himalayan monal — an iridescent pheasant that looks like a mistake.',
 snowleopard:'<b>Илбирс · snow leopard.</b> Kyrgyzstan\u2019s national animal and on the flag of Bishkek. Perhaps four hundred remain in the Tien Shan, and the odds of seeing one are effectively zero — but the ibex and argali they hunt are common enough, and the country has built its conservation identity around the cat.',
 marcopolo:'<b>Марко Поло · Marco Polo sheep.</b> Horns spiralling to 1.6 metres, the longest of any sheep alive, named for the man who first described them crossing the Pamir in 1273. They live above 4,000 m on the Afghan and Chinese borders. Ibex are far more commonly seen.',
 chamois:'<b>Camoscio · chamois.</b> Small, agile, dark-coated by October. Above the treeline on scree, usually in groups, usually higher than you. The coat darkening for winter makes them easier to pick out on pale limestone.',
 eagle:'<b>Steinadler · golden eagle.</b> Forty-odd pairs across the Alps, each holding a hundred square kilometres. Two metres of wingspan and it almost never flaps. Look up over sun-warmed south faces in the early afternoon when the thermals are strongest.',
 ibex:'<b>Kozorog · alpine ibex.</b> Reintroduced to the Julian Alps and now doing well. Enormous ridged horns, entirely unbothered by cliffs. Slovenian legend gives one of them golden horns — Zlatorog — and a fondness for punishing greedy hunters.',
 marmot:'<b>Svišť · alpine marmot.</b> The whistle you hear before you see anything. In September they are eating twice their weight to survive eight months underground. By October the burrows are plugged and you will not see one until April.',
 boar:'<b>Yaban domuzu · wild boar.</b> Common through the Kaçkar\'s beech and chestnut forest, mostly nocturnal, mostly heard rather than seen. The Caucasian brown bear is also here in small numbers.',
 wolf:'<b>Вълк · grey wolf.</b> Bulgaria has around a thousand, and Rila and Pirin hold a real population alongside bears and the odd jackal. You will not see one. You may hear one, which is better.',
 lynx:'<b>Râs · Eurasian lynx.</b> Romania has Europe\'s largest population outside Russia, plus around six thousand brown bears and three thousand wolves. The Carpathians are the last place in Europe with a fully intact large-predator guild.',
 vulture:'<b>Shkabë · griffon vulture.</b> Recovering in the Albanian Alps after near-extinction. Three-metre wingspan, riding the thermals over the Valbona pass. The Balkan lynx also survives here in the low dozens.',
 tur:'<b>ჯიხვი · Caucasian tur.</b> A wild goat found nowhere else on earth — East and West Caucasian species, both endemic. Massive swept-back horns, and they live on ground you would not attempt. The Caucasian leopard is also here, in single figures.',
 leopard:'<b>Հովազ · Caucasian leopard.</b> Fewer than ten in Armenia and possibly the rarest large cat in the region. You will not see one. What you will see is the bezoar goat it hunts, and an extraordinary density of raptors.'
};

/* collapse the panel only once it has actually stuck to the top */
(function(){
  const pn=document.querySelector('.panel');
  if(!pn||!('IntersectionObserver' in window)) return;
  const sentinel=document.createElement('div');
  sentinel.style.cssText='height:1px;margin-bottom:-1px';
  pn.parentNode.insertBefore(sentinel,pn);
  new IntersectionObserver(([e])=>{
    if(pn.dataset.pinned) return;
    pn.classList.toggle('stuck', !e.isIntersecting);
  },{rootMargin:'-8px 0px 0px 0px',threshold:0}).observe(sentinel);
})();

function startAudio(name){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    mas=AC.createGain();mas.gain.value=.5;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4200;
    mas.connect(lp);lp.connect(AC.destination);
    verb=AC.createConvolver();verb.buffer=ir(AC,3,2.1);
    const vg=AC.createGain();vg.gain.value=.34;verb.connect(vg);vg.connect(AC.destination);}
  clearInterval(seq);
  const S=MUS[name]||MUS.landler,b=60/S.bpm;let t=AC.currentTime+.25,n=0;on=true;cur=name;
  seq=setInterval(()=>{if(!on)return;while(t<AC.currentTime+2){t+=S.bar(t,b,n);n++}},200);
  document.getElementById('snd').textContent='♪ '+S.lab;
}
function stopAudio(){on=false;clearInterval(seq);if(AC){AC.close();AC=null}}
document.getElementById('snd').onclick=e=>{const b=e.currentTarget;
  if(on){stopAudio();b.textContent='♪ music';b.classList.remove('on')}
  else{try{startAudio(cur||'landler');b.classList.add('on')}catch(err){b.textContent='♪ blocked'}}};

/* restore state from the URL hash, if there is one */
(function(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('m')!==null) month=Math.max(0,Math.min(12,+h.get('m')));
  if(h.get('s')) sortBy=h.get('s');
  if(h.get('r')) region=decodeURIComponent(h.get('r'));
  if(h.get('f')) h.get('f').split(',').filter(Boolean).forEach(f=>filters.add(f));
  const so=document.getElementById('sort'); if(so) so.value=sortBy;
})();
function syncHash(){
  const p=new URLSearchParams();
  p.set('m',month); p.set('s',sortBy);
  if(region!=='all') p.set('r',encodeURIComponent(region));
  if(filters.size) p.set('f',[...filters].join(','));
  history.replaceState(null,'','#'+p.toString());
}
document.getElementById('mo').value=month;
document.getElementById('mo2').value=month;
document.getElementById('molab').textContent = month===12?'any month':MONTHNAME[month];
document.getElementById('molab2').textContent = month===12?'any month':MONTHNAME[month];
document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',filters.has(x.dataset.f)));
drawWorld(); renderLegend(); renderCmpBar(); renderCards();
