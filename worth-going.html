/* structural booking constraints — why a place is hard to book, never when.
   Deliberately holds no dates, quotas, platforms or prices, so it does not go stale. */
const EDGE={"Taiwan":"The constraint is that Yushan is the highest peak, and the highest peak is always the one everyone applies for. Xueshan is 66 m lower, has better forest and a real glacial cirque, and is permitted far more easily — the gap is entirely about the number, not the mountain. The same logic pushes demand into the colour season; the clearest air comes after it, when nobody is competing.","Southern Alps":"Two structural gaps. The famous Great Walks are rationed while the tracks beside them are not, so the day-walk section of a booked-out route is usually free — the Routeburn from the Divide gets you the best hour of it with no permit at all. And a circuit is easier to book than a one-way traverse, because one-way routes need transport at both ends and everyone wants the same direction.","High Sierra":"The permit is rationed by trailhead, not by trail. Popular entry points are contested; the same route entered from an unfashionable side is not. The classic start is usually the crowded one because it is the one in the guidebook — starting further along the same trail is the standard way through, and it skips the hardest climb of the trip.","Cascades":"Demand concentrates on the named beauty spots and thins immediately on the loops around them. Where a lottery exists it is because a small area has a single famous feature; the surrounding ridges have the same rock and no ballot. Season length is the other constraint — a short window means everyone applies for the middle of it, and the shoulders are quieter for the same weather.","Andes & Patagonia":"The Inca Trail is rationed; the mountains it crosses are not. Alternative routes reach the same destination without a permit because the restriction attaches to the historic path, not the terrain — that is a permanent feature, not a policy that might change. In Torres del Paine the one-way rule means the crowd moves as a single wave; being at the start or end of the daily wave changes the experience more than the season does.","Patagonia":"The one-way circuit rule means everyone travels as a wave. Sleeping at the far end of a day rather than the near end puts you ahead of it, permanently. The famous viewpoints are also the ones reachable from a road — walking in from the other side is always less contested.","Himalaya":"Restricted areas need a guide and a minimum group size, which is exactly why they stay empty — the friction is the point and it works. Adjacent valleys under the same permit are near-deserted because people book the named objective and go home. Teahouse routes need no advance booking at all; that is structural, since the lodges are built for walk-ins.","Bhutan":"The daily fee is the rationing mechanism, deliberately. It does not fluctuate with demand the way a lottery does, so there is no gap to find and no advantage to timing — you are paying for the absence of other people, which is the product. The only real edge is length: the fee is per night, so a shorter, higher-quality itinerary costs less than a long one covering the same ground.","Japan":"Mountain huts are booked by phone in the local language before they are booked online, so the online allocation is what remains after locals have taken theirs. Anyone able to call, or willing to have a guesthouse call, is drawing from a larger pool. Colour season concentrates demand into weekends; the same week midweek is a different mountain.","Taiwan & Korea":"Shelters and permits release on a schedule and the weekend slots go first, because that is when people can travel — the weekday equivalent of the same night is routinely available. Peak colour draws the crowd; the week after it has the same trail with better air and no queue.","Carpathians & Balkans":"Cross-border permits are slow to obtain directly and fast through a local agency, because the agency submits in volume and knows the office. That is how intermediation works and it will not change. Huts here are walk-in by tradition rather than booked, so the constraint is space on the day, not a reservation months out.","Alps":"Hut demand is concentrated on the named routes and on weekends, and the huts one valley over are the same building with the same food. The famous circuits are walked in one direction by almost everyone because the guidebook says so — going the other way means you meet people rather than queue behind them, and beds free up ahead of the flow.","Pyrenees & Corsica":"The refuges on the famous traverse fill in the standard direction and at the standard stages. Starting from the less popular end reverses your position relative to the crowd for the whole route. The season is long here, so the constraint is not the window but everyone choosing the same fortnight in it.","Nordic":"Nothing is rationed — wild camping is a legal right and the huts are first-come. The constraint is weather and daylight, not permission, so there is no booking edge to find. That is unusual on this list and worth knowing: the planning effort belongs elsewhere.","North America":"Almost everything worth doing is rationed by lottery, and lotteries reward flexibility rather than speed. An application naming an unpopular start date, an unfashionable trailhead or a longer itinerary competes against a much smaller field for the same terrain. The dates people avoid are avoided for convenience, not for quality.","Africa":"Guides and scouts are mandatory rather than optional, which caps numbers permanently and means there is no ballot to lose. Arranging locally at the gateway town is cheaper than booking from abroad for the same service — the intermediary adds nothing here except cost."};
const edgeFor=n=>EDGE[n]||EDGE[regOf(n)]||null;
const WILD={
 bear:'<b>Bear.</b> Grizzly and black in the Canadian Rockies, black in the Sierra and Cascades. Bear spray on the hip is standard equipment rather than a precaution, and Yosemite\u2019s bears are expert enough at food theft that canisters are legally required. You are far more likely to be hurt by an elk.',
 guanaco:'<b>Guanaco.</b> The wild ancestor of the llama, and on every ridge in Torres del Paine watching you without moving. Herds are matriarchal; the males posture and spit. Where they are, the puma that hunts them is not far — this is the densest puma population on earth.',
 kea:'<b>Kea.</b> The world\u2019s only alpine parrot, olive-green with scarlet under the wing, and comfortably the most intelligent bird you will meet. It solves puzzles, works cooperatively, and will systematically dismantle a rucksack, a car\u2019s rubber trim or a tent for the entertainment. Around 4,000 left.',
 gelada:'<b>Gelada.</b> The bleeding-heart baboon — the last grass-eating primate on earth, found only on the Ethiopian escarpment. Troops of several hundred graze past you paying no attention whatever, sleep on the cliff face, and have the most complex vocal repertoire of any non-human primate.',
 elk:'<b>Elk · wapiti.</b> Bugling through September — a rising whistle that sounds mechanical and carries for miles. Bulls are genuinely dangerous during the rut and Banff closes areas because of it. The defining sound of a Rockies autumn.',
 tahr:'<b>Himalayan tahr.</b> A wild goat on the cliffs above Namche, shaggy-maned and entirely unbothered by drops. Also here: musk deer, snow leopards nobody sees, and the Himalayan monal — an iridescent pheasant that looks like a mistake.',
 snowleopard:'<b>Илбирс · snow leopard.</b> Kyrgyzstan\u2019s national animal and on the flag of Bishkek. Perhaps four hundred remain in the Tien Shan, and the odds of seeing one are effectively zero — but the ibex and argali they hunt are common enough, and the country has built its conservation identity around the cat.',
 marcopolo:'<b>Марко Поло · Marco Polo sheep.</b> Horns spiralling to 1.6 metres, the longest of any sheep alive, named for the man who first described them crossing the Pamir in 1273. They live above 4,000 m on the Afghan and Chinese borders. Ibex are far more commonly seen.',
 chamois:'<b>Camoscio · chamois.</b> Small, agile, dark-coated by October. Above the treeline on scree, usually in groups, usually higher than you. The coat darkening for winter makes them easier to pick out on pale limestone.',
 eagle:'<b>Steinadler · golden eagle.</b> Forty-odd pairs across the Alps, each holding a hundred square kilometres. Two metres of wingspan and it almost never flaps. Look up over sun-warmed south faces in the early afternoon when the thermals are strongest.',
 ibex:'<b>Kozorog · alpine ibex.</b> Reintroduced to the Julian Alps and now doing well. Enormous ridged horns, entirely unbothered by cliffs. Slovenian legend gives one of them golden horns — Zlatorog — and a fondness for punishing greedy hunters.',
 marmot:'<b>Svišť · alpine marmot.</b> The whistle you hear before you see anything. In September they are eating twice their weight to survive eight months underground. By October the burrows are plugged and you will not see one until April.',
 boar:'<b>Yaban domuzu · wild boar.</b> Common through the Kaçkar\'s beech and chestnut forest, mostly nocturnal, mostly heard rather than seen. The Caucasian brown bear is also here in small numbers.',
 wolf:'<b>Вълк · grey wolf.</b> Bulgaria has around a thousand, and Rila and Pirin hold a real population alongside bears and the odd jackal. You will not see one. You may hear one, which is better.',
 lynx:'<b>Râs · Eurasian lynx.</b> Romania has Europe\'s largest population outside Russia, plus around six thousand brown bears and three thousand wolves. The Carpathians are the last place in Europe with a fully intact large-predator guild.',
 vulture:'<b>Shkabë · griffon vulture.</b> Recovering in the Albanian Alps after near-extinction. Three-metre wingspan, riding the thermals over the Valbona pass. The Balkan lynx also survives here in the low dozens.',
 tur:'<b>ჯიხვი · Caucasian tur.</b> A wild goat found nowhere else on earth — East and West Caucasian species, both endemic. Massive swept-back horns, and they live on ground you would not attempt. The Caucasian leopard is also here, in single figures.',
 leopard:'<b>Հովազ · Caucasian leopard.</b> Fewer than ten in Armenia and possibly the rarest large cat in the region. You will not see one. What you will see is the bezoar goat it hunts, and an extraordinary density of raptors.'
};

function runCountdown(then){
 try{
 if(cdTimer){ cancelAnimationFrame(cdTimer); cdTimer=null; }
 countdown=3;
 const t0=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
 let spoken=4;
 const step=()=>{
  try{
   const now=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
   countdown=Math.max(0, 3-(now-t0)/400);
   const n=Math.ceil(countdown);
   if(n<spoken){ spoken=n; if(n>0){ try{ sfx('beep'); }catch(_){ } buzz(12);} }
   if(globe){ needStatic=true; drawGlobe(); } else drawWorld();
   if(countdown>0) cdTimer=requestAnimationFrame(step);
   else { cdTimer=null; countdown=0; try{ sfx('go'); }catch(_){ } buzz([20,50,20]); then(); }
  }catch(err){
   reportErr('countdown', err);
   countdown=0; cdTimer=null;
   try{ then(); }catch(_){ }
  }
 };
 cdTimer=requestAnimationFrame(step);
 }catch(err){ reportErr('countdown start', err); countdown=0; cdTimer=null; try{ then(); }catch(_){ } }
}
function diceRoll(e){ try{ diceRoll_(e); }catch(err){ reportErr('dice', err); } }
function diceRoll_(e){ if(e&&e.stopPropagation) e.stopPropagation();
 /* The flat map's own flight was a separate three-second implementation that never
    received any of the globe's work — it read as a missile. The flat map is for
    browsing; a flight always happens on the globe. */
 if(!globe){
   globe=true; flatBox=null; zoom=1; needStatic=true;
   try{ LSset('globe','1'); }catch(_){ }
   const c=CENTRE[region]||CENTRE.all; camLon=c[0]; camLat=c[1];
   try{ drawGlobe(); renderLegend(); }catch(_){ }
 }
 try{ sfx('roll'); }catch(_){ }
 flying=false; traceTo=null; traceU=0; if(flyGuard){clearTimeout(flyGuard);flyGuard=null;}
 pushHist();
 if(view==='treks'){
 const T2=TREKS.filter(t=>(region==='all'||t.rg===region)&&trekOpen(t)&&matchTrek(t)&&t.d<=dmax);
 if(!T2.length) return;
 const p2=T2[Math.floor(Math.random()*T2.length)];
 if(p2.g){ runCountdown(()=>{
 let done=false;
 const land=()=>{ if(done) return; done=true;
  try{ fromPos=[p2.g[0],p2.g[1]]; legN++; }catch(_){ }

  try{ alertTrek(p2,true); }catch(err){ reportErr('open trek card', err); } };
 setTimeout(land, 24000);
 try{
  if(globe) flyTo(p2.g[1],p2.g[0],32,land,null,p2.n);
  else flyFlat({n:p2.n,lon:p2.g[1],lat:p2.g[0]},land,p2.n);
 }catch(err){ reportErr('launch', err); setTimeout(land, 400); }
 }); }
 else { buzz([8,40,8]); alertTrek(p2); }
 return;}
 const L=D.filter(passes); if(!L.length) return;
 /* random by default; the ↗ button asks for the nearest range not yet visited on this trip */
 let pick;
 rail=false;
 if(nextMode==='near'){
   const here = fromPos ? fromPos : HOME;
   const been = new Set([...visited, ...hist.map(h=>h.pin).filter(Boolean)]); if(hotPin) been.add(hotPin);
   const cand = L.filter(d=>!been.has(d.n));
   const pool = cand.length ? cand : L;
   pick = pool.slice().sort((a,b)=>km2(here[0],here[1],a.lat,a.lon)-km2(here[0],here[1],b.lat,b.lon))[0];
   /* a short hop is a train, not a flight */
   rail = km2(here[0],here[1],pick.lat,pick.lon) < 1500;
 } else {
   pick=L[Math.floor(Math.random()*L.length)];
 }
 nextMode='random';
 runCountdown(()=>{
 let done=false;
 const land=()=>{ if(done) return; done=true;
  try{ fromPos=[pick.lat,pick.lon]; legN++; visited.add(pick.n); }catch(_){ }
  /* the plume already fired at touchdown — firing again here restarted it
     under the card. Only trigger it if the landing branch never ran. */

  try{ open2(pick.n,true); }catch(err){ reportErr('open card', err); } };
 setTimeout(land, 24000);          /* registered first, so nothing can skip it */
 try{
  if(globe){ flyTo(pick.lon,pick.lat,36,land,pick.n,pick.n); }
  else { flyFlat(pick,land,pick.n); }
 }catch(err){ reportErr('launch', err); setTimeout(land, 400); }
 });
}

 })()}

 tone(58, 26, 0, 1.9, 0.085, 'sawtooth');
 tone(41, 20, 0.09, 2.1, 0.06, 'sine');
 [0.0,0.13,0.31].forEach((o,i)=>air(o, 0.5, 0.05-i*0.012, 1400-i*300, 120));
 break; case 'cruise': {
  air(0, 1.5, 0.034, 2400, 700);
  const o=C.createOscillator(), g=C.createGain(), f2=C.createBiquadFilter();
  o.type='triangle';
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(96,t+1.4);
  f2.type='lowpass'; f2.frequency.value=2200;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.026,t+0.3);
  g.gain.exponentialRampToValueAtTime(0.0004,t+1.5);
  o.connect(f2); f2.connect(g); g.connect(out); o.start(t); o.stop(t+1.6);
  break; }
 case 'land': {
  air(0, 1.9, 0.055, 2200, 380);
  const o=C.createOscillator(), g=C.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(52,t+1.7);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.038,t+0.15);
  g.gain.exponentialRampToValueAtTime(0.0004,t+1.9);
  o.connect(g); g.connect(out); o.start(t); o.stop(t+2.0);
  air(0.05, 0.22, 0.05, 1700, 260);
  break; }
 case 'open':                                     /* the card rising */
 tone(392, 392, 0,    0.55, 0.035, 'sine');
 tone(587, 587, 0.10, 0.60, 0.030, 'sine');
 tone(784, 784, 0.20, 0.75, 0.024, 'sine');
 break;
 case 'close':
 tone(520, 300, 0, 0.22, 0.028, 'sine');
 break;
 case 'beep':
 tone(880, 880, 0, 0.13, 0.055, 'square');
 tone(1760, 1760, 0, 0.07, 0.018, 'sine');
 break;
 case 'go':
 tone(1320, 1320, 0, 0.42, 0.065, 'square');
 tone(660, 660, 0, 0.45, 0.040, 'sine');
 break;
 case 'tick':
 tone(1100, 900, 0, 0.05, 0.022, 'triangle');
 break;
 }
}
/* ============ wind chimes ============ */
let AC=null,on=false,seq=null,verb,mas,cur=null,windGain=null,windSrc=null;
function ir(c,sec,dec){
 const n=Math.floor(c.sampleRate*sec), b=c.createBuffer(2,n,c.sampleRate);
 for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);
 for(let i=0;i<n;i++){const t=i/n;
 d[i]=(Math.random()*2-1)*Math.pow(1-t,dec)*(1-0.25*Math.sin(i*0.0009+ch));}}
 return b;
}
const f=n=>261.626*Math.pow(2,n/12);
/* ---- one tube ----
 A free-free aluminium bar does not ring in harmonics. Its overtones sit at
 roughly 1 : 2.76 : 5.40 : 8.93 : 13.3 — which is exactly why chimes sound
 like chimes and not like a piano. */
const PARTIALS=[[1,1,1],[2.756,0.50,0.50],[5.404,0.30,0.28],[8.933,0.17,0.17],[13.34,0.09,0.11],[18.6,0.04,0.07]];
function chime(fr,t,g,pan){
 if(!AC) return;
 const out=AC.createGain(); out.gain.value=1;
 const pn=AC.createStereoPanner? AC.createStereoPanner():null;
 if(pn){ pn.pan.value=pan||0; out.connect(pn); pn.connect(verb); pn.connect(mas); }
 else { out.connect(verb); out.connect(mas); }
 /* longer tubes ring longer */
 const life=Math.max(1.6, 6.4 - Math.log2(fr/220)*1.5);   /* small tubes, so shorter */
 PARTIALS.forEach(([mult,amp,dk])=>{
 const o=AC.createOscillator(), og=AC.createGain();
 o.type='sine';
 o.frequency.value=fr*mult*(1+(Math.random()-0.5)*0.0016);   /* never quite in tune */
 const dur=life*dk;
 og.gain.setValueAtTime(0,t);
 og.gain.linearRampToValueAtTime(g*amp,t+0.004);
 og.gain.exponentialRampToValueAtTime(0.00008,t+dur);
 o.connect(og); og.connect(out);
 o.start(t); o.stop(t+dur+0.05);
 });
 /* the clack of the clapper on the tube */
 const nb=AC.createBuffer(1,Math.floor(AC.sampleRate*0.03),AC.sampleRate), nd=nb.getChannelData(0);
 for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*Math.pow(1-i/nd.length,7);
 const ns=AC.createBufferSource(); ns.buffer=nb;
 const nf=AC.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=fr*4.2; nf.Q.value=1.1;
 const ng=AC.createGain(); ng.gain.value=g*0.09;
 ns.connect(nf); nf.connect(ng); ng.connect(out); ns.start(t);
}
/* ---- the wind itself: filtered noise that swells and drops ---- */
function startWind(){
 const n=Math.floor(AC.sampleRate*4), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
 let last=0;
 for(let i=0;i<n;i++){ const w=Math.random()*2-1; last=(last*0.94+w*0.06); d[i]=last*3.2; }
 windSrc=AC.createBufferSource(); windSrc.buffer=b; windSrc.loop=true;
 const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=520; bp.Q.value=0.7;
 windGain=AC.createGain(); windGain.gain.value=0.004;
 windSrc.connect(bp); bp.connect(windGain); windGain.connect(mas);
 windSrc.start();
 /* the filter drifts, so it breathes */
 const lfo=AC.createOscillator(), lg=AC.createGain();
 lfo.frequency.value=0.055; lg.gain.value=260;
 lfo.connect(lg); lg.connect(bp.frequency); lfo.start();
}
/* ---- tunings ----
 Chimes are usually tuned pentatonic so no two tubes can clash.
 Each region gets its own set, which keeps the local flavour without a melody. */
const THEMES={
 ramble:  {lab:'Chimes',      root:-5, n:[0,4,7,9,12,16,19]},
 alps:    {lab:'Alpine',      root:-5, n:[0,4,7,11,12,16,19]},
 jota:    {lab:'Iberian',     root:-4, n:[0,1,5,7,8,12,17]},
 horo:    {lab:'Carpathian',  root:-3, n:[0,3,5,7,10,12,15]},
 hardanger:{lab:'Northern',   root:-5, n:[0,2,7,9,12,14,19]},
 svan:    {lab:'Caucasian',   root:-2, n:[0,3,5,7,10,15,17]},
 komuz:   {lab:'Steppe',      root:-4, n:[0,3,5,10,12,15,17]},
 guqin:   {lab:'Pentatonic',  root:0,  n:[0,2,4,7,9,12,16]},
 sarangi: {lab:'Himalayan',   root:-3, n:[0,2,3,7,10,12,14]},
 gagaku:  {lab:'Hirajōshi',   root:-1, n:[0,2,3,7,8,12,14]},
 gnawa:   {lab:'Saharan',     root:-4, n:[0,3,5,7,10,12,17]},
 bluegrass:{lab:'Wide open',  root:-5, n:[0,5,7,12,14,19,24]},
 huayno:  {lab:'Andean',      root:-2, n:[0,3,5,7,10,12,15]},
 taonga:  {lab:'Oceanic',     root:-5, n:[0,2,7,9,14,16,21]}
};
const REGTHEME={'Alps':'alps','Pyrenees & Corsica':'jota','Carpathians & Balkans':'horo',
 'Nordic':'hardanger','Caucasus & Anatolia':'svan','Central Asia':'komuz','China':'guqin',
 'Himalaya':'sarangi','Japan':'gagaku','Taiwan & Korea':'guqin','Africa':'gnawa','North America':'bluegrass',
 'Andes & Patagonia':'huayno','Oceania':'taonga'};
function themeFor(){ return region==='all' ? 'ramble' : (THEMES[REGTHEME[region]] ? REGTHEME[region] : 'ramble'); }
function startAudio(name){
 if(!THEMES[name]) name='ramble';
 try{
 if(!AC){
 AC=new (window.AudioContext||window.webkitAudioContext)();
 if(AC.state==='suspended') AC.resume();
 mas=AC.createGain(); mas.gain.value=0.0001;
 const shelf=AC.createBiquadFilter(); shelf.type='highshelf'; shelf.frequency.value=7800; shelf.gain.value=-3;
 mas.connect(shelf); shelf.connect(AC.destination);
 verb=AC.createConvolver(); verb.buffer=ir(AC,3.6,1.9);
 const vg=AC.createGain(); vg.gain.value=0.62; verb.connect(vg); vg.connect(AC.destination);
 mas.gain.exponentialRampToValueAtTime(0.34,AC.currentTime+2.6);
 startWind();
 }
 }catch(e){ on=false; return; }
 clearInterval(seq);
 const T=THEMES[name]; cur=name;
 on=true;
 let t=AC.currentTime+0.5;
 let gust=0.35;                                  /* how hard it is blowing, 0..1 */
 const schedule=()=>{
 if(!on||!AC) return;
 while(t < AC.currentTime + 2.5){
 /* the wind wanders — long lulls, then a flurry */
 gust += (Math.random()-0.48)*0.28;
 gust = Math.max(0.04, Math.min(1, gust));
 if(windGain) windGain.gain.setTargetAtTime(0.0025+gust*0.011, t, 1.6);
 if(Math.random() < 0.20+gust*0.55){
 /* a gust knocks two to five tubes together */
 const hits = 1 + Math.floor(Math.random()*Math.random()*(1+gust*3));
 for(let i=0;i<hits;i++){
 const idx=Math.floor(Math.random()*T.n.length);
 const oct = Math.random()<0.22 ? -12 : (Math.random()<0.18 ? 12 : 0);
 const vel = (0.012+gust*0.022)*(0.45+Math.random()*0.7);
 chime(f(T.root+T.n[idx]+oct+26), t+i*(0.04+Math.random()*0.16), vel,
 (idx/(T.n.length-1))*1.5-0.75);     /* tubes hang left to right */
 }
 }
 t += 0.55+Math.random()*2.1*(1.3-gust);      /* silence when the air is still */
 }
 };
 schedule();
 seq=setInterval(schedule,700);
 const btn=document.getElementById('snd'); if(btn) btn.textContent='♪ '+T.lab;
}
function stopAudio(){
 on=false; clearInterval(seq);
 if(AC){ const a=AC;
 try{ mas.gain.cancelScheduledValues(a.currentTime);
 mas.gain.setValueAtTime(Math.max(0.0001,mas.gain.value),a.currentTime);
 mas.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+1.2); }catch(e){}
 setTimeout(()=>{ try{a.close()}catch(e){} },1500);
 AC=null; windGain=null; windSrc=null; }
}
(function(){
 const btn=document.getElementById('snd'); if(!btn) return;
 btn.textContent='♪ '+THEMES[themeFor()].lab;
 btn.onclick=function(){
 if(on){ stopAudio(); btn.textContent='♪ '+THEMES[themeFor()].lab; btn.classList.remove('on'); }
 else { startAudio(themeFor()); if(on) btn.classList.add('on'); }
 };
})();
/* open at the top of the page, every time — browsers otherwise restore the last scroll */
try{ if('scrollRestoration' in history) history.scrollRestoration='manual'; }catch(_){ }

/* restore state from the URL hash, if there is one */
(function(){
 let h=null;
 try{ h=new URLSearchParams((location.hash||'').slice(1)); }catch(e){ h=null; }
 try{
   if(h){
     if(h.get('m')!==null) month=Math.max(0,Math.min(12,+h.get('m')));
     if(h.get('s')) sortBy=h.get('s');

   }
 }catch(e){}
 try{ const so=document.getElementById('sort'); if(so) so.value=sortBy; }catch(e){}
})();
let hashOK=true;
function syncHash(){
 if(!hashOK) return;
 try{

  p.set('m',month); p.set('s',sortBy);
  if(region!=='all') p.set('r',encodeURIComponent(region));
  if(filters.size) p.set('f',[...filters].join(','));
  history.replaceState(null,'','#'+p.toString());
 }catch(e){ hashOK=false; }   /* sandboxed frame — stop trying */
}
document.getElementById('mo').value=month;
document.getElementById('mo2').value=month;
document.getElementById('molab').textContent = month===12?'any month':MONTHNAME[month];
document.getElementById('molab2').textContent = month===12?'any month':MONTHNAME[month];
document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',filters.has(x.dataset.f)));
(function(){ const c=CENTRE[region]||CENTRE.all; camLon=c[0]; camLat=c[1]; tgtLon=c[0]; tgtLat=c[1]; })();
try{ drawWorld(); }catch(e){ reportErr('drawWorld', e); }
try{ renderLegend(); }catch(e){ reportErr('renderLegend', e); }
try{ renderCmpBar(); }catch(e){ reportErr('renderCmpBar', e); }
try{ render(); }catch(e){ reportErr('render', e); }
