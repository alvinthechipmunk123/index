{n:'Dilijan & Aragats',crowd:1,crowdN:"You will not meet another walker.",club:"No hut system. Guesthouses and the Transcaucasian Trail Association, which builds and maintains the paths and is worth supporting even though it runs no beds.",rain:"Good. Yerevan is 90 minutes — the Matenadaran manuscript museum, the Cascade, a serious café culture. The monasteries themselves are better in rain: Haghartsin and Goshavank are wooded and atmospheric.",drink:"Armenian brandy is the famous export and deserves it. Areni wine from the world’s oldest known winery, six thousand years old. Tan, salted yoghurt, in the heat.",move:"Marshrutkas run Yerevan to Dilijan cheaply. A car helps for Aragats and the southern monasteries. Roads are decent.",kit:"Very little. This is the gentlest range on the list — trail shoes and a rain layer cover most of it. Cash outside Yerevan.",disc:{"lang": {"sc": 2, "s": "Armenian", "t": "⚠ Armenian has its own alphabet, distinct from Georgian and from anything else. Russian is universal among older people; English is common in Yerevan and Dilijan because of UWC and the tech sector. Signage in Dilijan is often trilingual.", "words": ["Բարև · barev, hello", "Շնորհակալություն · shnorhakalutyun, thank you", "Ջուր · jur, water"]}, "veg": {"sc": 5, "t": "Excellent, and again through fasting tradition plus a genuinely vegetable-heavy cuisine. Herbs by the fistful, lentils, bulgur, aubergine, and lavash with everything. Yerevan has a strong vegan scene.", "ask": "Բուսակերական · busakerakan — vegetarian; specify no dairy"}, "med": {"sc": 3, "t": "Yerevan has good private hospitals and is ninety minutes away. No mountain rescue as such, but Dilijan is forest walking at modest altitude and Aragats has a road most of the way up."}, "con": {"sc": 4, "t": "Good coverage, cheap data, easy eSIM. Cards work in Yerevan and Dilijan; villages are cash. Dram."}, "soc": {"sc": 4, "t": "Safe for visitors. ⚠ The regional political situation is genuinely complicated and worth checking current advice before booking — that is not scaremongering, just accurate."}, "hosp": "Warm and less performative than Georgia. Armenians are more reserved initially and very generous once past it. The diaspora connection means many people have relatives abroad and are curious about you.", "who": "Diaspora Armenians, Russians, Iranians on holiday, and a small European trickle. Dilijan has an international school which gives the town an unusual demographic."},cty:"Armenia",masc:"\u0540\u0578\u057e\u0561\u0566",mascEn:"the Caucasian leopard",mascL:"Fewer than ten in Armenia. Possibly the rarest large cat in the region.",season:[0, 0, 0, 1, 1, 2, 2, 2, 2, 2, 1, 0],best:"May\u2013June and Sept\u2013Oct",seasonN:"Lower and gentler than the rest, so the season is longer at both ends. Dilijan\u2019s beech turns through October.",lat:40.53,lon:44.2,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAECAwT/xAAWAQEBAQAAAAAAAAAAAAAAAAAAAQL/2gAMAwEAAhADEAAAAekCxiBiBiYhoAKAAARAQAUlSEMENDEDEFkhRIUSFEhUZxZreWiusGbEXCWLq6TgBDErKUsaQMQMVIimsFZQUrXK8NzWVmS29S5embLpSxj0uzHSkITEmCUwmpQt0YS6znhG2KleiIDXTmuzW8dDUgLMFW85ymk57kTsjDTRmVjDn25s3YyDfK8NSSJzrSUGjys0fO02rncdOnJrqaSLUokLeYaLMW1IW83CyrPFokXoy05tZvNzNNJlPNw2MTkkvTJ1uSby1nMu6zqqIZQixw4xRJ50hFdPOFhAKSA9QJQDoJCw0qQshBjTYAgSwKIDIkLUAf/EACMQAAIBBAMBAAIDAAAAAAAAAAABEQIQEjEgIUEwIkATMlD/2gAIAQEAAQUC/Vj/ADnVBl3PS74yT85JJJJJJJKmbt2PeTE5PHbZ0v0JIE0dEoqqu/xslJBU44wQQQQQQzExtoYojqFLeRIzFmLMRUIhmJikRaUjJGVJmjIbJF2YmIhVplVRQQmVFJKxykxZ2SZEsyP5DIk2O2NRiKk0PdLgkrqOql2m2IXb82Q4iHu0jkkm8Rwi7147VIkyJN2ekKqSfyzKWSTfo6MjIyJJJMjK02qcKo83ZD4eTAn8ZJJJRVeRzUf2NNu1Lgn4tk/Gbx8JJ4STaq03XN2Z4ekmjzy8W3dcfZ4e/wD/xAAZEQEAAwEBAAAAAAAAAAAAAAARAAEwIBD/2gAIAQMBAT8B3YxjHxyIQ6OTMhxW9b1v/8QAGREAAwEBAQAAAAAAAAAAAAAAAAEREDAg  fly:17,hop:'2 flights + 1.5 hr drive',acc:'Yerevan, then ninety minutes. The easiest transfer of the Caucasus options.',an:'leopard',
 col2:'Dilijan is called Armenian Switzerland and it is forest rather than rock — beech and oak, turning through October. Aragats above the treeline is bare and volcanic.',
 food:'Ancient and distinct. Lavash baked on the wall of a tonir oven is UNESCO-listed. Apricots, pomegranates, herbs by the fistful, and the best of it is what people cook at home.',

 v:'The gentlest of the Caucasus options and the easiest transfer. But the mountains are the weakest here — Dilijan is forest walking rather than alpine, and Aragats is a volcano rather than a range. Come for the monasteries, the food and Lake Sevan, not for a month of hiking.',

{n:"Tien Shan",crowd:2,crowdN:"Ala-Kul is the exception — a busy yurt camp in August. Everywhere else is silent.",club:"No association network. Yurt camps and guesthouses, arranged locally, mostly through Karakol operators. Mountain rescue is effectively absent — evacuation insurance is the substitute.",rain:"⚠ Thin. Karakol has a wooden Orthodox cathedral, a Dungan mosque and the Sunday animal market — genuinely worth a morning. Issyk-Kul beaches at Cholpon-Ata. Otherwise there is not much.",drink:"Kymyz, fermented mare’s milk, is an experience rather than a drink. Bozo, fermented millet. Vodka, inevitably, and Kyrgyz brandy which is better than it has any right to be.",move:"⚠ Shared taxis and marshrutkas between towns; a hired 4x4 for trailheads. No timetables that hold. Arrange transport through your guesthouse.",kit:"Water filter — essential. A four-season bag if camping; 3,500m freezes in August. Evacuation insurance is not optional here. Cash in som.",disc:{"lang": {"sc": 2, "s": "Cyrillic", "t": "Kyrgyz and Russian, both in Cyrillic. Russian is the working language and worth more than English here. English exists in Karakol’s CBT offices and among young guides. Trail marking is minimal — GPS essential.", "words": ["Салам · salam, hello", "Рахмат · rahmat, thank you", "Канча? · kancha, how much?"]}, "veg": {"sc": 1, "t": "⚠ The hardest on this list. Kyrgyz food is mutton, horse, noodles and dairy — the concept of not eating meat is genuinely unfamiliar in the jailoo. Karakol has Dungan and Uyghur places with vegetable options. In a yurt camp you will eat bread, jam, and whatever you brought.", "ask": "Этсиз, сүтсүз — без мяса, без молока"}, "med": {"sc": 2, "t": "⚠ Thin and expensive. Some organised rescue exists around Karakol but helicopter evacuation is privately arranged and costs thousands. Altitude sickness above 3,500 m is the common problem. Insurance covering high-altitude trekking and evacuation is mandatory, not advisable."}, "con": {"sc": 3, "t": "Surprisingly good 4G in Bishkek, Karakol and even some valleys — Kyrgyzstan leapfrogged into mobile data. Nothing on the passes. Cash economy outside the cities; som only."}, "soc": {"sc": 4, "t": "Genuinely safe and welcoming, and a well-established route for independent travellers including women alone. Bride kidnapping exists as a rural social problem but has no bearing on visitors. Bishkek taxi caution as anywhere."}, "hosp": "Nomadic hospitality is a real institution — a yurt will take you in, feed you and refuse payment. Kymyz will be offered and it is an acquired taste that you should acquire politely.", "who": "A serious independent trekking crowd — Poles, Czechs, Germans, Israelis, French, and increasing numbers of Americans. CBT community tourism has made it unusually easy to travel independently."},cty:"Kyrgyzstan",season:[0, 0, 0, 0, 0, 1, 2, 2, 2, 0, 0, 0],best:"July to early Sept",seasonN:"\u26a0 July and August are the safe default. Early September is excellent \u2014 clearer light, fewer people \u2014 but through the month yurt camps close and snow can shut a pass with no warning.",masc:"\u0418\u043b\u0431\u0438\u0440\u0441",mascEn:"the snow leopard",mascL:"Kyrgyzstan\u2019s national animal, on the flag of the capital. Perhaps four hundred left in the Tien Shan.",reg:"Karakol & Ala-Archa \u00b7 Kyrgyzstan",flag:"\ud83c\uddf0\ud83c\uddec",esp:1.2,day:45,mt:5,col:4,cf:2,nv:5,fly:20,hop:"2\u20133 flights",lat:42.49,lon:78.39,hi:7439,hin:"Jengish Chokusu",vert:1800,net:3,huts:2,tech:4,an:"snowleopard",music:"komuz",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAECAwT/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/9oADAMBAAIQAxAAAAHUHuMpWIo1lDAGCBhc1ls5fPZKKzy05dRyOgU5qhhI2IQdbigqKLcM0rGqtTmmzekZvQJNIlIwkkh0lKikyJkKRGpBQdTHU0  best mountains on this entire list by raw scale \u2014 Tien Shan runs to 7,439 m and the Karakol valleys hold glaciated peaks with almost no infrastructure and no permits. Ala-Kul at 3,500 m is one of the great treks anywhere. But it is a July-to-early-September range: by October the passes are closing and this becomes a road trip rather than a trek.",pro:["Cheapest per day of anywhere here", "7,000 m peaks, no permits", "Visa-free and genuinely welcoming"],con:["\u26a0 Wrong season for autumn", "20 hours door to door", "Rescue infrastructure is thin"],hikes:[["Ala-Kul & Altyn-Arashan", "3 days \u00b7 1,800 m", "Over a 3,900 m pass to a turquoise lake, then down to hot springs in a valley of wooden cabins. The signature Kyrgyz trek and it earns it."], ["Ala-Archa \u00b7 Ratsek hut", "12 km \u00b7 1,300 m \u00b7 7 h", "From an hour outside Bishkek up to a climbers\u2019 hut at 3,300 m under glaciated walls. The acclimatisation day everyone uses."], ["Jyrgalan valley", "2\u20134 days \u00b7 var", "A former coal village turned trekking hub, with community guesthouses and almost no other foreigners."], ["Traveller\u2019s Pass \u00b7 Lenin Peak", "14 km \u00b7 700 m \u00b7 6 h", "From Tulpar Kol at 3,500 m to a 4,150 m ridge facing the 7,134 m north wall. Red hills, green meadow, white peaks."]]},
{n:"Fann Mountains",crowd:1,crowdN:"A few guided groups in July. Otherwise shepherds.",club:"No huts and no association. The Artuch alplager is a Soviet-era base still operating privately. Everything else is a tent.",rain:"⚠ Almost none. Penjikent has Sogdian ruins and a small museum. Otherwise you are in a tent or an alplager, and the weather is usually fine anyway.",drink:"Green tea, constantly, from a piala. Vodka as the social lubricant, poured with more ceremony than you expect. Fresh apricot juice in season.",move:"⚠ Hired 4x4 from Penjikent or Dushanbe. There is no public transport to the trailheads. Arrange through an agency; roads are rough and long.",kit:"Water filter. Four-season bag — the lake basins freeze. A donkey and driver from Artuch, which costs little and changes the trip entirely. Cash in somoni.",disc:{"lang": {"sc": 1, "s": "Cyrillic", "t": "⚠ Tajik in Cyrillic, plus Uzbek in the north. Russian is essential — English is genuinely rare outside a handful of guides. No trail signage to speak of. This is the hardest linguistic environment here.", "words": ["Салом · salom, hello", "Раҳмат · rahmat, thank you", "Об · ob, water"]}, "veg": {"sc": 2, "t": "Difficult. Plov is lamb fat, qurutob has yoghurt. But bread, tomatoes, apricots and green tea are everywhere, and a guide can arrange vegetable food if told well in advance. Homestays will try hard once they understand.", "ask": "Бе гӯшт, бе шир — no meat, no dairy"}, "med": {"sc": 1, "t": "⚠ Essentially none. No mountain rescue, no helicopters available on demand, and Dushanbe hospitals are four hours from the trailheads on poor roads. Trekking with a guide is a safety decision here, not a luxury."}, "con": {"sc": 1, "t": "⚠ Almost nothing in the mountains. Patchy in Panjakent and Dushanbe. Pure cash economy — bring dollars and change them. Somoni."}, "soc": {"sc": 3, "t": "The Fanns themselves are safe and the people hospitable. Tajikistan is conservative; modest dress matters. Check current advice on the Tajik-Kyrgyz border area and GBAO, both of which have been closed at times."}, "hosp": "Persian-inflected and formal in a way the Turkic north is not — tea, ceremony, and real generosity in homes with very little.", "who": "A small hardcore — Russians, Poles, Czechs, and organised groups. You will meet almost nobody in September."},cty:"Tajikistan",season:[0, 0, 0, 0, 0, 2, 2, 2, 2, 0, 0, 0],best:"Late June or early Sept",seasonN:"\u26a0 The two ends of summer are the sweet spot: solid weather, thinner camps, lower prices. Autumn brings unpredictable storms and closed routes.",masc:"\u041c\u0430\u0440\u043a\u043e \u041f\u043e\u043b\u043e",mascEn:"the Marco Polo sheep",mascL:"Horns to 1.6 metres, the longest of any sheep alive. Named by the man who first described them.",reg:"Pamir-Alay \u00b7 Tajikistan",flag:"\ud83c\uddf9\ud83c\uddef",esp:1.0,day:40,mt:5,col:3,cf:2,nv:5,fly:21,hop:"2\u20133 flights + 4 hr drive",lat:39.2,lon:68.3,hi:5489,hin:"Chimtarga",vert:1600,net:3,huts:1,tech:4,an:"marcopolo",music:"shashmaqam",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAQIDAAQF/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAEC/9oADAMBAAIQAxAAAAGIKoroaOdNQ2kEvpXsBVwdHK5fjrPOxGyQlEuvKGWynQtc6hz1onO1FI44vNigfEnNnpc87Dfn1nfucRcyZZsyTQRwRrtE1pOzorzWmpWAhOdtYmGksK0tVlaJIyalYlS7c3QjqMVZdKZuywc1OfAEp01jdnL151zzrJFSpI58WdKnPNl0FSZICk6DBS7h4ebWVVvALU5xlQkheQ1Y3iKtqQxrEsmrum6C3mxMUUSfRBANqHXyuelppnVQSk0LVB0YOi5caMFc5ykgXNjtiqUyUUVgEYLhMVphsM4MdW5qL0mM4taJIYUES8jVkFmaITx0mttoZ7E22QbYUbURtFRsJTap22jshtLHp2BLaVhsY7S7bL//xAAiEAACAgEEAwEBAQAAAAAAAAAAAQIRIRASMUEDIjIgQhP/2gAIAQEAAQUCQyhS/CmJ3pw5cp0005SQ8nCEir1alUI7Yzo5H6l0OzcXrWkVbFqsoTLbLKOTN1Q+SBN0TzokPLZIpji0LjB2tfHLXDNqiMRIjhK7ZLi9PpbNxhHkdK8vl8xsWDoWJOvz0sNyVfyi0odRomvZpLSGYx5fq+vqTd6NmWbVXOiHJI7tSMDRRFD "21 hours door to door", "Camps get crowded in peak season"],hikes:[["Kulikalon & Alaudin lakes", "4 days \u00b7 1,400 m", "The classic circuit \u2014 two lake basins linked by a 3,860 m pass, under Chimtarga\u2019s walls. Camps can feel like villages in August and are empty in September."], ["Chimtarga pass", "2 days \u00b7 1,900 m", "Over the range\u2019s highest pass at 4,740 m. Scree, altitude, and a view over the whole Fann system."], ["Iskanderkul & the Fann Niagara", "8 km \u00b7 300 m \u00b7 3 h", "A lake named for Alexander the Great, with a 38 m waterfall below it. The easy day, reachable by road."], ["Seven Lakes of Marguzor", "2 days \u00b7 easy\u2013moderate", "A valley of seven lakes each a different colour, with homestays in the villages between them."]]},
{n:"Pamir Highway",crowd:1,crowdN:"Days between other travellers.",club:"None. Homestays run by the Pamir Eco-Cultural Tourism Association, which is a genuine community network and the right way to book. No rescue infrastructure.",rain:"⚠ None to speak of. This is high desert; the weather is the least of it. Khorog has a botanical garden at 2,320m and a good bazaar. Otherwise the road is the entertainment.",drink:"Shir chai — salted milk tea with butter, which you will grow to like. Tea otherwise. Alcohol is scarce and out of place in the Wakhan’s Ismaili villages.",move:"⚠ A hired 4x4 with a driver, for days. This is the trip. Shared jeeps exist but are unreliable and uncomfortable over that distance.",kit:"⚠ Everything, and spares. Diamox for the altitude. Water treatment. A four-season bag. Cash in small denominations — there are no ATMs past Khorog.",disc:{"lang": {"sc": 1, "s": "Cyrillic", "t": "⚠ Tajik and Russian, plus Pamiri languages — Shughni, Wakhi — which are unrelated to either. Russian is the only lingua franca. English is close to nonexistent. Every practical arrangement goes through a driver or a guide.", "words": ["Салом", "Раҳмат", "Роҳ кучост? · where is the road?"]}, "veg": {"sc": 2, "t": "Homestay food at 4,000 m is bread, yoghurt, apricots and shir chai — the salted butter tea. Vegetables are scarce because nothing grows up there. Bring supplements and expect a monotonous diet.", "ask": "Бе гӯшт, бе шир"}, "med": {"sc": 1, "t": "⚠ The worst on this list. No hospitals worth the name between Khorog and Osh, no rescue, no helicopters. Altitude sickness at 4,000+ m is the constant risk and the only treatment is descent — which can be a day of driving."}, "con": {"sc": 1, "t": "⚠ Effectively offline. Satellite messengers are used seriously here. Cash only, and bring more than you think."}, "soc": {"sc": 3, "t": "⚠ GBAO permits required and have been suspended during unrest; several governments advise against non-essential travel to parts of the region. The Pamiri people themselves are famously welcoming and the risk is political and logistical, not personal."}, "hosp": "Pamiri houses have five pillars and a skylight and a specific ritual of welcome. Ismaili culture is distinct from the Sunni lowlands — more open, more educated, and unusually warm to outsiders.", "who": "Overland cyclists, motorcyclists, 4x4 travellers, and almost no walkers. A particular kind of person, and they all know each other by Khorog."},cty:"Tajikistan",season:[0, 0, 0, 0, 0, 1, 2, 2, 2, 1, 0, 0],best:"July to Sept",seasonN:"\u26a0 The M41 is passable roughly June to October. Snow closes the high passes either side, and at 4,000 m the shoulder seasons are genuinely cold.",masc:"\u041c\u0430\u0440\u043a\u043e \u041f\u043e\u043b\u043e",mascEn:"the Marco Polo sheep",mascL:"Zorkul, on the Afghan border, is where they are. A permit and a long drive.",reg:"Wakhan & Bartang \u00b7 Tajikistan",flag:"\ud83c\uddf9\ud83c\uddef",esp:1.0,day:55,mt:5,col:2,cf:1,nv:5,fly:22,hop:"2\u20133 flights + days of 4x4",lat:37.5,lon:72.6,hi:7495,hin:"Ismoil Somoni",vert:1200,net:1,huts:1,tech:3,an:"marcopolo",music:"shashmaqam",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAECAwQF/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAEC/9oADAMBAAIQAxAAAAGRveZLZNOjI1UZmhWbZDdAhgnU06xVgqEimK6zsU6BmWHJtw9WdbOGlCoaAGmFTQ0gqUD1wDZLE3rFG0yykppoRZBHHGGmddVc9WVdMNeYrpWaTUxRssrK7CZRJGS05bOiMpOjPng9DA1Mp2lcDMMqjTFrXOK78Lzs6EsxmLrWc0dW/EjtwyR0a8UnbhzyVKDbXjI7Y5UtSIYiO/k9DCzBPSWU4NYIBk1vGbS2mMmKpAJChoFAUXDkBsQB6xrnc5c3TK6ZyonH0cDiK6a5Dq2OPqsI5+zM5qOmOfPqVcS6NJePX18LPPz9DOOKunnWTQPW5gudJBb88I6NAqtAM6BM+MF72Fc3KEaeqEZahYeWC8/UEehiFSAf/8QAIxAAAgICAgIDAQEBAAAAAAAAAQIAERASAyETICIwMTJBQv/aAAgBAQABBQL0EKypX2WPas3mpXvWKxWKlMIQcUZRmplGVAs1E0mkVrxf3g4/MX7WZc/1TYxU f hiking, it is the wrong answer.",pro:["One of the great road journeys on earth", "Wakhan corridor and the Hindu Kush", "Almost no other travellers"],con:["\u26a0 Permits and current advice must be checked", "Not a hiking trip \u2014 a driving one", "Altitude and no medical infrastructure"],hikes:[["Jizeu valley", "2 days \u00b7 600 m", "From the Bartang road into a village with no road, three hours\u2019 walk up. Homestays, apricot orchards, and total quiet."], ["Yamchun fort & Bibi Fatima springs", "5 km \u00b7 400 m \u00b7 2 h", "A 3rd-century BC fort above the Wakhan with the Hindu Kush opposite, and hot springs in a cave beside it."], ["Engels Peak viewpoint", "9 km \u00b7 500 m \u00b7 4 h", "Up from the Wakhan valley toward 6,510 m Karl Marx and Engels peaks. Short, high, and the border is the river below."], ["Zorkul & the Great Pamir", "var \u00b7 permit required", "Marco Polo sheep country on the Afghan border. Serious logistics, a permit, and almost nobody goes."]]},
{n:"Yunnan",crowd:3,crowdN:"Tiger Leaping Gorge is well walked; ⚠ Golden Week in October is a wall of people. Avoid it and it is fine.",club:"No association huts — the Tiger Leaping Gorge guesthouses are family businesses and among the best value in Asia. Book by phone or WeChat, or just turn up.",rain:"Good. Lijiang and Dali old towns are UNESCO-listed and pleasant in drizzle. Tea houses everywhere. The Naxi museum in Lijiang; Songzanlin monastery in Shangri-La, which is a small Potala.",drink:"Pu-erh tea, fermented and aged, from the province that invented it — this is the place to learn it properly. Yunnan coffee is now genuinely good. Baijiu if pressed.",move:"Excellent. High-speed rail and domestic flights between cities, buses to trailheads, and Didi works. ⚠ Google Maps does not — use Maps.me or Amap.",kit:"A VPN if you need western apps. Cash and WeChat Pay — cards are near-useless. Layers for 3,200m in Shangri-La. Nothing technical for the gorge.",reg:"Tiger Leaping Gorge & Shangri-La · China",flag:"🇨🇳",esp:1.8,day:60,mt:4,col:5,cf:3,nv:5,fly:20,hop:"2 flights + domestic",lat:27.2,lon:100.1,cty:"China",hi:5596,hin:"Jade Dragon Snow Mountain",vert:900,net:4,huts:3,tech:2,an:"leopard",music:"guqin",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAIDAQQF/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAEC/9oADAMBAAIQAxAAAAHzxSQ0ZU3AczUavOy3NsTlaZtY9Zzz6JHb0+P36l8CworRjIpRchLyARwAGgAYGboDJo9+fYs0XtbthU2etEZdU6L8fRrPc/Dp2bCynlW583CJElfLFHwzcBlNXDWF28QfHN6OW0WpGtC1iSn2Qpn5xOmcp1mLmKGhMMs0zDdXVbV0cNKGYUl0Rh8tA6JrUch0C1g9bPcJRaYDWJDhyjArDE9NNK6T00V53KT1ClOdyjFCTVckW0SHRxECmBrIIAktuqxa0TGyht+foOc3DLb1HO9mI3VA3lnZ6mwpKytyjRUMZAaGoaKFJgUcCfQBTANcCugMoBgC0ATQM4ABwI4CZgKgCf/EACEQAAICAgICAwEAAAAAAAAAAAABAhEQIRIxAyATIjBB/9oACAEBAAEFAvayxPHYh9Mi6JIoaPF Tiger Leaping Gorge is 22 km over two days between guesthouses, one of the deepest canyons on earth, and needs no guide or permit. Add Shangri-La at 3,200 m and Pudacuo, and it is a fortnight without repeating yourself.",pro:["Autumn is the best season, not a compromise", "No guide, no permit, well marked", "30 days visa-free for Canadians"],con:["Google Maps does not work — use Maps.me", "20 hours door to door", "Trail can be busy in October holiday week"],hikes:[["Tiger Leaping Gorge High Trail", "22 km · 2 days · 1,000 m", "Between Naxi villages on a track cut into the canyon wall, 2,000 m above the Jinsha river with Jade Dragon opposite. The 28 Bends is the hard hour. Guesthouses at Tea Horse, Half-way and Tina’s."], ["Haba Snow Mountain", "2 days · 1,800 m", "A 5,396 m non-technical summit across the gorge, with a base camp hut. The altitude day."], ["Pudacuo National Park", "12 km · 300 m · 4 h", "Boardwalks and meadow at 3,500 m near Shangri-La. Easy, and the autumn colour round Shudu lake is the reason to go."], ["Yubeng village trek", "3 days · 1,400 m", "Beyond Shangri-La under Kawagarbo, a 6,740 m peak that has never been climbed and is forbidden to climb. Sacred mountain, pilgrim route, and remote."]],disc:{"lang": {"sc": 3, "s": "Chinese characters", "t": "Mandarin, and no Latin alphabet — but the gorge and Lijiang are among the most English-friendly hiking areas in China, with bilingual menus and signage. Translation apps work well offline. ⚠ Google, WhatsApp and Gmail are blocked; you need a VPN installed before you arrive.", "words": ["你好 · nǐ hǎo, hello", "谢谢 · xiè xie, thank you", "多少钱 · duōshao qián, how much"]}, "veg": {"sc": 4, "t": "Good. Buddhist vegetarian tradition means 素食 sùshí is a recognised concept, Yunnan is vegetable-heavy, and mushrooms in autumn are extraordinary. Watch for lard and chicken stock in otherwise vegetable dishes.", "ask": "我吃素 · wǒ chī sù — I eat vegetarian; add 不要蛋奶 for no egg or dairy"}, "med": {"sc": 3, "t": "Better than most of Asia. China is building a national outdoor rescue platform and the popular parks have response teams. Lijiang has a decent hospital. Evacuation from the gorge itself is a horse and then a vehicle."}, "con": {"sc": 3, "t": "Excellent 4G everywhere, but ⚠ the Great Firewall blocks Google, WhatsApp, Instagram and Gmail — install a VPN before you fly. Payment is Alipay or WeChat Pay; both now accept foreign cards, and cash is increasingly refused."}, "soc": {"sc": 5, "t": "Extremely safe, including for a woman alone — street crime is close to nonexistent. The friction is bureaucratic and linguistic, not personal."}, "hosp": "Practical rather than effusive. Naxi and Tibetan guesthouse owners on the gorge are welcoming and used to foreigners; elsewhere curiosity is common and language is the barrier rather than reserve.", "who": "Chinese domestic hikers overwhelmingly, plus a steady international trickle on the gorge — it has been on the backpacker map since the 1990s."},masc:"雪豹",mascEn:"the snow leopard",mascL:"Yunnan has the golden monkey too — but the leopard is the one on the high ground."},
{n:"Sichuan",crowd:3,crowdN:"Yading is busy with domestic tourism; the high kora less so. ⚠ Golden Week again.",club:"No hut network. Siguniang requires a licensed local guide by regulation, and they arrange the tents. Yading has hotels at the trailhead only.",rain:"Strong. Chengdu is one of China’s great cities — pandas, tea houses, and the food. Closer: Kangding’s monasteries, the Tagong grasslands, and the hot springs at Rilong.",drink:"Sichuan tea houses are a whole institution — bamboo chairs, endless refills, cards. Butter tea in the Tibetan areas. Baijiu, which is an acquired taste and may stay unacquired.",move:"Good roads and domestic flights, but ⚠ Daocheng airport at 4,411m is the highest in the world and flying straight in is how people get sick. Come overland via Kangding.",kit:"⚠ Diamox and a real acclimatisation plan. Layers. Cash and WeChat Pay. A guide is mandatory for the Siguniang routes.",reg:"Siguniang & Yading · China",flag:"🇨🇳",esp:1.6,day:65,mt:5,col:5,cf:3,nv:5,fly:21,hop:"2 flights + 4 hr drive",lat:31.1,lon:102.9,cty:"China",hi:6250,hin:"Yaomeifeng · Siguniang",vert:1400,net:3,huts:2,tech:4,an:"leopard",music:"guqin",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAECAwQF/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAEC/9oADAMBAAIQAxAAAAE2h6y40ZznSGGmhErQXJaFZ3qQqTiMuhVhWqBhAmCYyRoBAhlAAAQMAYBLYlQIAGgAQxMYmAAkwQwaoEMJKgoiTaYZlsSaEhRnNbCcCWB0FSA8TU5qNzLYQwGsTVZMrLaSgYkw0jXImMug5tbRSdmE9mRnthznecUHdHH0C25oOsgpVNSlSjSJ5k7jio7suTGtpizo0rI2fJJ6PLwEdeOUFOKNHOkrIg69OKq7DmDUmTTHFWDRQIKcBVZqNYljloE2SxypijWc2u1SQp1ZiblZQG8oBABUANADCGgJAKAlGEqkAAR2C3YSoA//xAAkEAACAgEEAQUBAQAAAAAAAAAAAQIREgMQITFBEyAiMEAyUP/aAAgBAQABBQIxRSGiiijExMUUUYCgJbMxKEvqreivfX+xYnf60Pt9p3+dui+S6d2NGJ4syRnyudpSUSMpSlu5OMpORbYp+3IyJPhIfXgW1NCY3zTQv6tV8mUrWn h, birch and sea buckthorn turning gold and orange against 6,000 m snow peaks — a combination the Alps cannot offer because the peaks are not high enough. Yading, further south, adds turquoise lakes at 4,600 m under three sacred peaks. Peak is roughly 10–25 October.",food:"Sichuan, and it is as good as its reputation. Mala — numbing and hot — from the peppercorn. Hotpot in Chengdu, Tibetan food up high, and yak everything above 3,500 m.",eat:["Sichuan hotpot in Chengdu", "Mapo tofu, at its source", "Yak butter tea, above 3,500 m", "Dan dan noodles"],safe:"Safe. ⚠ The altitude is the real hazard — Yading sits above 4,000 m and Daocheng airport is 4,411 m, so flying in direct is genuinely dangerous without acclimatisation. Bus via Kangding with an overnight is the recommended approach.",v:"The strongest mountain landscape in China and one of the best autumn ranges on this entire list — 6,250 m granite spires called the eastward Alps, four hours from a major city. The catch is altitude: Yading is a 4,000 m kora and needs real acclimatisation. Local guides are required for Siguniang routes.",pro:["6,250 m peaks, four hours from Chengdu", "Sept–Oct is explicitly the best season", "Larch and 6,000 m snow in one frame"],con:["⚠ Serious altitude — acclimatise properly", "Guides required on Siguniang", "October holiday week is very busy"],hikes:[["Changping valley to Muluozi", "30 km · 2 days · 800 m", "Up the valley under Siguniang’s four peaks through larch and birch. Horses carry loads. The autumn colour day."], ["Yading kora · three sacred peaks", "35 km · 3 days · 4,000–4,700 m", "The pilgrim circuit round Chenrezig, Chana Dorje and Jampelyang, past Milk Lake and Five-Colour Lake. Altitude is the whole difficulty."], ["Dafeng · Siguniang", "2 days · 1,600 m", "A 5,025 m non-technical summit with a base camp. The accessible high peak, and a serious day."], ["Bipenggou traverse", "2 days · 1,000 m", "Over from Shuangqiao into a valley famous domestically for autumn colour and almost unvisited by foreigners."]],disc:{"lang": {"sc": 2, "s": "Chinese characters", "t": "⚠ Harder than Yunnan. Chengdu has English; the mountains largely do not, and Tibetan areas add a second language and script. A guide or a very good translation app is close to essential. Trail markers are in Chinese.", "words": ["你好 · nǐ hǎo", "谢谢 · xiè xie", "扎西德勒 · tashi delek, Tibetan hello"]}, "veg": {"sc": 4, "t": "Sichuan is excellent for vegetables and Buddhist vegetarian restaurants are common. Mapo tofu traditionally has pork — ask for 素 sù. Above 3,500 m the diet narrows to yak and tsampa.", "ask": "我吃素，不要肉不要蛋奶"}, "med": {"sc": 2, "t": "⚠ Thin at altitude. Clinics in Rilong and Daocheng, hospitals in Chengdu four hours or a flight away. Altitude sickness is the common emergency and oxygen is widely sold, which tells you something."}, "con": {"sc": 3, "t": "4G in the valleys, patchy above. VPN required for anything Google. Alipay and WeChat Pay everywhere; cash increasingly awkward."}, "soc": {"sc": 4, "t": "Very safe. ⚠ Tibetan-populated areas of Sichuan occasionally close to foreigners at short notice — check before committing to Yading specifically."}, "hosp": "Warm in the Tibetan villages and businesslike in Chengdu. Guesthouse owners at Rilong are used to climbers and helpful.", "who": "Chinese climbers and photographers, overwhelmingly. Siguniang is a national outdoor mecca and you will meet very few westerners."},masc:"雪豹",mascEn:"the snow leopard",mascL:"Sichuan is also giant panda country — Wolong reserve is on the road from Chengdu."},

cIMv8n8q/HSBobmov7ILdEI8sRcceoZ8MWg67hTZDbcKirdeIAK4GnnELFTDxUHydwQ3+bgy5cuX/B/LKOpj6huuZlCJGZrArhhpNE//9k=",imgt:"Kanas Lake",imgp:"https://en.wikipedia.org/wiki/Kanas_Lake",season:[0, 0, 0, 0, 0, 1, 2, 2, 2, 1, 0, 0],best:"Late Sept",seasonN:"A short, spectacular window. The birch forests round Kanas turn in the last two weeks of September and are famous throughout China for it. By mid-October snow closes the road.",acc:"Urumqi, then a domestic flight to Kanas or a long drive north. The most remote corner of China from anywhere.",col2:"<b>The most famous autumn colour in China, and it lasts about a fortnight.</b> Siberian birch and larch round Kanas lake turn gold and scarlet in late September against a turquoise glacial lake, with Tuvan and Kazakh villages of log houses among them. It is genuinely spectacular and it is genuinely brief.",food:"Kazakh and Tuvan rather than Chinese — mutton, horse, dairy, and the same nomadic tradition as across the border in Kyrgyzstan. Xinjiang lamb kebabs and hand-pulled laghman are the regional staples.",eat:["Xinjiang lamb kebab", "Laghman · hand-pulled noodles", "Nan bread from a tandoor", "Kumiss, if offered"],safe:"⚠ This is the caveat that matters. Xinjiang has pervasive surveillance, frequent checkpoints and identity checks, and the political situation is the subject of serious international concern. Personal safety is high; the experience of travelling there is not comparable to anywhere else on this list.",v:"The autumn colour is the best in China and among the best anywhere. But Xinjiang is not a normal destination — checkpoints, surveillance, permits that change, and a political context that many travellers will not want to participate in. Included because it is real and the colour is extraordinary; flagged because the caveat is not a detail.",pro:["The most famous autumn colour in China", "Tuvan and Kazakh villages, log houses", "Genuinely few foreign visitors"],con:["⚠ Xinjiang — surveillance and checkpoints", "A two-week colour window and then snow", "22 hours door to door"],hikes:[["Kanas lake to Hemu", "35 km · 2 days · 500 m", "Through birch forest between Tuvan villages, with the lake below. The walk everyone comes for and still quiet outside the peak fortnight."], ["Guanyu Pavilion & the three bays", "10 km · 300 m · 3 h", "The classic viewpoints over the lake’s bends. Boardwalked and busy at peak."], ["Baihaba village", "12 km · 400 m · 4 h", "A Tuvan village on the Kazakh border, log houses and hay meadows. Border permit needed."], ["Hemu river valley", "14 km · 300 m · 4 h", "Morning mist over the river with birch on both sides. The photograph everyone in China has seen."]],disc:{"lang": {"sc": 2, "s": "Chinese + Uyghur", "t": "⚠ Mandarin plus Uyghur and Kazakh. Very little English anywhere. Signage is Chinese and Uyghur. A guide is close to essential, and guides here are supervised.", "words": ["你好 · nǐ hǎo", "谢谢 · xiè xie", "Салам · Kazakh hello"]}, "veg": {"sc": 2, "t": "Hard. The regional cuisine is mutton and dairy. Chinese vegetarian dishes exist in Urumqi; in the Altai villages the answer is bread, tea and whatever vegetables are around.", "ask": "我吃素，不要肉"}, "med": {"sc": 2, "t": "Thin. Clinics in Burqin, hospital in Urumqi which is a flight away. No mountain rescue."}, "con": {"sc": 2, "t": "⚠ 4G exists but is monitored. VPNs are actively disrupted in Xinjiang specifically. Alipay and WeChat work."}, "soc": {"sc": 3, "t": "⚠ Personal safety is high and violent crime negligible. But expect repeated ID checks, vehicle stops and phone inspections. Several governments advise reconsidering travel to Xinjiang."}, "hosp": "Tuvan and Kazakh hospitality is real and warm in the villages. The wider atmosphere is not, and the two coexist uncomfortably.", "who": "Chinese domestic tourists in enormous numbers during the two-week colour peak, and almost no foreigners at all."},masc:"马鹿",mascEn:"the Altai wapiti",mascL:"Also the last Chinese habitat of the Eurasian beaver, on the Ulungur river."},
{n:"Khumbu",crowd:5,crowdN:"The busiest trail on this list — a procession in October. Gokyo and the passes cut it by half.",club:"No association — the teahouses are Sherpa family businesses and need no booking. The Himalayan Rescue Association runs the Pheriche aid post and gives free altitude talks, which are genuinely worth attending.",rain:"Thin, but the teahouses are social and there are bakeries. Namche has a Sherpa culture museum, a decent one, and the Saturday market. Tengboche monastery for a rest day.",drink:"Masala chai constantly. Chhaang, fermented millet beer, in the villages. Rakshi, distilled and fierce. ⚠ Alcohol at altitude is a bad idea and everyone tells you so.",move:"⚠ Flights to Lukla are weather-dependent and cancel for days. Build slack at both ends. Helicopters are the expensive alternative. No roads.",kit:"Down jacket, four-season bag, water treatment, Diamox. ⚠ Evacuation insurance covering helicopter rescue above 6,000m — non-negotiable. Cash; ATMs stop at Namche.",reg:"Everest & Gokyo · Nepal",flag:"🇳🇵",esp:1.5,day:55,mt:5,col:3,cf:3,nv:5,fly:24,hop:"2 flights + a flight to Lukla",lat:27.9,lon:86.85,cty:"Nepal",hi:8849,hin:"Everest",vert:800,net:5,huts:5,tech:3,an:"tahr",music:"sarangi",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAECAwQF/8QAFwEBAQEBAAAAAAAAAAAAAAAAAQACA//aAAwDAQACEAMQAAABrS56c9NeSx6DnY7c9pMqDWYfVjSuIHfHXTLyOq3iJtTpry2PS+RjvXPqOjisoBTItsnZSS50655dycapsqnnTXozsWyB0eF1pOD1nVzA7PBR0LDNumcCKGTRpOXN1Tcz3mptooJEz1x0YuaFRebaSsS2J1TRYbDdY3RnUMqlxRAPYvI7ctcqx3nbow1nq5L0zczp6FRVRLxikdMvDTceWtM6yt71U5TW6xVarO0g4SswM60JpOmYtn18011nHrG8PkrZRNb68inXp8xx6hyId8sBHKbNJRcTBUWTE1OdIYNXlSaVFNo80jlkJUmTRSYUXBWkDqaJoUSRSqtCQcLDOmwpIEqgF2DNAksESBACkBQwIyCkwpgSwB//xAAkEAACAgICAgICAwAAAAAAAAAAAQIREiEQI :"The most developed trekking infrastructure on earth — teahouses every hour, wifi, bakeries, and a rescue helicopter industry. That is either the appeal or the objection. The mountains are beyond anything else on this list and you will share them with several thousand people.",pro:["October is the best month of the year", "Teahouses every hour — no camping", "8,000 m peaks in your face"],con:["Busy in a way nothing else here is", "Lukla flight is weather-dependent", "Little autumn colour"],hikes:[["Everest Base Camp & Kala Patthar", "130 km · 12 days", "The classic. Kala Patthar at 5,644 m is the viewpoint — base camp itself sees nothing."], ["Gokyo Lakes & Renjo La", "120 km · 12 days", "Quieter, six turquoise lakes, and Gokyo Ri arguably beats Kala Patthar for the view."], ["Three Passes circuit", "160 km · 18 days", "Renjo La, Cho La and Kongma La. The serious version, and the one that loses the crowds."], ["Namche to Tengboche", "12 km · 700 m · 5 h", "The day-hike everyone remembers — a monastery at 3,867 m facing Ama Dablam."]],disc:{"lang": {"sc": 4, "s": "Devanagari", "t": "Nepali in Devanagari, but English is excellent throughout the trekking areas — lodge owners, guides and signage all handle it. The most English-friendly non-European place here.", "words": ["नमस्ते · namaste", "धन्यवाद · dhanyabad, thank you", "दाल भात · dal bhat"]}, "veg": {"sc": 5, "t": "Excellent. A large proportion of Nepalis are vegetarian, dal bhat is vegan by default, and every lodge menu has a vegetarian half. Above 4,000 m the vegetables get tired but the tradition is unambiguous.", "ask": "शाकाहारी · shakahari — vegetarian; add \"no dairy\" in English"}, "med": {"sc": 4, "t": "Unusually good for a remote range — HRA aid posts at Pheriche and Manang staffed by volunteer doctors in season, and a functioning helicopter evacuation industry. Expensive without insurance."}, "con": {"sc": 4, "t": "Wifi in most lodges, mobile data to base camp via Ncell. Cash is essential above Namche — the last ATM is there and it runs out."}, "soc": {"sc": 5, "t": "Very safe and thoroughly used to solo and female trekkers. Guide-mandatory rules have shifted recently — check the current position for the Khumbu."}, "hosp": "Sherpa hospitality is professionalised but genuine. Lodge families have been doing this for two generations and are good at it.", "who": "Everyone. Americans, Europeans, Indians, Chinese, Israelis, and an enormous Nepali guiding and portering workforce."},masc:"नाउर",mascEn:"the Himalayan tahr",mascL:"Also musk deer, snow leopards nobody sees, and Himalayan monal — the national bird, iridescent and absurd."},
{n:"Japan Alps",crowd:4,crowdN:"Kamikōchi is a crowd at the weekend, quiet midweek. Hut capacity caps the high trails.",club:"The huts are private or run by local authorities rather than a national club. The Japanese Alpine Club exists but does not lower prices. Huts are expensive, cash-only, and superb.",rain:"Excellent. Matsumoto castle is one of Japan’s finest, Takayama’s old town is beautifully preserved, and the onsen are better in bad weather. This is the best-provisioned wet day on the list.",drink:"Sake from Nagano, which is a serious brewing region — Masumi and Yorozuya are the names. Japanese whisky. Beer from a vending machine at the hut, chilled and improbable.",move:"Superb. Shinkansen to Matsumoto, buses to Kamikōchi — the valley is car-free by law. A JR pass pays for itself. No car needed at all.",kit:"Poles. Rain gear. A helmet for the Daikiretto. ⚠ Cash — mountain huts take nothing else, and they are expensive.",reg:"Kamikōchi & Hotaka · Japan",flag:"🇯🇵",esp:2.6,day:110,mt:4,col:5,cf:5,nv:4,fly:20,hop:"1–2 flights + train",lat:36.25,lon:137.63,cty:"Japan",hi:3190,hin:"Okuhotaka",vert:1400,net:5,huts:5,tech:3,an:"chamois",music:"gagaku",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAECAwT/xAAXAQEBAQEAAAAAAAAAAAAAAAABAAID/9oADAMBAAIQAxAAAAHA0zy1tz0ncuPSekmk0kTZz0msYz1SOE9TjkOidGJq6ypYZ1pGbxtSTFzYOQxNWq5dFadDhaNCSnMg7XhprPRnBo1MKrR4ur55mKUzVKoIa3rOsnLAqqlY3pUKqbIimqgQJpMpbw0mtcN0jPTDWRAgqRJqhluWQ9CkkoqNzSmVWk1VQaSMW2Jmk50jSJW+STbCtYzZBobdJOS0Uy1aY7JAwcdk0jHpzR3E1WHRE5t6UZ9GZFYa1pNUUTpGhBdZz0VPLPZKYTUUaY1NgF0U5wy2kaU1oYzW8w6uoTa5pQXNU1RozWipCREEC7zTXnSaBFduYc0kGmg0ZgaHYE7ClYQwJMw0JAgwKoDNEBuqQztAD//EACIQAAIBBAIDAQEBAAAAAAAAAAABEQIQEiEgMQMiQRMwMv/aAAgBAQABBQKyF5NUxVTUfMbQNWxY1BGuX+SR91VH0euSE2OoTtO+zGz7TJPWYRiiK ain hut food in Japan is a different category — proper meals, served on time, in huts that take reservations and run like ryokan. Down in Matsumoto: soba, basashi, and the best convenience-store food on earth for trail lunches.",eat:["Shinshu soba · buckwheat, the regional specialty", "Oyaki · stuffed dumplings", "Hut curry rice at 3,000 m", "Onsen after, non-negotiable"],safe:"Very safe. Trails are exceptionally well maintained and signed, huts are dense, and mountain rescue is competent. The Daikiretto traverse is the exception — genuinely exposed and chained.",v:"The Alpine formula applied by a country that does infrastructure better than anyone. Car-free valley, huts every few hours, onsen at the end, and autumn colour that the whole nation watches. It is the most expensive non-European option here and it is worth it.",pro:["Autumn colour is a national institution", "Hut network as good as the Alps", "Onsen"],con:["Most expensive outside western Europe", "Huts require reservations", "Peak colour weekends are very busy"],hikes:[["Kamikōchi to Karasawa", "16 km · 800 m · 7 h", "Up the Azusa into a glacial cirque that turns scarlet and gold in October. The colour walk."], ["Okuhotaka via Zaitengrat", "2 days · 1,600 m", "Japan’s third-highest at 3,190 m, chains on the final ridge, hut at the col."], ["Yari-ga-take", "2–3 days · 1,700 m", "The Japanese Matterhorn, a spear of rock at 3,180 m with a ladder to the summit."], ["Daikiretto traverse", "1 day · exposed", "Between Kita-Hotaka and Minami-dake — the most serious ridge in the Japanese Alps."]],disc:{"lang": {"sc": 3, "s": "Japanese", "t": "Three scripts and limited English outside the cities, but signage in Kamikōchi and on the main trails is bilingual and the systems are so well organised that language matters less than you would expect. Hut reservations often need Japanese or a booking site.", "words": ["こんにちは · konnichiwa", "ありがとう · arigatō", "山小屋 · yamagoya, mountain hut"]}, "veg": {"sc": 2, "t": "⚠ Harder than it looks. Dashi — bonito stock — is in almost everything including apparently vegetable dishes, and hut meals are fixed menus. Shōjin ryōri, Buddhist temple food, is fully vegan but not found in huts. Self-catering and konbini are the practical answer.", "ask": "ヴィーガンです。だしも魚も入っていないもの · vegan, no dashi or fish"}, "med": {"sc": 4, "t": "Good. Mountain rescue is prompt though sometimes charged, huts have radios, and Matsumoto has a major hospital. Japanese trail signage includes emergency numbering."}, "con": {"sc": 4, "t": "Coverage in the valley, patchy on ridges. Japan is still surprisingly cash-preferring in the mountains — huts often take nothing else. IC cards work in cities."}, "soc": {"sc": 5, "t": "Among the safest places on earth for anyone travelling in any configuration."}, "hosp": "Formal, precise and warm underneath. Hut wardens run a tight operation and expect you to fit into it — lights out at 20:00, breakfast at 05:00. Fitting in is appreciated.", "who": "Japanese hikers overwhelmingly, of every age — the 70-year-olds will pass you. A growing but still small international presence."},masc:"ニホンカモシカ",mascEn:"the Japanese serow",mascL:"A goat-antelope found nowhere else, and a designated national treasure. Also snow monkeys in the next valley."},
{n:"Cordillera Blanca",crowd:2,crowdN:"Santa Cruz has people; Huayhuash has few; the day walks from Huaraz are shared with a handful.",club:"The Casa de Guías in Huaraz is the guides association and the place to hire arrieros and check conditions. A few refugios are Italian-built and CAI-linked, so a CAI card does help there.",rain:"Thin. Huaraz has a small museum with pre-Inca stonework and the Chavín de Huántar ruins are two hours — a genuine highlight. Otherwise it is a café day.",drink:"Pisco sour, properly made. Chicha morada, purple corn, non-alcoholic and everywhere. Coca tea for the altitude, which actually helps.",move:"An eight-hour bus from Lima — take a good one, Cruz del Sur or Oltursa, overnight. Colectivos to trailheads from Huaraz. No car needed.",kit:"⚠ Acclimatise in Huaraz at 3,050m for three days before anything. Four-season bag. Water treatment. Arrieros and donkeys are cheap and worth it.",reg:"Huaraz · Peru",flag:"🇵🇪",esp:1.2,day:50,mt:5,col:1,cf:2,nv:5,fly:15,hop:"2 flights + 8 hr bus",lat:-9.12,lon:-77.61,cty:"Peru",hi:6768,hin:"Huascarán",vert:1200,net:4,huts:2,tech:4,an:"vulture",music:"huayno",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAECAwT/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/9oADAMBAAIQAxAAAAHNN9OcFISpCVISpCGAAMLF12Y3eVwKbRrm0ZtUca6MNZQFmo0iGCTBJglSVDBD0J7QxpgSzKqmk4M9Mq1z0k14e7jTIZvOqpIhoQwkpEjKQ6lO0rG5G4WV5gjYI0kUu6iXRPPpZzncHIqN85VokYSMEq1WOmpxuycyzNlTloalTKlTFNJHlrnV2VCKDk2qLFjZZmtVqZl3C2WWd1UIeWiHIEtydUySvSLRTaM9VQ5AskJRZitsKqZ0RE0qlyUSxoYldmBvJnTRWmVjEGhMmuFAFhz0Fk0ErkE0yBdMgKYDYFIJSQslgOwEAUgHQEgH/8QAJBAAAgEEAQUBAAMAAAAAAAAAAAECEBEhMRIgIjAyQUADE0L/2gAIAQEAAQUC/Ao3cYKFPlGQG+7+uLX4oxcnFcR5Y8C9dykx9sbENzV/wxjyfqq/CJHMpPK9I7gPzwjyElHobND3LCWIMtiAsR80Y8hLBsY9aFdiQ1ebyJd8iPr/ACOjXkSuRjZVeFoSp cooked in a ground oven.",eat:["Trucha · lake trout, everywhere", "Pachamanca · meat and potatoes cooked in earth", "Lomo saltado", "Chicha morada · purple corn drink"],safe:"Huaraz is safe with normal city sense. ⚠ Altitude is the issue — the town is at 3,050 m and passes go over 4,750 m. Acclimatise for three days minimum. Casa de Guías runs rescue but it is thin.",v:"The highest tropical mountain range on earth, and the density of 6,000 m peaks above Huaraz is unmatched outside the Himalaya. The Santa Cruz trek is the classic. But it is a May-to-September range and the wrong half of the calendar for an autumn trip.",pro:["Highest tropical range on earth", "Huaraz is a real base town", "Very cheap"],con:["⚠ Wrong season — Northern summer only", "Serious altitude from day one", "No autumn colour"],hikes:[["Santa Cruz trek", "50 km · 4 days · 4,750 m pass", "The classic Andean trek — Punta Unión pass with Alpamayo and Taulliraju either side."], ["Laguna 69", "14 km · 800 m · 6 h", "A day hike to an impossibly blue lake at 4,600 m under Chacraraju. The one everyone does."], ["Huayhuash circuit", "130 km · 10 days", "South of the Blanca and harder — the finest trek in South America by most accounts."], ["Laguna Churup", "8 km · 700 m · 5 h", "The acclimatisation day, with a cabled scramble at the top."]],disc:{"lang": {"sc": 3, "s": "Latin", "t": "Spanish, plus Quechua in the villages. English in Huaraz agencies and little else. Spanish is genuinely useful here in a way it is not in most of this list.", "words": ["Buenos días", "¿Cuánto cuesta?", "Allillanchu · Quechua hello"]}, "veg": {"sc": 3, "t": "Manageable. Potatoes, quinoa, beans and corn are the base of Andean food and there are hundreds of potato varieties. But meat is the centrepiece and lard is common. Huaraz has a few vegetarian places.", "ask": "Soy vegano — sin carne, sin queso, sin huevo"}, "med": {"sc": 2, "t": "⚠ Thin. Casa de Guías coordinates mountain rescue and is competent but under-resourced. Huaraz hospital handles altitude cases; anything serious means Lima."}, "con": {"sc": 3, "t": "Good in Huaraz, nothing on the treks. Cash economy — soles. Cards in town only."}, "soc": {"sc": 4, "t": "Safe with sensible precautions. Huaraz is a trekking town and used to foreigners. Bus travel at night is standard and fine on the good companies."}, "hosp": "Warm and unfussy. Andean hospitality is quieter than the Caucasus — practical rather than ceremonial.", "who": "A serious international trekking and climbing crowd — Israelis, Europeans, Americans, plus a large Peruvian guiding community."},masc:"cóndor",mascEn:"the Andean condor",mascL:"Three-metre wingspan over the puna. Also vizcacha — a rabbit-sized chinchilla relative that sunbathes on rocks."},
{n:"Patagonia",crowd:4,crowdN:"The W is a queue in January. The O and El Chaltén side valleys are much quieter.",club:"Chilean CONAF runs the Torres del Paine campsites; the rest are private concessions. In El Chaltén there are no huts at all — you camp or sleep in town. No reciprocal membership applies.",rain:"Reasonable. El Chaltén is small but has good breweries and a climbing culture. El Calafate has the Perito Moreno glacier, which is superb in any weather. Puerto Natales has decent museums.",drink:"Malbec, obviously, and it is cheap here. Calafate berry sour. Mate, shared, which is a social ritual before it is a drink. Patagonian craft beer in El Chaltén.",move:"Buses between towns are good and reliable. ⚠ A car helps for Torres del Paine logistics but the park runs shuttles. Distances are enormous.",kit:"⚠ Wind, not cold, is the enemy — a shell that survives 100km/h gusts. Tent pegs for wind, not rain. Poles. Layers for four seasons in a day.",reg:"El Chaltén & Torres del Paine · Argentina & Chile",flag:"🇦🇷",esp:2.2,day:95,mt:5,col:3,cf:4,nv:5,fly:20,hop:"2–3 flights",lat:-49.33,lon:-72.89,cty:"Argentina",hi:3405,hin:"Fitz Roy",vert:1100,net:5,huts:4,tech:3,an:"guanaco",music:"chacarera",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAEDAgQF/8QAFQEBAQAAAAAAAAAAAAAAAAAAAAH/2gAMAwEAAhADEAAAAZgCAOqmbxHa0QenUIdsSAAFrnJ2a0SQiFMBW06E+XqkSEwAENCALdnF1jFQ1OiOegzlpQCk2VWUblsOPHRE3qbNiCNJbEdgcWcaNudA7ODoK5hM6r+bo9B8dDltlF+rgZ3Z5ZnVjnyHXy9Bl14Dech09HH1RYA8rFVRlMYqi0sFczDZXJ182ekilkq4sY7EnrZPi9PZ579AOboYAEeWBSaQbwFHgHpIo1k3rCKpzHbmuXNgAhiBgAAIZHiV0qzpxLaxoxrTBddTz9dWDm1XZydW6GVRGhAAACGY0NpGgI86YVbAELAX6wAAQA2AkBgBGwoYS5YDAGAAEf/EACIQAAICAQQCAwEAAAAAAAAAAAABAhEhAxASMSBBEzAyIv/aAAgBAQABBQLw01/NZHlRwcf6cMeKVvoZ61BEcLte+n56P5362ROD3j  by it, and Torres del Paine has had serious wind incidents.",v:"El Chaltén is the purest version of your own formula anywhere on earth — every trail starts on the village street, no lifts, no permits. Torres del Paine is the opposite: bookings months ahead through three portals. Together they are the best trekking in the southern hemisphere, in the wrong half of the year.",pro:["Every trail from the village in El Chaltén", "Fitz Roy and the Torres", "Real towns with real food"],con:["⚠ Opposite season to Europe", "The wind cancels days", "Paine bookings open six months ahead"],hikes:[["Laguna de los Tres", "20 km · 750 m · 9 h", "Ten hours to a lake under Fitz Roy, the last kilometre a steep scramble. Go on the first clear morning, not the second."], ["Base las Torres", "18 km · 800 m · 8 h", "The three granite towers over a glacial lake. Sleep at Chileno and go up at dawn to have it alone."], ["Loma del Pliegue Tumbado", "22 km · 1,100 m · 8 h", "Fitz Roy, Cerro Torre and the ice cap from one summit, with a tenth of the traffic."], ["French Valley · the W", "24 km · 600 m · 9 h", "Into an amphitheatre of hanging glaciers with audible avalanches. The best day on the W."]],disc:{"lang": {"sc": 3, "s": "Latin", "t": "Spanish, with good English in El Chaltén and Puerto Natales because both live on trekking. Argentine Spanish is its own dialect — sh for ll, and vos for tú.", "words": ["Buen día", "Che · the all-purpose address", "¿Cuánto sale?"]}, "veg": {"sc": 3, "t": "Better than the beef reputation suggests. El Chaltén has a proper vegetarian restaurant and Argentine produce is excellent. But an asado is the social event and declining it is awkward.", "ask": "Soy vegano — sin carne, sin lácteos"}, "med": {"sc": 4, "t": "Good. Both parks have organised rescue, El Calafate and Puerto Natales have hospitals, and the trails are busy enough that help finds you."}, "con": {"sc": 3, "t": "⚠ Argentina limits ATM withdrawals to about USD 80 a day and machines are scarce. Bring dollars and change locally. Chile is easier. Signal in the villages, none in the parks."}, "soc": {"sc": 5, "t": "Very safe and thoroughly used to independent trekkers of every kind."}, "hosp": "Argentine warmth is loud and immediate; Chilean is more reserved. Both are easy. The mate gourd being passed to you is an inclusion, not an offer.", "who": "A genuinely international trekking crowd, heavy on Israelis, Europeans and North Americans, plus a big Argentine domestic contingent in January."},masc:"guanaco",mascEn:"the guanaco",mascL:"On every ridge in Torres del Paine, watching. Also the puma that hunts it — the densest population on earth is here."},
{n:"Southern Alps",crowd:3,crowdN:"The Great Walks are full by design — booking caps them. Off them, almost no one.",club:"The New Zealand Alpine Club owns several huts, and DOC runs the rest — over 950 of them. An NZAC membership or a DOC Backcountry Hut Pass pays back quickly on anything beyond the Great Walks.",rain:"Good. Te Anau and Queenstown have plenty. The Milford road is spectacular in rain — the waterfalls only exist when it is wet. Wanaka has Puzzling World and good cafés.",drink:"Central Otago Pinot Noir, world-class and made an hour from Wanaka. Marlborough Sauvignon. Craft beer everywhere; Emerson’s is the good one.",move:"⚠ A car is essential. Distances are long, buses are infrequent and expensive, and the trailheads are remote. Drive on the left.",kit:"⚠ Sandflies — repellent is not optional in Fiordland. Rain gear. A booking confirmation for every Great Walk hut, checked by wardens.",reg:"Aoraki & Fiordland · New Zealand",flag:"🇳🇿",esp:3.2,day:120,mt:5,col:3,cf:5,nv:5,fly:26,hop:"2–3 flights",lat:-43.59,lon:170.14,cty:"New Zealand",hi:3724,hin:"Aoraki / Mount Cook",vert:1300,net:5,huts:5,tech:4,an:"kea",music:"taonga",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGAABAQEBAQAAAAAAAAAAAAAAAAECAwT/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/9oADAMBAAIQAxAAAAGDrzAKIpIUAABQAAAAAAAAAQAFFJfRc6459eY8jedZiqAAAAiiKIolAACOczr23GM1OOa9DhtNs87OxdSKIoiiIivP6FKslbzbOOZd89bL182JfRidTyvV5zVmzjdda8q6DMT0TGDd48wyxrtvDU9GvL3st9GJeN9G48Garp6vF3PT5N+QsvqN6vjl9fm4Wxq8yb6cjHWeWWprKNC2XTpnHcz7PFk9evJuzFyrtwCxsnS8Y6cpaZ3THQiY1yzc27jOwrmOnMrqDYrnCyCroKIxSrgNwzc0zciNDUciID//xAAjEAACAgEEAgMBAQAAAAAAAAAAAQIREhAgITEDIhNAQTBg/9oACAEBAAEFAv8ADpNjiOLX2oxLbLiK2SVfYjZm2mljCSTlNyIyqP1r0jC4+RYqz8p0jEt33/BtLcuTFDikhJt4RRKSivl4bckIVxbyyGtLMmKRY3RmZobyae1z4k+bbfBKaSzHZCDmp14yMFX63k  0, 0, 0, 0, 1, 2, 2],best:"Dec to Mar",seasonN:"⚠ Southern hemisphere again. December to March. The Great Walks booking system opens in May for the following summer and the popular ones fill within minutes.",acc:"Auckland or Christchurch, then a long drive. The furthest thing on this list from anywhere.",col2:"⚠ Mostly evergreen beech and podocarp — little autumn colour, and their autumn is your spring. What there is: golden tussock on the tops year-round, and Central Otago poplars in April.",food:"Better than its old reputation. Lamb obviously, but also excellent seafood, whitebait in season, and a serious wine industry. Hut food is what you carried.",eat:["Green-lipped mussels", "Whitebait fritter, in season", "Hokey pokey ice cream", "Central Otago pinot noir"],safe:"Very safe. ⚠ The weather is the hazard — Fiordland gets seven metres of rain a year and rivers rise fast enough to strand people. DOC weather warnings are not decorative.",v:"World-class and a very long way away. The hut system is the best-run on earth, the Great Walks are booked to the minute, and the landscape moves from glacier to rainforest to fiord in a day. It is also expensive and in the opposite season.",pro:["Best-run hut system anywhere", "Glacier to fiord in one country", "Total safety and total organisation"],con:["⚠ 26 hours away and opposite season", "Most expensive on this list", "Great Walks book out in minutes"],hikes:[["Hooker Valley", "10 km · 100 m · 3 h", "Swing bridges to a glacial lake with Aoraki filling the head of the valley. Flat, and the best short walk in the country."], ["Routeburn Track", "32 km · 3 days", "Great Walk over the Harris Saddle between two national parks. Books out instantly."], ["Mueller Hut route", "10 km · 1,050 m · 8 h", "Straight up to a red hut at 1,800 m ringed by glaciers. Avalanche noise all night."], ["Gertrude Saddle", "7 km · 700 m · 5 h", "Unmarked, slabby, and the view down to Milford Sound is the finest in Fiordland."]],disc:{"lang": {"sc": 5, "s": "Latin", "t": "English, plus te reo Māori increasingly in official use and place names. Zero friction.", "words": ["Kia ora · hello", "Ka pai · good", "Tramping · what they call hiking"]}, "veg": {"sc": 4, "t": "Good. New Zealand cities are very vegan-friendly and supermarkets stock everything. In huts you cook what you carried, so it is entirely up to you.", "ask": "Just ask in English"}, "med": {"sc": 5, "t": "Excellent. DOC huts have radios, rescue is prompt and free, and ACC covers injury to visitors — a genuinely unusual arrangement."}, "con": {"sc": 4, "t": "Good in towns, none in the parks. Cards universal. Personal locator beacons are rented everywhere and widely used."}, "soc": {"sc": 5, "t": "Among the easiest and safest countries in the world to travel in."}, "hosp": "Casual and genuinely friendly, with a strong outdoors culture that assumes competence. Hut etiquette is real and unspoken.", "who": "New Zealanders, Australians, Germans and a long-stay working-holiday crowd. The Great Walks skew international; the backcountry skews local."},masc:"kea",mascEn:"the kea",mascL:"The world’s only alpine parrot, and it will dismantle your rucksack for entertainment. Genuinely intelligent and entirely without shame."},
{n:"Lofoten",crowd:3,crowdN:"Reinebringen is a staircase of people; the longer ridges are empty. September halves everything.",club:"DNT, the Norwegian Trekking Association, owns cabins across Norway, though few in Lofoten itself. DNT membership is still worth it for the rest of the country and includes reciprocal European rights.",rain:"Reasonable. Svolvær has the war museum and the Magic Ice bar; Å has the fishing village museum. Henningsvær is worth a wet afternoon. But the islands are small.",drink:"Aquavit, caraway-spiced and drunk with fish. Arctic beer from Svolvær’s Lofotpils. ⚠ Alcohol is state-controlled and eye-wateringly expensive — buy at the Vinmonopolet.",move:"⚠ A car, or you will see very little. Buses exist but are sparse. The E10 runs the length of the islands and is the drive itself.",kit:"Wind and rain gear that genuinely works. Boots with grip — the ridges are wet rock and slick. A head torch as nights lengthen through September.",reg:"Arctic Norway",flag:"🇳🇴",esp:3.8,day:140,mt:4,col:4,cf:4,nv:4,fly:17,hop:"2–3 flights",lat:68.2,lon:13.8,cty:"Norway",hi:1161,hin:"Higravstinden",vert:900,net:3,huts:2,tech:3,an:"eagle",music:"hardanger",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAECAwT/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/9oADAMBAAIQAxAAAAHEg1lXMy1LQVKOq+V2dWcBSSlpISryR0LErpMHZssytDINDMLIExTMbE0U2zEuSamx1DsZJFCAaY3IrFViVmpBSsQIACULnpiDVQLSSSiCrcaWCZUlGUFuXN0UrmrGNSicjQtQEIpi1SpQqRKIApVYwsTaxoTqJbzoUnTNEiUJlOYzrZZMZJqZlTjVEFluKTRZVNauc7nZZBuYC0kWUT0EGlZ1yvpac+zmVYdPNqAjUYgao46h2iFoVOkKri6qTQOca1kaB3AaXhpLtWe+NYGigmysJ2mzA0NSWHPTAgzCqAsnQKyAsALHqE1lIXIwp0EvVIc9aZBQgjnAj//EACIQAAIBBAMBAAMBAAAAAAAAAAABEQIQEiEgMEExAzJAQv/aAAgBAQABBQLMqYmZsc3WhVpkq2W8mZMyZLMmZGRPb7ZkkiPF0T0ST0r5/QuueS7JJ4z3T0SSSTwXGCCCCLaNW1/N n every form. Stockfish has been dried on racks here for a thousand years. Expensive, and the supermarkets are the practical answer.",eat:["Tørrfisk · air-dried cod, the thousand-year industry", "Skrei, if you are here in winter", "Cloudberries", "Brown cheese, which is not cheese"],safe:"Very safe. The hazards are weather, exposure on the ridges — several of the famous scrambles are genuinely serious — and the tide on the beaches.",v:"Mountains that rise straight out of the Arctic sea, at 1,000 m rather than 3,000 but steeper than the numbers suggest. September gives you autumn colour on the ground and northern lights overhead in the same week. It is also Norway, so bring money.",pro:["Aurora and autumn colour in the same week", "Mountains straight out of the sea", "September is genuinely the right month"],con:["Expensive — the most in Europe", "Weather can shut everything for days", "Ridges are more serious than the altitude suggests"],hikes:[["Reinebringen", "2 km · 450 m · 2 h", "1,900 stone steps built by Sherpas to the most photographed view in Norway. Short, brutal, worth it."], ["Ryten & Kvalvika", "10 km · 400 m · 4 h", "Over to a beach reachable only on foot, with a clifftop view straight down to it."], ["Munken", "12 km · 800 m · 6 h", "A long ridge walk above Reine with the whole archipelago below."], ["Himmeltindan", "13 km · 960 m · 7 h", "The highest on Vestvågøy, and quieter than anything near Reine."]],disc:{"lang": {"sc": 5, "s": "Latin", "t": "Norwegian, and English is effectively universal and excellent. No friction at all.", "words": ["Hei · hello", "Takk · thanks", "Fjell · mountain"]}, "veg": {"sc": 4, "t": "Fine. Norwegian supermarkets stock plenty and Svolvær has options. Restaurant food is fish-centric and very expensive, so self-catering is the answer for other reasons anyway.", "ask": "Just ask in English"}, "med": {"sc": 5, "t": "Excellent. Norwegian rescue is superb and free, and Red Cross volunteers cover the islands."}, "con": {"sc": {n:"High Atlas",crowd:3,crowdN:"Toubkal is busy year-round. Aït Bougmez sees a few groups a week.",club:"The CAF refuge at Toubkal is French Alpine Club, so a CAF or reciprocal card cuts the fee. Everything else is a village gîte arranged through Imlil.",rain:"Excellent. Marrakech is 90 minutes — souks, riads, the Majorelle garden, and the food. Genuinely one of the best bad-weather cities anywhere.",drink:"Mint tea, poured from height, endlessly, and refusing is not really an option. ⚠ Alcohol is limited outside tourist hotels. Fresh orange juice on every corner.",move:"Grand taxis from Marrakech to Imlil, cheap and frequent. A hired car and driver for Aït Bougmez. Mules carry everything above the villages.",kit:"Layers — 4,167m is cold even in October. ⚠ Crampons in winter. A guide is mandatory for Toubkal. Cash in dirham; small notes for the mules.",reg:"Toubkal & Aït Bougmez · Morocco",flag:"🇲🇦",esp:1.0,day:45,mt:4,col:2,cf:3,nv:5,fly:13,hop:"1–2 flights + 1.5 hr drive",lat:31.06,lon:-7.92,cty:"Morocco",hi:4167,hin:"Toubkal",vert:1400,net:3,huts:3,tech:3,an:"ibex",music:"gnawa",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAECAwQF/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//aAAwDAQACEAMQAAABts7c0MJLCHcQEBaopMBFBJQSUElAiiJLCSgkoEUpUVILHCXbJxmgM2MlXbXDtZ0E3YhghkJiGSlshlOGUSGE4LN305NZciszbOmSUiGUIpkdPOWdb56NVnkdE40bPmDoIKsmoBBx0TLQwTpE7ZMcVAawyqiSpcjBGkVJaVkiZlVTY9sGdJiFc23PLWuTOnJ2ZTriUjUgvc5V08QEgxBRNC0dEBmaGWotZkzEG8UhKQro5rNRdBx338JUYI0mWCsCekOW9LJ315Dbj6tjl26czzbWhqIOZADAVgZ7AFAdHOAtQBARIHXIG3IBh1AYyBpkAgD/xAAlEAABAwQCAQUBAQAAAAAAAAABAAIREBIhMQNBIBMiMkBCMDP/2gAIAQEAAQUC/rj65IV4QePs6RJNYTXIciBB+oSi9SseO0xxafUyHA+cq5XKVcrlKkIvMTCBJLgGp+SE3YWgu6FQU100lSpUq7+Ye4CgODs0FOyCoNA4wHIkBTmaFXIGUTCBmo8DigX5/NOhhTVpIpsKaxXSDppKnw6QK67psaU4W ent mountain range to Europe — three hours from London, 4,167 m, Berber villages of mud-brick, and a mule-supported trekking tradition. October works properly. It is not an autumn-colour trip but it is a very good autumn trip.",pro:["Closest exotic option — 13 h door to door", "October is a proper season", "Very cheap, mule-supported"],con:["Little autumn colour", "Guide mandatory on Toubkal", "Post-earthquake rebuilding in places"],hikes:[["Toubkal summit", "22 km · 2 days · 1,700 m", "North Africa’s highest at 4,167 m, from a refuge at 3,207 m. Non-technical in autumn, a long scree slog."], ["Aït Bougmez valley circuit", "3–5 days · mule supported", "The happy valley — terraced fields, mud-brick villages, gîtes. The cultural trek rather than the summit one."], ["Imlil to Tacheddirt", "14 km · 900 m · 6 h", "Over the Tizi n’Tamatert between villages. The day walk that shows you the range."], ["M’Goun traverse", "6 days · 4,071 m", "The second-highest and far quieter than Toubkal, through gorges and high plateau."]],disc:{"lang": {"sc": 3, "s": "Arabic + Tifinagh", "t": "Arabic and Tamazight — the Berber language, written in Tifinagh script on signage. French is the practical second language and gets you everywhere. English in Marrakech and among guides.", "words": ["السلام عليكم · salam alaikum", "شكرا · shukran", "Azul · hello in Tamazight"]}, "veg": {"sc": 4, "t": "Good. Vegetable tagine is a standard dish, bread and olive oil are everywhere, and Moroccan cooking uses vegetables seriously. Watch for meat stock. Gîtes will adapt if told when booking.", "ask": "Sans viande et sans produits laitiers, s’il vous plaît"}, "med": {"sc": 2, "t": "⚠ Thin in the mountains. A clinic in Imlil, hospitals in Marrakech ninety minutes away. Mule evacuation is the realistic first stage. No helicopter service to speak of."}, "con": {"sc": 3, "t": "Signal in the valleys, none high. Cash economy in the mountains — dirhams. Cards in Marrakech only."}, "soc": {"sc": 4, "t": "Safe. Morocco is conservative — modest dress in villages matters, and a woman travelling will get more attention in Marrakech than in the mountains, where it is markedly easier."}, "hosp": "Berber hospitality is a formal institution — tea will be poured three times and you drink all three. Guides and muleteers are often from the villages you walk through.", "who": "French and Spanish overwhelmingly, plus British and a growing Moroccan domestic hiking scene. Toubkal is busy; everywhere else is not."},masc:"أروي",mascEn:"the Barbary sheep",mascL:"Aoudad, the only wild sheep in Africa, and increasingly rare. Also Barbary macaques in the cedar forests further north."},
{n:"Canadian Rockies",crowd:4,crowdN:"Lake Louise and Moraine are managed crowds. Twenty minutes up any trail it drops away.",club:"The Alpine Club of Canada owns a superb backcountry hut network — Abbot Pass, Bow, Elizabeth Parker. Membership is required to book at member rates and the huts are the best way to see the range.",rain:"Excellent. Banff has the Whyte Museum and the Cave and Basin hot springs; Jasper has the Skytram. Calgary is 90 minutes. Lake Louise in cloud is arguably better than in sun.",drink:"Alberta craft beer is now serious — Banff Ave Brewing, Jasper Brewing. Canadian rye whisky. Icewine from Ontario if you want the local curiosity.",move:"⚠ A car, and book it early — September rates are brutal. Roam buses cover Banff and Lake Louise, and Moraine Lake is shuttle-only now. Icefields Parkway is the drive.",kit:"⚠ Bear spray on the hip, not in the pack, and know how to use it. Layers; September snows above 2,500m. A park pass on the windscreen.",reg:"Banff & Jasper · Canada",flag:"🇨🇦",esp:3.4,day:130,mt:5,col:5,cf:5,nv:3,fly:8,hop:"1–2 flights + drive",lat:51.42,lon:-116.18,cty:"Canada",hi:3954,hin:"Mount Robson",vert:1200,net:5,huts:3,tech:3,an:"bear",music:"fiddle",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAECAwQF/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//aAAwDAQACEAMQAAAB204Z3npvnmz0jLGOs5eoQkUMJCiK15ZSsdNZoqEb5tF1ChDBDBAV52N5rvjLL0zsrXk6I3WAdGvPcvRWNZpx746gCs2mUXWN1dZ1FS5C5zO05yPN25rtU9vGldHLoqSE005xerfz+qOlZRLeIWXDitXz7WNRZrry2a5ZqLMozaJMXJN9JedhFEmkgIaH08wPedqxO/TN8telykXOCd2XIRo8zNuEFKVLZAk1nXSWT0GU90y8hcANAOS7yZVZGa0szQmgJY0kUmE6JjEGDTsq52px05xiOSaas0M0a6c+ksKrlxezTnfSHIdbs5DsRzT1hz1tcvOdIecw3GBY5AAFAAYBoB18IYsADYCYABY6Cx2FyAJ//8QAIxAAAgICAQQDAQEAAAAAAAAAAAECERIhEAMTIDEiMEFAMv/aAAgBAQABBQKrf+XOak+lK/s on this entire list for you to reach — eight hours door to door — and among the best. September larch, turquoise lakes, and an enormous trail network. The objections are cost, crowds at the famous spots, and that it is the least foreign option here.",pro:["Eight hours door to door", "September larch is world-class", "Trail network is vast"],con:["Expensive inside the parks", "Moraine Lake access is now shuttle-only", "Bears require actual precautions"],hikes:[["Larch Valley & Sentinel Pass", "12 km · 725 m · 5 h", "The larch walk. Shuttle to Moraine Lake, then up into a valley of gold with the Ten Peaks above."], ["Skyline Trail", "44 km · 3 days · Jasper", "Most of it above the treeline — the finest multi-day in the Canadian Rockies."], ["Plain of Six Glaciers", "15 km · 400 m · 5 h", "From Lake Louise to a teahouse under the Victoria glacier, with icefall noise all afternoon."], ["Iceline Trail · Yoho", "20 km · 700 m · 7 h", "Along the edge of the Emerald Glacier with Takakkaw Falls opposite."]],disc:{"lang": {"sc": 5, "s": "Latin", "t": "English. None.", "words": ["—", "—", "—"]}, "veg": {"sc": 4, "t": "Easy. Canmore and Banff have plenty of options and supermarkets stock everything you would want.", "ask": "Just ask"}, "med": {"sc": 5, "t": "Excellent. Parks Canada rescue, helicopters, hospitals in Banff and Canmore. ⚠ As a Canadian you are covered; check your provincial coverage if you have been out of country."}, "con": {"sc": 4, "t": "Good in the townsites, patchy in the backcountry. Cards universal."}, "soc": {"sc": 5, "t": "Entirely straightforward."}, "hosp": "Friendly and outdoorsy. The parks are staffed by seasonal workers from everywhere and the atmosphere is casual.", "who": "Canadians, Americans, and enormous numbers of international visitors at the famous lakes. The backcountry thins out fast."},masc:"grizzly",mascEn:"the grizzly bear",mascL:"Bear spray on your hip, not in your pack. Also elk in rut in September, which are more dangerous than most p {n:"High Sierra",crowd:3,crowdN:"Permits cap the numbers — busy at trailheads, thin above. Half Dome is a queue.",club:"No hut system at all — this is a tent-and-permit range. The Sierra Club is a conservation organisation, not a hut network. The Muir hut on the JMT is an emergency shelter only.",rain:"Thin — it rarely rains. Bishop has the Mountain Light gallery and superb bakeries. Mammoth has hot springs. ⚠ The real bad-weather risk here is wildfire smoke, and nothing indoors fixes that.",drink:"California wine, obviously. Mammoth Brewing and Bishop’s Mountain Rambler are both good. ⚠ Water is the real drink — you carry and filter a lot of it.",move:"⚠ A car, absolutely. Highway 395 is the spine and there is no alternative. ⚠ Tioga Pass closes with the first serious snow, often in October.",kit:"⚠ Bear canister is legally required, not advisory. Water filter. Permit printed. Layers for 4,000m nights. No huts — everything on your back.",reg:"Yosemite & the John Muir Trail · USA",flag:"🇺🇸",esp:3.6,day:110,mt:5,col:3,cf:4,nv:3,fly:10,hop:"2 flights + drive",lat:37.73,lon:-119.57,cty:"United States of America",hi:4421,hin:"Mount Whitney",vert:1300,net:5,huts:1,tech:3,an:"bear",music:"bluegrass",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAIDBAEF/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAEC/9oADAMBAAIQAxAAAAHztGb0rKUVrA6A3AbnewnHKXoHADg3BTpZw6HAF6HIXmHubwUlfZF94q0qDnEWneMHedjpzq8WHRo0maGzarFOgo3DnO8oVs8Z1pTGs5qAJ21J6M7JojWSpsx6CwCE+zXnGWURuIt4pW/iMA3EUblJO+GKYxM6oRDR2a2dvNqu86Qh3luzNNpB58W6q4nWURNcRLTcoZaDy7mNax5EhiJlCs73LJaIUW6IGtZ5TU+ZyqvMGWgHAZ4BRVzltuTTEOURZHOyQk9azmsF2Zt9mJtsVyasimpsWlM2vRjXdPCgdbcYuPUzc9DAhLdOWsdUDs+WIptWMlo8NRhK0UA2dCsGYB5gmhAK9CVdQVj2APAIdQHiEcQKzMER4BQCv//EACUQAAICAgICAgMAAwAAAAAAAAECABEDIRIxECIgMBMyQUBCQ//aAAg N-Out on the drive", "Trail: whatever fits the bear canister", "Sierra Nevada, the beer, from Chico"],safe:"Safe. ⚠ Bear canisters are mandatory and enforced. Wildfire smoke in September is an increasingly real problem that can ruin a week. Permits are competitive and rangers check them.",v:"The finest granite in the world and a trail network that runs 340 km without leaving the high country. September is the right month. The frustration is entirely bureaucratic — the wilderness permit lottery is genuinely difficult and plans have to be made months ahead.",pro:["The best granite anywhere", "September–October is the right window", "Aspen colour in the eastern Sierra"],con:["⚠ Permit lottery is brutal", "Wildfire smoke is a real risk in Sept", "No hut system — you carry everything"],hikes:[["Yosemite Valley to Half Dome", "26 km · 1,460 m · 12 h", "Cables up the last 120 m. Permit-only and worth the lottery."], ["Mount Whitney", "35 km · 1,900 m · 14 h", "The highest in the lower 48 at 4,421 m. Day-hikeable and brutal; permit-only."], ["Rae Lakes Loop", "66 km · 5 days", "A loop over Glen Pass in Kings Canyon — the best circuit in the range."], ["Lundy Canyon", "12 km · 400 m · 4 h", "The eastern Sierra aspen walk in October. Short, and the colour is the point."]],disc:{"lang": {"sc": 5, "s": "Latin", "t": "English.", "words": ["—", "—", "—"]}, "veg": {"sc": 5, "t": "Easy. California. Bishop and Mammoth both have options and every supermarket is well stocked.", "ask": "Just ask"}, "med": {"sc": 4, "t": "Good but expensive. SAR is competent and free; the hospital afterwards is not. Travel insurance matters here more than in Europe."}, "con": {"sc": 3, "t": "Signal in the towns, none in the wilderness. Inreach or similar is standard. Cards everywhere."}, "soc": {"sc": 5, "t": "Straightforward."}, "hosp": "The trail culture is strong and friendly — JMT and PCT hikers are a community. Town culture in Bishop and Lone Pine is unfussy.", "who": "Americans overwhelmingly, plus a strong international contingent on the JMT. Thru-hikers coming off the PCT in September."},masc:"black bear",mascEn:"the black bear",mascL:"Yosemite bears are expert at food theft and the canisters exist for a reason. Also marmots that will chew through a pack for the salt."},
{n:"Cascades",crowd:3,crowdN:"Paradise and the Enchantments are rationed; the Wonderland is steady but never crowded.",club:"No association huts. The Mountaineers, based in Seattle, run courses and a lodge, and their guidebooks are the standard reference. Camping and permits otherwise.",rain:"Good. Seattle is two hours, Leavenworth is a Bavarian-themed oddity that works, and Paradise has a proper visitor centre. Portland for the Oregon side.",drink:"The best beer scene on this list — Seattle and Portland invented much of American craft brewing. Washington wine from Walla Walla. Coffee, seriously good, everywhere.",move:"⚠ A car. The park is large, the trailheads are scattered, and public transport is minimal. Chains may be required late in the season.",kit:"Rain gear that works — this is the wettest range in the US. ⚠ Permits printed for Wonderland and Enchantments. Bear canister for Wonderland. Poles.",reg:"Rainier & North Cascades · USA",flag:"🇺🇸",esp:3.4,day:105,mt:5,col:4,cf:4,nv:4,fly:10,hop:"2 flights + drive",lat:46.85,lon:-121.76,cty:"United States of America",hi:4392,hin:"Mount Rainier",vert:1400,net:4,huts:1,tech:4,an:"bear",music:"bluegrass",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQABAAMBAQAAAAAAAAAAAAAAAAECAwQF/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//aAAwDAQACEAMQAAAB70khIiRQAAAAAAAAAASEgFACAAAAUEAACgAAAAlCAAoIAGdaM7rIQAAAAACEJZQJQWUCUUS3PzU3no0wqvREZZ10zzD0Z4dk6FZiUCUCUCUCiq2yESrlW+XLnc9PNF7mmslmvRlLWa9JTPQc+9qlduex3Oe8urKsbohbKjJ58b59ufNJZVW0ZybVwua5xU305Lx025YOu3Jc35Q1rzydeOVi85TW+3Aj0HnlwkuUhEgqE6hlIWBMBEhASshIW0BeBMxX/8QAJBAAAgICAQMEAwAAAAAAAAAAAAECERIhMQMQEyAiMEBBQnD/2gAIAQEAAQUC/j2QpFr7EpKI+qKdljkz9pSaIT+rKSipSyZxFOnKQzLaZeLXUQnf0H1IofVG7ZFKRhZw3zuJgrx1wRVx3CS6nyWPqolJy7MWNysg2h6MbFzROxaTftXDsjTEqMjJHkj6L7OaR5GN2K32sXtaUB4MTJNUk
