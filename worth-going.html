<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where is Sophia?</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Worth going">
<meta name="theme-color" content="#2B2118">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Courier+Prime:wght@400;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B2118; --paper:#EFE6D5; --card:#FBF6EA; --stamp:#B8322B; --blue:#2C5C8A;
  --green:#3E7A4A; --gold:#E0A125; --violet:#6B4A7A; --grey:#8A8072; --teal:#2E8B8B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:15px;line-height:1.5;
  background-image:repeating-linear-gradient(45deg,rgba(43,33,24,.018) 0 2px,transparent 2px 5px)}
.wrap{max-width:1080px;margin:0 auto;padding:0 13px 80px}

header{position:relative;overflow:hidden;border-bottom:5px solid var(--ink);background:#8ECBE8}
#hero{display:block;width:100%;height:clamp(132px,18vh,190px)}
.hd{position:absolute;left:0;right:0;top:0;max-width:1080px;margin:0 auto;padding:9px 14px;z-index:3;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-family:'Bungee',cursive;font-size:clamp(21px,5vw,32px);line-height:1;letter-spacing:-.01em;
  color:#FFF;text-shadow:3px 3px 0 var(--ink),0 0 22px rgba(43,33,24,.35)}
h1 em{font-style:normal;color:#FFD84D}
.hsub{font-family:'Courier Prime',monospace;font-size:10.5px;font-weight:700;letter-spacing:.05em;margin-top:6px;
  color:#FFF;text-shadow:1.5px 1.5px 0 var(--ink);line-height:1.5}
.hsub b{color:#FFD84D}

/* the chart */
.mapbox{border:3px solid var(--ink);border-radius:4px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);margin:14px 0;background:#295270}
.mapbox.orb{background:#0E1420}
#worldmap{display:block;width:100%;height:min(66vh,600px);background:#2E5A78;transition:background .3s;touch-action:none;cursor:grab}
@media(max-width:520px){#worldmap{height:min(62vh,520px)}}
#worldmap.orb{background:#0E1420;cursor:grab;touch-action:none;height:auto;aspect-ratio:1290/1180;max-height:52vh}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(var(--amp))}}
.swell{animation:drift linear infinite}
.sw0{animation-duration:23s}.sw1{animation-duration:31s;animation-direction:reverse}
.sw2{animation-duration:41s}.sw3{animation-duration:53s;animation-direction:reverse}
.sw4{animation-duration:29s}.sw5{animation-duration:47s;animation-direction:reverse}
.sw6{animation-duration:37s}
@media(prefers-reduced-motion:reduce){.swell{animation:none}}
@keyframes twk{0%,100%{opacity:var(--o)}50%{opacity:calc(var(--o) * 0.22)}}
@keyframes twk2{0%,100%{opacity:var(--o)}42%{opacity:calc(var(--o) * 1.9)}70%{opacity:calc(var(--o) * 0.35)}}
.tw1{animation:twk 3.4s ease-in-out infinite}
.tw2{animation:twk2 5.1s ease-in-out infinite}
.tw3{animation:twk 7.2s ease-in-out infinite}
@keyframes lockpulse{0%{transform:scale(.55);opacity:0}45%{opacity:1}100%{transform:scale(1.25);opacity:.35}}
.lock{animation:lockpulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sunpulse{0%,100%{opacity:.20}50%{opacity:.34}}
.sunglow{animation:sunpulse 6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.tw1,.tw2,.tw3,.sunglow,.lock{animation:none}}
#worldmap.orb:active{cursor:grabbing}
.maplg{background:var(--card);border-top:3px solid var(--ink);padding:9px 11px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.rg{font-family:'Courier Prime',monospace;font-size:11px;font-weight:700;padding:4px 10px;border:2px solid var(--ink);
  border-radius:2px;background:#FFF;cursor:pointer;color:var(--ink)}
.rg.on{background:var(--gold)}
.zbtn{font-family:'Bungee',cursive;font-size:14px;padding:2px 11px;min-width:34px}
.dicebtn{font-size:15px;padding:3px 10px;line-height:1.2;border-color:var(--stamp)}
.backbtn{border-color:var(--blue);color:var(--blue)}
.homebtn{border-color:var(--green);color:var(--green)}
.fsbtn{border-color:var(--ink);font-size:15px;padding:3px 11px;line-height:1.2}
body.bigmap .mapbox{position:fixed;inset:0;z-index:80;margin:0;border-radius:0;border:0;
  display:flex;flex-direction:column;background:var(--paper)}
body.bigmap #worldmap{flex:1 1 auto;min-height:0;height:100%;width:100%}
body.bigmap #worldmap.orb{aspect-ratio:auto;max-height:none}
body.bigmap .maplg{order:2;flex:0 0 auto;padding:8px 10px;border-top:3px solid var(--ink);border-bottom:0;
  overflow-x:auto;white-space:nowrap}
body.bigmap .maphint{display:none}
body.bigmap header,body.bigmap .panel,body.bigmap #cards,body.bigmap #cnt,
body.bigmap footer,body.bigmap .cmpbar,body.bigmap #tin{display:none!important}
.dicebtn:active{transform:translateX(4px) rotate(-12deg) scale(1.12)}
.zlab{font-family:'Courier Prime',monospace;font-size:11px;font-weight:700;color:#6B6155;min-width:32px;text-align:center}
.maphint{margin-left:auto;font-family:'Courier Prime',monospace;font-size:10px;color:#6B6155}
.mpk{cursor:pointer}
.twn{cursor:pointer}
.twn:active circle{opacity:.6}
.mpk:hover{filter:brightness(1.1)}
.chart{background:var(--card);border:3px solid var(--ink);border-radius:4px;padding:12px 14px;
  box-shadow:6px 6px 0 var(--ink);margin:14px 0}
.charth{font-family:'Bungee',cursive;font-size:15px;letter-spacing:.01em}
.chartd{font-size:11.5px;color:#6B6155;margin-top:2px;font-weight:600}
.bars{margin-top:11px}
.br{display:grid;grid-template-columns:118px 1fr auto;gap:8px;align-items:center;margin-bottom:5px;cursor:pointer}
.br:hover .brb i{filter:brightness(1.12)}
.brn{font-size:11.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brb{height:19px;background:#E2D8C4;border:2px solid var(--ink);border-radius:2px;overflow:hidden;position:relative}
.brb i{display:block;height:100%}
.brb em{position:absolute;inset:0;display:flex;align-items:center;padding-left:7px;font-style:normal;
  font-family:'Courier Prime',monospace;font-size:9.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.brv{font-family:'Courier Prime',monospace;font-weight:700;font-size:12.5px;white-space:nowrap;width:52px;text-align:right}

.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 11px}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:4px;padding:11px 13px;
  box-shadow:5px 5px 0 var(--ink);margin:13px 0;position:sticky;top:6px;z-index:35;
  transition:padding .18s ease}
.panel.stuck{box-shadow:4px 4px 0 var(--ink),0 10px 20px rgba(43,33,24,.25);padding:7px 11px}
/* once stuck, everything folds away except one compact line */
/* once stuck, everything folds away except the compact line and the search box */
.panel.stuck .row:not(.mini):not(.srow),.panel.stuck .cnt,.panel.stuck .outline,.panel.stuck .hintline{display:none}
.panel.stuck .srow{margin-top:6px}
.panel.stuck .srow .sortlab{display:none}
.panel.stuck .srow input{font-size:16px;padding:6px 9px}
.panel .mini{display:none}
.panel.stuck .mini{display:flex;gap:7px;align-items:center;margin:0}
.mini .mlab{font-family:'Bungee',cursive;font-size:12px;white-space:nowrap}
.mini .mval{font-family:'Courier Prime',monospace;font-size:11.5px;font-weight:700;color:var(--stamp);white-space:nowrap}
.mini input[type=range]{flex:1;min-width:90px;accent-color:var(--stamp)}
.mini .mexp{flex:none;font-family:'Courier Prime',monospace;font-weight:700;font-size:11px;padding:4px 9px;
  border:2px solid var(--ink);border-radius:2px;background:#FFF;cursor:pointer;color:var(--ink)}
.fchip.dice{border-color:var(--stamp);color:var(--stamp);font-size:15px;padding:5px 11px;line-height:1.15}
.fchip.dice:active{transform:rotate(22deg) scale(1.12)}
.fchip.list{border-color:var(--blue);color:var(--blue)}
.viewrow{gap:6px}
.daysrow{display:none}
.panel.trekmode .daysrow{display:flex}
.panel.stuck .daysrow{display:none}
#q{flex:1;min-width:150px;position:relative;z-index:2;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;font-family:'Courier Prime',monospace;font-weight:700;font-size:16px;
  padding:8px 11px;border:2.5px solid var(--ink);border-radius:3px;background:#FFF;color:var(--ink);
  box-shadow:2px 2px 0 var(--ink);-webkit-appearance:none}
#q:focus{outline:none;box-shadow:2px 2px 0 var(--stamp)}
#q::placeholder{color:#A89A88;font-weight:400}
mark{background:var(--gold);color:var(--ink);padding:0 1px;border-radius:1px}
.vbtn{flex:1;font-family:'Bungee',cursive;font-size:13px;padding:8px;border:2.5px solid var(--ink);
  border-radius:3px;background:#FFF;cursor:pointer;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.vbtn.on{background:var(--ink);color:var(--gold)}
.tk{background:var(--card);border:3px solid var(--ink);border-radius:4px;box-shadow:5px 5px 0 var(--ink);
  padding:12px 14px;margin-bottom:11px;position:relative;cursor:pointer;transition:transform .12s}
.tk:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.tkh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.tkn{font-family:'Bungee',cursive;font-size:19px;line-height:1.08}
.tkc{font-family:'Courier Prime',monospace;font-size:10.5px;font-weight:700;color:var(--stamp);
  letter-spacing:.05em;text-transform:uppercase}
.tkstats{display:flex;gap:6px;margin:9px 0 0;flex-wrap:wrap}
.tkstats span{font-family:'Courier Prime',monospace;font-size:10.5px;font-weight:700;
  border:2px solid var(--ink);border-radius:2px;padding:3px 8px;background:#FFF}
.tkstats span.st{background:#E4EDF6}
.tkstats span.df{background:#FFF}
.tkstats span.df1,.tkstats span.df2{background:#DEEBDA}
.tkstats span.df3{background:#FBF0D6}
.tkstats span.df4,.tkstats span.df5{background:#F9DDD8}
.tkstats span.open{background:var(--green);color:#FBF6EA}
.tkstats span.shut{background:var(--stamp);color:#FBF6EA}
.tkv{font-size:12.8px;line-height:1.5;margin-top:9px;border-top:2px dashed var(--grey);padding-top:9px}
.tkb{margin-top:8px;font-family:'Courier Prime',monospace;font-size:11px;font-weight:700;color:#8A6A2A;
  background:#FBF0D6;border:1.5px solid var(--gold);border-radius:2px;padding:5px 9px;line-height:1.4}
.tkb::before{content:'📋 '}
.urg{display:inline-block;margin-top:8px;font-family:'Courier Prime',monospace;font-size:10.5px;font-weight:700;
  padding:3px 9px;border:2px solid var(--ink);border-radius:2px;background:#EDE4D2}
.urg.soon{background:var(--gold)}
.urg.now{background:var(--stamp);color:#FBF6EA}
.tktip{margin-top:7px;font-size:12.5px;line-height:1.5;color:#2B2118;background:#E8F0E4;
  border:2px solid var(--green);border-radius:2px;padding:7px 10px}
.tktip::before{content:'💡 The tip — ';font-family:'Bungee',cursive;font-size:10.5px;color:var(--green)}
.tktip b{font-weight:800}
.tkstrip{display:grid;grid-template-columns:repeat(12,1fr);gap:1.5px;margin-top:9px}
.tkstrip i{height:11px;border:1.5px solid var(--ink);border-radius:1px;background:#EDE4D2}
.tkstrip i.on{background:var(--green)}
.tkstrip i.now{outline:2.5px solid var(--stamp);outline-offset:1px;position:relative;z-index:2}
.hintline{font-family:'Courier Prime',monospace;font-size:10px;color:#8A8072;margin-top:6px}
.outline{margin-top:7px;font-family:'Courier Prime',monospace;font-size:10.5px;color:#8A6A2A;
  background:#FBF0D6;border:1.5px solid var(--gold);border-radius:2px;padding:4px 8px;cursor:pointer;line-height:1.4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.row:last-of-type{margin-bottom:0}
.row input[type=range]{flex:1;min-width:150px;accent-color:var(--stamp)}
.row>b{font-family:'Bungee',cursive;font-size:14px;color:var(--stamp);white-space:nowrap;min-width:96px;text-align:right}
.filters{gap:5px}
.fchip{font-family:'Courier Prime',monospace;font-weight:700;font-size:11px;padding:5px 10px;
  border:2px solid var(--ink);border-radius:2px;background:#FFF;cursor:pointer;color:var(--ink)}
.fchip.on{background:var(--green);color:#FBF6EA}
.fchip.star.on{background:var(--gold);color:var(--ink)}
.fchip.clear{border-style:dashed;color:#8A8072}
.sortlab{font-family:'Bungee',cursive;font-size:13px;letter-spacing:.01em;min-width:58px}
.selwrap{position:relative;flex:1;min-width:190px;max-width:330px}
.selwrap::after{content:'▾';position:absolute;right:11px;top:50%;transform:translateY(-52%);
  font-size:14px;pointer-events:none;color:var(--ink)}
#sort,#reg{appearance:none;-webkit-appearance:none;width:100%;font-family:'Courier Prime',monospace;font-weight:700;
  font-size:13px;padding:8px 30px 8px 11px;border:2.5px solid var(--ink);border-radius:3px;
  background:var(--gold);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
#reg{background:var(--card)}
#sort:focus,#reg:focus{outline:none;box-shadow:3px 3px 0 var(--stamp)}
#sort optgroup,#reg optgroup{background:var(--card);font-style:normal;font-weight:700}
#sort option,#reg option{background:var(--card);font-weight:400;padding:4px}
.chip{font-family:'Courier Prime',monospace;font-weight:700;font-size:12px;padding:6px 11px;border:2.5px solid var(--ink);
  border-radius:3px;background:var(--card);cursor:pointer;box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.chip.on{background:var(--gold)}
.cnt{font-family:'Courier Prime',monospace;font-size:11px;color:#6B6155;line-height:1.4;margin-top:9px;
  padding-top:8px;border-top:2px dashed var(--grey)}
.cmpbar{position:sticky;top:0;z-index:40;background:var(--ink);color:var(--paper);border:3px solid var(--ink);
  border-radius:4px;padding:9px 12px;margin-bottom:11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmpbar b{font-family:'Bungee',cursive;font-size:13px;color:var(--gold)}
.cmpbar .pill{font-family:'Courier Prime',monospace;font-size:11px;font-weight:700;background:var(--paper);
  color:var(--ink);padding:3px 9px;border-radius:2px;cursor:pointer}
.cmpbar .go2{margin-left:auto;font-family:'Bungee',cursive;font-size:12px;background:var(--gold);color:var(--ink);
  border:2px solid var(--paper);border-radius:3px;padding:5px 12px;cursor:pointer}
.star2{position:absolute;top:9px;left:9px;z-index:3;width:30px;height:30px;border:2.5px solid var(--ink);
  border-radius:50%;background:rgba(251,246,234,.92);cursor:pointer;font-size:14px;line-height:1;padding:0}
.star2.on{background:var(--gold)}
.cmp2{position:absolute;top:9px;left:45px;z-index:3;width:30px;height:30px;border:2.5px solid var(--ink);
  border-radius:50%;background:rgba(251,246,234,.92);cursor:pointer;font-size:12px;line-height:1;padding:0;font-weight:800}
.cmp2.on{background:var(--blue);color:#FFF}
.ctable{width:100%;border-collapse:collapse;font-family:'Courier Prime',monospace;font-size:12px;margin-top:8px}
.ctable th,.ctable td{border:1.5px solid var(--ink);padding:6px 8px;text-align:left}
.ctable th{background:var(--ink);color:var(--paper);font-family:'Bungee',cursive;font-size:11px;font-weight:400}
.ctable td:first-child{background:#EFE6D5;font-weight:700;white-space:nowrap}
.ctable .win{background:#DEEBDA;font-weight:700}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:13px}
.grid.treks{grid-template-columns:1fr;gap:0}
@media(min-width:760px){.grid.treks{grid-template-columns:1fr 1fr;gap:0 12px}}
.d{background:var(--card);border:3px solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--ink);
  overflow:hidden;cursor:pointer;transition:transform .13s;position:relative}
.d:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.photo{position:relative;height:126px;overflow:hidden;border-bottom:3px solid var(--ink);background:#C8D4DC}
.photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.94) contrast(1.03)}
.zoom{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border:2px solid var(--ink);
  border-radius:3px;background:rgba(251,246,234,.9);cursor:pointer;font-size:13px;padding:0;line-height:1}
.lightbox{position:fixed;inset:0;background:rgba(43,33,24,.94);z-index:80;display:flex;align-items:center;
  justify-content:center;flex-direction:column;padding:18px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:76vh;border:4px solid var(--paper);border-radius:3px}
.lbcap{color:var(--paper);font-family:'Courier Prime',monospace;font-size:12px;font-weight:700;margin-top:12px;text-align:center;line-height:1.5}
.lbcap a{color:var(--gold)}
.pc{position:absolute;left:0;bottom:0;background:rgba(43,33,24,.82);color:var(--paper);
  font-family:'Courier Prime',monospace;font-size:9.5px;font-weight:700;padding:3px 8px;letter-spacing:.03em}
.dtop{padding:11px 13px 0;display:grid;grid-template-columns:1fr 74px;gap:10px}
.dreg{font-family:'Courier Prime',monospace;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--stamp);text-transform:uppercase}
.dn{font-family:'Bungee',cursive;font-size:21px;line-height:1.05;margin-top:2px}
.dsub{font-size:11.5px;color:#6B6155;font-weight:600;margin-top:2px}
.stampwrap{position:relative}
.stamp{position:absolute;right:-4px;top:-4px;transform:rotate(-11deg)}
.stamp svg{width:78px;height:78px;display:block}
.money{display:flex;gap:7px;margin:11px 13px 0}
.mo{flex:1;border:2.5px solid var(--ink);border-radius:3px;padding:6px 7px;text-align:center;background:#FFF}
.mo b{display:block;font-family:'Bungee',cursive;font-size:18px;line-height:1.05}
.mo span{font-family:'Courier Prime',monospace;font-size:9px;font-weight:700;color:#6B6155}
.mo.esp{background:#F6EBD4}.mo.esp b{color:#8A5A1E}
.mo.pk{background:#E4EDF6}.mo.pk b{color:#2C5C8A}
.season{margin:10px 13px 0}
.seasonh{font-family:'Courier Prime',monospace;font-size:10px;font-weight:700;color:#6B6155;margin-top:4px}
.seasonh b{color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:1.5px}
.strip i{height:13px;border:1.5px solid var(--ink);border-radius:1px;background:#EDE4D2}
.strip i.ok{background:var(--gold)}.strip i.peak{background:var(--green)}
.strip i.off{background:#DCD3C0;opacity:.5}
.strip i.now{outline:2.5px solid var(--stamp);outline-offset:1px;z-index:2;position:relative}
.striplab span.now{color:var(--stamp);font-size:8.5px}
.empty{grid-column:1/-1;background:var(--card);border:3px dashed var(--ink);border-radius:4px;padding:26px 20px;
  text-align:center;font-family:'Courier Prime',monospace;font-size:13px;font-weight:700;color:#6B6155}
.striplab{display:grid;grid-template-columns:repeat(12,1fr);gap:1.5px;font-family:'Courier Prime',monospace;
  font-size:7px;font-weight:700;text-align:center;color:#8A8072;margin-top:2px}
.hikeline{margin:9px 13px 0;font-family:'Courier Prime',monospace;font-size:11px;font-weight:700;
  color:var(--stamp);border-left:3px solid var(--stamp);padding-left:8px;line-height:1.35}
.scores{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;margin:11px 13px;font-size:10px;font-weight:800}
.scores .l{color:#6B6155;width:80px}
.sb{height:9px;background:#E2D8C4;border:2px solid var(--ink);border-radius:2px;overflow:hidden}
.sb i{display:block;height:100%}
.sb.mt i{background:var(--stamp)}.sb.col i{background:var(--gold)}
.sb.net i{background:var(--green)}.sb.hut i{background:var(--blue)}.sb.tec i{background:var(--violet)}
.sb.cf i{background:var(--blue)}.sb.nv i{background:var(--violet)}
.scores .v{font-family:'Bungee',cursive;font-size:11px;width:12px;text-align:right}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin:10px 13px 0}
.fl{display:flex;align-items:center;gap:5px;font-family:'Courier Prime',monospace;font-size:10px;font-weight:700;
  padding:3px 8px;border:1.5px solid var(--stamp);border-radius:2px;background:#F9DDD8;color:#7A2018}
.fl b{font-size:11px}
.fl.ok{border-color:var(--green);background:#DEEBDA;color:#2A5A34}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(43,33,24,.45);z-index:110;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.backdrop.hide{display:none!important}
.sheet{position:fixed;inset:auto 0 0 0;max-height:88vh;overflow-y:auto;z-index:120;background:var(--card);
  border-top:5px solid var(--ink);transform:translateY(102%);transition:transform .34s cubic-bezier(.3,.8,.4,1);
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:46px}
.sheetclose{position:fixed;left:16px;z-index:130;
  font-family:'Bungee',cursive;font-size:12px;padding:7px 20px;border:3px solid var(--ink);border-radius:20px;
  background:var(--stamp);color:var(--paper);cursor:pointer;box-shadow:3px 3px 0 var(--ink);
  top:calc(12vh + 8px);display:none;touch-action:manipulation}
@media(max-height:700px){.sheetclose{top:calc(12vh + 4px)}}
.sheet.slow{transition:transform .85s cubic-bezier(.16,.86,.24,1)}
.sheet.slow .sin{animation:sinfade .7s .12s both}
@keyframes sinfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.sheet.slow{transition:transform .3s}.sheet.slow .sin{animation:none}}

.sin{max-width:740px;margin:0 auto;padding:8px 16px 90px;position:relative}
.sx{position:fixed;top:calc(12vh + 6px);right:12px;width:44px;height:44px;

 d.onclick=function(){d.remove()};
 (document.body||document.documentElement).appendChild(d); }

};

e3DCKfYimSn3jQwn5gcq+ozYz1juRlaN/wBGW9Tws268UTN4X3xDo17S28leWUrfxL+7gnIuMZqodWvMt+s/CKcahNOuM65i7CmEAP4lCApviwyyjyc/RAPdXWP1BLS2jj5iqhboQSCvF0S4orgFFeWBKvNtOCE4odW2U9hGi2VUKg4vrAFlLflHLiulnZ3nOze7yzwBxDO7jinMBGz4lqruOGY6QT6KwerDEMkrSyzpKBQPKFZo5KaSvFStCn+OkwRYgav8SoFZKClN1LGcDB0QAhyGBxLFEh41ANG7jsC63UszTit4gwCrJSpszsar4lq6WXf8gQkrVTrP/9k=",imgt:"Morne Seychellois",imgp:"https://en.wikipedia.org/wiki/Morne_Seychellois",season:[2, 2, 2, 2, 1, 1, 1, 1, 1, 2, 2, 2],best:"April–May and October–November",seasonN:"Tropical, so it works all year, but the shoulder months between the trade winds — April to May and October to November — are calmest, clearest and best for the water. ⚠ December to February is the northwest monsoon: wetter, and the trails turn to mud.",acc:"Doha or Dubai to Mahé, then domestic hops or ferries. Visa-free for everyone, which is unusual.",col2:"⚠ There is no autumn here. The forest is evergreen — takamaka, coco de mer palms, endemic pitcher plants. The colour is in the granite, which glows orange at either end of the day, and in the water.",food:"Creole, and better than the resorts suggest. Octopus curry, grilled job fish, breadfruit chips, and a fish market in Victoria that is the real thing. ⚠ Expensive — almost everything except fish is imported.",eat:["Octopus curry with coconut milk", "Grilled bourgeois or job fish", "Ladob · breadfruit or plantain in coconut", "Takamaka rum, distilled on Mahé"],safe:"Very safe, with the usual sense about unattended belongings on beaches. ⚠ The real hazards are the sun, currents on the unprotected beaches, and trails that are steep, slick and unmarked once you leave the main routes.",v:"⚠ Be clear what this is: it is not a mountain destination. Morne Seychellois is 905 m and the app will rank it last on almost every mountain sort — that is correct, not a bug. What it is instead is the best possible recovery leg: granite inselbergs rising straight out of the Indian Ocean, walkable forest trails in the morning, and the finest beaches on earth by lunchtime. If a month of walking needs a soft landing at either end, this is it.",pro:["Recovery, not exertion — and superb at it", "Granite, forest and reef within an hour", "Visa-free, safe, English widely spoken"],con:["⚠ Not a mountain range — 905 m", "Among the most expensive places on this list", "No autumn colour and no huts"],hikes:[["Copolia", "2 km · 300 m · 2 h", "A short climb through mist forest to a bare granite dome with pitcher plants growing on it, and the whole east coast below. The best hour on the island."], ["Morne Blanc", "3 km · 350 m · 2 h", "Steeper and quieter, ending at a viewpoint 667 m above the west coast. Go early before the cloud sits down."], ["Anse Major trail", "7 km · 150 m · 3 h", "A coastal path cut across granite slabs to a beach reachable only on foot or by boat. Take water; there is no shade and no shop."], ["Vallée de Mai · Praslin", "2 km · 80 m · 2 h", "Not a hike so much as a walk through a prehistoric palm forest — the only place the coco de mer grows wild. UNESCO-listed and worth the ferry."]],disc:{"lang": {"sc": 5, "s": "Latin", "t": "Seychellois Creole is the everyday language, but English and French are both official and universal. Signage, menus and officialdom are all in English. Among the easiest places on this list linguistically.", "words": ["Bonzour · hello", "Mersi · thank you", "Zoli · beautiful"]}, "veg": {"sc": 3, "t": "Workable but not a strength — this is a fish culture, and lentil or vegetable curries are the fallback rather than the point. Self-catering solves it; the supermarkets in Victoria carry Indian staples. ⚠ Vegan specifically is harder than vegetarian.", "ask": "Mon pa manz lavyann ni pwason · I eat neither meat nor fish"}, "med": {"sc": 3, "t": "Victoria Hospital on Mahé is adequate for most things, and there is a decompression chamber for divers. ⚠ Anything serious means evacuation to Réunion or Nairobi — insurance matters here more than the gentle terrain suggests."}, "con": {"sc": 4, "t": "Good 4G across Mahé and Praslin, patchy on the smaller islands. Cards accepted almost everywhere. The rupee is the currency but euros and dollars circulate."}, "soc": {"sc": 5, "t": "Extremely easy and safe for a couple. Tourism is the economy and it is well run. No hassle, no scams to speak of."}, "hosp": "Warm and unhurried, in a genuinely creole way — African, French, Indian and Chinese threads in the same place. Nobody is in a rush and it is contagious.", "who": "Honeymooners and divers, mostly, plus a steady trickle of French and Italian families. Almost nobody comes here to walk, which is why the trails are empty."},masc:"Zwazo lil",mascEn:"the Seychelles black parrot",mascL:"The national bird, found only on Praslin, and there are perhaps 500 left. You will hear it in the Vallée de Mai before you see it.",rain:"⚠ Thin, and rain here is heavy but brief. Victoria has the market, the botanical gardens and a small natural history museum. Otherwise a wet hour is a reason to eat, and the rain usually stops before you finish.",drink:"Takamaka rum, distilled on Mahé and genuinely good — the dark one, not the coconut. SeyBrew is the local beer. Fresh coconut everywhere, cut in front of you.",move:"⚠ Hire a car on Mahé; the buses exist and are cheap but slow, and the good trailheads are scattered. Ferries between Mahé, Praslin and La Digue are frequent and reliable. On La Digue you cycle — there are almost no cars.",kit:"Almost nothing technical. Reef shoes, serious sun protection, and grippy trail shoes — the granite is slick when wet and the trails are steep. Bring cash in small notes for the ferries.",club:"None, and none needed. Trails are maintained by the Seychelles National Parks Authority and are free to walk. No huts, no permits, no association — you sleep in a guesthouse and walk from it."},
{n:'Val Gardena',crowd:4,crowdN:"Busy on the lift-served trails and at Seceda, empty a valley over. September is far quieter than August.",club:"CAI, the Club Alpino Italiano, owns most of the rifugi. Membership pays for itself in about four nights and works across the whole reciprocal network — DAV, ÖAV, SAC, PZS. Join in any Italian town; the Bolzano office handles English.",rain:"Strong. Bolzano is 40 minutes for the Ötzi museum and arcaded streets; Ortisei has thermal baths and the woodcarving museum; the valley has enough restaurants that a wet day is a good day. The best-provisioned bad weather on this list.",drink:"Törggelen from late September — new wine drunk in farmhouse cellars with chestnuts and speck, and the whole reason to be here in October. Otherwise Lagrein and Gewürztraminer, both grown in the valley below.",move:"A car is optional. The Val Gardena bus runs every 20 minutes between the three villages and the Mobilcard covers the whole province including trains. This is the one place here you genuinely do not need to drive.",kit:"Poles for the descents — the drops off Seceda are long and hard on knees. A via ferrata set if you want the Sella routes. Nothing technical otherwise.",disc:{"lang": {"sc": 5, "s": "Latin", "t": "Italian, German and Ladin all official. Trail signs numbered and multilingual, menus in three languages, everyone in tourism speaks English. Zero friction.", "words": ["Bon dé · good day, in Ladin", "Giulan · thank you, in Ladin", "Servus · hello, German-side"]}, "veg": {"sc": 2, "t": "The known weakness. Speck, dumplings, cheese — the tradition is meat and dairy, and huts have one token vegetarian option at best. A kitchen solves it: supermarkets here stock everything, and the Thursday market has real produce.", "ask": "Senza carne e senza formaggio, per favore"}, "med": {"sc": 5, "t": "Helicopter rescue in twenty minutes, EU health card valid, hospital in Bolzano an hour away. Rescue is charged but insurance covers it. The best in the world, effectively."}, "con": {"sc": 5, "t": "Full 4G/5G everywhere including most trails. Cards accepted universally. ATMs in every village."}, "soc": {"sc": 5, "t": "Completely unremarkable for a couple or a woman alone. Alpine reserve — polite, not intrusive, nobody will approach you."}, "hosp": "Reserved. South Tyrolean politeness is real but distant — people have been in one valley a very long time and do not need anything from a visitor. Warmth has to be earned over a few days at the same hut.", "who": "German and Italian families, Austrian day-trippers, serious via-ferrata people. Very few Americans or British outside July."},cty:"Italy",masc:"Camoscio",mascEn:"the chamois",mascL:"Watches you from higher up the scree and does not move.",season:[0, 0, 0, 0, 1, 1, 2, 2, 2, 2, 1, 0],best:"Late Sept to late Oct",seasonN:"Larch peaks mid-to-late October and the lifts run to 2 November \u2014 the longest autumn window on this list. July and August work but are crowded and thundery.",lat:46.57,lon:11.67,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAIDAQQF/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//aAAwDAQACEAMQAAABZqy3gkzWRd3EXUHm4SLZZNpVzp1rgiUXUTGLnBtVGrOM0eVCrS851BNMLK7FpbkWzcnaepMbN4yVIZ1ZUrjbauStiZ051iEBmTXonn9Uq5fNZm82hgFwY1hTFloOs0IYjbEVJ6AyuZk3jVtPUXMyVx1M2mCV55S9ax0YmHWvfKXjfponInapyr3IcTdqnOVkJrucTwrFsXt1OCXXx511YdepxL6BZwv1BzHThxHaVXV3FYzVSKLZ1LzrZ15BxqTUuvOhx5uZ03p8HYkZdCY0dnL2i66am5yPqdDJTNUws1OfFvz4bzgNY9Y5FZLlGbiG5ora8q9k9lpsaY0zSQquVqM+jLJWFjSYXAXcAADQIVQszANmFTmFagWdFAzUcDQCXOGsmBYAH//EACMQAAICAgICAwEBAQAAAAAAAAABAhESIRAgAzETIkEyMEL/2gAIAQEAAQUCsUjIfCRRRofWijHvRRRiYsriaEijEofTQ6pP7QfN9V7cGull8Wexa6NWV0e3jst1+D1wy9L3DyWOFjtc2X1sssfMtLi9L3/zFnt+uK49EfKZxbfj/wAKKGqNEfsUeT+uv5x+8r2veVHyD8hlvhlb9JUUSLabluTylxRL2n  fly:14,hop:'2 flights + train',acc:'Fly Munich or Venice, then rail and bus. Half a day.',an:'chamois',
 col2:'Larch gold, mid-to-late October, lifts to 2 Nov. The most reliable autumn colour on this list.',
 food:'The known weakness. Speck, dumplings, pizza — a rotation that wore thin by day four last time. A kitchen fixes it: proper butchers, a Thursday market, Graukäse and Speck direct from farms, and supermarkets that stock what you would want.',
 eat:['Törggelen · new wine, chestnuts, speck, Sept–Nov','Schlutzkrapfen · spinach-ricotta ravioli','Kaiserschmarrn at a hut','Graukäse · the sour grey cheese nobody exports'],
 safe:'As safe as anywhere on earth. The only real risks are weather and your own legs.',
 music:'valzer',
 v:'You have been, and the verdict was mixed: mountains excellent, seven nights two too many, food wore thin. The question is not whether it is good — it is whether a kitchen and five nights instead of seven changes the verdict. Probably yes.',
 pro:['Three lifts from the village','Latest lifts anywhere here','Best-drawn autumn on the list'],
 con:['Most expensive per day','Food rotation','You already know it']},
{n:'Berchtesgaden',crowd:4,crowdN:"Königssee and the Watzmannhaus are crowded; the Steinernes Meer is not. Weekends double it.",club:"DAV, the Deutscher Alpenverein, owns the Watzmannhaus and most huts here — the largest mountaineering association on earth. Membership roughly halves hut fees and includes worldwide mountain rescue and repatriation insurance, which alone is worth the fee.",rain:"⚠ You will need this — 10 to 12 wet days in October. Salzburg is 30 minutes by bus: Mozart, the fortress, coffee houses. Closer there is the salt mine, the Königssee boat, and Watzmann Therme. Good options, and you will use them.",drink:"Bavarian beer culture at full strength — Hofbräu Berchtesgaden brews in the town. Enzian schnapps, distilled from gentian root, is the local digestif and tastes like the mountain smells.",move:"The Berchtesgaden guest card includes all regional buses free, and they reach every trailhead. Trains to Salzburg and Munich. A car adds little.",kit:"Proper rain gear, not a shell you tolerate — it will be tested. Poles. The Watzmann traverse needs a helmet and a head for exposure.",disc:{"lang": {"sc": 5, "s": "Latin", "t": "German, with English standard in tourism. Trail signage is excellent and consistent. Bavarian dialect is impenetrable but nobody uses it on you.", "words": ["Grüß Gott · the greeting, all day", "Servus · casual hello and goodbye", "Bergheil · what you say on a summit"]}, "veg": {"sc": 2, "t": "Bavarian food is meat and cheese in that order. Guesthouses will manage something if warned; huts will offer Kaiserschmarrn and little else. Salzburg thirty minutes away has proper options.", "ask": "Vegan, bitte — ohne Fleisch, Käse, Butter oder Ei"}, "med": {"sc": 5, "t": "Bergwacht mountain rescue is superb and the Watzmann sees regular callouts. EU card valid, hospital in Berchtesgaden itself."}, "con": {"sc": 5, "t": "Full coverage, cards everywhere, though Germany is more cash-preferring than its neighbours — carry some."}, "soc": {"sc": 5, "t": "As safe and unremarkable as the Alps get."}, "hosp": "Warmer than South Tyrol, in a formal way. The Grüß Gott to every passing walker is genuine and universal — you will say it four hundred times a day.", "who": "Germans, overwhelmingly. Munich weekenders, families, and a serious alpine-club contingent on the Watzmann."},cty:"Germany",masc:"Steinadler",mascEn:"the golden eagle",mascL:"Never flaps. Owns a hundred square kilometres and knows it.",season:[0, 0, 0, 0, 1, 1, 2, 2, 2, 1, 0, 0],best:"Sept to early Oct",seasonN:"Beech turns from mid-September. October is the wettest month here \u2014 ten to twelve rain days \u2014 so the sweet spot is narrower than it looks.",lat:47.59,lon:12.98,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQABAQADAQAAAAAAAAAAAAAAAAECAwQF/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//aAAwDAQACEAMQAAAB2renKKIoiiKIoiliiKIoikiiTIYsoRRbSxRFRFEURRFEXOXW2aDNVkURRFEmQxZKqsotMWQxZQhguzDLRnW9y7dToz5d+blwd+g07+O7z2OfogAEAKKxyVccI2ufUvXyata5sLZ1Yc8l2zXbN3RxYZvZlx4m7CLMmCurbwZHpvL2x3ufqIJfPx1410cwBYLEsVRGTAuVxGeMsSpVsGTEVKXZphtalkeiPOegPPeiPOegPPvdTz3eOB3jjx9fljidUOd0Ree9mw8934HG3w0rCM2b17DWbSlACCJAyoASBcggWUMNQa9BLgJf/8QAJRAAAgIBBAEEAwEAAAAAAAAAAAECERMDEBIhIDAxQEEiMlBg/9oACAEBAAEFAv8ATJEv1T+PJ1uls1a9hSE7+E+jkiqWq/y5OlI5kT2Jx6ssWoe/rN0nqSLtpi1CTOixMnOhzHqMZeylRHVFqR8uS2tEtSMTNEzslNye1ll7oe1+gtSQtZUchyLoy9el9H15WdeEdRxTk2X/AC+L9dSR0zhExwOETHAxRMUTFExRMMTDEwxMK2eijCYmYWY5EYM4I4j00Y2Y2Vt9R7XwL85dLTfMTTlPqbZ//8QAGhEAAgMBAQAAAAAAAAAAAAAAAREAMEAQUP/aAAgBAwEBPwHw1wQihWKLcsH/xAAZEQADAAMAAAAAAAAAAAAAAAABEUAAEDD/2gAIAQIBAT8BnfR6OAyu5wf/xAAiEAABAwQCAgMAAAAAAAAAAAAAASExEBEgQTBAAjJQUWD/2gAIAQEABj8C/Tq3YTXacsMJWS60Xyq/O4tq2xshvFh3HbKaSSQpCdSR0sQPqv3ypyW18bC87LSCCCMdmzZNJJwdErHeVSD1FtT/xAAqEAACAgEDBAAEBwAAAAAAAAAAAREhMRBRYSBBcYEwQJHwYKGxwdHh8f/aAAg {n:'Julian Alps',crowd:3,crowdN:"Bled and Triglav draw people; the Soča valley and the western ridges are quiet.",club:"PZS, the Slovenian alpine association, owns the koče. Reciprocity with DAV, ÖAV, CAI and SAC applies, so an existing card works here. Slovenian huts are cheap even at full price.",rain:"Reasonable. Ljubljana is 90 minutes and one of Europe’s most likeable small capitals. Closer: Bled castle, the Kobarid WWI museum — outstanding — and the Tolmin gorges, which are better in rain.",drink:"Slovenia makes serious wine almost nobody exports. Rebula and Teran from the Karst, both worth seeking out. Blueberry schnapps in the huts.",move:"⚠ A car matters here. The Vršič pass, the Soča valley and Bohinj are poorly linked by bus and the good valleys are the awkward ones. Book one.",kit:"Via ferrata set for Triglav — the summit ridge is cabled and exposed. Poles. Trails are rougher and less marked than Austria; a map you trust.",disc:{"lang": {"sc": 4, "s": "Latin", "t": "Slovene, and English is widely spoken by anyone under fifty. Trail signage is good and uses the same numbering logic as the Alps. Italian and German both help.", "words": ["Dober dan · good day", "Hvala · thank you", "Kje je pot? · where is the path?"]}, "veg": {"sc": 4, "t": "Surprisingly good. Slovenia has a strong vegetable tradition and Ljubljana is genuinely vegan-friendly; Bohinj less so but guesthouses adapt willingly. Štruklji can be made without cheese and often is.", "ask": "Brez mesa in brez mlečnih izdelkov, prosim"}, "med": {"sc": 4, "t": "Good. Slovenian mountain rescue is volunteer-run, well trained and free. EU card valid. Hospital in Jesenice, an hour from Bohinj."}, "con": {"sc": 5, "t": "Excellent coverage and cards accepted everywhere. Euro currency."}, "soc": {"sc": 5, "t": "Very comfortable. Slovenia is among the safest countries in Europe and the mountain culture is family-oriented."}, "hosp": "Understated and genuine. Slovenes are less effusive than the Balkans and less formal than Austria — the middle setting, and easy to be around.", "who": "Slovenes, Italians, Germans, a growing British contingent. Triglav is a national pilgrimage so the trails are full of locals, which changes the feel entirely."},cty:"Slovenia",masc:"Zlatorog",mascEn:"the golden-horned ibex",mascL:"Slovenian legend. Punishes greedy hunters, tolerates walkers.",season:[0, 0, 0, 0, 1, 1, 2, 2, 2, 2, 1, 0],best:"Late Sept to late Oct",seasonN:"Beech turns two to three weeks after larch, so Bohinj holds colour into early November \u2014 the latest window in the Alps.",lat:46.36,lon:13.84,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAECAwQF/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//aAAwDAQACEAMQAAABoDpzAABgACYSWEOqM3YQUhKglWyFrJmWVNMiRhAFjchRIWSFEhTkLedS0SxiQxAMYAlaBAJKIBOxIdtcjUTI1DI1kzdqpMtpQqiCwzdsmNQxqwhaSJlEmxnWZaSSlSVBIwuZWbhULU2g0lWuWkrMq1mxFjEDEFBtnSsjOrMwh8aue2pcuGOhYJ9RznaS41pzCohSKysrqw6zF7UYPRnM9EhOmE1oYbgcocrwmzo6fOuPcXkdZpOmg1KWpnqS+bpheHbexPNhh0ow1dArDky24TbLB2dIyXgYazGwS3kEen2gqQDQE0A0AYAVQEaAaIDm88CsgsgCz//EACQQAAICAQQCAgMBAAAAAAAAAAABAhESAxAhMSAiMEETMlBA/9oACAEBAAEFAvhr+ZX9yvGiiv8APfyvgyNNpvj4KK2ooxYkl8MVZq9WW2T0yCihQEvjivOtvvsj+zRWysSW304+y68lyJJbWN+CQ+zJsV2oOlFt/jVcQTae12ZCVmBiYMUBwMGKI+CLtur5K5ymmtazTJROboUGz1W3BZNXP8Ri0Mog2nT8ZNlSHURd5O4yWMpXJap3FPEhrsUozUqSzFV9DbqL4/aRqNj4IcvZujNjc6imUPqUmOkWlHOxO9rY5NnKM5J5PUf4hQxH3jJmLbjHHaUbFBFElYlW/Hhq9S2kKUcaGrOiDbG0dPQ1Xqb3yN0k7L8MvfI+8faKrfX/AF+16tP2Twf/xAAaEQEBAAIDAAAAAAAAAAAAAAARAAEQIDBQ/9oACAEDAQE/AfAI0REaOB0FnhjsIjwv/8QAGhEAAgMBAQAAAAAAAAAAAAAAABEBECBQMP/aAAgBAgEBPwHgOmMY6eXh2xkYmfORjHwv/8QAJhAAAQQBAgYCAwAAAAAAAAAAAAEQESEgMVECMDJBYXFAgXDB0f/aAAgBAQAGPwL8O94IX5PZra1U6vs15m/JjuUtEP4wjmfvCxba1ppNiIeoE2fV7wjhLLKLg3I0akw1LfU1Pb01YUhammPSims/YhdoUpZRZu98OFlP4Ni2ogs8n {n:'High Tatras',crowd:3,crowdN:"Polish side packed in summer, Slovak side calmer. The high huts fill on weekends.",club:"The Slovak KST and the Polish PTTK run the chaty and schroniska. Reciprocal discounts are patchier than in the Alps, but rates are so low it barely matters. Mountain rescue is HZS, and it is free.",rain:"Decent. The electric railway makes village-hopping easy, Poprad has thermal baths at AquaCity, and Levoča and Spišský hrad — the largest castle ruin in central Europe — are an hour away.",drink:"Tatratea, 52 to 72 percent, is a warning rather than a recommendation. Better: Slovak white wine, which nobody outside the country has heard of, and Zlatý Bažant beer.",move:"The Tatra Electric Railway links every village and runs all year — genuinely useful. Buses to trailheads. A car is unnecessary and parking is limited.",kit:"Chains and via ferrata sections on Rysy and the Eagle Path — a set is worth carrying. Weather turns fast; carry more layers than the forecast suggests.",disc:{"lang": {"sc": 3, "s": "Latin", "t": "Slovak, with Polish mutually intelligible. English is common among younger people and in the resort villages, patchier in huts. Trail signage is excellent — colour-coded and rigorous.", "words": ["Dobrý deň · good day", "Ďakujem · thank you", "Pivo, prosím · beer, please"]}, "veg": {"sc": 2, "t": "Hard. Bryndzové halušky is sheep cheese and bacon; the tradition is meat, dumplings and dairy. Poprad and Starý Smokovec have a few options. Self-catering is the realistic answer.", "ask": "Bez mäsa a bez mliečnych výrobkov, prosím"}, "med": {"sc": 5, "t": "Horská záchranná služba is excellent and free to EU citizens — Slovakia takes mountain rescue seriously and the Tatras are small enough to reach anywhere fast. Hospital in Poprad."}, "con": {"sc": 4, "t": "Good coverage in the valleys, patchy on the ridges. Cards widely accepted. Euro currency."}, "soc": {"sc": 5, "t": "Very safe and family-oriented. The mountain railway makes everything accessible without a car."}, "hosp": "Straightforward and unsentimental. Not effusive, but hut wardens are helpful and the hiking culture is deeply national — Slovaks take these mountains seriously and respect anyone who does too.", "who": "Slovaks and Poles overwhelmingly, plus Czechs. Almost no western Europeans, which is the point."},cty:"Slovakia",masc:"Svi\u0161\u0165",mascEn:"the marmot",mascL:"Whistles before you see it. Underground by October.",season:[0, 0, 0, 0, 1, 2, 2, 2, 2, 1, 0, 0],best:"Sept to early Oct",seasonN:"Trails above the treeline are officially closed 1 Nov to 15 June. September is the best month: stable weather, thin crowds, larch turning.",lat:49.17,lon:20.13,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAECAwQF/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//aAAwDAQACEAMQAAAB9F8m2s3xaxqTpgaz1TgpZmlqIYIaAABskYIYJgAygYiGLpri41yAzbLJLRKpCGKlREumQMEMEMpFCIbEMEMWxiSUiSgrTPTGuYtbkjQCcA3ZJQSUElBJQIbEOMaZmc99JzdPXmJyPM5s66b8/cqY1xqKjE1moN9+bbWaFmbPLXeQosksJ5ujLnsOXbnuToDiRe8vSrlnn6sCXUlSqMtVY8nB0dPJ1SzjrnFy5q9uZ6z1ZVmZZ1njQrzOgwCN56NR6zjm3z7RUJbJnTinHdMvnvRWad/m9UtZ75RFc9WVqqlrn0xNFkweuAFELqDUXMC6ZAY9YWGQR0QErzCsLCzq5glvrBMGEpyAaZAdG4CAy//EACQQAAICAQIGAwEAAAAAAAAAAAABAhEhEjEDECAiMkETQEIw/9oACAEBAAEFAtRZLKp2maiLJv62rk8D5WW/sWSKf3b6H1of1ILPEj9XHWnQ5Nqui0X/AG9u+pySFJNvBqs9RWNlVNkX3/ynNxalY9rPmHKKaakalbkPYjlS3xE1UtyMsvJMVuLVIQnfTeLdubT1FpnsiQwaXI3dWLDV21lkUjFrEnEhtMW25sJ0J3ymNmVysTwIjGzdPEdJa5We0rWxaZdyTclmmUh4bI5RqJMq042KpLGpJoojEqiu27Jt2n2pXHThLWnFx51mPkm6lZ7/ACQ8lUeTN0xXoXktVw3WBHEnb5S8ZYUtoOnupRjTiOPbGVEWquiTIsWRWjB+mzU9OtONUnbIkPFR7pb8FY3GKVEn3SVDQpdizy2j+tbp7Skzh8Oz40h7rJPtPaVkiHjpTJJJf//EABsRAAMAAwEBAAAAAAAAAAAAAAABERAgUBIw/9oACAEDAQE/AaMpeDN0iImEiaNHkmUvrCcL/8QAHBEAAgIDAQEAAAAAAAAAAAAAABEBAhASMCBA/9oACAECAQE/AURAjXo m \u00b7 700 m \u00b7 5 h", "The green lake under the Lomnick\u00fd massif, with a hut on the shore that has been there since 1876."], ["Skalnat\u00e9 pleso to Lomnick\u00e9 sedlo", "9 km \u00b7 800 m \u00b7 4 h", "Cable car assist to a lake at 1,751 m, then up to the saddle at 2,190 m with the whole ridge above."], ["K\u00f4provsk\u00fd \u0161t\u00edt", "18 km \u00b7 1,200 m \u00b7 8 h", "Past Popradsk\u00e9 pleso to a summit with the finest panorama in the Tatras, and a fraction of the traffic on Rysy."]],reg:'Slovakia',flag:'🇸🇰',esp:1.20,day:80,mt:4,col:4,cf:3,nv:5,

 col2:'Larch and rowan over a dark dwarf-pine belt, which throws the gold and scarlet into relief. Peaks around 10 October.',
 food:'Hearty and cheap. Bryndzové halušky — potato dumplings with sheep cheese and bacon — is the national dish and it is very good after eight hours walking. Soups, dumplings, and beer that costs less than water elsewhere.',
 eat:['Bryndzové halušky','Kapustnica · cabbage and sausage soup','Žinčica · sour sheep whey, an acquired taste','Tatratea · 52–72%, a warning not a recommendation'],
 safe:'Safe. Brown bears are genuinely present and the densest population in Europe — make noise, do not surprise one. Mountain rescue is excellent and free to EU citizens.',
 music:'fujara',
 v:'The most underrated thing on this list. Granite to 2,655 m, an electric railway linking the villages, a real hut network, and the lowest prices in the EU Alps. Almost nobody from western Europe goes. The catch is that it is off every other spine — a start or an end, not a middle.',
 pro:['Cheapest in the EU','Real granite peaks','A hut network and a mountain railway'],
 con:['Off every rail spine','Comfort floor moderate','Weather turns fast']},
{n:'Kaçkar',crowd:1,crowdN:"A handful of Turkish groups in August. Otherwise you have the range to yourself.",club:"No hut association — accommodation is family pensions and yayla houses, arranged directly. TDF, the Turkish mountaineering federation, exists but is not a hut network. Book through your guesthouse.",rain:"⚠ Thin, and you will need it — this is the wettest range in Turkey. Rize for tea plantations and the Ayder thermal baths. The Sumela monastery, cut into a cliff, is two hours and spectacular. Otherwise you sit it out.",drink:"Çay, constantly, from tulip glasses — this is Turkey’s tea region and the whole economy runs on it. Black Sea rakı is drunk with the anchovies. Local honey is exceptional.",move:"⚠ A car or a driver is essential. Roads are steep, wet and often unpaved, and the yayla villages are unreachable otherwise. Consider hiring a driver rather than self-driving.",kit:"Waterproofs that actually work, and a spare set. Boots, not trail shoes — the mud is real. A GPS track; signage is almost nonexistent and cloud sits for days.",disc:{"lang": {"sc": 2, "s": "Latin", "t": "Turkish, plus Laz and Hemshin in the highland villages. English is rare outside Trabzon and a few guesthouses. Trail marking is minimal and inconsistent — a GPS track is essentially mandatory.", "words": ["Merhaba · hello", "Teşekkürler · thank you", "Yayla nerede? · where is the highland pasture?"]}, "veg": {"sc": 3, "t": "Black Sea cooking is butter, cheese and anchovies, so the classics are out. But Turkey generally is excellent for vegetables — zeytinyağlı, the olive-oil cooked vegetable tradition, is a whole menu section. In the yayla it is bread, cheese and honey.", "ask": "Etsiz, peynirsiz, yumurtasız — zeytinyağlı olsun"}, "med": {"sc": 2, "t": "⚠ Thin. AKUT and jandarma handle rescue and are willing but slow. Nearest real hospital is Rize or Trabzon, hours of steep wet road away. Weather grounds helicopters routinely here."}, "con": {"sc": 3, "t": "Reasonable in the valleys, none on the range. Turkish cards and contactless work well in towns; the yayla is cash. Lira inflation means prices change fast."}, "soc": {"sc": 4, "t": "Safe and hospitable. The Black Sea is more conservative than the coast — modest dress in villages is expected and appreciated. Tea will be offered constantly."}, "hosp": "Overwhelming and specific. Black Sea people have a reputation within Turkey for directness and warmth in equal measure. You will be given tea by strangers repeatedly and refusing is genuinely rude.", "who": "Turkish trekkers from Istanbul and Ankara, a handful of Germans and Poles. Almost no other foreigners."},cty:"Turkey",masc:"Yaban domuzu",mascEn:"the wild boar",mascL:"Heard rather than seen, in the cloud forest at night.",season:[0, 0, 0, 0, 0, 1, 2, 2, 2, 1, 0, 0],best:"July to Sept",seasonN:"The wettest range in Turkey. July and August are the only reliably clear months; the yayla villages empty from late September.",lat:40.85,lon:41.16,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAECAwQF/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAEC/9oADAMBAAIQAxAAAAHHQC+jh9g8vLv5LOe1ZQqFDY9JoJbKrPqMMLy1Il1GVzZLVULRDIDab0xrHeJPQ4O3Kzz9c2bS6lM6ZnqbmMdWicFvm1LzpyxcKwKgBAXMmpAvch4uboI6sHU4dKrE6cIBaB2czO1cu5zcvbz2c2kakrq7TxFthYjowCQVmpl1pkoAJippsl3mNOzoOUNtuXoOV9fERPo8Z16c/nHZx86s6HzXGqqok1F1IIsCmhiTC+jk664XtmZm0krTE1ziRrNk56iYlQAmO87VjI70PCFZUMlLM2uhmylKsdwlFTJVSSVJOe6OethML1IiqCSi0AyTAYFPMEphAgKApoIAAQU5BRAlIAAgAr//xAAjEAACAgICAwADAQEAAAAAAAAAAQIRECEDEiAxQRMiMDJC/9oACAEBAAEFArtoi7l+N0/beIjos/5yyOEy/wBrsXv6PC94i6cF1a0Q0La5OJEoISEj5GJRX6/ZeitiUYprcnpe2rxVrHbSeiyXqJHkcXK2paxR8+j9fGI5CByzQ3oQ1Qlh5iNordaH745WudY2Wxeh+q1xxscKc0ur8JKiRHD8KzemK01O1yRIjyiMjsrQ0mcsHT/zirJRdIf8H5acT6hQZ+PcGKRPlo69haYoditckOsiv16vMf5uHYSZxrU3RGj7NX  fly:16,hop:'2 flights + 3 hr drive',acc:'Istanbul then Trabzon, then a long drive. A full day and a half.',an:'boar',
 col2:'The wettest mountains in Turkey and the only temperate rainforest — beech, chestnut, rhododendron. Colour is riotous and late, into November, and utterly unlike the Alps.',
 food:'Black Sea cooking, which is nothing like the coast you just saw. Anchovies in everything, corn instead of wheat, muhlama — the cheese-and-cornmeal fondue — and more butter than anywhere else in Turkey.',
 eat:['Muhlama · melted cheese and cornmeal','Hamsi · Black Sea anchovies, in season Nov','Karalahana çorbası · black cabbage soup','Highland honey from the yayla'],
 safe:'Safe, but remote. Roads are the real hazard — steep, wet and often unpaved. Very little English. Weather changes with no warning and the cloud sits on the range for days.',
 music:'horon',
 v:'Turkey\'s Alps, and green in a way no other range here is — yayla villages, wooden houses, cloud forest. You have just been in Turkey and liked it. The catch is access: a day and a half door to door, and the comfort floor is guesthouses and pensions.',
 pro:['Cheapest on the list','Landscape unlike anything else here','You already know the country'],
 con:['Hardest to reach','Rains constantly','Very little infrastructure']},
{n:'Rila & Pirin',crowd:2,crowdN:"Seven Lakes gets a weekend crowd from Sofia. The rest is near-empty.",club:"BTS, the Bulgarian tourist union, inherited the socialist-era hut network and still runs it. Reciprocal cards get little here, but the huts are among the cheapest in Europe and take walk-ins.",rain:"Good. Rila Monastery is worth a full day and is better in mist. Bansko has a walkable old town and thermal baths at Banya nearby. Sofia is two hours.",drink:"Rakia, plum or grape, home-distilled and offered constantly — refusing is harder than drinking it. Melnik wine from the south Pirin, made from a grape grown nowhere else.",move:"Buses reach Bansko and Borovets from Sofia cheaply. Beyond that a car helps but is not essential — the huts are walk-in.",kit:"Sleeping bag liner for the huts. Poles. Cash — the huts take nothing else. Nothing technical.",disc:{"lang": {"sc": 2, "s": "Cyrillic", "t": "Bulgarian in Cyrillic — a real daily friction. Trail signs and hut names are often Cyrillic only. English is common in Sofia and Bansko, thin elsewhere. Learn the alphabet on the plane; it takes an hour and changes everything.", "words": ["Добър ден · dobar den, good day", "Благодаря · blagodarya, thank you", "⚠ Nodding means no. Shaking means yes."]}, "veg": {"sc": 4, "t": "Good, again thanks to Orthodox fasting. Postno means fasting food and it is on every menu. Shopska salad without cheese, bean stew, grilled vegetables, banitsa is unfortunately cheese.", "ask": "Постно, моля · postno, molya — fasting food please"}, "med": {"sc": 3, "t": "Planinska spasitelna sluzhba exists but is thinner than the Alps. EU card valid. Huts are basic and evacuation from the Rila interior is slow. Insurance with mountain cover is sensible."}, "con": {"sc": 4, "t": "Good 4G, and Bulgaria has fast cheap internet. Cards accepted in towns, cash in huts. Lev, pegged to the euro."}, "soc": {"sc": 4, "t": "Safe. Normal caution with Sofia taxis. Stray dogs in villages are the recurring nuisance."}, "hosp": "Warm once you are past the initial reserve, which can read as brusqueness and is not. Rakia will be offered and refusing is a small insult.", "who": "Bulgarians, Romanians, Greeks, Israelis. Bansko has a large digital-nomad population which has changed the town considerably."},cty:"Bulgaria",masc:"\u0412\u044a\u043b\u043a",mascEn:"the grey wolf",mascL:"A thousand of them in Bulgaria. You may hear one, which is better.",season:[0, 0, 0, 0, 1, 2, 2, 2, 2, 1, 0, 0],best:"Sept",seasonN:"Huts open roughly June to September. The Seven Lakes basin in the first half of September is the window: warm days, cold nights, no crowds.",lat:42.13,lon:23.55,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAECAwT/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/9oADAMBAAIQAxAAAAFvR9+Gb0cub0CDRy5u2ubtmZoRAZS3MPNvTnmuo55TqXNFdpzaGqt1maBjXFWsdb5ql3eCXcwR0vkZ1nMY10ZZPNEiVuWDmhZ7FmNaBCuaevPJ0nOJypLedHldzZm63J2xqdWZ0CMaaVEDcqqCxZ9BTjLcxusk3nCquFRgbCcba3l2t5Y3dY1TJlAolWGTuVSYKbETljqQqDKmtLTk3WR0GIcu+e9PQvGiVeo3LhiJWAAIE0VFQgrozuNKgSHURSQjMoSugWdOSNStsxLrMl0JpQZEjCVYSNkFISaFSQgixY9M6nEbCddhjeUBvO2YS7YAlsCrCVsFJCAASAaASAMws5wLMQK//8QAIhAAAgICAgMBAAMAAAAAAAAAAAECERAhEiAwMUEDIjJA/9oACAEBAAEFAqKKKKKKKKKKKKKzaORyWaxrvXWvA5JDd4rVC/ic5F4oUmhfp4dHJHJFrpaHK+llns4lUz2fBSo5sX6HM5l9rLLZbPvSsLZdDlooa1LR8wyz4WKRci2K3irL2y+nyeiMt3yJCmKYrJRKNtO4m8/EsRUmKCXX7R6K1hFIjqRSJQZTpLk2miOySaEz2LEU2lBI99Ht52fH20xy1ZKquSakOSKwrYopeRLDTz7wnZJNuj44wLIJctsUBCWUV4/fTTH6To5JjaeGpMRFCjlD8NY9Yq8/cS0f2XKKXNEVusrNf4nHEo02j1husIk8WWXmvL6Yx7xBW5YWkh+hbGX0+eB4+OdfmSkf/8QAGxEBAQACAwEAAAAAAAAAAAAAEQABEBIwQAL/2gAIAQMBAT8B4xEREREREbZ26I6CIuNj5OwjtxjxPr//xAAbEQEBAQEAAwEAAAAAAAAAAAAAEQEwAhIhQP/aAAgBAgEBPwGqqqqqqqqqqIiI+N1eFVXs3yvTfKPbru/iic87/wD/xAAkEAAABwABBAIDAAAAAAAAAAAAARARICExQDBBUWEiMnGRsf/a et:4,huts:4,tech:3,hikes:[["Seven Rila Lakes", "12 km \u00b7 700 m \u00b7 5 h", "A staircase of glacial lakes at 2,100\u20132,500 m, and the image everyone has seen without knowing where it is."], ["Musala", "16 km \u00b7 1,000 m \u00b7 7 h", "The highest peak in the Balkans at 2,925 m, with a gondola assist from Borovets and a hut chain on the way."], ["Vihren", "12 km \u00b7 1,100 m \u00b7 7 h", "Pirin\u2011s marble summit at 2,914 m from Bansko. Sharper rock than Rila and a harder day."], ["Rila Monastery to Kirilova Polyana", "10 km \u00b7 400 m \u00b7 4 h", "From one of the great buildings of the Balkans up into the forest behind it."]],reg:'Bulgaria',flag:'🇧🇬',esp:1.10,day:60,mt:4,col:4,cf:2,nv:5,
 fly:15,hop:'2 flights + 2 hr drive',acc:'Sofia, then two hours by road. Easier than it sounds.',an:'wolf',
 col2:'Beech and pine, peaking mid-October. The Seven Rila Lakes basin in autumn light is the image everyone knows without knowing where it is.',
 food:'Balkan, generous, cheap. Banitsa for breakfast, grilled meat, shopska salad, yoghurt that is genuinely better than anywhere else because Bulgaria invented the bacterium.',

 v:'Genuine 2,900 m peaks, a real hut network built in the socialist era, and the cheapest mountains in the EU after Slovakia. Rila monastery is one of the great buildings of the Balkans. But it is off every rail line you would use and the huts are basic.',
 pro:['Cheapest in the EU with Slovakia','2,900 m peaks and a hut network','Rila monastery'],

{n:'Făgăraș',crowd:1,crowdN:"Perhaps a dozen people on the whole ridge on a summer day.",club:"No functioning hut association. The cabanas are privately run or abandoned, and Salvamont is the volunteer rescue service. Carry a tent regardless of what the map shows.",rain:"Strong, and it is a reason to come. Sibiu and Brașov are proper Saxon cities with squares, cafés and museums. Bran and Peleș castles, the fortified churches, the Transfăgărășan drive itself.",drink:"Țuică, twice-distilled plum brandy, and everyone’s grandmother makes a stronger one. Romanian wine is genuinely good and absurdly cheap — Fetească Neagră is the one.",move:"⚠ A car, definitely. The Transfăgărășan is the point, the trailheads are scattered, and rural buses are infrequent. Roads are decent.",kit:"⚠ Bear awareness is the real kit item — food storage, noise, and knowing what to do. A tent; the refuges are unreliable. Water for the long dry ridge sections.",disc:{"lang": {"sc": 3, "s": "Latin", "t": "Romanian, a Romance language so Italian and French speakers get some purchase. English is good in Sibiu and Brașov, thin in villages. Trail marking uses coloured symbols and is reasonably maintained.", "words": ["Bună ziua · good day", "Mulțumesc · thank you", "Unde este poteca? · where is the trail?"]}, "veg": {"sc": 4, "t": "Better than expected because of Orthodox fasting — de post means fasting food, which is effectively vegan, and it is a normal menu category. Ask for mâncare de post and you will be understood immediately.", "ask": "Mâncare de post, vă rog · fasting food, please"}, "med": {"sc": 3, "t": "Salvamont mountain rescue exists and is competent but coverage on the Făgăraș ridge is thin. EU card valid. Serious injury on the ridge means a long evacuation. Bears are a genuine medical risk here in a way they are not elsewhere."}, "con": {"sc": 3, "t": "Surprisingly good 4G in towns and even some valleys — Romania has excellent internet. Cards accepted in cities, cash in villages. Lei, not euro."}, "soc": {"sc": 4, "t": "Safe, with normal city precautions in Bucharest. Rural Romania is conservative but hospitable. Shepherd dogs are the more real concern than people."}, "hosp": "Genuine and sometimes overwhelming. Rural Romanians will feed you and refuse payment. The Saxon towns are more reserved, the mountains much less so.", "who": "Romanians, Hungarians, Poles, and a small dedicated international trekking crowd. The ridge traverse attracts serious walkers only."},cty:"Romania",masc:"R\u00e2s",mascEn:"the lynx",mascL:"Europe\u2019s largest population outside Russia. You will not see it.",season:[0, 0, 0, 0, 0, 1, 2, 2, 2, 1, 0, 0],best:"July to Sept",seasonN:"The ridge is a summer route \u2014 snow lingers into June and returns in October. Beech in the valleys turns through October but the high traverse has closed by then.",lat:45.6,lon:24.73,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGAAAAwEBAAAAAAAAAAAAAAAAAAEDAgT/xAAWAQEBAQAAAAAAAAAAAAAAAAAAAQL/2gAMAwEAAhADEAAAAenGaSJ4M51Pe9ayMHlgAEsUlKwFTywAoa1CTQ0ALSoGQ3gNmFZQmFCYaeQ0kDTUqYUAQDQADTQAA0DAEh2JhAArQhghhg2GDYYjZuRslUTM0ysYYUJm0I0GJ2ZhvayzfCS6Ezl6kyaqhpbMKs60XnEd0yc1q4FLrlLGiZpZYjQKZmymyctNrEY3joIqPdUsAabZXjs0JmF6ZPJfOcQCdLWq2ctZKWoglvFLM6dJZ15qROqCXRF0qyoNGoWKQOqJIemtSlY0ym982rXc9QjfMaNFY2FmwMoXBTARjIbnTMM3eQjfKFXyBYDKXSBx9IVKYV0yCMgV/8QAJhAAAgICAQQCAgMBAAAAAAAAAQIAERIhMQMiMkEQQiAzIzBAUP/aAAgBAQABBQL4uGfUA/j6j/4WJH4Cevyf8rPzqvzyMyMyMyMyMyMymRmZmRmZmTSz/jv/AKnr+nmXa8wccP1NQ/qU1Bxf8ONqNp7FGJ3DqDEVcNWnJEqelguXqczQPTjdpSilleoy25GXS6gJdgJUVcZhaKO2iDjrpeLrhG7kZtao+WUXkaNAwcYgLiIFAlBkxqCmYCmcDLKiBG1Ly6d1H0Lx6eIA56Y3AcHcdhFJpxQKj4Ah0NwDRiXfC+gaXG4tmMbi7j7V+9EFzqiA5oO2dP8AWP1cgHNcgV6Xh0zu6lTtmwQQYywbhByOh9wI/ivcQO7xgpZ9hwugTkvTJHTPdClBtTpHtfnEw6lbrdb2RUuvhecTQyMAIY7Nyrd7BayMg45cVGNNDp 00b7 1,600 m \u00b7 10 h", "Romania\u2011s highest at 2,544 m. Long, remote, and you will likely see nobody for hours."], ["B\u00e2lea Lake to Negoiu", "14 km \u00b7 900 m \u00b7 8 h", "Along the main ridge with the Transf\u0103g\u0103r\u0103\u0219an far below. Cables and exposure on the Strunga Dracului section."], ["The F\u0103g\u0103ra\u0219 ridge traverse", "5\u20137 days \u00b7 70 km", "The great Carpathian traverse \u2014 the whole ridge, hut to hut. One of the last genuinely wild multi-day routes in the EU."], ["B\u00e2lea waterfall", "6 km \u00b7 400 m \u00b7 3 h", "Short, with the cable car as a bail-out. The day for weather."]],reg:'Transylvania · Romania',flag:'🇷🇴',esp:1.40,day:70,mt:4,col:5,cf:2,nv:5,
 fly:15,hop:'2 flights + 2 hr drive',acc:'Bucharest or Sibiu, then road. Sibiu is the better gateway.',an:'lynx',
 col2:'Beech forest on an enormous scale — Europe\'s largest remaining old-growth beech is here — turning copper through October. The Transfăgărășan road through it is the drive.',
 food:'Substantial and under-appreciated. Sarmale, mămăligă, smoked cheese from the shepherds, and Transylvanian Saxon baking in Sibiu and Brașov.',
 eat:['Sarmale · stuffed cabbage','Mămăligă cu brânză · polenta and sheep cheese','Cozonac · sweet bread','Țuică · plum brandy, twice-distilled'],
 safe:'Safe in towns. Europe\'s largest brown bear population is here and encounters on trails are real — several serious incidents a year. Shepherd dogs are the more common problem: carry a stick.',
 music:'doina',
 v:'The wildest mountains in the EU, with Europe\'s biggest bear and wolf populations and old-growth beech forest at a scale that no longer exists further west. Also the least infrastructure of anywhere on this list and the one place where the wildlife is a genuine hazard rather than a delight.',

{n:'Accursed Mountains',crowd:2,crowdN:"Valbona-Theth has become known; a steady trickle, not a crowd. Beyond it, no one.",club:"No association at all — every bed is a family guesthouse arranged directly or through a local agency. There is no organised mountain rescue; that absence is the single most important planning fact here.",rain:"⚠ Very thin. Shkodër has a castle, a decent museum and cafés, but it is three hours away over bad road. In Theth or Valbona a wet day is a day in the guesthouse.",drink:"Raki, which is not the Turkish kind and is much stronger, poured on arrival whether you want it or not. Mountain tea gathered on the slopes. Local honey.",move:"⚠ 4x4 or arranged transfer only. The Koman ferry is part of the journey and runs to a schedule that changes. No public transport in the valleys at all.",kit:"Everything you need, carried in — there are no shops. Cash in lek. Water treatment. A tent if you plan anything beyond the two villages.",disc:{"lang": {"sc": 2, "s": "Latin", "t": "Albanian, which is related to nothing. Italian is widely understood from decades of television; English is good among the young in Theth and Valbona because guesthouses depend on it. Trails on the main pass are marked; everything else is not.", "words": ["Mirëdita · good day", "Faleminderit · thank you", "⚠ Nodding means no here too."]}, "veg": {"sc": 3, "t": "Guesthouse food is what the garden produced — often accidentally vegan, but the lamb is the centrepiece and refusing it is awkward. Flija is made with butter and eggs. Tell them when you book, not when you arrive.", "ask": "Pa mish dhe pa bulmet, ju lutem"}, "med": {"sc": 1, "t": "⚠ Effectively none in the mountains. No organised mountain rescue, no helicopter, and the nearest hospital is hours of bad road away. A broken ankle on the Valbona pass is a serious logistical problem. Evacuation insurance is not optional."}, "con": {"sc": 2, "t": "Patchy. Signal in Theth and Valbona villages, nothing on the pass. Cash only in the mountains — bring lek from Shkodër. Cards work in Tirana and nowhere useful."}, "soc": {"sc": 4, "t": "Far safer than the reputation. Albania has low crime and besa — the code of hospitality and protection — is a real cultural force. A woman alone would draw curiosity, not threat. Dress modestly in villages."}, "hosp": "The most intense on this list. Guests are close to sacred here and you will be fed whether you asked or not, refused payment, and given the best room. It can be overwhelming and it is entirely genuine.", "who": "A young international trekking crowd on the Valbona-Theth route — Germans, Poles, Israelis, Americans. Almost nobody anywhere else in the range."},cty:"Albania",masc:"Shkab\u00eb",mascEn:"the griffon vulture",mascL:"Three metres of wingspan riding the Valbona thermals.",season:[0, 0, 0, 0, 0, 1, 2, 2, 2, 1, 0, 0],best:"Late June to Sept",seasonN:"Guesthouses in Theth and Valbona open roughly May to October and the pass needs to be snow-free. Late September is the quiet end of the season.",lat:42.47,lon:19.82,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAECAwQF/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAEC/9oADAMBAAIQAxAAAAH0HZcpWpcy3YqTllWAiDQ4tzWaAGCAGmKhiIABghhKz0KFBosYOl+fz17J5u0dPmmWo9Zuzfr8/POvTXls9N+ZudpljG75+WvVPMs9E45O05SOXfKtS8qmKzuzkuYo25tTTKLl0xU2aa82pLQOoDrvh2NMUWDQVKRYgXSjOqmVDaRGVzqZtMesKXNp2G2O0SVAxXUOWWp0BtEgrGIHGdZvQczlam7HCVUJmkbc8oNWPTNxtlpnKtsNbJHI6ixrSAWtGBZXLV4hUUWXlLNBYARvjWRQiqV5xtA1z2y0Sp0mWbh0a83UmWuNGgiI5QoArcDNyAsABwA2FVAF0EZ2BvmEsgWTsBrkEZgaf//EACUQAAEDAwQCAwEBAAAAAAAAAAEAAhEQIDEDEiFBEzIiMEJAUP/aAAgBAQABBQJRSKikf4BMLzch4P8ADNs2OdAc7cUMM1azaXgLeLmvDql4C8gXkBTtVbim6zpGsE9+4riBCOkVBavI5DUctyZqlF4gulcIuQ1CF5HEteU/VTdULBDipJRIUyPkEeEeR2CncGUCNpMoOITyLJTHDanmya7kx5UraBRvyUQZoHCBko1yLWv \u00b7 9 h", "The highest peak in the Dinaric Alps at 2,694 m. Scree, no marking above the treeline, and a summit few reach."], ["Blue Eye of Theth", "12 km \u00b7 400 m \u00b7 4 h", "Along the river to a spring so blue it looks manipulated. Swim in it if you can stand the cold."], ["Peaks of the Balkans circuit", "10 days \u00b7 192 km", "Albania, Montenegro and Kosovo in one loop, with border permits. The signature multi-day trek of the region."]],reg:'Theth & Valbona · Albania',flag:'🇦🇱',esp:1.00,day:55,mt:5,col:4,cf:1,nv:5,
 fly:16,hop:'2 flights + ferry + 4x4',acc:'Tirana, then a bus, a ferry up Lake Koman, and a 4x4. The journey is the adventure.',an:'vulture',
 col2:'Beech and chestnut, peaking late October. The Valbona-to-Theth pass in autumn is one of the great walks in Europe and almost nobody knows it.',
 food:'Simple mountain food, huge portions, everything from the garden. Byrek, flija — a layered pancake cooked under embers — lamb, and honey. Guesthouses feed you whether you asked or not.',
 eat:['Flija · layered pancake, cooked under coals','Byrek','Fresh trout from the Valbona river','Raki, which is not Turkish rakı and is stronger'],
 safe:'Safer than its reputation by a long way — Albania has low crime and famously fierce hospitality. The hazards are the roads, the lack of rescue services, and trails that are unmarked once you leave the main route.',
 music:'iso',
 v:'The most dramatic mountains on this entire list, and the least prepared for you. The Koman ferry and the Valbona pass are genuinely great travel. But comfort is guesthouse-with-a-shared-bathroom, and a month here would be a different kind of trip entirely.',
 pro:['Most dramatic terrain here','Astonishing hospitality','Cheapest of all'],
 con:['Comfort floor is the lowest','No rescue infrastructure','Getting there is a two-day project']},
{n:'Svaneti',crowd:2,crowdN:"Mestia to Ushguli has a following now. The side valleys are empty.",club:"No hut network. Guesthouses in every village, arranged a day ahead. The Georgian alpine club exists but does not run accommodation. Rescue is improvised.",rain:"Thin but interesting. Mestia has the Svaneti museum, which is genuinely good, and the tower houses themselves. Otherwise it is a guesthouse day, and the food makes that acceptable.",drink:"Chacha, grape spirit, poured at every meal by a tamada who will make you drink to a long list of things. Qvevri wine — amber, fermented in buried clay, and the oldest winemaking tradition on earth.",move:"⚠ Marshrutka or a hired 4x4. The Zugdidi road is long and rough, and the Ushguli track is 4x4 only. Mestia has a small airport with unreliable flights.",kit:"Cash — no cards outside Mestia. Sturdy boots for the Ushguli track. Layers; it is cold at altitude even in summer.",disc:{"lang": {"sc": 1, "s": "Georgian", "t": "⚠ Georgian has its own alphabet — beautiful and completely opaque. Svan is a separate language again, spoken at home. Russian works with anyone over forty; English with young guesthouse hosts in Mestia only. Signage is minimal and Georgian-script.", "words": ["გამარჯობა · gamarjoba, hello", "მადლობა · madloba, thank you", "ღვინო · ghvino, wine"]}, "veg": {"sc": 5, "t": "Accidentally excellent. Orthodox fasting means a huge repertoire of vegan dishes — lobio, pkhali, badrijani, ajapsandali — and they are normal food, not substitutes. Svaneti is more meat-focused than the lowlands but the tradition is there.", "ask": "მარხვის კერძები · marxvis kerdzebi — fasting dishes"}, "med": {"sc": 1, "t": "⚠ Very thin. A small hospital in Mestia, nothing above it. No organised mountain rescue. Evacuation means a helicopter from Tbilisi if you can arrange and pay for one. This is the most serious medical gap on the list."}, "con": {"sc": 2, "t": "Signal in Mestia and Ushguli, nothing between. Cash is essential — a few ATMs in Mestia and none beyond. Georgian lari."}, "soc": {"sc": 3, "t": "Georgia is very safe. Svaneti historically had a reputation for lawlessness that is now outdated but leaves traces — the towers exist because of blood feuds. A woman alone is fine; drinking culture at a supra is intense and hard to decline."}, "hosp": "Legendary and non-negotiable. The supra — the ritual feast with a tamada leading toasts — will consume an evening and cannot be politely shortened. Refusing chacha requires real skill.", "who": "A small determined trekking crowd — Poles, Israelis, Germans, Russians. Mestia has grown a lot; Ushguli less so."},cty:"Georgia",masc:"\u10ef\u10d8\u10ee\u10d5\u10d8",mascEn:"the Caucasian tur",mascL:"A wild goat found nowhere else on earth. Lives on ground you would not attempt.",season:[0, 0, 0, 0, 0, 2, 2, 2, 2, 0, 0, 0],best:"Late June to early Sept",seasonN:"\u26a0 The season ends in September. Guesthouses on the Mestia\u2013Ushguli route start closing in October and the high passes go. This is not an autumn destination.",lat:43.05,lon:42.73,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQABAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//aAAwDAQACEAMQAAABDvxAAKIolAAgsoAAiiASogKqoolAAIUzqDcERqdM65zrgzZdZBQiAAosAAFllzcbbxqWTe9Z4610jnvizrrMrJj05s4jeQAIoCggEcelmp1l57yyrt149c15vX5LF59bGpZZNwvLpNZwN5AAAAVrNzJc72mo5tc66d+Os32eXvE+f06+bUuJauNB34SXvnldZ0zTo5E62SzTOpSzO1IZnOztOWJezzI9/LzWOk5q6uetTd45X0XhJO7jutSwAxgytFCR1K8+SrsiUlohCs5NZQqwjUDWhdiX/8QAJRAAAgECBgICAwAAAAAAAAAAAAERAhADEiAhMUEwQBMiMkJg/9oACAEBAAEFAv4tJv14099cjUepB0700uocISyqRP7Nejy3ZVbx9XQiB1whPa0jp88yU0xebYcGKhH6riz4loq38tT2w0LhXXFKcYm9I2LQrPyVRSNxeo7gw7VUPNUoY6yWZqrU7CadpRmM3gf5VcGyGc2UiJMQbn0u+udEnyb/AD0lWM2yfJKMyJRs79tokbgzjqb1IlkmYkdYqts5m093zMzbku3Ytc2WluSZqW6/  col2:'⚠ Autumn is not Svaneti\'s season. Prime trekking is late June to early September; by October the high passes are closing and guesthouses start shutting. Colour here is thin — birch and beech in the valleys, and the show is the glaciers, not the trees.',

{n:'Kazbegi & Racha',crowd:3,crowdN:"Gergeti church is a coach stop; walk an hour past it and it thins to nothing.",club:"Same as Svaneti — guesthouses, not huts. The Kazbegi meteo station is a private shelter, not an association hut. No reciprocal card helps here.",rain:"Reasonable. Tbilisi is three hours and one of the great cities to sit out weather in — sulphur baths, wine bars, the old town. Closer, the Ananuri fortress is on the way up.",drink:"Qvevri wine again, and Kakheti’s harvest festival in late September is the single best reason to be in Georgia that month. Chacha everywhere else.",move:"Marshrutkas run Tbilisi to Stepantsminda all year on a maintained road. Beyond that, a 4x4 or a hired driver for Juta, Truso and Shatili.",kit:"Layers — 1,750m base, colder than the forecast. Cash. Nothing technical unless you go for Kazbek itself, which is a glaciated climb.",disc:{"lang": {"sc": 2, "s": "Georgian", "t": "Same Georgian alphabet, but Kazbegi is three hours from Tbilisi on a highway and the tourism infrastructure is far more developed — English in guesthouses is normal, signage better, and Russian universal.", "words": ["გამარჯობა · gamarjoba", "გაუმარჯოს · gaumarjos, the toast", "მადლობა · madloba"]}, "veg": {"sc": 5, "t": "Same excellent fasting tradition, with far better access to it. Tbilisi has a real vegan scene, and Kazbegi guesthouses handle it without fuss. Rtveli in late September is the grape harvest and the food that goes with it.", "ask": "მარხვის კერძები, თუ შეიძლება"}, "med": {"sc": 3, "t": "Better than Svaneti by a distance. Clinic in Stepantsminda, and Tbilisi is three hours on a maintained road. Still no organised mountain rescue above the village — the Gergeti glacier claims people most years."}, "con": {"sc": 4, "t": "Good 4G in Stepantsminda and along the highway. Georgia has cheap fast internet and eSIMs are easy. ATMs in town; Racha villages are cash."}, "soc": {"sc": 4, "t": "Very comfortable. Kazbegi is a well-travelled destination with a mixed international crowd. Racha is quieter and more traditional."}, "hosp": "The same Georgian intensity with more practice at handling visitors. A supra will still take your evening — but here you can decline the third chacha without offence.", "who": "A genuinely mixed crowd — Israelis, Poles, Russians, western Europeans, and a large Georgian domestic contingent at weekends. Racha next door has essentially none."},cty:"Georgia",masc:"\u10ef\u10d8\u10ee\u10d5\u10d8",mascEn:"the Caucasian tur",mascL:"Same goat, better road to reach it.",season:[0, 0, 0, 0, 1, 2, 2, 2, 2, 2, 1, 0],best:"Sept to mid-Oct",seasonN:"The exception in the Caucasus \u2014 Kazbegi is three hours from Tbilisi on a year-round highway. Late September is rtveli, the grape harvest, and Racha holds colour into October.",lat:42.66,lon:44.62,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQABAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAEC/9oADAMBAAIQAxAAAAH6CrIolAABKJNQyCTUSLKoKWWVRZQCiAAABSSiAk0rM3zMY4TWfR18Oj3Xj2zaFoCia+N1j6WPjw+8+d7zQUEFJNRRxR4sY3NWas1maR146X36+b1zfa8epfU8w+SlQgthdsDr6PEPq+n4I+9n4uj2+fm1npMU3nFNzmOuuA7646rpMDbA8xMVYKgqKWCoLc1da51NsWtIgKAWDbA0yTnc3OpQiwqKWUEKiKlsqItkNsq0lFgAIMCWwIAKUgBoASAUqCKFBAKK/8QAIxAAAgIABgIDAQAAAAAAAAAAAQIAEQMQEhMgMARAITFgFP/aAAgBAQABBQL8YzBZrgaA37LMFyMqoGgfneRNRXDN2O+mFvmA5VkrVFOrjvPP6DRZmgJETyIrBupsQCFrM+uWr53DNxoMQzc56jLMDssHkvF8hTFdWmtbOIoj4twmXneVzVPuAZXLl9ty+V8Q0v0767l+nf6P/8QAFREBAQAAAAAAAAAAAAAAAAAAUBH/2gAIAQMBAT8BKr//xAAYEQEAAwEAAAAAAAAAAAAAAAARACBQMP/aAAgBAgEBPwHGKEOBrf/EACIQAAICAgEDBQAAAAAAAAAAAAABITERMBACUWEiQWBwkf/aAAgBAQAGPwL5TN8RxOleRrtt8k3ssolmUz1r8IedXfVZ7E6LZbI6mSkyYIeTGUWQ4+vf/8QAJhAAAgEDBAICAgMAAAAAAAAAAAERECExIDBBUWFxQKFgkYGx4f/aAAgBAQABPyH8Lg8g+ht0kN5SfoRh8eKZzLwjm6WyJa1x5GHZwxbwjyhXVrrVGiXR8oQk
