<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where to walk?</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Worth going">
<meta name="theme-color" content="#2B2118">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Courier+Prime:wght@400;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B2118; --paper:#EFE6D5; --card:#FBF6EA; --stamp:#B8322B; --blue:#2C5C8A;
  --green:#3E7A4A; --gold:#E0A125; --violet:#6B4A7A; --grey:#8A8072; --teal:#2E8B8B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:15px;line-height:1.5;
  background-image:repeating-linear-gradient(45deg,rgba(43,33,24,.018) 0 2px,transparent 2px 5px)}
.wrap{max-width:1080px;margin:0 auto;padding:0 13px 80px}

header{background:var(--ink);color:var(--paper);border-bottom:5px solid var(--stamp);position:relative;overflow:hidden}
.hd{max-width:1080px;margin:0 auto;padding:15px 14px 13px;position:relative;z-index:2}
h1{font-family:'Bungee',cursive;font-size:clamp(25px,6.2vw,42px);line-height:1;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--gold)}
.hsub{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.1em;margin-top:8px;opacity:.8}
#steam{position:absolute;right:-10px;top:-10px;width:190px;opacity:.16}

/* the chart */
.mapbox{border:3px solid var(--ink);border-radius:4px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);margin:14px 0;background:#CFE0EA}
#worldmap{display:block;width:100%;height:auto;background:#C6DCE8}
.maplg{background:var(--card);border-top:3px solid var(--ink);padding:7px 10px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.rg{font-family:'Courier Prime',monospace;font-size:11px;font-weight:700;padding:4px 10px;border:2px solid var(--ink);
  border-radius:2px;background:#FFF;cursor:pointer;color:var(--ink)}
.rg.on{background:var(--gold)}
.maphint{margin-left:auto;font-family:'Courier Prime',monospace;font-size:10px;color:#6B6155}
.mpk{cursor:pointer}
.mpk:hover{filter:brightness(1.1)}
.chart{background:var(--card);border:3px solid var(--ink);border-radius:4px;padding:12px 14px;
  box-shadow:6px 6px 0 var(--ink);margin:14px 0}
.charth{font-family:'Bungee',cursive;font-size:15px;letter-spacing:.01em}
.chartd{font-size:11.5px;color:#6B6155;margin-top:2px;font-weight:600}
.bars{margin-top:11px}
.br{display:grid;grid-template-columns:118px 1fr auto;gap:8px;align-items:center;margin-bottom:5px;cursor:pointer}
.br:hover .brb i{filter:brightness(1.12)}
.brn{font-size:11.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brb{height:19px;background:#E2D8C4;border:2px solid var(--ink);border-radius:2px;overflow:hidden;position:relative}
.brb i{display:block;height:100%}
.brb em{position:absolute;inset:0;display:flex;align-items:center;padding-left:7px;font-style:normal;
  font-family:'Courier Prime',monospace;font-size:9.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.brv{font-family:'Courier Prime',monospace;font-weight:700;font-size:12.5px;white-space:nowrap;width:52px;text-align:right}

.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 11px}
.sortlab{font-family:'Bungee',cursive;font-size:13px;letter-spacing:.01em}
.selwrap{position:relative;flex:1;min-width:190px;max-width:330px}
.selwrap::after{content:'▾';position:absolute;right:11px;top:50%;transform:translateY(-52%);
  font-size:14px;pointer-events:none;color:var(--ink)}
#sort{appearance:none;-webkit-appearance:none;width:100%;font-family:'Courier Prime',monospace;font-weight:700;
  font-size:13px;padding:8px 30px 8px 11px;border:2.5px solid var(--ink);border-radius:3px;
  background:var(--gold);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
#sort:focus{outline:none;box-shadow:3px 3px 0 var(--stamp)}
#sort optgroup{background:var(--card);font-style:normal;font-weight:700}
#sort option{background:var(--card);font-weight:400;padding:4px}
.chip{font-family:'Courier Prime',monospace;font-weight:700;font-size:12px;padding:6px 11px;border:2.5px solid var(--ink);
  border-radius:3px;background:var(--card);cursor:pointer;box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.chip.on{background:var(--gold)}
.cnt{flex-basis:100%;font-family:'Courier Prime',monospace;font-size:11px;color:#6B6155;line-height:1.35}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:13px}
.d{background:var(--card);border:3px solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--ink);
  overflow:hidden;cursor:pointer;transition:transform .13s;position:relative}
.d:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.photo{position:relative;height:132px;overflow:hidden;border-bottom:3px solid var(--ink);background:#C8D4DC}
.photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.94) contrast(1.03)}
.pc{position:absolute;left:0;bottom:0;background:rgba(43,33,24,.82);color:var(--paper);
  font-family:'Courier Prime',monospace;font-size:9.5px;font-weight:700;padding:3px 8px;letter-spacing:.03em}
.dtop{padding:11px 13px 0;display:grid;grid-template-columns:1fr 74px;gap:10px}
.dreg{font-family:'Courier Prime',monospace;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--stamp);text-transform:uppercase}
.dn{font-family:'Bungee',cursive;font-size:21px;line-height:1.05;margin-top:2px}
.dsub{font-size:11.5px;color:#6B6155;font-weight:600;margin-top:2px}
.stampwrap{position:relative}
.stamp{position:absolute;right:-4px;top:-4px;transform:rotate(-11deg)}
.stamp svg{width:78px;height:78px;display:block}
.money{display:flex;gap:7px;margin:11px 13px 0}
.mo{flex:1;border:2.5px solid var(--ink);border-radius:3px;padding:6px 7px;text-align:center;background:#FFF}
.mo b{display:block;font-family:'Bungee',cursive;font-size:18px;line-height:1.05}
.mo span{font-family:'Courier Prime',monospace;font-size:9px;font-weight:700;color:#6B6155}
.mo.esp{background:#F6EBD4}.mo.esp b{color:#8A5A1E}
.mo.pk{background:#E4EDF6}.mo.pk b{color:#2C5C8A}
.season{margin:10px 13px 0}
.seasonh{font-family:'Courier Prime',monospace;font-size:10px;font-weight:700;color:#6B6155;margin-top:4px}
.seasonh b{color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:1.5px}
.strip i{height:13px;border:1.5px solid var(--ink);border-radius:1px;background:#EDE4D2}
.strip i.ok{background:var(--gold)}.strip i.peak{background:var(--green)}
.strip i.off{background:#DCD3C0;opacity:.5}
.striplab{display:grid;grid-template-columns:repeat(12,1fr);gap:1.5px;font-family:'Courier Prime',monospace;
  font-size:7px;font-weight:700;text-align:center;color:#8A8072;margin-top:2px}
.hikeline{margin:9px 13px 0;font-family:'Courier Prime',monospace;font-size:11px;font-weight:700;
  color:var(--stamp);border-left:3px solid var(--stamp);padding-left:8px;line-height:1.35}
.scores{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;margin:11px 13px;font-size:10px;font-weight:800}
.scores .l{color:#6B6155;width:80px}
.sb{height:9px;background:#E2D8C4;border:2px solid var(--ink);border-radius:2px;overflow:hidden}
.sb i{display:block;height:100%}
.sb.mt i{background:var(--stamp)}.sb.col i{background:var(--gold)}
.sb.net i{background:var(--green)}.sb.hut i{background:var(--blue)}.sb.tec i{background:var(--violet)}
.sb.cf i{background:var(--blue)}.sb.nv i{background:var(--violet)}
.scores .v{font-family:'Bungee',cursive;font-size:11px;width:12px;text-align:right}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin:10px 13px 0}
.fl{display:flex;align-items:center;gap:5px;font-family:'Courier Prime',monospace;font-size:10px;font-weight:700;
  padding:3px 8px;border:1.5px solid var(--stamp);border-radius:2px;background:#F9DDD8;color:#7A2018}
.fl b{font-size:11px}
.fl.ok{border-color:var(--green);background:#DEEBDA;color:#2A5A34}
.mo.mtq{background:#E8E2D0}.mo.mtq b{color:#5E5344}
.dband{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:10px 13px 0}
.dp{display:flex;align-items:center;gap:6px;font-family:'Courier Prime',monospace;font-size:10px;
  font-weight:700;padding:3px 7px;border:1.5px solid var(--ink);border-radius:2px;background:#FFF;letter-spacing:1px}
.dp b{font-size:12px;letter-spacing:0}
.dp.good{background:#DEEBDA}.dp.mid{background:#FBF0D6}.dp.bad{background:#F9DDD8}
.dp:nth-child(5){grid-column:1/-1}
.mascot{display:grid;grid-template-columns:52px 1fr;gap:9px;align-items:center;margin:11px 13px 0;
  padding:7px 9px;border:2px solid var(--ink);border-radius:3px;background:#F4EDDC}
.mascsvg svg{width:52px;height:auto;display:block}
.mascot b{font-family:'Bungee',cursive;font-size:12px;font-weight:400}
.mascot>div:last-child{font-family:'Courier Prime',monospace;font-size:10.5px;font-weight:700;line-height:1.35}
.mascot span{font-weight:400;color:#6B6155}
.verdict{margin:0 13px 12px;font-size:12.5px;line-height:1.45;border-top:2px dashed var(--grey);padding-top:9px}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin:0 13px 12px}
.tg{font-family:'Courier Prime',monospace;font-size:9.5px;font-weight:700;padding:2px 7px;border:1.5px solid var(--ink);border-radius:2px;background:#FFF}
.tg.go{background:#DCEBD8}.tg.no{background:#FBDDD8}.tg.hm{background:#FCF0D4}
.access{font-family:'Courier Prime',monospace;font-size:10.5px;font-weight:700;margin:0 13px 12px;color:var(--blue)}

/* sheet */
.sheet{position:fixed;inset:auto 0 0 0;max-height:92vh;overflow-y:auto;z-index:60;background:var(--card);
  border-top:5px solid var(--ink);transform:translateY(102%);transition:transform .3s cubic-bezier(.3,.8,.4,1)}
.sheet.open{transform:translateY(0)}
.sin{max-width:740px;margin:0 auto;padding:18px 16px 44px;position:relative}
.sx{position:absolute;top:12px;right:12px;width:34px;height:34px;border:3px solid var(--ink);border-radius:3px;
  background:var(--gold);cursor:pointer;font-weight:800;font-size:17px;box-shadow:2px 2px 0 var(--ink)}
.sh{font-family:'Bungee',cursive;font-size:27px;line-height:1.02;padding-right:44px}
.ssub{font-family:'Courier Prime',monospace;font-size:12px;color:#6B6155;margin:5px 0 14px}
.mascline{display:grid;grid-template-columns:46px 1fr;gap:9px;align-items:center;margin:0 0 11px;
  padding:6px 9px;border:2px solid var(--ink);border-radius:3px;background:#F4EDDC;
  font-family:'Courier Prime',monospace;font-size:11px;font-weight:700;line-height:1.35}
.mascline b{font-family:'Bungee',cursive;font-size:12px;font-weight:400}
.shot{display:block;position:relative;height:190px;overflow:hidden;border:3px solid var(--ink);
  border-radius:4px;box-shadow:3px 3px 0 var(--ink);margin-bottom:11px}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.sec{border:3px solid var(--ink);border-radius:4px;background:#FFF;padding:11px 13px;margin-bottom:9px;box-shadow:3px 3px 0 var(--ink)}
.sech{font-family:'Bungee',cursive;font-size:14px;display:flex;align-items:center;gap:7px}
.secd{font-size:13px;line-height:1.55;margin-top:6px}
.secd b{font-weight:800}
.wild{display:grid;grid-template-columns:88px 1fr;gap:11px;align-items:start}
.wild svg{width:88px;height:auto}
.skey{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-family:'Courier Prime',monospace;font-size:10px;font-weight:700;color:#6B6155}
.skey span{display:flex;gap:5px;align-items:center}
.skey i{width:12px;height:12px;border:1.5px solid var(--ink);border-radius:1px;display:block}
.skey i.peak{background:var(--green)}.skey i.ok{background:var(--gold)}.skey i.off{background:#DCD3C0}
.glance{display:grid;grid-template-columns:1fr;gap:3px;margin-top:8px}
.gl{display:flex;align-items:center;gap:10px;font-family:'Courier Prime',monospace;font-size:11.5px;
  font-weight:700;padding:3px 0;border-bottom:1px dashed #DCD3C0}
.gl:last-child{border:none}
@media(min-width:560px){.glance{grid-template-columns:1fr 1fr;gap:3px 20px}}
.dts{font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:1.5px;margin-left:auto}
.dts.good{color:var(--green)}.dts.mid{color:var(--gold)}.dts.bad{color:var(--stamp)}
.phrase{margin-top:8px;background:#F6EBD4;border:2px solid var(--gold);border-radius:3px;padding:7px 10px;
  font-family:'Courier Prime',monospace;font-size:12px;line-height:1.4}
.phrase b{font-weight:700}
.hk{border-left:3px solid var(--stamp);padding-left:10px;margin-top:9px}
.hkn{font-family:'Bungee',cursive;font-size:14px;line-height:1.15}
.hks{font-family:'Courier Prime',monospace;font-size:10.5px;font-weight:700;color:var(--blue);margin-top:1px}
.hkd{font-size:12.5px;line-height:1.45;margin-top:3px}
.pricelist{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-family:'Courier Prime',monospace;font-size:12.5px;margin-top:8px}
.pricelist span:nth-child(even){text-align:right;font-weight:700}
.warn{background:#FBDDD8;border:2.5px solid var(--stamp);border-radius:3px;padding:9px 12px;font-size:12.5px;margin-top:9px;line-height:1.45;font-weight:600}

.hide{display:none!important}
footer{margin-top:26px;padding-top:12px;border-top:3px solid var(--ink);font-family:'Courier Prime',monospace;
  font-size:10.5px;color:#6B6155;display:flex;justify-content:space-between;flex-wrap:wrap;gap:9px;align-items:center}
.snd{font-family:'Bungee',cursive;font-size:12px;border:3px solid var(--ink);border-radius:3px;padding:5px 12px;
  background:var(--card);cursor:pointer;box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.snd.on{background:var(--gold)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <svg id="steam" viewBox="0 0 120 120" aria-hidden="true"></svg>
  <div class="hd">
    <h1>Where to <em>walk?</em></h1>
    <div class="hsub">Alps to the Pamir · ranked by the walking</div>
  </div>
</header>

<div class="wrap">
  <div class="mapbox">
    <svg id="worldmap" viewBox="0 0 1100 500" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="maplg" id="maplg"></div>
  </div>

  <div class="ctl">
    <label class="sortlab" for="sort">Rank by</label>
    <div class="selwrap">
      <select id="sort">
        <optgroup label="The walking">
          <option value="mtq" selected>Best mountains overall</option>
          <option value="hi">Highest peak</option>
          <option value="net">Trail network &amp; huts</option>
          <option value="col">Autumn colour</option>
        </optgroup>
        <optgroup label="Timing">
          <option value="oct">Good in October</option>
        </optgroup>
        <optgroup label="Practical">
          <option value="easy2">Least friction</option>
          <option value="safe">Rescue cover</option>
          <option value="veg">Vegan-friendly</option>
        </optgroup>
        <optgroup label="Money">
          <option value="val">Mountain per euro</option>
          <option value="esp">Cheapest per day</option>
        </optgroup>
      </select>
    </div>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="grid" id="grid"></div>

  <footer>
    <span>Prices are late-2026 estimates · confirm before committing</span>
    <button class="snd" id="snd">♪ music</button>
  </footer>
</div>

<div class="sheet" id="sheet"><div class="sin" id="sin"></div></div>

<script>
/* ============ animals ============ */

chamois:`<svg viewBox="0 0 120 100"><ellipse cx="58" cy="94" rx="26" ry="4" fill="#2B2118" opacity=".2"/>

{n:'Val Gardena',disc:{"lang": {"sc": 5, "s": "Latin", "t": "Italian, German and Ladin all official. Trail signs numbered and multilingual, menus in three languages, everyone in tourism speaks English. Zero friction.", "words": ["Bon dé · good day, in Ladin", "Giulan · thank you, in Ladin", "Servus · hello, German-side"]}, "veg": {"sc": 2, "t": "The known weakness. Speck, dumplings, cheese — the tradition is meat and dairy, and huts have one token vegetarian option at best. A kitchen solves it: supermarkets here stock everything, and the Thursday market has real produce.", "ask": "Senza carne e senza formaggio, per favore"}, "med": {"sc": 5, "t": "Helicopter rescue in twenty minutes, EU health card valid, hospital in Bolzano an hour away. Rescue is charged but insurance covers it. The best in the world, effectively."}, "con": {"sc": 5, "t": "Full 4G/5G everywhere including most trails. Cards accepted universally. ATMs in every village."}, "soc": {"sc": 5, "t": "Completely unremarkable for a couple or a woman alone. Alpine reserve — polite, not intrusive, nobody will approach you."}, "hosp": "Reserved. South Tyrolean politeness is real but distant — people have been in one valley a very long time and do not need anything from a visitor. Warmth has to be earned over a few days at the same hut.", "who": "German and Italian families, Austrian day-trippers, serious via-ferrata people. Very few Americans or British outside July."},cty:"Italy",masc:"Camoscio",mascEn:"the chamois",mascL:"Watches you from higher up the scree and does not move.",season:[0, 0, 0, 0, 1, 1, 2, 2, 2, 2, 1, 0],best:"Late Sept to late Oct",seasonN:"Larch peaks mid-to-late October and the lifts run to 2 November \u2014 the longest autumn window on this list. July and August work but are crowded and thundery.",lat:46.57,lon:11.67,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqP  fly:14,hop:'2 flights + train',acc:'Fly Munich or Venice, then rail and bus. Half a day.',an:'chamois',
 col2:'Larch gold, mid-to-late October, lifts to 2 Nov. The most reliable autumn colour on this list.',
 food:'The known weakness. Speck, dumplings, pizza — a rotation that wore thin by day four last time. A kitchen fixes it: proper butchers, a Thursday market, Graukäse and Speck direct from farms, and supermarkets that stock what you would want.',
 eat:['Törggelen · new wine, chestnuts, speck, Sept–Nov','Schlutzkrapfen · spinach-ricotta ravioli','Kaiserschmarrn at a hut','Graukäse · the sour grey cheese nobody exports'],
 safe:'As safe as anywhere on earth. The only real risks are weather and your own legs.',
 music:'valzer',
 v:'You have been, and the verdict was mixed: mountains excellent, seven nights two too many, food wore thin. The question is not whether it is good — it is whether a kitchen and five nights instead of seven changes the verdict. Probably yes.',
 pro:['Three lifts from the village','Latest lifts anywhere here','Best-drawn autumn on the list'],
 con:['Most expensive per day','Food rotation','You already know it']},

{n:'Berchtesgaden',disc:{"lang": {"sc": 5, "s": "Latin", "t": "German, with English standard in tourism. Trail signage is excellent and consistent. Bavarian dialect is impenetrable but nobody uses it on you.", "words": ["Grüß Gott · the greeting, all day", "Servus · casual hello and goodbye", "Bergheil · what you say on a summit"]}, "veg": {"sc": 2, "t": "Bavarian food is meat and cheese in that order. Guesthouses will manage something if warned; huts will offer Kaiserschmarrn and little else. Salzburg thirty minutes away has proper options.", "ask": "Vegan, bitte — ohne Fleisch, Käse, Butter oder Ei"}, "med": {"sc": 5, "t": "Bergwacht mountain rescue is superb and the Watzmann sees regular callouts. EU card valid, hospital in Berchtesgaden itself."}, "con": {"sc": 5, "t": "Full coverage, cards everywhere, though Germany is more cash-preferring than its neighbours — carry some."}, "soc": {"sc": 5, "t": "As safe and unremarkable as the Alps get."}, "hosp": "Warmer than South Tyrol, in a formal way. The Grüß Gott to every passing walker is genuine and universal — you will say it four hundred times a day.", "who": "Germans, overwhelmingly. Munich weekenders, families, and a serious alpine-club contingent on the Watzmann."},cty:"Germany",masc:"Steinadler",mascEn:"the golden eagle",mascL:"Never flaps. Owns a hundred square kilometres and knows it.",season:[0, 0, 0, 0, 1, 1, 2, 2, 2, 1, 0, 0],best:"Sept to early Oct",seasonN:"Beech turns from mid-September. October is the wettest month here \u2014 ten to twelve rain days \u2014 so the sweet spot is narrower than it looks.",lat:47.59,lon:12.98,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wgARCAC+AbgDASIAAhEBAxEB/8QAGgAAAwEBAQEAAAAAAAAAAAAAAAECAwQFBv/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/9oADAMBAAIQAxAAAAHrbfq8aGyWwRQSUElCyUEjBKiJKCShZb  fly:14,hop:'2 flights + train',acc:'Munich, then two hours by rail and bus.',an:'eagle',
 col2:'Beech and maple, not larch — copper and scarlet, doubled off an almost-black lake. Peaks early October.',
 food:'Bavarian, which means good and heavy. Obatzda, Schweinshaxe, Weisswurst before noon. Berchtesgaden itself is small; the eating is in the guesthouses.',
 eat:['Obatzda · the beer-cheese spread','Kaiserschmarrn again, differently','Königssee smoked trout','Bergkäse from the alm dairies'],
 safe:'Very safe. The Watzmann is not — it kills people most years. The east face is a serious mountaineering objective, not a hike.',
 music:'zwiefacher',
 v:'Already booked for 2027, which makes it a fixed point rather than a candidate. Best terrain on the whole list, one lift, and every other day starts with a bus. The wettest place here — ten to twelve rain days in October.',

 con:['One lift','Wettest place on the list','Bus-dependent']},

{n:'Julian Alps',disc:{"lang": {"sc": 4, "s": "Latin", "t": "Slovene, and English is widely spoken by anyone under fifty. Trail signage is good and uses the same numbering logic as the Alps. Italian and German both help.", "words": ["Dober dan · good day", "Hvala · thank you", "Kje je pot? · where is the path?"]}, "veg": {"sc": 4, "t": "Surprisingly good. Slovenia has a strong vegetable tradition and Ljubljana is genuinely vegan-friendly; Bohinj less so but guesthouses adapt willingly. Štruklji can be made without cheese and often is.", "ask": "Brez mesa in brez mlečnih izdelkov, prosim"}, "med": {"sc": 4, "t": "Good. Slovenian mountain rescue is volunteer-run, well trained and free. EU card valid. Hospital in Jesenice, an hour from Bohinj."}, "con": {"sc": 5, "t": "Excellent coverage and cards accepted everywhere. Euro currency."}, "soc": {"sc": 5, "t": "Very comfortable. Slovenia is among the safest countries in Europe and the mountain culture is family-oriented."}, "hosp": "Understated and genuine. Slovenes are less effusive than the Balkans and less formal than Austria — the middle setting, and easy to be around.", "who": "Slovenes, Italians, Germans, a growing British contingent. Triglav is a national pilgrimage so the trails are full of locals, which changes the feel entirely."},cty:"Slovenia",masc:"Zlatorog",mascEn:"the golden-horned ibex",mascL:"Slovenian legend. Punishes greedy hunters, tolerates walkers.",season:[0, 0, 0, 0, 1, 1, 2, 2, 2, 2, 1, 0],best:"Late Sept to late Oct",seasonN:"Beech turns two to three weeks after larch, so Bohinj holds colour into early November \u2014 the latest window in the Alps.",lat:46.36,lon:13.84,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wgARCAC+AbgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAQIAAwQFBgf/xAAYAQEBAQEBAAAAAAAAAAAAAAAAA  fly:15,hop:'2 flights + bus',acc:'Ljubljana or Venice, then bus. Longer than it looks.',an:'ibex',
 col2:'The last colour in the Alps. Beech turns two to three weeks after larch, so Bohinj is still going in early November. Mist off the lake most October mornings.',
 food:'Underrated and improving fast. Alpine-Italian-Balkan crossover. Štruklji, jota, air-dried Karst pršut, and Slovenia now has more Michelin stars per head than most of Europe.',
 eat:['Štruklji · rolled dumplings, sweet or savoury','Bohinj trout','Kranjska klobasa · the protected sausage','Potica · walnut roll'],
 safe:'Very safe. Trails are rougher and less waymarked than Austria; the Triglav routes have exposed sections with cables.',
 music:'polka',
 v:'The best value in the Alps and the widest colour range on this list — larch and beech in the same frame. The catch is the comfort floor: guesthouses rather than residences, one cable car in the whole massif, rougher trails. Four to six nights, not a fortnight.',
 pro:['30–40% below Austria','Last colour in the Alps','Genuinely wild'],
 con:['One cable car','Comfort floor is low','Mist hides the mountains']},

{n:'High Tatras',disc:{"lang": {"sc": 3, "s": "Latin", "t": "Slovak, with Polish mutually intelligible. English is common among younger people and in the resort villages, patchier in huts. Trail signage is excellent — colour-coded and rigorous.", "words": ["Dobrý deň · good day", "Ďakujem · thank you", "Pivo, prosím · beer, please"]}, "veg": {"sc": 2, "t": "Hard. Bryndzové halušky is sheep cheese and bacon; the tradition is meat, dumplings and dairy. Poprad and Starý Smokovec have a few options. Self-catering is the realistic answer.", "ask": "Bez mäsa a bez mliečnych výrobkov, prosím"}, "med": {"sc": 5, "t": "Horská záchranná služba is excellent and free to EU citizens — Slovakia takes mountain rescue seriously and the Tatras are small enough to reach anywhere fast. Hospital in Poprad."}, "con": {"sc": 4, "t": "Good coverage in the valleys, patchy on the ridges. Cards widely accepted. Euro currency."}, "soc": {"sc": 5, "t": "Very safe and family-oriented. The mountain railway makes everything accessible without a car."}, "hosp": "Straightforward and unsentimental. Not effusive, but hut wardens are helpful and the hiking culture is deeply national — Slovaks take these mountains seriously and respect anyone who does too.", "who": "Slovaks and Poles overwhelmingly, plus Czechs. Almost no western Europeans, which is the point."},cty:"Slovakia",masc:"Svi\u0161\u0165",mascEn:"the marmot",mascL:"Whistles before you see it. Underground by October.",season:[0, 0, 0, 0, 1, 2, 2, 2, 2, 1, 0, 0],best:"Sept to early Oct",seasonN:"Trails above the treeline are officially closed 1 Nov to 15 June. September is the best month: stable weather, thin crowds, larch turning.",lat:49.17,lon:20.13,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wgARCAC+AbgDASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAQIA  fly:15,hop:'2 flights + train',acc:'Vienna or Kraków, then four hours by rail.',an:'marmot',
 col2:'Larch and rowan over a dark dwarf-pine belt, which throws the gold and scarlet into relief. Peaks around 10 October.',
 food:'Hearty and cheap. Bryndzové halušky — potato dumplings with sheep cheese and bacon — is the national dish and it is very good after eight hours walking. Soups, dumplings, and beer that costs less than water elsewhere.',
 eat:['Bryndzové halušky','Kapustnica · cabbage and sausage soup','Žinčica · sour sheep whey, an acquired taste','Tatratea · 52–72%, a warning not a recommendation'],
 safe:'Safe. Brown bears are genuinely present and the densest population in Europe — make noise, do not surprise one. Mountain rescue is excellent and free to EU citizens.',
 music:'fujara',
 v:'The most underrated thing on this list. Granite to 2,655 m, an electric railway linking the villages, a real hut network, and the lowest prices in the EU Alps. Almost nobody from western Europe goes. The catch is that it is off every other spine — a start or an end, not a middle.',
 pro:['Cheapest in the EU','Real granite peaks','A hut network and a mountain railway'],

{n:'Kaçkar',disc:{"lang": {"sc": 2, "s": "Latin", "t": "Turkish, plus Laz and Hemshin in the highland villages. English is rare outside Trabzon and a few guesthouses. Trail marking is minimal and inconsistent — a GPS track is essentially mandatory.", "words": ["Merhaba · hello", "Teşekkürler · thank you", "Yayla nerede? · where is the highland pasture?"]}, "veg": {"sc": 3, "t": "Black Sea cooking is butter, cheese and anchovies, so the classics are out. But Turkey generally is excellent for vegetables — zeytinyağlı, the olive-oil cooked vegetable tradition, is a whole menu section. In the yayla it is bread, cheese and honey.", "ask": "Etsiz, peynirsiz, yumurtasız — zeytinyağlı olsun"}, "med": {"sc": 2, "t": "⚠ Thin. AKUT and jandarma handle rescue and are willing but slow. Nearest real hospital is Rize or Trabzon, hours of steep wet road away. Weather grounds helicopters routinely here."}, "con": {"sc": 3, "t": "Reasonable in the valleys, none on the range. Turkish cards and contactless work well in towns; the yayla is cash. Lira inflation means prices change fast."}, "soc": {"sc": 4, "t": "Safe and hospitable. The Black Sea is more conservative than the coast — modest dress in villages is expected and appreciated. Tea will be offered constantly."}, "hosp": "Overwhelming and specific. Black Sea people have a reputation within Turkey for directness and warmth in equal measure. You will be given tea by strangers repeatedly and refusing is genuinely rude.", "who": "Turkish trekkers from Istanbul and Ankara, a handful of Germans and Poles. Almost no other foreigners."},cty:"Turkey",masc:"Yaban domuzu",mascEn:"the wild boar",mascL:"Heard rather than seen, in the cloud forest at night.",season:[0, 0, 0, 0, 0, 1, 2, 2, 2, 1, 0, 0],best:"July to Sept",seasonN:"The wettest range in Turkey. July and August are the only reliably clear months; the yayla villages empty from late September.",lat:40.85,lon:41.16,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIB  fly:16,hop:'2 flights + 3 hr drive',acc:'Istanbul then Trabzon, then a long drive. A full day and a half.',an:'boar',
 col2:'The wettest mountains in Turkey and the only temperate rainforest — beech, chestnut, rhododendron. Colour is riotous and late, into November, and utterly unlike the Alps.',
 food:'Black Sea cooking, which is nothing like the coast you just saw. Anchovies in everything, corn instead of wheat, muhlama — the cheese-and-cornmeal fondue — and more butter than anywhere else in Turkey.',
 eat:['Muhlama · melted cheese and cornmeal','Hamsi · Black Sea anchovies, in season Nov','Karalahana çorbası · black cabbage soup','Highland honey from the yayla'],
 safe:'Safe, but remote. Roads are the real hazard — steep, wet and often unpaved. Very little English. Weather changes with no warning and the cloud sits on the range for days.',
 music:'horon',
 v:'Turkey\'s Alps, and green in a way no other range here is — yayla villages, wooden houses, cloud forest. You have just been in Turkey and liked it. The catch is access: a day and a half door to door, and the comfort floor is guesthouses and pensions.',
 pro:['Cheapest on the list','Landscape unlike anything else here','You already know the country'],

{n:'Rila & Pirin',disc:{"lang": {"sc": 2, "s": "Cyrillic", "t": "Bulgarian in Cyrillic — a real daily friction. Trail signs and hut names are often Cyrillic only. English is common in Sofia and Bansko, thin elsewhere. Learn the alphabet on the plane; it takes an hour and changes everything.", "words": ["Добър ден · dobar den, good day", "Благодаря · blagodarya, thank you", "⚠ Nodding means no. Shaking means yes."]}, "veg": {"sc": 4, "t": "Good, again thanks to Orthodox fasting. Postno means fasting food and it is on every menu. Shopska salad without cheese, bean stew, grilled vegetables, banitsa is unfortunately cheese.", "ask": "Постно, моля · postno, molya — fasting food please"}, "med": {"sc": 3, "t": "Planinska spasitelna sluzhba exists but is thinner than the Alps. EU card valid. Huts are basic and evacuation from the Rila interior is slow. Insurance with mountain cover is sensible."}, "con": {"sc": 4, "t": "Good 4G, and Bulgaria has fast cheap internet. Cards accepted in towns, cash in huts. Lev, pegged to the euro."}, "soc": {"sc": 4, "t": "Safe. Normal caution with Sofia taxis. Stray dogs in villages are the recurring nuisance."}, "hosp": "Warm once you are past the initial reserve, which can read as brusqueness and is not. Rakia will be offered and refusing is a small insult.", "who": "Bulgarians, Romanians, Greeks, Israelis. Bansko has a large digital-nomad population which has changed the town considerably."},cty:"Bulgaria",masc:"\u0412\u044a\u043b\u043a",mascEn:"the grey wolf",mascL:"A thousand of them in Bulgaria. You may hear one, which is better.",season:[0, 0, 0, 0, 1, 2, 2, 2, 2, 1, 0, 0],best:"Sept",seasonN:"Huts open roughly June to September. The Seven Lakes basin in the first half of September is the window: warm days, cold nights, no crowds.",lat:42.13,lon:23.55,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/P  m from Bansko. Sharper rock than Rila and a harder day."], ["Rila Monastery to Kirilova Polyana", "10 km \u00b7 400 m \u00b7 4 h", "From one of the great buildings of the Balkans up into the forest behind it."]],reg:'Bulgaria',flag:'🇧🇬',esp:1.10,day:60,mt:4,col:4,cf:2,nv:5,
 fly:15,hop:'2 flights + 2 hr drive',acc:'Sofia, then two hours by road. Easier than it sounds.',an:'wolf',
 col2:'Beech and pine, peaking mid-October. The Seven Rila Lakes basin in autumn light is the image everyone knows without knowing where it is.',
 food:'Balkan, generous, cheap. Banitsa for breakfast, grilled meat, shopska salad, yoghurt that is genuinely better than anywhere else because Bulgaria invented the bacterium.',
 eat:['Banitsa · cheese pastry, eaten hot at 7am','Shopska salad','Tarator · cold cucumber-yoghurt soup','Rakia · fruit brandy, and they will insist'],
 safe:'Safe, with the usual advice about taxis in Sofia. Stray dogs in villages. Mountain rescue is thinner than the Alps.',
 music:'horo',
 v:'Genuine 2,900 m peaks, a real hut network built in the socialist era, and the cheapest mountains in the EU after Slovakia. Rila monastery is one of the great buildings of the Balkans. But it is off every rail line you would use and the huts are basic.',
 pro:['Cheapest in the EU with Slovakia','2,900 m peaks and a hut network','Rila monastery'],

{n:'Făgăraș',disc:{"lang": {"sc": 3, "s": "Latin", "t": "Romanian, a Romance language so Italian and French speakers get some purchase. English is good in Sibiu and Brașov, thin in villages. Trail marking uses coloured symbols and is reasonably maintained.", "words": ["Bună ziua · good day", "Mulțumesc · thank you", "Unde este poteca? · where is the trail?"]}, "veg": {"sc": 4, "t": "Better than expected because of Orthodox fasting — de post means fasting food, which is effectively vegan, and it is a normal menu category. Ask for mâncare de post and you will be understood immediately.", "ask": "Mâncare de post, vă rog · fasting food, please"}, "med": {"sc": 3, "t": "Salvamont mountain rescue exists and is competent but coverage on the Făgăraș ridge is thin. EU card valid. Serious injury on the ridge means a long evacuation. Bears are a genuine medical risk here in a way they are not elsewhere."}, "con": {"sc": 3, "t": "Surprisingly good 4G in towns and even some valleys — Romania has excellent internet. Cards accepted in cities, cash in villages. Lei, not euro."}, "soc": {"sc": 4, "t": "Safe, with normal city precautions in Bucharest. Rural Romania is conservative but hospitable. Shepherd dogs are the more real concern than people."}, "hosp": "Genuine and sometimes overwhelming. Rural Romanians will feed you and refuse payment. The Saxon towns are more reserved, the mountains much less so.", "who": "Romanians, Hungarians, Poles, and a small dedicated international trekking crowd. The ridge traverse attracts serious walkers only."},cty:"Romania",masc:"R\u00e2s",mascEn:"the lynx",mascL:"Europe\u2019s largest population outside Russia. You will not see it.",season:[0, 0, 0, 0, 0, 1, 2, 2, 2, 1, 0, 0],best:"July to Sept",seasonN:"The ridge is a summer route \u2014 snow lingers into June and returns in October. Beech in the valleys turns through October but the high traverse has closed by then.",lat:45.6,lon:24.73,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2w  fly:15,hop:'2 flights + 2 hr drive',acc:'Bucharest or Sibiu, then road. Sibiu is the better gateway.',an:'lynx',
 col2:'Beech forest on an enormous scale — Europe\'s largest remaining old-growth beech is here — turning copper through October. The Transfăgărășan road through it is the drive.',
 food:'Substantial and under-appreciated. Sarmale, mămăligă, smoked cheese from the shepherds, and Transylvanian Saxon baking in Sibiu and Brașov.',
 eat:['Sarmale · stuffed cabbage','Mămăligă cu brânză · polenta and sheep cheese','Cozonac · sweet bread','Țuică · plum brandy, twice-distilled'],
 safe:'Safe in towns. Europe\'s largest brown bear population is here and encounters on trails are real — several serious incidents a year. Shepherd dogs are the more common problem: carry a stick.',
 music:'doina',
 v:'The wildest mountains in the EU, with Europe\'s biggest bear and wolf populations and old-growth beech forest at a scale that no longer exists further west. Also the least infrastructure of anywhere on this list and the one place where the wildlife is a genuine hazard rather than a delight.',
 pro:['Wildest place in the EU','Old-growth beech at scale','Sibiu and Brașov are real cities'],

{n:'Accursed Mountains',disc:{"lang": {"sc": 2, "s": "Latin", "t": "Albanian, which is related to nothing. Italian is widely understood from decades of television; English is good among the young in Theth and Valbona because guesthouses depend on it. Trails on the main pass are marked; everything else is not.", "words": ["Mirëdita · good day", "Faleminderit · thank you", "⚠ Nodding means no here too."]}, "veg": {"sc": 3, "t": "Guesthouse food is what the garden produced — often accidentally vegan, but the lamb is the centrepiece and refusing it is awkward. Flija is made with butter and eggs. Tell them when you book, not when you arrive.", "ask": "Pa mish dhe pa bulmet, ju lutem"}, "med": {"sc": 1, "t": "⚠ Effectively none in the mountains. No organised mountain rescue, no helicopter, and the nearest hospital is hours of bad road away. A broken ankle on the Valbona pass is a serious logistical problem. Evacuation insurance is not optional."}, "con": {"sc": 2, "t": "Patchy. Signal in Theth and Valbona villages, nothing on the pass. Cash only in the mountains — bring lek from Shkodër. Cards work in Tirana and nowhere useful."}, "soc": {"sc": 4, "t": "Far safer than the reputation. Albania has low crime and besa — the code of hospitality and protection — is a real cultural force. A woman alone would draw curiosity, not threat. Dress modestly in villages."}, "hosp": "The most intense on this list. Guests are close to sacred here and you will be fed whether you asked or not, refused payment, and given the best room. It can be overwhelming and it is entirely genuine.", "who": "A young international trekking crowd on the Valbona-Theth route — Germans, Poles, Israelis, Americans. Almost nobody anywhere else in the range."},cty:"Albania",masc:"Shkab\u00eb",mascEn:"the griffon vulture",mascL:"Three metres of wingspan riding the Valbona thermals.",season:[0, 0, 0, 0, 0, 1, 2, 2, 2, 1, 0, 0],best:"Late June to Sept",seasonN:"Guesthouses in Theth and Valbona open roughly May to O gro and Kosovo in one loop, with border permits. The signature multi-day trek of the region."]],reg:'Theth & Valbona · Albania',flag:'🇦🇱',esp:1.00,day:55,mt:5,col:4,cf:1,nv:5,
 fly:16,hop:'2 flights + ferry + 4x4',acc:'Tirana, then a bus, a ferry up Lake Koman, and a 4x4. The journey is the adventure.',an:'vulture',
 col2:'Beech and chestnut, peaking late October. The Valbona-to-Theth pass in autumn is one of the great walks in Europe and almost nobody knows it.',
 food:'Simple mountain food, huge portions, everything from the garden. Byrek, flija — a layered pancake cooked under embers — lamb, and honey. Guesthouses feed you whether you asked or not.',
 eat:['Flija · layered pancake, cooked under coals','Byrek','Fresh trout from the Valbona river','Raki, which is not Turkish rakı and is stronger'],
 safe:'Safer than its reputation by a long way — Albania has low crime and famously fierce hospitality. The hazards are the roads, the lack of rescue services, and trails that are unmarked once you leave the main route.',
 music:'iso',
 v:'The most dramatic mountains on this entire list, and the least prepared for you. The Koman ferry and the Valbona pass are genuinely great travel. But comfort is guesthouse-with-a-shared-bathroom, and a month here would be a different kind of trip entirely.',
 pro:['Most dramatic terrain here','Astonishing hospitality','Cheapest of all'],
 con:['Comfort floor is the lowest','No rescue infrastructure','Getting there is a two-day project']},

{n:'Svaneti',disc:{"lang": {"sc": 1, "s": "Georgian", "t": "⚠ Georgian has its own alphabet — beautiful and completely opaque. Svan is a separate language again, spoken at home. Russian works with anyone over forty; English with young guesthouse hosts in Mestia only. Signage is minimal and Georgian-script.", "words": ["გამარჯობა · gamarjoba, hello", "მადლობა · madloba, thank you", "ღვინო · ghvino, wine"]}, "veg": {"sc": 5, "t": "Accidentally excellent. Orthodox fasting means a huge repertoire of vegan dishes — lobio, pkhali, badrijani, ajapsandali — and they are normal food, not substitutes. Svaneti is more meat-focused than the lowlands but the tradition is there.", "ask": "მარხვის კერძები · marxvis kerdzebi — fasting dishes"}, "med": {"sc": 1, "t": "⚠ Very thin. A small hospital in Mestia, nothing above it. No organised mountain rescue. Evacuation means a helicopter from Tbilisi if you can arrange and pay for one. This is the most serious medical gap on the list."}, "con": {"sc": 2, "t": "Signal in Mestia and Ushguli, nothing between. Cash is essential — a few ATMs in Mestia and none beyond. Georgian lari."}, "soc": {"sc": 3, "t": "Georgia is very safe. Svaneti historically had a reputation for lawlessness that is now outdated but leaves traces — the towers exist because of blood feuds. A woman alone is fine; drinking culture at a supra is intense and hard to decline."}, "hosp": "Legendary and non-negotiable. The supra — the ritual feast with a tamada leading toasts — will consume an evening and cannot be politely shortened. Refusing chacha requires real skill.", "who": "A small determined trekking crowd — Poles, Israelis, Germans, Russians. Mestia has grown a lot; Ushguli less so."},cty:"Georgia",masc:"\u10ef\u10d8\u10ee\u10d5\u10d8",mascEn:"the Caucasian tur",mascL:"A wild goat found nowhere else on earth. Lives on ground you would not attempt.",season:[0, 0, 0, 0, 0, 2, 2, 2, 2, 0, 0, 0],best:"Late June to early Sept",seasonN:"\u26a0 The season ends in Septembe  col2:'⚠ Autumn is not Svaneti\'s season. Prime trekking is late June to early September; by October the high passes are closing and guesthouses start shutting. Colour here is thin — birch and beech in the valleys, and the show is the glaciers, not the trees.',
 food:'One of the great undiscovered cuisines, and Svaneti has its own version. Kubdari — bread stuffed with spiced meat — is the regional dish. Svanetian salt is a spice mix worth bringing home.',
 eat:['Kubdari · spiced meat bread','Khachapuri, every region differently','Chvishtari · cornbread with cheese','Chacha · grape spirit, offered constantly'],
 safe:'Georgia is generally very safe and hospitality is overwhelming. The specific risks in Svaneti are the road in, shepherd dogs, and a mountain rescue capability that is thin. Trails are less structured than western Europe.',
 music:'svan',
 v:'Medieval stone towers under glaciated 4,000 m peaks, and nothing else on earth looks like it. But the honest verdict for an autumn trip is that you would be going at the wrong time — the season ends in September and October is thin. This is a June-to-September destination.',
 pro:['Nothing else looks like it','Cheapest espresso on the list','Extraordinary hospitality'],
 con:['⚠ Wrong season for autumn','Access is genuinely difficult','Comfort floor low']},

{n:'Kazbegi & Racha',disc:{"lang": {"sc": 2, "s": "Georgian", "t": "Same Georgian alphabet, but Kazbegi is three hours from Tbilisi on a highway and the tourism infrastructure is far more developed — English in guesthouses is normal, signage better, and Russian universal.", "words": ["გამარჯობა · gamarjoba", "გაუმარჯოს · gaumarjos, the toast", "მადლობა · madloba"]}, "veg": {"sc": 5, "t": "Same excellent fasting tradition, with far better access to it. Tbilisi has a real vegan scene, and Kazbegi guesthouses handle it without fuss. Rtveli in late September is the grape harvest and the food that goes with it.", "ask": "მარხვის კერძები, თუ შეიძლება"}, "med": {"sc": 3, "t": "Better than Svaneti by a distance. Clinic in Stepantsminda, and Tbilisi is three hours on a maintained road. Still no organised mountain rescue above the village — the Gergeti glacier claims people most years."}, "con": {"sc": 4, "t": "Good 4G in Stepantsminda and along the highway. Georgia has cheap fast internet and eSIMs are easy. ATMs in town; Racha villages are cash."}, "soc": {"sc": 4, "t": "Very comfortable. Kazbegi is a well-travelled destination with a mixed international crowd. Racha is quieter and more traditional."}, "hosp": "The same Georgian intensity with more practice at handling visitors. A supra will still take your evening — but here you can decline the third chacha without offence.", "who": "A genuinely mixed crowd — Israelis, Poles, Russians, western Europeans, and a large Georgian domestic contingent at weekends. Racha next door has essentially none."},cty:"Georgia",masc:"\u10ef\u10d8\u10ee\u10d5\u10d8",mascEn:"the Caucasian tur",mascL:"Same goat, better road to reach it.",season:[0, 0, 0, 0, 1, 2, 2, 2, 2, 2, 1, 0],best:"Sept to mid-Oct",seasonN:"The exception in the Caucasus \u2014 Kazbegi is three hours from Tbilisi on a year-round highway. Late September is rtveli, the grape harvest, and Racha holds colour into October.",lat:42.66,lon:44.62,img:"data:image/jpeg;base64,/9j/4A  col2:'Kazbegi itself has little foliage — but Racha, next door, is where Georgians go for autumn colour, and Truso and Juta valleys near Kazbegi hold the best of it. Peaks mid-to-late October.',
 food:'Same extraordinary cuisine, better access to it. And late September is rtveli — the grape harvest — which is the single best time to be in Georgia for reasons that have nothing to do with mountains.',
 eat:['Khinkali · soup dumplings, twist and bite','Khachavuri Adjaruli · the boat with the egg','Rtveli · the grape harvest, late Sept','Qvevri wine · amber, fermented in buried clay'],
 safe:'Safe. Kazbegi is three hours from Tbilisi on a maintained highway, which makes it far more accessible than Svaneti. Guesthouses stay open. Avalanche closures are a winter issue.',
 music:'svan',
 v:'The version of Georgia that actually works in autumn. Kazbegi is accessible year-round, Gergeti Trinity under a 5,000 m peak is the image, and Racha next door has the foliage Svaneti lacks. Add Kakheti for the harvest and it is a strong three-week trip at a third of Alpine cost.',
 pro:['Works in autumn, unlike Svaneti','Three hours from Tbilisi','Rtveli harvest in late September'],
 con:['Less dramatic than Svaneti','Long flight','Trails less structured']},

{n:'Dilijan & Aragats',disc:{"lang": {"sc": 2, "s": "Armenian", "t": "⚠ Armenian has its own alphabet, distinct from Georgian and from anything else. Russian is universal among older people; English is common in Yerevan and Dilijan because of UWC and the tech sector. Signage in Dilijan is often trilingual.", "words": ["Բարև · barev, hello", "Շնորհակալություն · shnorhakalutyun, thank you", "Ջուր · jur, water"]}, "veg": {"sc": 5, "t": "Excellent, and again through fasting tradition plus a genuinely vegetable-heavy cuisine. Herbs by the fistful, lentils, bulgur, aubergine, and lavash with everything. Yerevan has a strong vegan scene.", "ask": "Բուսակերական · busakerakan — vegetarian; specify no dairy"}, "med": {"sc": 3, "t": "Yerevan has good private hospitals and is ninety minutes away. No mountain rescue as such, but Dilijan is forest walking at modest altitude and Aragats has a road most of the way up."}, "con": {"sc": 4, "t": "Good coverage, cheap data, easy eSIM. Cards work in Yerevan and Dilijan; villages are cash. Dram."}, "soc": {"sc": 4, "t": "Safe for visitors. ⚠ The regional political situation is genuinely complicated and worth checking current advice before booking — that is not scaremongering, just accurate."}, "hosp": "Warm and less performative than Georgia. Armenians are more reserved initially and very generous once past it. The diaspora connection means many people have relatives abroad and are curious about you.", "who": "Diaspora Armenians, Russians, Iranians on holiday, and a small European trickle. Dilijan has an international school which gives the town an unusual demographic."},cty:"Armenia",masc:"\u0540\u0578\u057e\u0561\u0566",mascEn:"the Caucasian leopard",mascL:"Fewer than ten in Armenia. Possibly the rarest large cat in the region.",season:[0, 0, 0, 1, 1, 2, 2, 2, 2, 2, 1, 0],best:"May\u2013June and Sept\u2013Oct",seasonN:"Lower and gentler than the rest, so the season is longer at both ends. Dilijan\u2019s beech turns through October.",la  col2:'Dilijan is called Armenian Switzerland and it is forest rather than rock — beech and oak, turning through October. Aragats above the treeline is bare and volcanic.',

 safe:'Safe for visitors. The regional political situation is genuinely complicated and worth checking current advice before booking — that is not scaremongering, it is just true.',
 music:'duduk',
 v:'The gentlest of the Caucasus options and the easiest transfer. But the mountains are the weakest here — Dilijan is forest walking rather than alpine, and Aragats is a volcano rather than a range. Come for the monasteries, the food and Lake Sevan, not for a month of hiking.',

{n:"Tien Shan",disc:{"lang": {"sc": 2, "s": "Cyrillic", "t": "Kyrgyz and Russian, both in Cyrillic. Russian is the working language and worth more than English here. English exists in Karakol’s CBT offices and among young guides. Trail marking is minimal — GPS essential.", "words": ["Салам · salam, hello", "Рахмат · rahmat, thank you", "Канча? · kancha, how much?"]}, "veg": {"sc": 1, "t": "⚠ The hardest on this list. Kyrgyz food is mutton, horse, noodles and dairy — the concept of not eating meat is genuinely unfamiliar in the jailoo. Karakol has Dungan and Uyghur places with vegetable options. In a yurt camp you will eat bread, jam, and whatever you brought.", "ask": "Этсиз, сүтсүз — без мяса, без молока"}, "med": {"sc": 2, "t": "⚠ Thin and expensive. Some organised rescue exists around Karakol but helicopter evacuation is privately arranged and costs thousands. Altitude sickness above 3,500 m is the common problem. Insurance covering high-altitude trekking and evacuation is mandatory, not advisable."}, "con": {"sc": 3, "t": "Surprisingly good 4G in Bishkek, Karakol and even some valleys — Kyrgyzstan leapfrogged into mobile data. Nothing on the passes. Cash economy outside the cities; som only."}, "soc": {"sc": 4, "t": "Genuinely safe and welcoming, and a well-established route for independent travellers including women alone. Bride kidnapping exists as a rural social problem but has no bearing on visitors. Bishkek taxi caution as anywhere."}, "hosp": "Nomadic hospitality is a real institution — a yurt will take you in, feed you and refuse payment. Kymyz will be offered and it is an acquired taste that you should acquire politely.", "who": "A serious independent trekking crowd — Poles, Czechs, Germans, Israelis, French, and increasing numbers of Americans. CBT community tourism has made it unusually easy to travel independently."},cty:"Kyrgyzstan",season:[0, 0, 0, 0, 0, 1, 2, 2, 2, 0, 0, 0],best:"July to early Sept",seasonN:"\u26a0 July and August are the safe default. Early September is excellent \u2014 clearer light, fewer people \u2014 but through the month yurt camps close and snow can shut a pass with no warning.",masc:"\u0418\u043b\u0431\u0438\u0440\u0441",mascEn:"the snow leopard",mascL:"Kyrgyzstan\u2019s national animal, on the flag of the capital. Perhaps four hundred left in the Tien Shan.",reg:"Karakol & Ala-Archa \u00b7 Kyrgyzstan",flag:"\ud83c\uddf0\ud83c\uddec",esp:1.2,day:45,mt:5,col:4,cf:2,nv:5,fly:20,hop:"2\u20133 flights",lat:42.49,lon:78.39,hi:7439,hin:"Jengish Chokusu",vert:1800,net:3,huts:2,tech:4,an:"snowleopard",music:"komuz",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wgARCAC+AbgDASIAAhEBAxEB/8QAGgAAAwEBAQEAAAAAAAAAAAAAAQIDBAAFBv/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/9oADAMBAAIQAxAAAAHYVt6czJG+ZN5bi83XI48Anju4x3HkB7juPHcegEvKhO3Fz+ge4dj3HF6NgZJ+gNzyO9DF25JkOW1smuDU6Msp7myGeyxNZzjiVpk6UPRBVO7s32VN7odJk0sJlpLXeJm8evME9Y6hoXtNM6xc3ayOPIDxCQYNonOttvN28etQI5uiEF3nWcoNvjW8vRAl9Ivl0yzoVzeAz5UU9lDqZ9SoIgy6p0tK5ZOr276uiB1b57Tg6MjGhCtlq49EoolN4rbKY0rDrKxr1zItazOXI06vjUaLVZWKZt06MtqR6XRky5FSPZ+mdbY3lRwuRmEkLk5syjmaVKbk3KZSeWnRQc+Vuy9p71Jvdaclp2Jpy2lNH4l1SCdoFXwbLLLGkrZq+fZs9T5zVZ9CfM9PnbgnFRadQJEvInlWel88dO5nsMdBo1hlWUGIVGpLTktUbF7I2TcszLXZ756lphqq3I3Nl7X1elSib2Z0CTWjVTlMZzz2WjWcuKdq7zCRTUcIbGc1lLGubX0/Lnm+1Txssex5mDYCk6qrr5aaYJGzZI9lGqoTZom9ZnmsDPN8yuinXKQ2ZcWmTXDSVZS09CiDBubs30L5K9bQyJTmUPZrA6lLE6VVga5tSMtctZk4vB1ZL501VEpW6mIYaayd+LXDxfzZTXHssReGWjMJZMrDTmheF0M3NNLLCsZBR40OPaY3YaWtK2HcOzbaIv0aUShR8rrdGfSTqAUz2SiLwcuuJmuuhGpFmtRk8GOryaybOaxiVyx57bawVjOTREYyzZ2qxnXLtJPIO4SjuUAMtoXzvuAViIF2gqO5VefrNPJzTsj2NyvoHn2WkQ7TUk20Sg4URGnXxtZrbGsek3l1zdXYhXoP5OqNmRbhy4s9lSBIkXTY0W8LvzV5WpR+dXPSOlTGiZ8es9WWrHSZXbgrMnKupQbl7U3BUxo59qadXzu1PRUHIleGI3Vjn7WPbydHq9XmSqhLlmaq5wbzjzr6PnCCbjl0xnpREjl0YbFo+2oWt2KjWoqKZcw7pk9iU6DCqaq5dMTq5aYyEulL uuoWspA49ewYHEaKHyDlkUuuVMbSipB/iVBaIHjxMRZWZ/eVIWLf1jAqJfsAaBAjYncWdANJjdQ3Vrg64io6LXIbENwDgVJ+evIUJZABkaeohYNsLjm4kKkq7tiP2E3dvLKKKYpmnHyMztteqdQxBCrYAO9Dg8libyAedEZDrRtO4c1qBoPZeSYKM10RWoE0Ol3CRLaKLVuUMNC7OujqUAHjcO241NXFpR6XP//Z",imgt:"Ala-Archa Nature Park",imgp:"https://en.wikipedia.org/wiki/Ala-Archa_Nature_Park",acc:"Istanbul or Dubai to Bishkek, then six hours east by shared taxi to Karakol. A long day and a half.",col2:"\u26a0 Autumn is the edge of the season. Early September is excellent \u2014 thinner crowds, clearer light \u2014 but through the month yurt camps close, nights turn cold and snow can shut a pass with no warning. The colour is spruce and Tien Shan birch turning gold in the Karakol valley, and Arslanbob\u2019s walnut forest \u2014 the largest on earth \u2014 going copper in October at lower altitude.",food:"Central Asian, meat-heavy, and better than its reputation. Lagman noodles, manty, plov, and Dungan food in Karakol from the Chinese-Muslim community \u2014 ashlyan-fu is the local cold noodle dish and there is a whole market for it.",eat:["Ashlyan-fu \u00b7 Dungan cold noodles, Karakol", "Lagman \u00b7 hand-pulled noodle soup", "Beshbarmak \u00b7 the national dish, eaten with hands", "Kymyz \u00b7 fermented mare\u2019s milk, an experience"],safe:"Safe and genuinely welcoming. The risks are altitude, weather that changes in an hour, and roads. Mountain rescue is thin and helicopter evacuation expensive \u2014 insurance that covers high altitude is not optional. Shepherd dogs on the jailoo need respect.",v:"The best mountains on this entire list by raw scale \u2014 Tien Shan runs to 7,439 m and the Karakol valleys hold glaciated peaks with almost no infrastructure and no permits. Ala-Kul at 3,500 m is one of the great treks anywhere. But it is a July-to-early-September range: by October the passes are closing and this becomes a road trip rather than a trek.",pro:["Cheapest per day of anywhere here", "7,000 m peaks, no permits", "Visa-free and genuinely welcoming"],con:["\u26a0 Wrong season for autumn", "20 hours door to door", "Rescue infrastructure is thin"],hikes:[["Ala-Kul & Altyn-Arashan", "3 days \u00b7 1,800 m", "Over a 3,900 m pass to a turquoise lake, then down to hot springs in a valley of wooden cabins. The signature Kyrgyz trek and it earns it."], ["Ala-Archa \u00b7 Ratsek hut", "12 km \u00b7 1,300 m \u00b7 7 h", "From an hour outside Bishkek up to a climbers\u2019 hut at 3,300 m under glaciated walls. The acclimatisation day everyone uses."], ["Jyrgalan valley", "2\u20134 days \u00b7 var", "A former coal village turned trekking hub, with community guesthouses and almost no other foreigners."], ["Traveller\u2019s Pass \u00b7 Lenin Peak", "14 km \u00b7 700 m \u00b7 6 h", "From Tulpar Kol at 3,500 m to a 4,150 m ridge facing the 7,134 m north wall. Red hills, green meadow, white peaks."]]},
{n:"Fann Mountains",disc:{"lang": {"sc": 1, "s": "Cyrillic", "t": "⚠ Tajik in Cyrillic, plus Uzbek in the north. Russian is essential — English is genuinely rare outside a handful of guides. No trail signage to speak of. This is the hardest linguistic environment here.", "words": ["Салом · salom, hello", "Раҳмат · rahmat, thank you", "Об · ob, water"]}, "veg": {"sc": 2, "t": "Difficult. Plov is lamb fat, qurutob has yoghurt. But bread, tomatoes, apricots and green tea are everywhere, and a guide can arrange vegetable food if told well in advance. Homestays will try hard once they understand.", "ask": "Бе гӯшт, бе шир — no meat, no dairy"}, "med": {"sc": 1, "t": "⚠ Essentially none. No mountain rescue, no helicopters available on demand, and Dushanbe hospitals are four hours from the trailheads on poor roads. Trekking with a guide is a safety decision here, not a luxury."}, "con": {"sc": 1, "t": "⚠ Almost nothing in the mountains. Patchy in Panjakent and Dushanbe. Pure cash economy — bring dollars and change them. Somoni."}, "soc": {"sc": 3, "t": "The Fanns themselves are safe and the people hospitable. Tajikistan is conservative; modest dress matters. Check current advice on the Tajik-Kyrgyz border area and GBAO, both of which have been closed at times."}, "hosp": "Persian-inflected and formal in a way the Turkic north is not — tea, ceremony, and real generosity in homes with very little.", "who": "A small hardcore — Russians, Poles, Czechs, and organised groups. You will meet almost nobody in September."},cty:"Tajikistan",season:[0, 0, 0, 0, 0, 2, 2, 2, 2, 0, 0, 0],best:"Late June or early Sept",seasonN:"\u26a0 The two ends of summer are the sweet spot: solid weather, thinner camps, lower prices. Autumn brings unpredictable storms and closed routes.",masc:"\u041c\u0430\u0440\u043a\u043e \u041f\u043e\u043b\u043e",mascEn:"the Marco Polo sheep",mascL:"Horns to 1.6 metres, the longest of any sheep alive. Named by the man who first described them.",reg:"Pamir-Alay \u00b om both.",v:"Turquoise lakes under jagged 5,000 m peaks, and more compact and varied than anything on the Pamir Highway. A guided eight-day trek runs about $1,105. The honest verdict for autumn is the same as Georgia and Kyrgyzstan: this is a June-to-September range, and October is a gamble.",pro:["Cheapest day cost on the list", "Seven turquoise lakes and 5,000 m walls", "Compact \u2014 a week covers it"],con:["\u26a0 Summer range, not autumn", "21 hours door to door", "Camps get crowded in peak season"],hikes:[["Kulikalon & Alaudin lakes", "4 days \u00b7 1,400 m", "The classic circuit \u2014 two lake basins linked by a 3,860 m pass, under Chimtarga\u2019s walls. Camps can feel like villages in August and are empty in September."], ["Chimtarga pass", "2 days \u00b7 1,900 m", "Over the range\u2019s highest pass at 4,740 m. Scree, altitude, and a view over the whole Fann system."], ["Iskanderkul & the Fann Niagara", "8 km \u00b7 300 m \u00b7 3 h", "A lake named for Alexander the Great, with a 38 m waterfall below it. The easy day, reachable by road."], ["Seven Lakes of Marguzor", "2 days \u00b7 easy\u2013moderate", "A valley of seven lakes each a different colour, with homestays in the villages between them."]]},
{n:"Pamir Highway",disc:{"lang": {"sc": 1, "s": "Cyrillic", "t": "⚠ Tajik and Russian, plus Pamiri languages — Shughni, Wakhi — which are unrelated to either. Russian is the only lingua franca. English is close to nonexistent. Every practical arrangement goes through a driver or a guide.", "words": ["Салом", "Раҳмат", "Роҳ кучост? · where is the road?"]}, "veg": {"sc": 2, "t": "Homestay food at 4,000 m is bread, yoghurt, apricots and shir chai — the salted butter tea. Vegetables are scarce because nothing grows up there. Bring supplements and expect a monotonous diet.", "ask": "Бе гӯшт, бе шир"}, "med": {"sc": 1, "t": "⚠ The worst on this list. No hospitals worth the name between Khorog and Osh, no rescue, no helicopters. Altitude sickness at 4,000+ m is the constant risk and the only treatment is descent — which can be a day of driving."}, "con": {"sc": 1, "t": "⚠ Effectively offline. Satellite messengers are used seriously here. Cash only, and bring more than you think."}, "soc": {"sc": 3, "t": "⚠ GBAO permits required and have been suspended during unrest; several governments advise against non-essential travel to parts of the region. The Pamiri people themselves are famously welcoming and the risk is political and logistical, not personal."}, "hosp": "Pamiri houses have five pillars and a skylight and a specific ritual of welcome. Ismaili culture is distinct from the Sunni lowlands — more open, more educated, and unusually warm to outsiders.", "who": "Overland cyclists, motorcyclists, 4x4 travellers, and almost no walkers. A particular kind of person, and they all know each other by Khorog."},cty:"Tajikistan",season:[0, 0, 0, 0, 0, 1, 2, 2, 2, 1, 0, 0],best:"July to Sept",seasonN:"\u26a0 The M41 is passable roughly June to October. Snow closes the high passes either side, and at 4,000 m the shoulder seasons are genuinely cold.",masc:"\u041c\u0430\u0440\u043a\u043e \u041f\u043e\u043b\u043e",mascEn:"the Marco Polo sheep",mascL:"Zorkul, on the Afghan border, is whe 3,500 m \u2014 there is essentially no autumn colour, because there are essentially no trees. What there is instead: poplars turning gold along the Wakhan irrigation channels, against a backdrop of the Hindu Kush.",food:"Sparse and simple at altitude. Homestay food in the Wakhan \u2014 bread, yoghurt, apricot everything, shir chai with salt and butter. The Pamiri house itself, with its five pillars and skylight, is the cultural experience.",eat:["Shir chai \u00b7 salted milk tea with butter", "Apricot oil and dried apricots, the Wakhan staple", "Osh \u00b7 the Pamiri plov", "Pamiri homestay bread, baked that morning"],safe:"\u26a0 Requires current checking. GBAO permits are needed and have been suspended during periods of unrest; several governments advise against non-essential travel to parts of the region. Altitude sickness at 4,000+ m is the constant physical risk, and medical facilities barely exist.",v:"The greatest road journey in Asia and among the least practical hiking trips here. This is overland travel through 4,000 m desert past Afghanistan, not a walking holiday \u2014 the walking is short and incidental. If the appeal is the journey rather than the trails, it is unmatched. If it is a month of hiking, it is the wrong answer.",pro:["One of the great road journeys on earth", "Wakhan corridor and the Hindu Kush", "Almost no other travellers"],con:["\u26a0 Permits and current advice must be checked", "Not a hiking trip \u2014 a driving one", "Altitude and no medical infrastructure"],hikes:[["Jizeu valley", "2 days \u00b7 600 m", "From the Bartang road into a village with no road, three hours\u2019 walk up. Homestays, apricot orchards, and total quiet."], ["Yamchun fort & Bibi Fatima springs", "5 km \u00b7 400 m \u00b7 2 h", "A 3rd-century BC fort above the Wakhan with the Hindu Kush opposite, and hot springs in a cave beside it."], ["Engels Peak viewpoint", "9 km \u00b7 500 m \u00b7 4 h", "Up from the Wakhan valley toward 6,510 m Karl Marx and Engels peaks. Short, high, and the border is the river below."], ["Zorkul & the Great Pamir", "var \u00b7 permit required", "Marco Polo sheep country on the Afghan border. Serious logistics, a permit, and almost nobody goes."]]},
{n:'Zell am See',disc:{"lang": {"sc": 5, "s": "Latin", "t": "German plus fluent tourism English. Also, unusually, a lot of Arabic — Zell has been a summer destination for Gulf visitors for two decades and signage reflects it.", "words": ["Grüß Gott", "Zwei Bier, bitte", "Wo ist die Seilbahn?"]}, "veg": {"sc": 3, "t": "Better than Bavaria because the town is big enough to have variety — Italian, Asian, and a couple of places that do it properly. The Pinzgau harvest festival is cheese and bread heavy.", "ask": "Vegan, bitte"}, "med": {"sc": 5, "t": "Excellent. Hospital in Zell, helicopter base, EU card valid."}, "con": {"sc": 5, "t": "Complete. It is a resort town."}, "soc": {"sc": 5, "t": "Entirely comfortable. A busy lakeside promenade with families everywhere."}, "hosp": "Professional rather than personal — this is a place that has been hosting people for a century and does it well without needing to know you.", "who": "Germans, Dutch, Gulf families in summer, and a strong Austrian domestic crowd. The most international of the Alpine options."},cty:"Austria",masc:"Camoscio",mascEn:"the chamois",mascL:"Also present, also unbothered, but nearer the caf\u00e9.",season:[0, 0, 0, 0, 1, 2, 2, 2, 2, 1, 0, 0],best:"Sept",seasonN:"The lake is swimmable into early October and the Pinzgau harvest festival runs from late August. Lifts thin out from mid-October.",lat:47.32,lon:12.8,img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wgARCAC+AbgDASIAAhEBAxEB/8QAGgABAQADAQEAAAAAAAAAAAAAAAECAwQFBv/EABcBAQEBAQAAAAAAAAAAAAAAAAABAgP/2gAMAwEAAhADEAAAAfYVvnKApFEUAAAAAJRFEURRFEABFEUQCUSURRFhFglElEVW1UCxFEUBQBYAAAAAAJRFEUQCURRFglEUSURYRRASZQijcJRSKAAQAAAAAAACKIoiwCgIoiwlCKJKIokokoiwijcslKIoAAGo2vP7TMApAAAJQlEURYAAiURSwEUkBFEBFhFlRRuWSlQAAWGPFt6M78TKTrz9fd4voS9SyAAAAEoiiKIACKIogIoiwiiSiLEiwijcqaiiKQal2aO   LAND.forEach(c=>{

let AC=null,on=false,seq=null,verb,mas,cur=null;
function ir(c,sec,dec){const n=c.sampleRate*sec,b=c.createBuffer(2,n,c.sampleRate);
  for(let x=0;x<2;x++){const d=b.getChannelData(x);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dec)}return b}
const f=n=>261.63*Math.pow(2,n/12);
function pluck(fr,t,g,len,type){const o=AC.createOscillator(),gg=AC.createGain(),lp=AC.createBiquadFilter();
  o.type=type||'triangle';o.frequency.value=fr;lp.type='lowpass';lp.frequency.value=2200;
  gg.gain.setValueAtTime(0,t);gg.gain.linearRampToValueAtTime(g,t+.006);
  gg.gain.exponentialRampToValueAtTime(.0002,t+len);
  o.connect(lp);lp.connect(gg);gg.connect(verb);gg.connect(mas);o.start(t);o.stop(t+len+.05)}
function reed(fr,t,g,len,bright){const o=AC.createOscillator(),o2=AC.createOscillator(),gg=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='sawtooth';o2.type='square';o.frequency.value=fr;o2.frequency.value=fr*1.004;
  lp.type='lowpass';lp.frequency.value=bright||1600;lp.Q.value=1.2;
  gg.gain.setValueAtTime(0,t);gg.gain.linearRampToValueAtTime(g,t+.04);
  gg.gain.setValueAtTime(g,t+len*.7);gg.gain.exponentialRampToValueAtTime(.0002,t+len);
  o.connect(lp);lp.connect(gg);gg.connect(verb);gg.connect(mas);
  o.start(t);o2.connect(lp);o2.start(t);o.stop(t+len+.05);o2.stop(t+len+.05)}
function drone(fr,t,g,len){const o=AC.createOscillator(),gg=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='sawtooth';o.frequency.value=fr;lp.type='lowpass';lp.frequency.value=800;lp.Q.value=2.2;
  gg.gain.setValueAtTime(0,t);gg.gain.linearRampToValueAtTime(g,t+.25);
  gg.gain.setValueAtTime(g,t+len*.82);gg.gain.exponentialRampToValueAtTime(.0002,t+len);
  o.connect(lp);lp.connect(gg);gg.connect(verb);gg.connect(mas);o.start(t);o.stop(t+len+.1)}
function bassN(fr,t,g,len){const o=AC.createOscillator(),gg=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='triangle';o.frequency.value=fr;lp.type='lowpass';lp.frequency.value=400;
  gg.gain.setValueAtTime(0,t);gg.gain.linearRampToValueAtTime(g,t+.012);
  gg.gain.exponentialRampToValueAtTime(.0002,t+len);
  o.connect(lp);lp.connect(gg);gg.connect(mas);o.start(t);o.stop(t+len+.05)}
function hit(t,g,low){const o=AC.createOscillator(),gg=AC.createGain(),lp=AC.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=low?200:900;
  o.frequency.setValueAtTime(low?110:280,t);o.frequency.exponentialRampToValueAtTime(low?45:90,t+.1);
  gg.gain.setValueAtTime(g,t);gg.gain.exponentialRampToValueAtTime(.0001,t+.22);
  o.connect(lp);lp.connect(gg);gg.connect(mas);o.start(t);o.stop(t+.3)}

function startAudio(name){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    mas=AC.createGain();mas.gain.value=.5;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4200;
    mas.connect(lp);lp.connect(AC.destination);
    verb=AC.createConvolver();verb.buffer=ir(AC,3,2.1);
    const vg=AC.createGain();vg.gain.value=.34;verb.connect(vg);vg.connect(AC.destination);}
  clearInterval(seq);
  const S=MUS[name]||MUS.landler,b=60/S.bpm;let t=AC.currentTime+.25,n=0;on=true;cur=name;
  seq=setInterval(()=>{if(!on)return;while(t<AC.currentTime+2){t+=S.bar(t,b,n);n++}},200);
  document.getElementById('snd').textContent='♪ '+S.lab;
}
function stopAudio(){on=false;clearInterval(seq);if(AC){AC.close();AC=null}}
document.getElementById('snd').onclick=e=>{const b=e.currentTarget;
  if(on){stopAudio();b.textContent='♪ music';b.classList.remove('on')}
  else{try{startAudio(cur||'landler');b.classList.add('on')}catch(err){b.textContent='♪ blocked'}}};

drawWorld(); renderLegend(); renderCards();
</script>
