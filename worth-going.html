ents permit lottery is worse than Yosemite’s.",pro:["Rainier is unlike any other mountain here", "Larch and rainforest colour together", "Two hours from Seattle"],con:["⚠ Short season, fast weather", "Enchantments permits near-impossible", "Rain, a great deal of it"],hikes:[["Wonderland Trail", "150 km · 9 days", "Right round Mount Rainier through every ecosystem it has. Permit-only and the finest circuit in the US."], ["Maple Pass Loop", "12 km · 600 m · 5 h", "The larch walk. Late September, and one of the best day-loops in the country."], ["The Enchantments", "29 km · 1,400 m · 1–3 days", "Granite basins, larches and mountain goats at 2,300 m. A permit lottery with roughly 3% odds."], ["Skyline Trail · Paradise", "9 km · 500 m · 4 h", "Straight up into the flower meadows under the Nisqually glacier. The introduction to Rainier."]],disc:{"lang": {"sc": 5, "s": "Latin", "t": "English.", "words": ["—", "—", "—"]}, "veg": {"sc": 5, "t": "Easy. Seattle is one of the better vegan cities in North America.", "ask": "Just ask"}, "med": {"sc": 4, "t": "Good, expensive. Rainier has a climbing ranger programme and rescue is competent."}, "con": {"sc": 3, "t": "None in the parks. Cards everywhere else."}, "soc": {"sc": 5, "t": "Straightforward."}, "hosp": "Pacific Northwest friendly — mild, outdoorsy, slightly reserved.", "who": "Seattleites in enormous numbers on weekends, and a serious mountaineering community."},masc:"mountain goat",mascEn:"the mountain goat",mascL:"The Enchantments goats are habituated and follow hikers for the salt in urine, which is exactly as awkward as it sounds."},
{n:"GR20",crowd:3,crowdN:"The refuges fill in summer, and everyone walks the same way. September is much emptier.",club:"The refuges are run by the Parc Naturel Régional de Corse, not an alpine club, so reciprocal cards do nothing. Book through the park system.",rain:"Thin on the trail. Corte has the Museum of Corsica and a citadel; Calvi and Bastia are proper towns. But if you are on the route, a wet day is a hard day.",drink:"Corsican wine from Patrimonio, and it is much better than its reputation. Cap Corse, a quinine aperitif. Myrte liqueur from the maquis, drunk cold after dinner.",move:"A car for the trailheads, or the little train from Bastia to Vizzavona which is charming and useful. Ferries from Nice and Livorno; flights to Bastia and Calvi.",kit:"⚠ This is the technical one — chains, slabs and real exposure. Grippy approach shoes over boots. A sleeping bag liner for the refuges. Water; sources are far apart.",reg:"Corsica · France",flag:"🇫🇷",esp:2.2,day:85,mt:4,col:2,cf:3,nv:4,fly:13,hop:"2 flights + ferry or drive",lat:42.3,lon:9.0,cty:"France",hi:2706,hin:"Monte Cinto",vert:1200,net:3,huts:4,tech:5,an:"ibex",music:"paghjella",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGAABAQEBAQAAAAAAAAAAAAAAAAECAwX/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/9oADAMBAAIQAxAAAAH0BrmCgTWbLuaZudErOsmmRrIWhmbHJ1zWVyUUAsusU1jTOkZaVmrLLBFpLkVBoAAE56lBQAa53WEvRzudbk1LKCXJaCWApJoSWmbeRWVLLZWC7GuYKCXeN42lksahUoILmlAITBVlVKGGhRrmCgiwu41jQSyaGbYXOhJaZz0yYdOVayUQVoBrmCgAl3m43RKAgUAADl05lJpYoQUa5goAGqY1RKwFABoCBnmVsVKAH//EAB8QAAEDBAMBAAAAAAAAAAAAAAEAEBEgITAxAhJAQf/aAAgBAQABBQKvi0UGuJXVRGYVfW1X1C61woeGlSpqPpGTlgnCMO3O1Pnhyb3JXUZJacZMVC3n++O7Bi225aF0HCKv5iJbRYoeEYNHKM0o3zCr6aitgGr/xAAZEQADAQEBAAAAAAAAAAAAAAABETAAQBD/2gAIAQMBAT8B9GVlV58A4BcXE//EABkRAAIDAQAAAAAAAAAAAAAAAAEwABAR  are low but manageable, and the crowds have gone. October the refuges close.",acc:"Fly to Bastia or Calvi, or ferry from Nice or Livorno. Easy once you are in Europe.",col2:"⚠ Mediterranean maquis, not deciduous forest — this is a green-year-round range. What autumn gives is temperature and light rather than colour. Chestnut forest in the Castagniccia does turn, but that is off the route.",food:"Corsican food is its own thing — charcuterie from chestnut-fed pigs, brocciu cheese, and wild boar. Refuge food is basic; the villages either end are excellent.",eat:["Figatellu · liver sausage, grilled", "Brocciu · fresh sheep cheese in everything", "Wild boar stew", "Corsican wine, Patrimonio and Nielluccio"],safe:"⚠ The hardest walking on this list per kilometre. The GR20 is chains, slabs, exposure and scrambling for two weeks, and people are injured on it every season. It is not a walking holiday.",v:"Reputedly the toughest waymarked trail in Europe — 180 km along the granite spine of Corsica with refuges every night. Technically demanding rather than high. September is the right month and it is an intense fortnight rather than a relaxed one.",pro:["The most technically interesting trail in Europe", "Refuges every night", "September is the correct month"],con:["⚠ Genuinely hard and exposed", "Refuges are basic and can be full", "No autumn colour"],hikes:[["GR20 north section", "~90 km · 8 days", "Calenzana to Vizzavona. The hard half — Cirque de la Solitude was rerouted after a fatal rockfall but it remains serious."], ["GR20 south section", "~90 km · 7 days", "Vizzavona to Conca. Gentler, still not gentle, and the Bavella needles are the highlight."], ["Monte Cinto", "14 km · 1,400 m · 8 h", "Corsica’s highest at 2,706 m, off the main route and worth the detour."], ["Lac de Melo & Capitello", "10 km · 700 m · 5 h", "Two glacial lakes in the Restonica, and a taste of the terrain without the fortnight."]],disc:{"lang": {"sc": 4, "s": "Latin", "t": "French, plus Corsican which you will see on signage and hear in villages. English is patchy in the interior. French is genuinely useful.", "words": ["Bonjour", "Merci", "Salute · hello in Corsican"]}, "veg": {"sc": 2, "t": "⚠ Difficult. Corsican food is charcuterie and cheese, and refuge dinners are fixed. Tell them well in advance or carry your own — most GR20 walkers resupply and self-cater anyway.", "ask": "Végétalien — sans viande, sans fromage, sans œuf"}, "med": {"sc": 4, "t": "French mountain rescue — PGHM — is excellent and helicopter-equipped. Given how many injuries the GR20 produces, they are well practised."}, "con": {"sc": 3, "t": "Patchy on the route, fine in the towns. Refuges are cash. Euro."}, "soc": {"sc": 4, "t": "Safe. Corsican reserve toward outsiders is real but overstated; it fades quickly on the trail."}, "hosp": "Proud and initially cool, warm once you are past it. The refuge gardiens are characters.", "who": "French overwhelmingly, plus Germans, Italians and a hard core of long-distance walkers. Everyone on the trail is doing the same thing, which builds a fast community."},masc:"muvra",mascEn:"the mouflon",mascL:"Corsica’s wild sheep, on the high ground above Bavella. Also the bearded vulture, reintroduced and slowly recovering."},
{n:"Pyrenees",crowd:2,crowdN:"Ordesa has a summer crowd on the valley floor. The high routes and the Spanish side are quiet.",club:"FFCAM on the French side and FEDME on the Spanish, both with reciprocal agreements. Either card cuts refuge fees on both sides of the border, which matters if you cross.",rain:"Good. Zaragoza and Toulouse are both reachable. Closer: the Lourdes basilica, the Aínsa medieval village, and thermal spas at Panticosa and Bagnères.",drink:"Somontano and Navarra wine, cheap and good. Basque cider poured from height. Patxaran, sloe liqueur, as a digestif. Ossau-Iraty cheese on the French side.",move:"⚠ A car matters — the valleys are separated by big ranges and crossing between them without one is slow. Roads are good. Two countries, two systems.",kit:"Poles. Layers. A sleeping bag liner for the refuges, which are excellent and require booking. Nothing technical for the standard routes.",reg:"Ordesa, Gavarnie & Aigüestortes · Spain & France",flag:"🇪🇸",esp:1.8,day:75,mt:4,col:4,cf:4,nv:4,fly:12,hop:"1–2 flights + drive",lat:42.65,lon:0.05,cty:"Spain",hi:3404,hin:"Aneto",vert:1300,net:5,huts:5,tech:3,an:"ibex",music:"jota",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAIDBAEF/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//aAAwDAQACEAMQAAABmd50wAAAcO8AbkvOcDoiF89EGvmpKxx7FDtnOdDh3gAAdCvF7jXZ61M1ucOxtE0z5EJ1SlVuHRuE26pptDTCGfQU4yxEGrirUYQl9KUaD5rY46tIVsp5+gyzZbKcEG4OVXsRpd4WtO5mPTeM7VJYtXMRr5+gobQ6jhjNKmPlspoz0sZE7ts899L1ivtaPM5qWsfdmgzbaQluuakAyD5hi3JIayAZapkqi99Ixel3kPCGQ10y7DzNlIG9vH9o53vBE5nNKd0nm76cG8/REaOhSnm3c1EA3SnpJjoE6wMbZ6lBNIjVxmq2TWPlspmtaYkbIXlTyzbkTQXuvFrzHKPSPKDbULI1A09Ax+QAemBWwHGAMwCawM1QPOiAwEroEAFOBZ//xAAmEAACAgICAwACAQUAAAAAAAABAgARAxIQIRMiMQRBMBQjMjNA/9oACAEBAAEFAv53MupVD/jqfs1Xks7SzNrBFDY1+umLkfxW s", "Two countries, two languages, two systems", "Access needs a car for the good valleys"],hikes:[["Ordesa canyon to Cola de Caballo", "18 km · 500 m · 6 h", "Up a beech-filled canyon between 1,000 m walls to a horsetail waterfall. In October the colour is extraordinary."], ["Brèche de Roland", "14 km · 900 m · 7 h", "A 40 m natural gap in the ridge at 2,807 m, from the Gavarnie side. Snow lingers in it year round."], ["Aneto", "20 km · 1,500 m · 10 h", "The highest Pyrenean at 3,404 m, with a small glacier and an exposed final ridge."], ["Carros de Foc", "55 km · 5 days", "A hut-to-hut circuit in Aigüestortes linking nine refuges. The best multi-day in the range."]],disc:{"lang": {"sc": 4, "s": "Latin", "t": "Spanish, Catalan, French and some Aragonese depending which valley. English is patchy in the refuges. A little Spanish or French makes everything easier.", "words": ["Buenos días / Bonjour", "Refugio / Refuge", "¿Hay sitio? · is there space?"]}, "veg": {"sc": 3, "t": "Manageable. Spanish refuges do a fixed menu that is meat-centric; tell them at booking. Down in the valleys, Spain has improved enormously and pisto, escalivada and lentils are everywhere.", "ask": "Soy vegano — sin carne, sin queso, sin huevo"}, "med": {"sc": 4, "t": "Good on both sides. Spanish GREIM and French PGHM both helicopter-equipped. EU card valid."}, "con": {"sc": 4, "t": "Good in valleys, patchy high. Cards accepted, refuges often cash. Euro throughout."}, "soc": {"sc": 5, "t": "Very comfortable and family-oriented."}, "hosp": "Aragonese and Catalan mountain villages are welcoming and unpretentious. Refuge culture is communal and sociable in a way the Alps sometimes are not.", "who": "Spanish and French, overwhelmingly. Very few English speakers, which is part of the appeal."},masc:"quebrantahuesos",mascEn:"the bearded vulture",mascL:"The bone-breaker — drops bones from height to crack them. The Pyrenees hold Europe’s densest population, and Ordesa is the place to see one."},
{n:"Simien",crowd:1,crowdN:"A few groups a day in the whole park.",club:"No association. Scouts and guides are arranged through the park office at Debark, and that is legally required. Camps are park-run.",rain:"⚠ Very thin. Gondar’s castles are genuinely remarkable and worth a full day — an Ethiopian Camelot. Beyond that, in the park, a wet day is a tent day.",drink:"Ethiopian coffee, from the country that discovered it, roasted and poured in a ceremony that takes an hour and is the point. Tej, honey wine. St George beer.",move:"⚠ Organised transport, and a scout is legally required. Debark is the gateway; vehicles are arranged there. Roads are rough.",kit:"⚠ Four-season bag — 3,600m camps are genuinely cold at night. Layers. Water treatment. Cash in birr; almost nothing takes cards.",reg:"Gondar & Ras Dashen · Ethiopia",flag:"🇪🇹",esp:0.7,day:45,mt:4,col:2,cf:2,nv:5,fly:19,hop:"2 flights + 3 hr drive",lat:13.18,lon:38.07,cty:"Ethiopia",hi:4550,hin:"Ras Dashen",vert:1000,net:2,huts:1,tech:2,an:"gelada",music:"ethio",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGAABAQEBAQAAAAAAAAAAAAAAAAECAwT/xAAWAQEBAQAAAAAAAAAAAAAAAAAAAQL/2gAMAwEAAhADEAAAAfU6NZ53YzaAltzSkKg0zDUzKsELTK2WTcrCSysjsjNqUAAFM0CxJSgCF0yjVxTUkNMgiyIlqDTI0yNOPM9HLFl3rmPTPPo64xC9eOa9U4Dtrzo9N8lPS8sPW8g63is7TnF6uKN4olWWwKCpDWaMrSKJNZqEQZrTBOkymiE1vl0XWagC2DSItgZ3Dk2rneeK9WCE1CFqKJNozpCyQ0kOl5jcxmO0nM6OOq6ZxI7a8/OsOds9e+fXNl59DUg0iqIcglLAUDzws9fQzXnDnsOPM1ANe0jYmpCID//EACIQAAICAQQCAwEAAAAAAAAAAAABAhESECAhQCIxEzBBUP/aAAgBAQABBQKiiuxfUor6L79/x7Mj3onpZkhzM2RlZaMkZFr7nLq2WWWiyzLqXu46tl9Xnor75zxeYna3cbXoi+dLLQ2kWjJGaPkie9Jvz9kF4jFvb2XrYpc4ocLP2tMUZqJ8r1hK9t6PWQpXt/HNikyHktJ8Ckxckvet04u1sfB//8QAFhEBAQEAAAAAAAAAAAAAAAAAEQBg/9oACAEDAQE/ASNR/8QAGREAAgMBAAAAAAAAAAAAAAAAAREAECBg/9oACAECAQE/AXH0Qo4//8QA oops at arm’s length", "The cheapest espresso on this list", "An escarpment unlike anything else"],con:["⚠ Check current travel advice — Amhara unrest", "Armed scout mandatory", "No real trail infrastructure"],hikes:[["Sankaber to Geech", "15 km · 500 m · 6 h", "Along the escarpment edge with gelada troops and lammergeier below. The classic first day."], ["Imet Gogo", "8 km · 400 m · 4 h", "A promontory at 3,926 m with a 360° drop. The best viewpoint in the park."], ["Ras Dashen", "2 days · 1,200 m", "Ethiopia’s highest at 4,550 m and the tenth-highest in Africa. A long walk rather than a climb."], ["Chennek escarpment", "10 km · 300 m · 4 h", "Walia ibex country — endemic, endangered, and reliably seen here."]],disc:{"lang": {"sc": 2, "s": "Ge’ez script", "t": "⚠ Amharic in its own script, plus Tigrinya. English among guides and in Gondar hotels, little elsewhere. Guides and scouts are mandatory anyway, which solves it.", "words": ["ሰላም · selam, hello", "አመሰግናለሁ · ameseginalehu, thank you", "ቡና · buna, coffee"]}, "veg": {"sc": 5, "t": "Outstanding, and for the same reason as Georgia — Orthodox fasting. Wednesdays and Fridays are fasting days nationally and the whole country eats vegan, so shiro, misir wot and atkilt are everyday food. Ask for \"fasting food\" and you get a vegan platter.", "ask": "የጾም · ye-tsom — fasting food"}, "med": {"sc": 1, "t": "⚠ Minimal. A clinic in Debark, hospital in Gondar three hours away. No mountain rescue. Altitude to 4,550 m with no infrastructure."}, "con": {"sc": 1, "t": "⚠ Patchy at best and periodically shut down entirely during unrest. Cash economy — birr, and dollars to change."}, "soc": {"sc": 2, "t": "⚠ The park is safe and scouted. The wider region is the concern — check advice, and note that internet and transport have both been suspended regionally in recent years."}, "hosp": "Ethiopian hospitality is famous and the coffee ceremony is a real institution — an hour, three cups, and you stay for all three.", "who": "A small determined crowd, mostly organised groups. Numbers collapsed with the conflict and have not fully returned."},masc:"ጭላዳ",mascEn:"the gelada",mascL:"The bleeding-heart baboon — the last grass-eating primate on earth, found only here, and troops of several hundred graze past you paying no attention at all."},
{n:"Colorado",crowd:4,crowdN:"⚠ Maroon Bells in colour season is a shuttle queue. The San Juans are a different world.",club:"The Colorado Mountain Club runs huts and courses, and the 10th Mountain Division Hut Association owns a superb winter network. For summer, most of it is permits and tents.",rain:"Good. Aspen and Telluride are resort towns with museums, galleries and hot springs; Ouray and Glenwood have the best soaking. Denver is three hours.",drink:"Colorado has more breweries per head than anywhere in the US — Odell, Great Divide, New Belgium. ⚠ Altitude doubles the effect; go slower than you think.",move:"⚠ A car. Distances between the San Juans and the Elks are long, and Maroon Bells is shuttle-only in season. Passes can close early.",kit:"⚠ You start at 3,000m — acclimatise before hiking. Afternoon thunderstorms are routine; be off summits by noon. Bear canister in some areas.",reg:"San Juans & Maroon Bells · USA",flag:"🇺🇸",esp:3.6,day:115,mt:4,col:5,cf:5,nv:3,fly:8,hop:"1–2 flights + drive",lat:39.07,lon:-106.99,cty:"United States of America",hi:4401,hin:"Mount Elbert",vert:1000,net:5,huts:3,tech:2,an:"elk",music:"bluegrass",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAECAwQF/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//aAAwDAQACEAMQAAABxqdNR9fEz0Tm6IqNEZ640aGYE65jfLdaZ4zXovzeiOqHlEEPU05FjKBWEFBNSal1ldbdvm6y+nHPsWRka8qNQneTF1JKpCqdzKujKXFXgJPTFh3UZFBm3GpSZZNSF6Y1XS8Gp1c1pq83LlFFipNdVlkbKIjfAvKbcS1KUjJLbeLsodmZSslaMioVauA1UoaTBpqIUFZmVSkUSxmeiyUVCKsy1My9ebeKebNHDLUkXOWwzKDWIsQTTM7GIKrILpOMzcl52ntQUYz1SmF7aGG1rKU4jPQmiW4SYqmqs563qXnrWTPVARoQiQth0xVAVYLluC8iDJsM2pASATAYEogoQIAUgAAP/8QAIRAAAgEEAwEBAQEAAAAAAAAAAAERAhASIQMgMRNBMjD/2gAIAQEAAQUCt46KkSZEk9amYMVBgirGkp5IFUmTs9VoZXyEWdvBOLU8gqSFZ6eRN6uRIdTPrqyZTXJlp1JGe3ybrqqIg/Y1  reach from anywhere in North America.",pro:["The best aspen display anywhere", "58 peaks over 14,000 ft", "Eight hours from you"],con:["⚠ Colour window is two weeks and busy", "Trailheads start at 3,000 m", "Aspen and Telluride are expensive"],hikes:[["Maroon Bells & Crater Lake", "6 km · 150 m · 2 h", "The most photographed mountains in North America, with aspen below. Shuttle-only in season."], ["Four Pass Loop", "43 km · 2,700 m · 4 days", "Four passes over 3,800 m round the Maroon Bells. The finest circuit in Colorado."], ["Ice Lake Basin", "13 km · 800 m · 6 h", "Above Silverton to a basin of impossibly blue lakes at 3,800 m."], ["Kebler Pass", "drive + short walks", "The largest aspen stand in North America — a single organism covering hundreds of hectares."]],disc:{"lang": {"sc": 5, "s": "Latin", "t": "English.", "words": ["—", "—", "—"]}, "veg": {"sc": 5, "t": "Easy. Boulder and Denver are very vegan-friendly and the resort towns cater to everything.", "ask": "Just ask"}, "med": {"sc": 4, "t": "Good, expensive. County SAR teams are volunteer and excellent. Altitude clinics exist in the resort towns."}, "con": {"sc": 4, "t": "Good in the corridors, none in the wilderness. Cards everywhere."}, "soc": {"sc": 5, "t": "Straightforward."}, "hosp": "Outdoorsy and welcoming. Colorado mountain-town culture is friendly and slightly self-satisfied about the lifestyle.", "who": "Coloradans in enormous numbers during leaf season, plus Texans and a national photography crowd."},masc:"elk",mascEn:"the elk",mascL:"Bugling through September — a sound like a rusty gate crossed with a whistle, and one of the great wildlife experiences in North America."},
{n:"Bhutan",crowd:1,crowdN:"Engineered to be empty. You may not see another trekker.",club:"None — everything runs through your licensed operator, who supplies tents, cooks and staff. There is no independent hut system and no membership that helps.",rain:"Reasonable, and your guide handles it. Paro and Thimphu have dzongs, the National Museum and the textile museum. The archery is worth watching. Rain days are absorbed into the itinerary.",drink:"Suja, butter tea with salt, which takes commitment. Ara, distilled rice or barley spirit, home-made. K5 whisky, which is Bhutan’s own and surprisingly decent.",move:"Everything is arranged — you cannot travel independently. Roads are winding and slow; distances take longer than the map suggests.",kit:"Layers for 4,000m camps. Broken-in boots. ⚠ Your operator supplies tents and cooking — do not bring your own. Cash in ngultrum for tips.",reg:"Paro & Jomolhari · Bhutan",flag:"🇧🇹",esp:2.0,day:210,mt:5,col:3,cf:4,nv:5,fly:24,hop:"3 flights",lat:27.83,lon:89.27,cty:"Bhutan",hi:7570,hin:"Gangkhar Puensum",vert:1000,net:3,huts:1,tech:3,an:"tur",music:"bhutan",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAIDAQQF/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEAMQAAABoMCjAu7E1b8h03lQnnTMkFSWUUUcEHwUdyQwLrqZu6YMGG8xVJ9hGHVMWPVoJjHVGAWv51zpSnGXSKHRDZlY0mdWc1Cyc3QUeMzuIhhOhO7aQzow52vMSmOTj1Bxt1Bzr0hzbfSC9GkC/KZuSOg48Ou3Gp6J54ehvJh17yB1LJS09Ym2qCrznTvKx1byqdecrHTvKC5rkl0NY010c0wOgYEdlNTHCd0Jp06cj9WnK9cFbNMlRDZOpKPdM4Tv04K9lzzq9KjEwqYGiMau4TbA3nsFJ6g24g+ycavOHRHNGFcxDlOtuYLqzgc4XUAYBdAZAKQAqgGoAUAACnOBugEgE5wPUQDAD//EACUQAAICAgIDAAICAwAAAAAAAAABAhESIQMTECIxIEEjQgQwQP/aAAgBAQABBQL8sT6QTMCv+iYmutSo4m2KXviOND0Ylflx+zkkhkKK1+Umoik2NjJKVRjb4luVqcZevcm8c3D5KVFj0ZIchuSKkbRB5LkRGWSpwHIi1Ly+UispFDVRjP1cyDY2z6Va  — a famously demanding approach between ridges.",col2:"Blue pine, juniper and rhododendron rather than deciduous colour, though the valley floors have poplar and walnut that turn. What October gives is the clearest views of the year onto unclimbed 7,000 m peaks — Gangkhar Puensum is the highest unclimbed mountain on earth and climbing it is illegal.",food:"Ema datshi — chillies and cheese — is the national dish and it is genuinely hot. Red rice, buckwheat in Bumthang, and a lot of chilli generally.",eat:["Ema datshi · chilli and cheese", "Red rice", "Suja · butter tea, salted", "Ara · the local spirit"],safe:"Extremely safe. ⚠ The constraint is not safety but cost — the Sustainable Development Fee is USD 100 per person per night on top of everything, which is what makes Bhutan the most expensive destination on this list by a distance.",v:"⚠ The €210 a day is the daily fee plus costs, not a lifestyle choice — Bhutan deliberately prices tourism to limit it. What you get is a Himalayan kingdom with no crowds anywhere, October clarity, and the Jomolhari trek under a 7,326 m peak. Whether that is worth four times Val Gardena is a real question.",pro:["October is the correct month", "No crowds anywhere, by design", "Culturally unlike anywhere else here"],con:["⚠ USD 100/night fee on top of costs", "Guide mandatory for everything", "Trek infrastructure is camping, not huts"],hikes:[["Tiger’s Nest · Taktsang", "6 km · 700 m · 4 h", "A monastery on a cliff face at 3,120 m. The image of Bhutan, and busy by Bhutanese standards, which means fifty people."], ["Jomolhari trek", "8 days · 4,900 m pass", "To base camp under a 7,326 m peak, over Nyile La. The classic Bhutanese trek, fully camping."], ["Druk Path", "5 days · 4,200 m", "Paro to Thimphu over lakes and ridges. The shorter introduction and the most walkable."], ["Bumthang cultural circuit", "var · easy", "Valley walking between temples in the spiritual heartland. Gentle and the autumn festivals are here."]],disc:{"lang": {"sc": 4, "s": "Tibetan script", "t": "Dzongkha in Tibetan script, but English is an official language and the medium of education — everyone under fifty speaks it well. Effectively no friction, unusually.", "words": ["Kuzuzangpo la · hello", "Kadrinchey la · thank you", "Ema datshi"]}, "veg": {"sc": 4, "t": "Good. Buddhist country, vegetarian dishes are standard, and ema datshi itself is vegetarian though not vegan. Your guide arranges all meals so it is simply a matter of telling them.", "ask": "Tell your guide when booking"}, "med": {"sc": 3, "t": "Basic but organised. Hospitals in Thimphu and Paro, guide-managed evacuation, and helicopter service exists. Free healthcare, including for visitors."}, "con": {"sc": 3, "t": "Good in the valleys, none on trek. Cards in Thimphu; cash elsewhere. Ngultrum, pegged to the rupee."}, "soc": {"sc": 5, "t": "Among the safest countries anywhere, and the guided structure removes almost all friction."}, "hosp": "Formal, gentle, and quietly proud. The guide relationship is central — you will spend a week with one person and it shapes the trip entirely.", "who": "Very few people, by design. Older and wealthier than most trekking destinations, plus a serious Indian visitor contingent who pay a lower fee."},masc:"ཏཀིན",mascEn:"the takin",mascL:"The national animal — a goat-antelope that looks assembled from spare parts, and according to legend was created that way by a mad saint."},
{n:"Taiwan",crowd:3,crowdN:"Yushan is rationed; Zhuilu too. Trails near Taipei are busy at weekends, empty midweek.",club:"The mountain lodges are run by the national parks, and permits come through them. Local hiking associations can sponsor permit applications, which is occasionally the easier route.",rain:"Excellent. Taipei is world-class for a wet day — the National Palace Museum, night markets, hot springs at Beitou. Alishan’s forest railway is atmospheric in mist.",drink:"High-mountain oolong, grown at 2,000m and among the best tea on earth — this is the place to buy it seriously. Kavalan whisky, which beats Scottish ones in blind tastings. Aboriginal millet wine.",move:"Superb. High-speed rail down the west coast, buses to trailheads, EasyCard for everything. ⚠ A car helps for the Central Cross-Island Highway only.",kit:"⚠ Permits printed — park, police and lodge, all separate. Rain gear. Layers for 3,900m. Cash, though cards work in cities.",reg:"Yushan & the Central Range",flag:"🇹🇼",esp:1.9,day:70,mt:4,col:4,cf:4,nv:5,fly:22,hop:"2 flights + 4 hr drive",lat:23.47,lon:120.96,cty:"Taiwan",hi:3952,hin:"Yushan · Jade Mountain",vert:1400,net:4,huts:4,tech:3,an:"boar",music:"guqin",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAEDAgQF/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//aAAwDAQACEAMQAAABT2dueDYYVAmUKmURg2GFQJlAwbDBsMmwwbDBsSZQJmyqlDnqZQJlAmUKmUFmqBMoEzYmDbqZRxMoEygTKpJlAkUCpo5byNKJ85deYq9R+Z3FSUy5yQO7igRvr48x7Bw707DlZ0vlZ0nMzoUBLEQ0uXGddeeJHTKYAJNPJTyIYIGOKUhiVrL1KGCt7i0sRdWIiWJFIFz0xAIQxAxI0kxmWVi8gIpvIaMsYgYOE1mtmAshQAgEAPcYNYWm4I3No6MZxD0FBrAGSqZTTObtYPoUSKBlBYAC2EogMMCTCzIFaAhAU9BDAKXDGsMIig3KgH//xAAlEAACAgEDBAEFAAAAAAAAAAAAARESAgMTIRAgMDFAMkFCUGD/2gAIAQEAAQUCggj+Qj9hZGeTyE2aWc/B1M6l8x5vI09ShdNXNw3lL1Mn19JIWpBuFixYuXLl al friction.",pro:["268 peaks over 3,000 m", "World-class food and hot springs", "Excellent transport and infrastructure"],con:["⚠ Typhoon season shuts June–September", "Yushan permit is a lottery", "22 hours door to door"],hikes:[["Yushan main peak", "22 km · 2 days · 1,400 m", "North-east Asia’s highest at 3,952 m, from Tataka via Paiyun Lodge. Permit and lottery required; the sunrise from the summit is the reason."], ["Snow Mountain · Xueshan", "25 km · 2 days · 1,700 m", "The second-highest, through the Black Forest to a glacial cirque. Easier to permit than Yushan and arguably better."], ["Jiaming Lake", "26 km · 3 days · 1,200 m", "A meteor-crater lake at 3,310 m on the Southern Cross-Island Highway. Sika deer come down to drink at dusk."], ["Zhuilu Old Trail · Taroko", "10 km · 400 m · 5 h", "A cliff path cut 500 m above the Liwu river in a marble gorge. Permit-only, and the most vertiginous walk on this list."]],disc:{"lang": {"sc": 3, "s": "Traditional Chinese", "t": "Mandarin in traditional characters, plus Taiwanese Hokkien. English is decent in Taipei and among younger people, patchy in the mountains — but signage on major trails is bilingual and permits can be applied for in English. No Great Firewall, unlike the mainland.", "words": ["你好 · nǐ hǎo", "謝謝 · xiè xie", "山屋 · shānwū, mountain hut"]}, "veg": {"sc": 5, "t": "Outstanding. Taiwan has one of the highest vegetarian rates in the world thanks to Buddhist practice, and 素食 sùshí buffets are on every other street corner. Convenience stores label vegetarian food. Genuinely the easiest place on this list.", "ask": "我吃素 · wǒ chī sù — and 全素 quánsù for strictly vegan"}, "med": {"sc": 4, "t": "Excellent. Taiwan’s health system is among the best in Asia, mountain rescue is organised and helicopter-equipped, and permits mean the authorities know where you are."}, "con": {"sc": 4, "t": "Superb 4G almost everywhere including many summits. EasyCard for transport, cards widely accepted, and free public wifi in cities."}, "soc": {"sc": 5, "t": "Among the safest and easiest countries anywhere to travel in, including alone. Lost wallets get returned."}, "hosp": "Warm and practical. Taiwanese hospitality is less formal than Japan and more immediate — people will walk you to where you are going rather than point.", "who": "Taiwanese hikers in large numbers — it is a national pastime — plus Hong Kongers and Japanese. Very few westerners in the mountains."},masc:"臺灣黑熊",mascEn:"the Formosan black bear",mascL:"A white V on its chest, fewer than 600 left, and the island’s national animal. You will more likely meet a Formosan macaque or a sika deer."},
{n:"South Korea",crowd:5,crowdN:"⚠ October weekends on Seoraksan are shoulder to shoulder. Weekdays are fine.",club:"The Korea National Park Service runs the shelters and the online booking. The Korean Alpine Federation exists but does not affect prices. Book direct, well ahead.",rain:"Excellent. Seoul is two hours and inexhaustible. Closer: Sokcho’s fish market, the Naksansa temple, and jjimjilbang bathhouses which are the correct answer to a wet day.",drink:"Makgeolli, cloudy rice wine, drunk after a hike as a matter of national custom. Soju, inevitably. Temple tea if you do a templestay. Korean craft beer has improved enormously.",move:"Excellent. Express buses everywhere, KTX rail, T-money card for all of it. ⚠ No car needed at all — one of two places here where that is true.",kit:"Very little. Trails are stepped and railed. Poles for the descents. ⚠ Book shelters online in advance for Jirisan. Cash rarely needed.",reg:"Seoraksan & Jirisan",flag:"🇰🇷",esp:2.8,day:85,mt:3,col:5,cf:5,nv:5,fly:21,hop:"2 flights + 3 hr bus",lat:38.12,lon:128.47,cty:"South Korea",hi:1950,hin:"Hallasan · on Jeju",vert:1300,net:5,huts:4,tech:2,an:"boar",music:"gagaku",img:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCABlAOgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAECAwQF/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAEC/9oADAMBAAIQAxAAAAHvJnGtVm60MhNVmVoZsslwKZrcyqLkFBAxOwBiBiYhiAJM1gAAAAAUAAKbLIKdQyiLgQhtA05oQrGAUUsVDKSoJbCHQIVEmGNnc45jsOal3WfGekc6TpXHFd55mydpkprY5izoMWaGYlvMNHzZHZHBdVSwsbm7BaYSi1xKGzQz2sl0Vm2EzYQUJ0Ekt1jJpnEFKZK2zvOtMc7sNMrlcklZ1NlW5J0kLvls2zuDQw6bJNBYglHBjLtz1OaaQzSsuk5989jNaYUAkpAFSi7ydSUIdHLvLkMrc5Q2gCcAzbkKdBIrBd8QhsNSsgBgNAAFDCEBRqBiAn//xAAlEAACAgAFBAMBAQAAAAAAAAAAAQIRAxASITETIDAyIkBBQkP/2gAIAQEAAQUC8nBq+hubm+W/gplMXnvLY2NikUUV9Gyy/Nfmoory0UV2qSf1LVmLNxHiNmuJLFbIYlGHNyeJKo4b0z6qOqPFkxyk8o  yellow. National parks publish a daily foliage map. The granite spires of Ulsanbawi with scarlet maple below is the image.",food:"Superb and unlike its neighbours. Temple cuisine in the mountains is a serious tradition — no meat, no garlic, no onion — and it is some of the best vegetarian food in Asia. Plus everything else Korea does.",eat:["Sanchae bibimbap · mountain vegetables", "Temple food at a mountain sanctuary", "Makgeolli after a hike, non-negotiable", "Pajeon · scallion pancake, in the rain"],safe:"Extremely safe. Trails are immaculately maintained with stairs and railings on the steep ground. ⚠ The only real issue is crowding — Seoraksan on an October weekend is a queue.",v:"The mountains are modest by this list’s standards — nothing over 2,000 m — but the granite is spectacular, the trail infrastructure is the best in Asia, and the autumn colour is arguably the finest in the world. Come for the danpung and the temple food, not for altitude.",pro:["Autumn colour among the best anywhere", "Temple food is exceptional and vegan", "Flawless infrastructure and transport"],con:["Nothing above 2,000 m", "⚠ October weekends are genuinely crowded", "Expensive by Asian standards"],hikes:[["Ulsanbawi · Seoraksan", "8 km · 700 m · 4 h", "Up 800 steps to a ridge of six granite domes, with maple filling the valley below. The most photographed walk in Korea and it earns it."], ["Daecheongbong", "16 km · 1,300 m · 9 h", "Seoraksan’s summit at 1,708 m, with a shelter near the top. The long day, and far quieter than Ulsanbawi."], ["Jirisan ridge traverse", "34 km · 3 days · 2,000 m", "The mainland’s highest, hut to hut along the spine of the southern peninsula. Book the shelters online."], ["Hallasan · Jeju", "19 km · 1,400 m · 9 h", "A shield volcano at 1,950 m with a crater lake, on an island of black rock and tangerine groves."]],disc:{"lang": {"sc": 4, "s": "Hangul", "t": "Korean in hangul — which was designed to be learnable in a morning and genuinely is. English is common in Seoul and on park signage; less so in villages, but translation apps and the transport system make it painless.", "words": ["안녕하세요 · annyeonghaseyo", "감사합니다 · gamsahamnida", "단풍 · danpung, autumn leaves"]}, "veg": {"sc": 5, "t": "Excellent, through temple cuisine. Korean Buddhist food is a formal tradition and temple stays serve it; sanchae bibimbap is mountain vegetables and is everywhere. Watch for anchovy stock and fish sauce in ordinary restaurants.", "ask": "저는 채식주의자예요 · jeoneun chaesikjuuija-yeyo"}, "med": {"sc": 5, "t": "Outstanding. Korean healthcare is fast and cheap, national parks have staffed shelters and rescue teams, and the trails are patrolled."}, "con": {"sc": 5, "t": "The best connectivity on this entire list — 5G on most summits. T-money card for everything, cards accepted universally, cash almost unnecessary."}, "soc": {"sc": 5, "t": "Very safe and easy. Hiking is a mainstream national activity across every age group, so a couple on a trail is entirely unremarkable."}, "hosp": "Formal at first, warm quickly, and hikers share food on the trail as a matter of course. Someone will offer you makgeolli at a summit.", "who": "Koreans in enormous numbers, all ages, in immaculate hiking kit. Very few foreigners outside Seoraksan."},masc:"반달가슴곰",mascEn:"the Asiatic black bear",mascL:"Reintroduced to Jirisan and slowly recovering — about ninety now. The moon bear, named for the white crescent on its chest."},
{n:'Zell am See',crowd:3,crowdN:"A resort — busy around the lifts, quiet on the long ridges.",club:"ÖAV, the Austrian alpine club, owns the Hohe Tauern huts and runs the marked paths. Membership halves hut fees, includes rescue insurance, and is reciprocal with DAV, CAI, SAC and PZS.",rain:"Excellent, and it is the reason this place earns its slot. Salzburg is 90 minutes. Closer: the Kitzsteinhorn glacier runs all year, the Sigmund Thun gorge, Krimml falls, and the Tauern Spa at Kaprun.",drink:"Austrian Grüner Veltliner and Zweigelt. Stiegl and Zipfer beer. Almdudler, the herbal soft drink, which is what everyone actually drinks after a walk.",move:"Excellent. The guest card covers regional buses and some lifts free, trains to Salzburg and Innsbruck. No car needed.",kit:"Almost nothing. This is the softest range here — trail shoes, a rain layer, poles if your knees want them.",disc:{"lang": {"sc": 5, "s": "Latin", "t": "German plus fluent tourism English. Also, unusually, a lot of Arabic — Zell has been a summer destination for Gulf visitors for two decades and signage reflects it.", "words": ["Grüß Gott", "Zwei Bier, bitte", "Wo ist die Seilbahn?"]}, "veg": {"sc": 3, "t": "Better than Bavaria because the town is big enough to have variety — Italian, Asian, and a couple of places that do it properly. The Pinzgau harvest festival is cheese and bread heavy.", "ask": "Vegan, bitte"}, "med": {"sc": 5, "t": "Excellent. Hospital in Zell, helicopter base, EU card valid."}, "con": {"sc": 5, "t": "Complete. It is a resort town."}, "soc": {"sc": 5, "t": "Entirely comfortable. A busy lakeside promenade with families everywhere."}, "hosp": "Professional rather than personal — this is a place that has been hosting people for a century and does it well without needing to know you.", "who": "Germans, Dutch, Gulf families in summer, and a strong Austrian domestic crowd. The most international of the Alpine options."},cty:"Austria",masc:"Camoscio",mascEn:"the chamois",mascL:"Also pr /* a range drawn as a chain of little peaks along its spine, sized by weight */
function ridgePath(pts, w, sc, dark){
  if(pts.length<2) return '';
  let out='';
  const ink = dark ? '#0E1420' : '#2B2118';
  const lit = dark ? '#E8DCBE' : '#FBF6EA';
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    if(!a||!b) continue;
    const dx=b[0]-a[0], dy=b[1]-a[1];
    const len=Math.hypot(dx,dy);
    if(len<2 || len>420) continue;
    const step=Math.max(9*sc, 13*sc);
    const n=Math.max(1,Math.round(len/step));
    const nx=-dy/len, ny=dx/len;             /* normal, so peaks point "up" the slope */
    for(let k=0;k<n;k++){
      const t=(k+0.5)/n;
      const x=a[0]+dx*t, y=a[1]+dy*t;
      const h=(2.6+w*2.1)*sc*(0.72+((k*37)%10)/16);
      const half=h*0.78;
      out+=`<path d="M${(x-half).toFixed(1)},${(y+h*0.28).toFixed(1)} L${(x).toFixed(1)},${(y-h).toFixed(1)} L${(x+half).toFixed(1)},${(y+h*0.28).toFixed(1)} Z"
        fill="${ink}" opacity="${(0.16+w*0.05).toFixed(2)}"/>`;
      if(w>=2) out+=`<path d="M${(x).toFixed(1)},${(y-h).toFixed(1)} L${(x+half*0.42).toFixed(1)},${(y-h*0.24).toFixed(1)} L${(x-half*0.2).toFixed(1)},${(y-h*0.32).toFixed(1)} Z"
        fill="${lit}" opacity="${(0.30+w*0.06).toFixed(2)}"/>`;
    }
  }
  return out;
}

/* ---- real ground at the landing: raster tiles, fetched on the approach ----
   Tiles are Web Mercator; the globe is orthographic. Over the ~950 km a landing
   frame spans the difference is a few percent, so the ground lays flat as you
   descend and the tiles draw as a Mercator patch centred on the destination.
   If any tile fails, the vector ground you already have is what you land on. */
const TILE = { src: (z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/${z}/${y}/${x}`,
               attr: 'Esri, HERE, Garmin, FAO, NOAA, USGS' };
let tiles = { key:null, ready:false, failed:false, imgs:[], z:7, n:0 };
function tileKey(lon,lat){ return lon.toFixed(2)+','+lat.toFixed(2); }
function tileLevelFor(lat, m){
  /* pick the tile level so about five tiles span the frame at this map zoom */
  const F = 1290/m * (40075/(2*Math.PI*GR0));
  return Math.max(5, Math.min(13, Math.round(Math.log2(40075*Math.max(0.3,Math.cos(lat*RAD))*4.5/F))));
}
function prefetchTiles(lon,lat,m){
  const Z=tileLevelFor(lat, m||zoom);
  const key=tileKey(lon,lat)+'@'+Z;
  if(tiles.key===key) return;
  tiles={ key, ready:false, failed:false, imgs:[], z:Z, n:0 };
  try{
    const N=Math.pow(2,Z);
    const cx=(lon+180)/360*N;
    const cy=(1-Math.log(Math.tan(lat*RAD)+1/Math.cos(lat*RAD))/Math.PI)/2*N;
    const R=2;                                       /* a 5x5 patch */
    let pending=0, bad=false;
    for(let dy=-R;dy<=R;dy++) for(let dx=-R;dx<=R;dx++){
      const tx=Math.floor(cx)+dx, ty=Math.floor(cy)+dy;
      if(ty<0||ty>=N) continue;
      const img=new Image();
      img.crossOrigin='anonymous';
      pending++;
      img.onload=()=>{ pending--; if(!pending && !bad){ tiles.ready=true; if(globe){needStatic=true;drawGlobe();} } };
      img.onerror=()=>{ bad=true; pending--; tiles.failed=true; };
      img.src=TILE.src(Z, ((tx%N)+N)%N, ty);
      tiles.imgs.push({img, tx, ty, fx:cx-Math.floor(cx), fy:cy-Math.floor(cy), dx, dy});
      tiles.n++;
    }
    /* do not wait forever — a slow network should not stall the landing */
    setTimeout(()=>{ if(!tiles.ready) tiles.failed=true; }, 9000);
  }catch(e){ tiles.failed=true; }
}
function tileLayer(lon,lat){
  if(!tiles.ready || tiles.failed || !tiles.key.startsWith(tileKey(lon,lat))) return '';
  /* size of one tile in world units at this latitude, at base radius */
  const kmPerTile = 40075/Math.pow(2,tiles.z)*Math.cos(lat*RAD);
  const kmPerUnit = 40075/(2*Math.PI*GR0);
  const T = kmPerTile/kmPerUnit;
  const c=proj0(lon,lat); if(!c) return '';
  let out=`<g class="tiles" opacity="${Math.min(1,(zoom-7)/4).toFixed(2)}">`;
  tiles.imgs.forEach(({img,fx,fy,dx,dy})=>{
    if(!img.complete||!img.naturalWidth) return;
    const x=c[0]+(dx-fx)*T, y=c[1]+(dy-fy)*T;
    out+=`<image href="${img.src}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(T+0.6).toFixed(1)}" height="${(T+0.6).toFixed(1)}" preserveAspectRatio="none"/>`;
  });
  return out+'</g>';
}

let flatDrag=false, fdx=0, fdy=0, flatWired=false;
function wireFlat(){
  const el=document.getElementById('worldmap');
  if(!el || flatWired) return;
  flatWired=true;
  const cur=()=>(flatBox||VB[region]||VB.all).slice();
  const rect=()=>{ try{ return el.getBoundingClientRect(); }catch(e){ return {width:390,height:349}; } };
  let p0=0, box0=null, moved=false;
  const gap=e=>{ const a=e.touches[0], b=e.touches[1];
    return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); };
  const zoomFlat=(f,cx,cy)=>{
    const b=box0? box0.slice() : cur();
    const r=rect();
    const nw=Math.max(60, Math.min(9000, b[2]/f));
    const nh=nw*(b[3]/b[2]);
    const ax=(cx-r.left)/r.width, ay=(cy-r.top)/r.height;
    flatBox=[ b[0]+(b[2]-nw)*ax, b[1]+(b[3]-nh)*ay, nw, nh ];
    renderLegend(); drawWorld();
  };
  el.addEventListener('touchstart',e=>{
    if(globe) return;
    if(e.touches.length===2){ p0=gap(e); box0=cur(); flatDrag=false; if(e.cancelable) e.preventDefault(); }
    else if(e.touches.length===1){ flatDrag=true; moved=false; fdx=e.touches[0].clientX; fdy=e.touches[0].clientY; box0=cur(); }
  },{passive:false});
  el.addEventListener('touchmove',e=>{
    if(globe) return;
    if(e.touches.length===2 && p0){
      const a=e.touches[0], b=e.touches[1];
      zoomFlat(gap(e)/p0, (a.clientX+b.clientX)/2, (a.clientY+b.clientY)/2);
      if(e.cancelable) e.preventDefault();
    } else if(flatDrag && e.touches.length===1 && box0){
      const dx=e.touches[0].clientX-fdx, dy=e.touches[0].clientY-fdy;
      if(!moved && Math.hypot(dx,dy) < 9) return;
      moved=true;
      const r=rect(), b=box0;
      flatBox=[ b[0]-dx*(b[2]/r.width), b[1]-dy*(b[3]/r.height), b[2], b[3] ];
      drawWorld();
      if(e.cancelable) e.preventDefault();
    }
  },{passive:false});
  el.addEventListener('touchend',()=>{ p0=0; flatDrag=false; box0=null; if(moved) renderLegend(); moved=false; });
  el.addEventListener('wheel',e=>{
    if(globe) return;
    box0=cur(); zoomFlat(e.deltaY>0?0.92:1.087, e.clientX, e.clientY); box0=null;
    if(e.cancelable) e.preventDefault();
  },{passive:false});
  let lastT=0;
  el.addEventListener('click',e=>{
    if(globe) return;
    if(e.target && e.target.closest && e.target.closest('.mpk,.twn')) return;
    const now=Date.now();
    if(now-lastT<300){ flatBox=null; hotPin=null; buzz(5); renderLegend(); drawWorld(); lastT=0; }
    else lastT=now;
  });
}

/* the legend is rebuilt constantly, so listen on the container instead of the buttons */
function wireLegend(){
 const box=document.getElementById('maplg');
 if(!box || box._wired) return;
 box._wired=true;
 const hit=(e)=>{
 const b=e.target&&e.target.closest?e.target.closest('button'):null;
 if(!b) return;
 if(e.cancelable) e.preventDefault();
 e.stopPropagation();
 switch(b.id){
 case 'maphome': goHome(); break;
 case 'mapback': goBack(); break;
 case 'dice':    diceRoll(e); break;
 case 'zin':     zoom=Math.min(240, zoom*1.16); buzz(4); renderLegend(); drawGlobe(); break;
 case 'zout':    zoom=Math.max(1,zoom/1.10);  buzz(4); renderLegend(); drawGlobe(); break;
 case 'zreset':  flatBox=null; hotPin=null; buzz(5); renderLegend(); drawWorld(); break;
 case 'fzin': case 'fzout': {
  const bx=(flatBox||VB[region]||VB.all).slice();
  const f=(b.id==='fzin')?0.78:1.28;
  const nw=Math.max(60,Math.min(9000,bx[2]*f)), nh=nw*(bx[3]/bx[2]);
  flatBox=[ bx[0]+(bx[2]-nw)/2, bx[1]+(bx[3]-nh)/2, nw, nh ];
  buzz(4); renderLegend(); drawWorld();
  break; }
 case 'mapfull':
 bigMap=!bigMap;
 try{ document.body.classList.toggle('bigmap', bigMap); }catch(_){}
 buzz(bigMap?[8,30,8]:6);
 needStatic=true; renderLegend(); drawWorld();
 break;
 case 'globebtn':
 globe=!globe; flatBox=null;
 LSset('wg_globe',globe?'1':'0');
 if(globe){ const c=CENTRE[region]||CENTRE.all; camLon=c[0]; camLat=c[1]; tgtLon=c[0]; tgtLat=c[1]; }
 buzz(globe?[6,30,6]:6);
 needStatic=true; renderLegend(); drawWorld();
 break;
 }
 };
 ['click','touchend'].forEach(ev=>box.addEventListener(ev,hit,{passive:false}));
}
function renderLegend(){
 const counts=Object.fromEntries(Object.keys(REGIONS).map(r=>[r,D.filter(d=>regOf(d.n)===r).length]));
 document.getElementById('maplg').innerHTML=
 `<label class="sortlab" for="reg">Where</label>
 <div class="selwrap"><select id="reg">
 <option value="all"${region==='all'?' selected':''}>The whole world · ${D.length} ranges</option>
 ${Object.keys(REGIONS).map(r=>`<option value="${r}"${region===r?' selected':''}>${r} · ${counts[r]}</option>`).join('')}
 </select></div>
 <button class="rg${globe?' on':''}" id="globebtn">${globe?'🌍 globe':'🗺 flat'}</button>
 <button class="rg dicebtn" id="dice" title="Fly somewhere at random">✈</button>

 <button class="rg fsbtn" id="mapfull" title="Full screen">${bigMap?'⤡':'⤢'}</button>
 ${hist.length?`<button class="rg backbtn" id="mapback" title="Back one step">↩ back</button>`:''}
 ${(region!=='all'||zoom>1.05||flatBox||hotPin)?`<button class="rg homebtn" id="maphome" title="Back to the whole world">⌂ home</button>`:''}
 ${globe?`<button class="rg zbtn" id="zout">−</button><span class="zlab">${zoom.toFixed(1)}×</span><button class="rg zbtn" id="zin">+</button>`
 :`<button class="rg zbtn" id="fzout">−</button><button class="rg zbtn" id="fzin">+</button>`+(flatBox?`<button class="rg" id="zreset">⤢ fit</button>`:'')}
 <span class="maphint">the map ${globe?'drags &amp; pinches':'zooms'} · music follows</span>`;
 const dc=document.getElementById('dice');
 if(dc) dc.onclick=diceRoll;
 const bk=document.getElementById('mapback');
 if(bk) bk.onclick=goBack;
 const hm=document.getElementById('maphome');
 if(hm) hm.onclick=goHome;
 const zr=document.getElementById('zreset');
 if(zr) zr.onclick=()=>{ flatBox=null; hotPin=null; buzz(5); renderLegend(); drawWorld(); };
 wireLegend();
 const zi=document.getElementById('zin'), zo=document.getElementById('zout');
 if(zi) zi.onclick=()=>{ zoom=Math.min(240, zoom*1.5); buzz(4); needStatic=true; renderLegend(); drawGlobe(); };
 if(zo) zo.onclick=()=>{ zoom=Math.max(1,zoom/1.4); buzz(4); needStatic=true; renderLegend(); drawGlobe(); };
 const gb=document.getElementById('globebtn');
 if(gb) gb.onclick=()=>{ globe=!globe; try{ document.getElementById('worldmap').style.height=''; }catch(_){ } flatBox=null; LSset('wg_globe',globe?'1':'0');
 if(globe){ const c=CENTRE[region]||CENTRE.all; camLon=c[0]; camLat=c[1]; tgtLon=c[0]; tgtLat=c[1]; }
 buzz(globe?[6,30,6]:6);
 needStatic=true; renderLegend(); drawWorld(); };
 document.getElementById('reg').onchange=e=>{
 pushHist();
 region=e.target.value; flatBox=null; hotPin=null;
 if(globe){ const c=CENTRE[region]||CENTRE.all; buzz(8); nudgeIdle();
 zoom = region==='all' ? 1 : 2.3; needStatic=true; easeTo(c[0],c[1]); }
 drawWorld(); renderLegend(); render();
 if(on) startAudio(themeFor()); else document.getElementById('snd').textContent='♪ '+THEMES[themeFor()].lab;
 };
}

const TREKS=[{"n":"Tour du Mont Blanc","g":[45.92, 6.87, 45.92, 6.87],"bm":0,"tip":"Walk it <b>anticlockwise</b> — that is the way the refuges are provisioned and the way the ascents fall more kindly. And skip the Col de la Seigne day if the forecast is bad; the Val Veny alternative is lower and just as good.","rg":"Alps","cty":"France · Italy · Switzerland","d":11,"km":170,"up":10000,"st":"huts","mo":[6,7,8],"df":3,"book":"Refuges book out in January for July–August. Book the day they open.","v":"The most famous circuit in the Alps and it earns it — three countries, a hut every night, and no technical ground. Also the busiest trail in Europe in August."},{"n":"Alta Via 1","g":[46.7, 12.09, 46.14, 12.22],"bm":2,"tip":"Book Rifugio Lagazuoi for one night whatever it costs. It sits at 2,752 m on the edge of a cliff with a sauna, and the sunset from the terrace is the single best thing on the route.","rg":"Alps","cty":"Italy · Dolomites","d":10,"km":120,"up":6800,"st":"huts","mo":[5,6,7,8],"df":3,"book":"Rifugi open late June to late September. Book by March.","v":"Dolomite rifugi hut to hut from Braies to Belluno, through the finest limestone scenery in Europe. Better food than any other long trail here."},{"n":"Haute Route · Chamonix to Zermatt","g":[45.92, 6.87, 46.02, 7.75],"bm":1,"tip":"Take the <b>walkers’</b> variant over the Europaweg, not the direct line. Same finish into Zermatt, no glacier travel, and the last day’s balcony path is the finest in the Alps.","rg":"Alps","cty":"France · Switzerland","d":12,"km":180,"up":12000,"st":"huts","mo":[6,7,8],"df":4,"book":"The walkers’ route needs no glacier skills; the classic ski route does.","v":"Mont Blanc to the Matterhorn over eleven passes. Harder than the TMB, quieter, and the finish into Zermatt is one of the great arrivals."},{"n":"GR20","g":[42.51, 8.85, 41.74, 9.34],"bm":2,"tip":"Walk it <b>south to north</b>. Everyone goes north to south, so you meet them coming the other way rather than queueing behind them — and you finish on the hardest section when you are fittest.","rg":"Pyrenees & Corsica","cty":"France · Corsica","d":15,"km":180,"up":12000,"st":"refuges","mo":[5,6,7,8],"df":5,"book":"Refuges bookable online from spring; they fill.","v":"Reputedly the toughest waymarked trail in Europe. Chains, slabs and exposure for a fortnight along the granite spine of Corsica."},{"n":"Carros de Foc","g":[42.56, 0.95, 42.56, 0.95],"bm":2,"tip":"You do not have to do all nine refuges. The Amitges–Colomers–Ventosa loop is three nights and gets you the best of the lake district without the forced march.","rg":"Pyrenees & Corsica","cty":"Spain · Aigüestortes","d":5,"km":55,"up":4000,"st":"huts","mo":[5,6,7,8,9],"df":3,"book":"Nine refuges, one booking system, done online.","v":"A circuit linking nine refuges in a granite lake district. Half the price of the Alps and a fraction of the people."},{"n":"Alta Via 2","g":[46.62, 11.68, 46.14, 11.9],"bm":2,"tip":"The via ferrata sections are short but real. Carry a set rather than planning to avoid them — the detours cost more time than the gear costs weight.","rg":"Alps","cty":"Italy · Dolomites","d":13,"km":160,"up":11000,"st":"huts","mo":[6,7,8],"df":4,"book":"Some sections are via ferrata — bring a set.","v":"Harder and higher than AV1, over the Puez plateau and the Sella. The route that passes above Ortisei."},{"n":"Tatra High Route","g":[49.17, 20.09, 49.23, 19.98],"bm":3,"tip":"Orla Perć is one-way in high season and it is enforced. Do the Slovak side if you want flexibility; the Polish side if you want the chains.","rg":"Carpathians & Balkans","cty":"Slovakia · Poland","d":6,"km":70,"up":6000,"st":"huts","mo":[6,7,8],"df":4,"book":"Chains and ladders on the Orla Perć section. Huts are small.","v":"Along the granite ridge with a hut most nights. Slovakia’s answer to the Alps at a third of the price."},{"n":"Făgăraș ridge traverse","g":[45.62, 24.6, 45.6, 24.74],"bm":-1,"tip":"Carry a tent even though there are cabanas — several are derelict and the ridge has no water for long stretches. Fill at every spring you pass, not when you are thirsty.","rg":"Carpathians & Balkans","cty":"Romania","d":7,"km":70,"up":7000,"st":"camp","mo":[6,7,8],"df":5,"book":"No booking. Cabanas are basic and unreliable — carry a tent.","v":"The last genuinely wild multi-day in the EU. Bears, no infrastructure, and seventy kilometres above 2,000 m."},{"n":"Peaks of the Balkans","g":[42.47, 19.87, 42.47, 19.87],"bm":4,"tip":"Apply for the border permits <b>four weeks</b> ahead through a local agency; doing it yourself takes longer. And carry cash in three currencies — euro, lek and dinar.","rg":"Carpathians & Balkans","cty":"Albania · Montenegro · Kosovo","d":10,"km":192,"up":9800,"st":"guesthouse","mo":[5,6,7,8],"df":4,"book":"Cross-border permits needed — apply four weeks ahead.","v":"A loop through three countries staying in village guesthouses. The best-value long trek in Europe and almost nobody has heard of it."},{"n":"Valbona to Theth","g":[42.42, 19.9, 42.39, 19.77],"bm":-1,"tip":"Do it <b>Valbona to Theth</b>, not the reverse. The climb is gentler that way and you finish walking down into the more beautiful of the two valleys.","rg":"Carpathians & Balkans","cty":"Albania","d":2,"km":17,"up":1000,"st":"guesthouse","mo":[5,6,7,8,9],"df":2,"book":"Guesthouses in both villages; the ferry up Lake Koman is the approach.","v":"One pass between two valleys with no road between them. Two days, and among the great short walks in Europe."},{"n":"Rila & Pirin traverse","g":[42.19, 23.56, 41.77, 23.44],"bm":-1,"tip":"The huts take cash only and do not answer the phone. Turn up and there will be a bed — this is not the Alps. Bring your own sleeping bag liner.","rg":"Carpathians & Balkans","cty":"Bulgaria","d":8,"km":110,"up":7500,"st":"huts","mo":[5,6,7,8],"df":3,"book":"Socialist-era hut network, no booking, cash only.","v":"Musala and Vihren in one route through the Seven Lakes. The cheapest hut-to-hut in Europe."},{"n":"Transcaucasian Trail · Svaneti","g":[43.05, 42.72, 42.92, 43.01],"bm":-1,"tip":"Book the Mestia–Ushguli guesthouses one day ahead by phone as you walk, not months before. And take the <b>high route</b> above Adishi rather than the jeep track.","rg":"Caucasus & Anatolia","cty":"Georgia","d":4,"km":58,"up":3300,"st":"guesthouse","mo":[6,7,8],"df":3,"book":"Guesthouses in every village; they close in October.","v":"Mestia to Ushguli between medieval tower villages under 4,000 m walls. The classic Caucasus trek."},{"n":"Kaçkar yayla traverse","g":[40.95, 41.09, 40.85, 41.16],"bm":-1,"tip":"Start walking at first light. The cloud comes up the valleys from the Black Sea by ten most days and sits until evening — the views are a morning phenomenon here.","rg":"Caucasus & Anatolia","cty":"Turkey","d":5,"km":60,"up":4200,"st":"camp","mo":[6,7,8],"df":4,"book":"Guides worth hiring — marking is minimal and cloud is constant.","v":"Between highland villages of wooden houses on stilts, through the only temperate rainforest in Turkey."},{"n":"Ala-Kul & Altyn-Arashan","g":[42.49, 78.39, 42.38, 78.61],"bm":-1,"tip":"Do it <b>Karakol to Altyn-Arashan</b>, not the reverse, so you finish at the hot springs rather than starting there. Camp at Ala-Kul only if you have a proper bag — it freezes at 3,500 m in August.","rg":"Central Asia","cty":"Kyrgyzstan","d":3,"km":48,"up":2400,"st":"camp","mo":[6,7,8],"df":4,"book":"No permits. Yurt camps at Altyn-Arashan close mid-September.","v":"Over a 3,900 m pass to a turquoise lake, then down to hot springs. Kyrgyzstan’s signature trek."},{"n":"Fann Mountains circuit","g":[39.22, 68.21, 39.13, 68.36],"bm":-1,"tip":"Hire a donkey and a driver in Artuch. It costs very little, it employs someone local, and it turns a heavy trek into a walk. Water is scarce between the lake basins.","rg":"Central Asia","cty":"Tajikistan","d":6,"km":75,"up":5000,"st":"camp","mo":[5,6,7,8],"df":4,"book":"Guided packages from about $1,100 for eight days.","v":"Seven turquoise lakes under 5,000 m walls, linked by scree passes. Compact and cinematic."},{"n":"Everest Base Camp","g":[27.69, 86.73, 28.0, 86.85],"bm":-1,"tip":"Take the <b>extra acclimatisation day at Dingboche</b>, not Pheriche — it is higher, so you sleep worse and acclimatise better. And Gokyo Ri beats Kala Patthar for the view if you have the days.","rg":"Himalaya","cty":"Nepal","d":12,"km":130,"up":5000,"st":"teahouse","mo":[3,4,9,10],"df":3,"book":"No booking needed; lodges take you as you arrive.","v":"Teahouses every hour, wifi, bakeries and a helicopter industry. Extraordinary and thoroughly shared."},{"n":"Three Passes circuit","g":[27.8, 86.71, 28.0, 86.85],"bm":-1,"tip":"Go <b>anticlockwise</b>: Kongma La first, when you are freshest, and Renjo La last, which gives you the best Everest view of the whole loop as a finale.","rg":"Himalaya","cty":"Nepal","d":18,"km":160,"up":9000,"st":"teahouse","mo":[3,4,9,10],"df":5,"book":"Same lodges, far fewer people.","v":"Renjo La, Cho La and Kongma La. The serious version of the Khumbu and the one that loses the crowds."},{"n":"Jomolhari trek","g":[27.43, 89.42, 27.83, 89.27],"bm":4,"tip":"Ask your guide to build in the Soi Thangthangkha rest day. Bhutan’s standard itinerary climbs too fast to Jangothang at 4,080 m and people get sick on it.","rg":"Himalaya","cty":"Bhutan","d":8,"km":80,"up":4900,"st":"camp","mo":[3,9,10],"df":4,"book":"Guide and USD 100/night fee mandatory. Fully supported camping.","v":"To base camp under a 7,326 m peak over Nyile La. Nobody else on the trail, by design and by price."},{"n":"Yading kora","g":[28.43, 100.33, 28.38, 100.3],"bm":-1,"tip":"Sleep at <b>Shangri-La town first</b>, not Daocheng. Flying straight into Daocheng at 4,411 m and walking a 4,600 m kora the next day is how people end up on oxygen.","rg":"China","cty":"China · Sichuan","d":3,"km":35,"up":2000,"st":"camp","mo":[4,5,8,9],"df":4,"book":"Park permit at the gate; guides required for the outer kora.","v":"The pilgrim circuit round three sacred peaks past Milk Lake at 4,600 m. Altitude is the whole difficulty."},{"n":"Tiger Leaping Gorge","g":[27.19, 100.1, 27.24, 100.16],"bm":-1,"tip":"Stay at <b>Tea Horse or Half-way</b>, not Tina’s. Half-way’s terrace toilet is famous for a reason and the guesthouses at the top of the 28 Bends are where the walkers are.","rg":"China","cty":"China · Yunnan","d":2,"km":22,"up":1000,"st":"guesthouse","mo":[2,3,8,9,10],"df":2,"book":"No guide, no permit. Guesthouses along the way.","v":"A track cut into a canyon wall 2,000 m above the river, between Naxi villages. The most accessible great trek in Asia."},{"n":"Kamikōchi to Yari & Hotaka","g":[36.25, 137.63, 36.34, 137.65],"bm":5,"tip":"Reserve the huts by phone in Japanese if you can — the online system fills first. Dinner is at six and lights out at eight; plan your day around it rather than against it.","rg":"Japan","cty":"Japan","d":4,"km":45,"up":3200,"st":"huts","mo":[6,7,8,9],"df":4,"book":"Huts take reservations and run like ryokan. Book ahead in October.","v":"Two of Japan’s three highest, linked by the Daikiretto if you want the exposure. Huts serve dinner at six."},{"n":"Santa Cruz trek","g":[8.95, -77.71, -9.02, -77.68],"bm":-1,"tip":"Do it <b>Vaquería to Cashapampa</b>, which puts the 4,750 m pass on day two rather than day three and gets the long descent behind you. Acclimatise in Huaraz for three days first, not two.","rg":"Andes & Patagonia","cty":"Peru","d":4,"km":50,"up":2400,"st":"camp","mo":[4,5,6,7,8],"df":3,"book":"Arrieros and donkeys arranged in Huaraz for very little.","v":"Over Punta Unión at 4,750 m with Alpamayo and Taulliraju either side. The classic Andean trek."},{"n":"Huayhuash circuit","g":[-10.28, -76.9, -10.28, -76.9],"bm":-1,"tip":"Budget for the community fees — six or seven separate valleys each collect their own, in cash, and they add up to more than most people expect. Take small soles notes.","rg":"Andes & Patagonia","cty":"Peru","d":10,"km":130,"up":8000,"st":"camp","mo":[5,6,7,8],"df":5,"book":"Community fees at each valley. Fully supported is normal.","v":"Widely called the finest trek in South America. Ten days above 4,000 m and nobody there."},{"n":"Torres del Paine · the W","g":[-51.05, -73.13, -50.94, -72.87],"bm":3,"tip":"Sleep at <b>Refugio Chileno</b> and walk up to the towers at first light. Everyone else arrives at midday from the valley. One night changes the whole experience.","rg":"Andes & Patagonia","cty":"Chile","d":5,"km":80,"up":3000,"st":"refugio","mo":[10,11,0,1,2],"df":3,"book":"Three separate portals, opens six months ahead, sells out.","v":"Grey, French Valley and the towers. The booking is harder than the walking."},{"n":"Torres del Paine · the O","g":[-51.0, -73.0, -51.0, -73.0],"bm":3,"tip":"The John Gardner pass day is long and the weather turns fast. Leave Los Perros before six — rangers close the pass if you start late, and they mean it.","rg":"Andes & Patagonia","cty":"Chile","d":9,"km":130,"up":5500,"st":"camp","mo":[10,11,0,1],"df":4,"book":"Anticlockwise only, enforced. Book everything first.","v":"The W plus the back side and the John Gardner pass — the best day in the park, seen by forty people a day."},{"n":"Routeburn Track","g":[-44.72, 168.28, -44.83, 168.13],"bm":4,"tip":"If you miss the Great Walk lottery, walk it as a <b>day hike from the Divide</b> to Key Summit and Lake Howden. You get the best hour of it without a booking.","rg":"Oceania","cty":"New Zealand","d":3,"km":32,"up":1200,"st":"huts","mo":[10,11,0,1,2,3],"df":2,"book":"Great Walk booking opens in May and sells out in minutes.","v":"Over the Harris Saddle between two national parks. The booking is the hard part."},{"n":"Milford Track","g":[-45.42, 167.72, -44.67, 167.93],"bm":4,"tip":"The lottery opens at a fixed minute in May and sells out in about ten. Have three date options and two people booking simultaneously on separate accounts.","rg":"Oceania","cty":"New Zealand","d":4,"km":54,"up":1150,"st":"huts","mo":[10,11,0,1,2,3],"df":2,"book":"Same lottery, worse odds. One direction only, fixed dates.","v":"Called the finest walk in the world by a newspaper in 1908 and it has been booked out ever since."},{"n":"Toubkal circuit","g":[31.14, -7.92, 31.06, -7.92],"bm":-1,"tip":"Sleep at the <b>Refuge du Toubkal</b> and summit at four in the morning. The scree is frozen and easier before dawn, and the range is clear before the haze builds.","rg":"Africa","cty":"Morocco","d":5,"km":60,"up":4000,"st":"gîte","mo":[3,4,8,9],"df":3,"book":"Guide mandatory for the summit. Mules carry everything.","v":"Berber villages, gîtes and North Africa’s highest peak. Thirteen hours from home and completely different."},{"n":"Simien traverse","g":[13.19, 38.06, 13.24, 38.37],"bm":-1,"tip":"Ask for the Chennek to Ambiko section rather than turning back at Chennek. That is where the walia ibex are and where the escarpment is at its most vertical.","rg":"Africa","cty":"Ethiopia","d":6,"km":70,"up":3500,"st":"camp","mo":[9,10,11,0,1,2],"df":3,"book":"Armed scout mandatory by regulation. Check current advice.","v":"Along an escarpment of 1,500 m cliffs with gelada troops grazing past you. Nothing else is like it."},{"n":"Wonderland Trail","g":[46.85, -121.76, 46.85, -121.76],"bm":1,"tip":"Apply in the <b>early access lottery in February</b> and put your least popular start date first — clockwise from Mowich Lake gets permits when the classic direction does not.","rg":"North America","cty":"USA · Washington","d":9,"km":150,"up":6700,"st":"camp","mo":[6,7,8],"df":4,"book":"Permit lottery in February. Roughly one in five.","v":"Right round Mount Rainier through every ecosystem it has. The finest circuit in the lower 48."},{"n":"John Muir Trail","g":[37.73, -119.57, 36.58, -118.29],"bm":1,"tip":"Enter the lottery for a <b>Lyell Canyon start</b> rather than Happy Isles. Same trail, far better odds, and you skip the brutal first climb out of the valley.","rg":"North America","cty":"USA · California","d":21,"km":340,"up":14000,"st":"camp","mo":[6,7,8,9],"df":4,"book":"Permit lottery is brutal. Bear canisters mandatory.","v":"Yosemite to Whitney without leaving the high country. Three weeks of granite."},{"n":"Skyline Trail","g":[52.72, -117.64, 52.88, -118.05],"bm":0,"tip":"Walk it <b>north to south</b>, Maligne Lake to the Skyline trailhead. That way the Notch — the high point — comes on day two with a light pack and the long descent is at the end.","rg":"North America","cty":"Canada · Jasper","d":3,"km":44,"up":1400,"st":"camp","mo":[6,7,8],"df":3,"book":"Parks Canada reservations open in January.","v":"Most of it above the treeline. The finest multi-day in the Canadian Rockies and September is the month."},{"n":"Four Pass Loop","g":[39.1, -106.94, 39.1, -106.94],"bm":3,"tip":"Go <b>clockwise</b>: West Maroon first. The passes come in increasing order of difficulty and you get the aspen light on the right side of the valleys in the afternoon.","rg":"North America","cty":"USA · Colorado","d":4,"km":43,"up":2700,"st":"camp","mo":[6,7,8],"df":4,"book":"Permit needed for the Maroon Bells zone.","v":"Four passes over 3,800 m round the Maroon Bells. Do it in the last week of September for the aspen."},{"n":"Kungsleden · northern section","g":[68.35, 18.83, 67.9, 18.65],"bm":-1,"tip":"The lake crossings have boats you row yourself — and the etiquette is that you row across, tow a second boat back, then row across again so a boat is always on each side.","rg":"Nordic","cty":"Sweden · Lapland","d":7,"km":110,"up":2000,"st":"huts","mo":[5,6,7,8],"df":2,"book":"STF huts, no booking, first come. Boats across the lakes.","v":"Abisko to Kebnekaise above the Arctic circle. Gentle walking, enormous space, and the huts have saunas."},{"n":"Lofoten ridge traverse","g":[68.11, 13.14, 68.24, 14.2],"bm":-1,"tip":"Wild camping is legal but the good spots are known. Walk an extra thirty minutes past the obvious col and you will have the ridge to yourself. Peg for wind, not rain.","rg":"Nordic","cty":"Norway","d":4,"km":45,"up":3500,"st":"camp","mo":[5,6,7,8],"df":4,"book":"Wild camping is legal and normal. No huts.","v":"Mountains straight out of the Arctic sea. September gives you autumn colour on the ground and aurora overhead."},{"n":"Lycian Way","g":[36.55, 29.14, 36.85, 30.51],"bm":-1,"tip":"Walk <b>west to east</b> from Fethiye in autumn — the sun is behind you all morning and the sections get easier as the days shorten. Most people do a week: Fethiye to Kaş is the best of it. Water is the constraint; village fountains, not streams.","rg":"Caucasus & Anatolia","cty":"Turkey · Fethiye to Antalya","d":29,"km":540,"up":27000,"st":"pension","mo":[1,2,3,4,8,9,10],"df":3,"book":"No permits, no booking. Pensions in the villages, wild camping between. ⚠ Summer is genuinely too hot — this is a spring or autumn trail.","v":"Turkey’s first long-distance path, waymarked in red and white by Kate Clow in 1999, running along the Teke peninsula past Lycian rock tombs, Roman ruins and the sea. Most people walk a week of it rather than the whole thing."},{"n":"Camino Francés","g":[43.16, -1.24, 42.88, -8.54],"bm":-1,"tip":"Start in <b>Saint-Jean</b>, not Roncesvalles — the Pyrenean crossing is the best day on the whole route and skipping it to save a day is a false economy. Send your pack ahead with a transfer service and walk with a daypack.","rg":"Pyrenees & Corsica","cty":"Spain · St-Jean to Santiago","d":33,"km":780,"up":18000,"st":"albergue","mo":[3,4,5,8,9],"df":2,"book":"No booking on the classic route — albergues are first come. ⚠ July and August are hot and full; May and September are the walking months.","v":"The great pilgrim road, over the Pyrenees and across northern Spain. Not a mountain trek — a cultural one, walked by a quarter of a million people a year, and the social experience is the point."},{"n":"Camino del Norte","g":[43.32, -1.98, 42.88, -8.54],"bm":4,"tip":"The albergues are further apart than on the Francés and some stages are 30 km with nothing between. Plan the day before, not the morning of, and book ahead from July.","rg":"Pyrenees & Corsica","cty":"Spain · the coastal route","d":35,"km":825,"up":25000,"st":"albergue","mo":[3,4,5,8,9],"df":3,"book":"Fewer albergues than the Francés, so book ahead in summer.","v":"The coastal alternative along the Basque and Asturian shore — harder, hillier, greener and far quieter than the Francés. Better food, too."},{"n":"GR11 · Pyrenean traverse","g":[43.39, -1.79, 42.34, 3.17],"bm":3,"tip":"Resupply points are far apart in Aragón — carry four days of food through the Ordesa section. And take the Ordesa canyon variant rather than the high route if the weather closes in.","rg":"Pyrenees & Corsica","cty":"Spain · sea to sea","d":45,"km":840,"up":42000,"st":"refuges","mo":[5,6,7,8],"df":4,"book":"Refuges bookable; long unsupported stretches in Aragón.","v":"Atlantic to Mediterranean along the Spanish side. Its French twin the GR10 is greener; the GR11 is higher, drier and wilder."},{"n":"Annapurna Circuit","g":[28.24, 84.42, 28.6, 83.87],"bm":-1,"tip":"Take <b>two nights at Manang</b>, not one, and walk up to Ice Lake on the rest day. Then cross Thorong La from High Camp rather than Thorong Phedi — it is a shorter, safer morning.","rg":"Himalaya","cty":"Nepal","d":16,"km":180,"up":9000,"st":"teahouse","mo":[2,3,9,10],"df":4,"book":"No booking. ⚠ Thorong La at 5,416 m is the crux — acclimatise at Manang for two nights.","v":"Round the whole massif from subtropical valley to high desert, crossing at 5,416 m. Roads have eaten parts of it, but the high half remains one of the great treks on earth."},{"n":"Manaslu Circuit","g":[28.2, 84.86, 28.55, 84.55],"bm":-1,"tip":"Combine it with the <b>Tsum Valley</b> if you have four extra days. Same permit, almost nobody goes, and it is the most intact Tibetan-Buddhist valley left in Nepal.","rg":"Himalaya","cty":"Nepal","d":14,"km":177,"up":8500,"st":"teahouse","mo":[2,3,9,10],"df":4,"book":"⚠ Restricted area — permit plus a licensed guide and a minimum of two trekkers. Arrange in Kathmandu.","v":"What the Annapurna Circuit was twenty years ago. Larkya La at 5,106 m, teahouses, and a fraction of the traffic because of the permit."},{"n":"Kumano Kodo · Nakahechi","g":[33.73, 135.38, 33.83, 135.77],"bm":3,"tip":"Book through <b>Kumano Travel</b>, the local co-operative, rather than a tour operator — it is cheaper and the money stays in the villages. Use the luggage shuttle; the ryokan expect it.","rg":"Japan","cty":"Japan · Kii peninsula","d":5,"km":70,"up":3500,"st":"ryokan","mo":[2,3,9,10],"df":2,"book":"Minshuku and ryokan book out — reserve months ahead through Kumano Travel.","v":"A thousand-year-old pilgrimage through cedar forest to three grand shrines, and the only route twinned with the Camino. Onsen at the end of most days."},{"n":"Laugavegur","g":[63.99, -19.06, 63.53, -19.51],"bm":0,"tip":"Add the <b>Fimmvörðuháls extension</b> to Skógar. It is one more day, it crosses between two glaciers over ground that was erupting in 2010, and it finishes at a waterfall.","rg":"Nordic","cty":"Iceland","d":4,"km":55,"up":1400,"st":"huts","mo":[6,7,8],"df":3,"book":"⚠ A very short season — huts open early July to early September and book out in January.","v":"Rhyolite mountains, black sand, hot springs and glaciers in four days. The most colour-saturated landscape on this list and the shortest window to see it."},{"n":"Via Dinarica · White Trail","g":[43.85, 18.41, 42.44, 19.02],"bm":-1,"tip":"Hire a local guide for the Bosnian sections. Not for navigation — for the fact that <b>landmine clearance is still incomplete</b> in parts of the range and locals know which ground is walked.","rg":"Carpathians & Balkans","cty":"Bosnia · Montenegro","d":12,"km":200,"up":11000,"st":"camp","mo":[5,6,7,8],"df":4,"book":"Village guesthouses and mountain huts, arranged as you go. Local guides worth it.","v":"Along the Dinaric ridge through countries that were closed to walkers a generation ago. Karst, wolves,
